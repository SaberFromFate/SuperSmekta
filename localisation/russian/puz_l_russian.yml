 #HIST
 PUZ_HIST: "Во время восстания в Германии, некий Вано Пузиковский основал Северогерманское государство и объявил о независимости. У германских властей не хватило сил и времени для подчичения мятежников. В будущем это может сыграть с миром злую шутку."