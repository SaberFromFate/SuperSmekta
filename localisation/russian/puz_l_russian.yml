 PUZ_cet: "Господство на Балтике"
 PUZ_cet_desc: "Север больше не делится на сферы влияния. Балтийское море становится внутренним морем технократии, а завоёванные земли — её неотъемлемой частью."

 #final chapter
 PUZ_era: "Эра Машины"
 PUZ_era_desc: "Завоеванные земли требуют нового порядка. Мы заложим основу общества, где каждый механизм и каждый человек служит единой цели — торжеству разума над хаосом. Начинается эра Машины."

 PUZ_ascension: "Возвышение Магоса"
 PUZ_ascension_desc: "Культ Mechanicus перестаёт быть силой внутри государства — он становится его сердцем. Архимагос получает право голоса в каждом решении, а наука и вера сливаются в единое учение."

 PUZ_pax: "Pax Mechanicus"
 PUZ_pax_desc: "Мир, построенный на железе и логике, не знает сомнений. Северогерманская технократия провозглашает свой порядок единственно верным и готовится нести его всему человечеству."


 
 
