 germany.40.d_3: "Германия предъявляет свои права на Судетскую область Чехословакии, где проживает значительное число этнических немцев. [GER.GetLeader] разместил на границе с Чехословакией войска, готовые перейти в наступление. В Мюнхене проходят переговоры между Нидерландами, Великобританией, Францией, Италией и Германией в надежде найти мирное решение для Судетского кризиса. Какова будет позиция Нидерландов?"
 germany.51.d: "Чехословакия — это раковая опухоль в сердце Европы, и немцы наконец намерены окончательно решить эту проблему. Судетская область уже была передана Германии, а теперь, в соответствии с Мюнхенскими договоренностями, нам должна отойти территория Чехословакии, по праву принадлежащая Венгрии."
 germany.71.d: "Войскам СС и верным армейским подразделениям удалось убить или взять в плен предателей, пытавшихся захватить Рейхсканцелярию, но лишь после того, как эти мерзавцы убили Гитлера! Фюрер был обнаружен с десятком пулевых ранений у себя за столом, за которым он без устали трудился во благо Германии!\n\nУцелевшие заговорщики поплатятся за свое чудовищное преступление, но сейчас Германия ведет войну, и ей необходим новый лидер. Кто станет фюрером?"
 germany.73.d: "Ожесточенные бои оставили на месте Рейхсканцелярии дымящиеся развалины. Несмотря на то, что войска СС пытались прийти Гитлеру на помощь, армейские подразделения, выступавшие на стороне заговорщиков, одержали победу. Фюрер был убит, и заговорщики завладели всеми правительственными зданиями в Берлине.\n\nВермахт раскололся на последователей заговорщиков и на тех офицеров, кто остался верен НСДАП. Кто их возглавит?"
 germany.75.d: "Невзирая на все гневные речи, которые ранее звучали как против народа, так и против идеологического вождя государства [Root.GetName], [From.GetLeader] и Германия обратились к нам с предложением взаимовыгодного информационного союза. Обмен научными данными позволит нам быстрее разрабатывать свои танки и даст другие преимущества в будущем, однако можно не сомневаться, что немцы будут заняты тем же самым. Стоит ли нам заключать такой союз, рискуя подхлестнуть амбиции, которые питает [From.GetLeader]?"
 china.107_tt: "@КНР §YКитайская Народная Республика§! берет под свой контроль китайские районы §YСеверного Китая§! и §YМаньчжурии§!\n"
 soviet.5.t: "Румыния отвергла наши требования"
 soviet.5.d: "Румыны отказались уступить нашим требованиям! По всей видимости, нам придется выдавливать их оккупационные войска из Бессарабии силой."
 soviet.70.t: "Давление государства [SOV.GetName]"
 soviet.71.t: "Достигнуто соглашение о [POL.GetAdjective]ом курсе"
 soviet.71.desc: "В результате недавнего давления от нашего правительства и постоянной угрозы от всемогущей Красной Армии буржуазная администрация государства [POL.GetName] согласилась признать власть коммунистической партии единственной легитимной властью народа. Мы могли бы утвердить свою волю силой, но теперь в этом нет необходимости, и мы можем быть уверены: [POL.GetName] войдет в сферу нашего влияния."
 soviet.72.t: "[POL.GetName] продолжает угнетать пролетариат"
 soviet.72.desc: "В своей неуместной буржуазной заносчивости нелегитимная администрация государства [POL.GetName] отказывается признавать власть коммунистической партии. Нельзя позволить этим глупцам снова превратить Польшу в плацдарм для фашистского вторжения, от которого может пострадать [SOV.GetNameDef]. Немедленно ввести государство [POL.GetName] в сферу нашего влияния — безотлагательное дело и вопрос государственной безопасности."
 soviet.73.t: "[SOV.GetNameDef] уступает"
 soviet.73.desc: "Недавняя напряженность, возникшая из-за внешней политики государства [POL.GetName], ослабла, поскольку [SOV.GetNameDef] теперь отказывается от своей прежней агрессивной риторики. Хотя вероятность очередного вторжения снизилась, мы должны быть начеку и внимательно следить за нашими восточными соседями и их марионетками."
 finland.10.d: "Наконец-то территориальные амбиции государства [SOV.GetNameDef] привели к вторжению этого наиболее коварного из врагов в нашу страну. Мы должны предпринять все возможное, чтобы организовать надежную оборону от этих беспощадных атак. Не уступим ни единого шага без боя."
 baltic.8.desc: "Отличный день для государства [ROOT.GetNameDef]! После доблестной кампании, проведённой нашими товарищами, [SOV.GetNameDefCap] справедливо заявляет, что новоосвобождённая балтийская территория вместе с её отважными рабочими попадёт под нашу юрисдикцию.\n\nТак мы сделаем ещё один шаг по пути к образованию объединённого Балтийского государства, достаточно мощного, чтобы сражаться с врагами рабочего класса."
 italy.5.d: "Италия предлагает обмен технологиями и идеями. Это должно сплотить наши народы и сделать их сильнее."
 news.1.d: "Японские и китайские силы столкнулись в районе моста Марко Поло, имеющего стратегическое значение в силу расположения к юго-западу от Пекина.\n\n[CHI.GetNameDef] ответил отказом на требования государства [JAP.GetNameDef] принести извинения и сделать территориальные уступки и заявил, что достигнут «переломный момент» в борьбе с японской агрессией. \n\nСитуация нестабильна, и дипломаты опасаются, что война может разразиться в любой момент."
 news.11.d: "Выведя войска к границе государства [ROM.GetNameDef], [SOV.GetNameDefCap] выдвинул ультиматум румынскому правительству о немедленной передаче под свой контроль Бессарабии, прежде являвшейся частью Российской империи.\n\nПроявив неожиданную несговорчивость, Бухарест отверг эти территориальные притязания и объявил о всеобщей мобилизации .\n\nМеждународные наблюдатели утверждают, что советские войска в любой момент могут перейти границу."
 news.12.d: "Советские дипломаты передали ультиматум правительству государства [FIN.GetNameDef] с требованием пересмотра границ в Карелии. \n\nХельсинки отверг эти требования, несмотря на существенное присутствие советских войск в регионе, и заявил, что «ни одного клочка финской земли не достанется русским агрессорам». \n\nМеждународные наблюдатели опасаются, что война с Советами неминуема."
 news.13.t: "[FIN.GetNameDefCap] принимает требования Советов"
 news.13.d: "После долгих споров правительство государства [FIN.GetNameDef] решило удовлетворить советские требования по пересмотру границ в Карелии. \n\n[SOV.GetNameDef] заявил о необходимости создания буферной зоны для безопасности Ленинграда, расположенного всего в 30 км от прежней финской границы. \n\nМногие наблюдатели опасались, что советско-финская война неизбежна, однако теперь эти опасения отчасти улеглись."
 news.14.t: "[SOV.GetNameDefCap] аннексирует государство [TAN.GetNameDef]"
 news.14.d: "В сегодняшнем пресс-релизе Москва сообщила об аннексии государства [TAN.GetNameDef]. \n\nВерховный Совет принял решение ответить положительно на запрос тувинского парламента о членстве в СССР. \n\nТувинская народная республика, которая до сих пор была признана только Советами и Монголией, будет преобразована в автономную область."
 news.20.t: "[FROM.GetNameDefCap] отказывается выполнять требования немцев"
 news.20.d: "Невзирая на немецкие войска, скопившиеся на границе, [FROM.GetNameDef] отвергает ультиматум Берлина о передаче Мемеля. \n\nПрежде эта территория входила в состав Восточной Пруссии, но держава [FROM.GetNameDef] получила ее по Версальскому договору. Как заявляет [FROM.GetLeader], необходимо было сохранить целостность договора, когда [FROM.GetAdjective]ое правительство объявило, что отвергает его.\n\nМеждународные эксперты ожидают, что Германия попробует захватить эти земли силой..."
 news.23.d: "Дипломаты государства [ITA.GetNameDef] предъявили ультиматум государству [ALB.GetNameDef] с требованием войти в состав Великой Италии. \n\nКороль Зогу отказался подчиниться итальянцам, призвав албанский народ оказать сопротивление. \n\nОднако зарубежные военные эксперты сходятся на том, что у государства [ALB.GetNameDef] нет шансов отразить агрессию."
 news.61.d: "Немецкие войска вторглись в Богемию и Моравию с целью поддержания порядка после падения чешского правительства. \n\nВ Праге оккупационные силы заявили о создании «автономного протектората» государства [GER.GetNameDef]. Венгерские войска при поддержке немцев захватили Словакию и присоединили ее к Венгрии. \n\nЧехословакии больше не существует."
 news.69.d: "С самого прихода к власти партии [From.GetRulingParty] [From.GetNameDef] активно стремится укреплять связи с государством [SOV.GetNameDef] и теперь становится его частью.\n\nНесколько дней назад [From.GetAdjective]ое правительство официально передало контроль над страной, которая теперь входит в состав государства [SOV.GetNameDef] в качестве области.\n\nСоветские официальные лица отказываются считать это агрессией и утверждают, что передача территории государства [From.GetNameDef] была осуществлена добровольно, без какого-либо нажима."
 news.101.d: "Бои в различных регионах государства [FRA.GetNameDef] продолжаются, но поступают сообщения о том, что немецкие войска вошли в Париж. \n\nФранцузы объявили, что оставляют столицу, незадолго до того, как ее покинули последние воинские части. Немецкие войска на глазах у безмолвных парижан несколькими колоннами промаршировали по Елисейским полям, повторяя прусский парад победы 1871 года. \n\nВоенные эксперты утверждают, что [FRA.GetNameDef] неминуемо падет."
 news.103.d: "[195.GetCapitalVictoryPointName], колыбель русской революции, сдается наступающим силам немецкой армии.\n\nИз пригородов еще доносятся отголоски стрельбы, но над разоренным городом повисло тягостное затишье.\n\nСегодня днем немецкие войска прошли маршем мимо Исаакиевского собора, купол которого был выкрашен серой краской инженерами [SOV.GetSovietArmyAdjectiveBasedOnIdeology] армии в целях маскировки от бомбардировщиков люфтваффе.\nНесмотря на все их усилия, он испещрен следами от пуль и шрапнели."
 news.105.d_alt: "[217.GetCapitalVictoryPointName], промышленный центр на берегу Волги, теперь под контролем наступающих немецких штурмовиков.\n\nС тяжелыми боями пробившись через развалины тракторного завода города [217.GetCapitalVictoryPointName] и захватив стратегическую высоту на Мамаевом кургане, немцы вытеснили остатки [SOV.GetAdjective]их войск на восточный берег Волги. По неподтвержденным сведениям, часть [SOV.GetSovietArmyAdjectiveBasedOnIdeology] армии вместе с партизанами укрылась в канализации и подвалах, чтобы продолжать борьбу.\n\nОднако никакого существенного сопротивления пока не отмечено."
 news.125.d: "После продолжительных массированных бомбардировок город Калькутта в Индии был сдан наступающей японской армии. Хотя эпизодические бои еще какое-то время продолжались в пригородах, парад победы был организован и прошел на Чуринги-авеню.\n\nСолдаты индийской национальной армии, созданной японцами под лозунгом освобождения Индии от британского владычества, приняли участие в параде, что вызвало ликование толпы. Можно предполагать, что вслед за падением Калькутты вскоре вся Индия окажется в руках японцев."
 news.126.d: "В Индии продолжается наступление японских войск, которым недавно удалось захватить Нью-Дели. Столица Британской Индии имела огромное стратегическое значение, и ее потеря может стать решающим фактором в индийской кампании.\n\nПо слухам, вице-король был захвачен ударными японскими отрядами во время погрузки его имущества для эвакуации, однако эти сведения еще не подтверждены."
 news.136.d: "После напряженных боев войска Союзников оккупировали Москву, столицу государства [SOV.GetNameDef]. Город сильно пострадал, пожары до сих пор не утихают по обоим берегам Москвы-реки. Несмотря на массированные бомбардировки, Кремль остался неповрежденным, и именно там разместилась штаб-квартира оккупационной администрации.\n\nПотеря Москвы нанесла Советам мощный удар. Хотя практически всё правительство эвакуировалось из города заблаговременно, военные эксперты прогнозируют скорое падение Советов."
 get_SOV_ideology_london_desc_alt: "Наступление [SOV.GetAdjective]их войск продолжается. В последних новостях говорится о массированном штурме Лондона и его последующем взятии.\n\nЕдва успев подавить последние очаги сопротивления, [SOV.GetAdjective]ие силы организовали парад в честь своей победы. Сторонники [SOV.GetAdjective]ой власти выражают свою горячую поддержку и признательность руководству страны и приветствуют наступление новой эпохи в своей истории."
 news.157.d: "Всего несколько дней назад армия государства [From.GetName] двинулась на государство [From.From.From.GetName] после объявления войны. За этим последовал ультиматум государства [From.From.GetName] с требованием немедленного прекращения военных действий и отступления [From.GetAdjective]их войск. [From.GetLeader] отстаивает свою правоту и не собирается уступать. Теперь страна находится в состоянии войны с государствами [From.From.From.GetName] и [From.From.GetName]."
 news.158.d: "Несколько дней назад государство [From.GetName] объявило войну государству [From.From.From.GetName]. Вскоре вслед за тем последовал ультиматум государства [From.From.GetName] с угрозой начать военные действия против государства [From.GetName], если не будет положен конец агрессии и подписан мир. [From.GetLeader] утверждает, что они имели на это право, но согласился провести демобилизацию и мирные переговоры."
 news.192.d: "В обращении к итальянцам, проживающим на побережье Далмации, [From.GetLeader] заявляет: государство [From.GetName] считает, что законно претендует на италоговорящую часть государства [YUG.GetName]. \n\nОфициальное заявление подкрепляет эти претензии и четко дает понять, что [From.GetName] в случае необходимости заберет эти земли силой."
 news.194.d: "В результате неизвестных политических маневров власти государства [Poland.GetName] передали свои восточные земли государству [From.GetName]. \n\nПока неясно, какими угрозами или обещаниями государство [From.GetName] обеспечило себе эту политическую победу. Возможно, мы никогда этого не узнаем, поскольку [Poland.GetLeader] никак не комментирует официальный анонс соглашения."
 news.199.b: "Странам всего мира надо объединиться против государства [From.GetNameDef]!"
 news.200.t: "Германия усиливает дипломатическое влияние в государстве [CZE.GetNameDef]"
 news.200.d: "Выступая с речью о братской дружбе народов в «Германской сфере», [From.GetLeader] объявляет о том, [From.GetName] и [CZE.GetNameDef] будут укреплять политические и дипломатические связи. Являясь страной с большим процентом немецкоязычного населения, [CZE.GetNameDef] — естественный проводник [From.GetAdjective]их интересов.\n\nПока неясно, какие права [CZE.GetNameDef] получит в этом союзе, но можно не сомневаться, что территориальные притязания государства [GER.GetNameDef] не коснутся ее границ."
 news.206.d_not_communist: "Недавно установившийся в Соединенных Штатах коммунистический режим принял новую доктрину [USA.GetAdjective]ой внешней политики, подразумевающую намного более агрессивную позицию по отношению к бывшим союзникам и друзьям, и в то же время — сближение с членами Коминтерна.\nЭти изменения ставят под сомнение не только статус государства [CAN.GetName], как подчиненной нации, но также саму практику доминионов, которую в США называют «мировым британским империализмом».\n\nНапряженность растет, и угроза нового англо-американского конфликта кажется все более реальной."
 news.207.d_fascism: "\nВ ответ на всё более агрессивную риторику государства [SOV.GetNameDef] [USA.GetLeader] выступает с речью против коммунизма, называя его «величайшей опасностью, когда-либо угрожавшей миру».\n\nГосударство [USA.GetNameDef] решило не только провести ряд защитных мер против зарождающегося социалистического движения в Северной и Южной Америке, но и намерено поразить коммунизм в самом его сердце.\n\n[USA.GetAdjective]ая военная машина способна полностью уничтожить коммунизм, возможно, впервые за время его существования."
 news.215.d_soviet: "[GER.GetLeader] — ярый противник коммунизма с самого начала своей политической карьеры, и нет никаких сомнений в том, что [GER.GetNameDef] считает себя врагом государства [SOU.GetNameDef].\n\nСегодня эта позиция прозвучала на весь мир, когда «антисоветское соглашение», которое ранее заключили [GER.GetNameDef] и ряд других держав, стало официальным пактом. Если один из участников пакта вступит в войну с нами, к нему должны будут присоединиться все остальные страны."
 news.216.d: "Вчера [GER.GetAdjective]ие дипломаты передали правительству государства [TUR.GetName] ультиматум, согласно которому [TUR.GetLeader] должен передать полномочия прогерманскому правительству. Пользуясь поддержкой меджлиса, [TUR.GetLeader] заявляет, что [TUR.GetAdjective]ий народ никогда не станет пешкой в военных играх иностранного диктатора.\n\nИ теперь страна готовится к войне."
 news.217.a: "Мы должны объединиться против государства [GER.GetNameDef]."
 news.219.a: "[SOV.GetLeader] обеспечивает стабильность государства [SOV.GetNameDef]."
 news.224.t: "[ENG.GetNameDefCap] оказывает давление на государство [Spain.GetNameDef]"
 news.224.d: "Учитывая традиционно сильное влияние Британии в Средиземноморье, основой которого является Гибралтар, ни для кого не должно оказаться сюрпризом, что [ENG.GetAdjective]ое правительство решило оказать политическое давление на фашистский режим государства [Spain.GetNameDef].\n\nДля страны, до сих пор восстанавливающейся после гражданской войны, [ENG.GetAdjective]ая помощь гораздо важнее каких-то политических принципов."
 news.225.d: "\nСредиземноморье уже давно является стратегически важным регионом для имперских амбиций государства [ENG.GetNameDef]. Сейчас [ENG.GetAdjective]ое правительство ищет дополнительную поддержку у стран региона. С этой целью оно назначило «особого консула в [TUR.GetAdjective]ом государстве».\n\nНесмотря на века непримиримой борьбы за морское доминирование в Средиземноморье, обоим государствам удаётся выстраивать крепкие деловые отношения."
 news.226.d: "\nСредиземноморье уже давно является стратегически важным регионом для имперских амбиций государства [ENG.GetNameDef]. Сейчас [ENG.GetAdjective]ое правительство ищет дополнительную поддержку у стран региона. С этой целью оно назначило «специального консула в [GRE.GetAdjective]ом государстве».\n\nПрошло уже более века с участия лорда Байрона в греческой войне за независимость, и остается неясным, достигнет ли [ENG.GetNameDef] своих целей."
 news.228.d: "\n[ENG.GetNameDef] — не единственное государство, которое видит нарастающую угрозу в Центральной Европе.\n\nРяд государств — те, чья независимость определяется оспариваемым сейчас Версальским договором, либо те, на чьи территории претендуют фашистские правительства, — вынуждены в этой связи проводить про[ENG.GetAdjective]ую политику.\n [ENG.GetNameDef] ответит на это, удвоив свои дипломатические усилия в регионе."
 news.230.d: "Как в Центральной, так и в Южной Америке революционеры взялись за оружие и поднялись во имя слова «[USA.GetRulingIdeologyNoun]».\n\nОни прекрасно вооружены и организованы, и если бы они следовали любой другой идеалогии, их покровителей было бы нетрудно вычислить. Однако, кто бы ни поддерживал их, он принял все меры, чтобы остаться неизвестным.\n\nХотя, разумеется, есть лишь одна великая держава, которая могла бы способствовать распространению идеологии [USA.GetRulingIdeologyNoun] в Америках..."
 news.236.d: "Понимая, что [GER.GetNameDef], скорее всего, потерпит поражение в войне, [yalta_origin.GetNameDef] и [yalta_partner.GetNameDef] хотят обеспечить долгосрочную стабильность в Европе. [yalta_origin.GetLeader], [yalta_partner.GetLeader] и главы других государств, участвующих в войне, встретились, чтобы обсудить судьбу государства [GER.GetNameDef].\n\nМногодневные переговоры полностью перекроили карту Европы. Восток и запад в новом европейском порядке разделены раной, которая скоро появится в середине государства [GER.GetNameDef].\n\nПока неясно, поможет ли это надолго сохранить мир."
 news.236.e: "Это, возможно, конец государства [GER.GetNameDef]."
 news.238.d: "\nЧтобы сдержать нарастающую агрессию против [ENG.GetAdjective]их колоний в Юго-Восточной Азии, Сингапур и Борнео были переданы под контроль государства [AST.GetNameDef]. Призванное стать первой и самой надежной линией обороны Содружества в Тихом океане, государство [AST.GetNameDef] приняло на себя всю ответственность за военную и административную подготовку на случай войны в регионе.\n\nПредполагается, что [AST.GetNameDef] будет противостоять имперским амбициям государства [JAP.GetNameDef] и поэтому самостоятельно защитит себя от вторжения, не полагаясь всецело на помощь бывшей метрополии."
 news.241.d: "Вскоре после появления социалистического государства в Австралии [AST.GetAdjective]ое правительство взялось за усиление своего влияния в регионе. Ссылаясь на призывы о помощи угнетенных фермеров и рабочих государства [NZL.GetNameDef], [AST.GetNameDef] оказывает активное давление на [NZL.GetAdjective]ие власти, чтобы те присоединились к «Народному Союзу» южнотихоокеанского региона.\n\nНаходясь в окружении и не питая надежд, что [ENG.GetFactionName] окажет своевременную поддержку, [NZL.GetNameDef] сдается под натиском. [AST.GetLeader] провозглашает «равенство всех государств, подобно равенству всех граждан», но все прекрасно понимают, кто в этом союзе главный."
 news.244.d: "Заявление государства [AST.GetNameDef] о создании своего независимого альянса не стало сюрпризом для большинства наблюдателей. [AST.GetLeader] планирует, что [AST.GetNameDef] с помощью союзников сможет гарантировать стабильность в Юго-Восточной Азии и за пределами региона и, если потребуется, остановить агрессию против [AST.GetAdjective]их и других территорий.\n\nНа фоне недавнего ослабления связей с Содружеством этот шаг выглядит очень логично: [AST.GetNameDef] стремится стать единоличным хозяином своей судьбы."
 news.247.d: "После коротких переговоров государство [CAN.GetNameDef] стало участником альянса [GER.GetFactionName]. [CAN.GetAdjective]ой власти объявили, что будут «с честью защищать [GER.GetAdjective]ий народ точно так же, как [GER.GetNameDef] – [CAN.GetAdjective]ий».\n\nПока неясно, чем руководствуется [CAN.GetNameDef], вступая в этот альянс, но явно следует ожидать скорого начала военных действий против врагов государства [GER.GetNameDef]. Вполне возможно, что этот союз станет переломным моментом в войне."
 news.248.d: "\nВслед за усилением дипломатического давления со стороны государства [CAN.GetNameDef] [ENG.GetNameDef] передает территории Лабрадор и Ньюфаундленд [CAN.GetAdjective]им властям. [CAN.GetAdjective]ие политики давно хотели «объединить все исконно [CAN.GetAdjective]ой земли», и теперь они стали на шаг ближе к заветной мечте.\n\nРазумеется, главный вопрос – что именно следует считать «исконно [CAN.GetAdjective]ой» территорией. Не только [ENG.GetNameDef], но и вся Северная Америка теперь будут тревожно спать по ночам."
 news.254.d: "Став полностью независимым государством, [AST.GetNameDefCap] наращивает свое влияние в южной части Тихого океана. В частности, [AST.GetAdjective]ое правительство потребовало, чтобы все бывшие колонии Океании передали ему свои властные полномочия.\n\nНе желая выполнять это условие, [ENG.GetAdjective]ие и новозеландские власти поначалу демонстрировали дипломатическое сопротивление, но у Империи больше нет рычага влияния в регионе, ведь прежде эту роль играла Австралия. Было ясно, что вскоре [AST.GetNameDef] выдвинет ультиматум, подкрепив его военной угрозой.\nТеперь Новая Зеландия является самой восточной провинцией государства [AST.GetNameDef]."
 news.265.desc: "После сокрушительного поражения, которое Франция потерпела на своей территории, многие поставили под вопрос легитимность ее колониальной империи. Власти стран [SOV.GetNameDef] и [SAF.GetNameDef] опубликовали совместное заявление, в котором объявили, что Франция более неспособна поддерживать порядок на Мадагаскаре, и потребовали передать остров под контроль государства [SAF.GetNameDef].\n\nПравительство Франции провело обсуждение этой проблемы. Эксперты по вопросам обороны считают, что ослабевшая французская армия не сможет удержать остров, если дело дойдет до войны."
 news.280.desc: "После напряженных переговоров между [GER.GetAdjective]им послом и [ENG.GetAdjective]им министром иностранных дел правительство государства [ENG.GetNameDef] объявило о том, что, начиная с этого момента, [RAJ.GetNameDef] будет самостоятельно определять свою политику. Многовековому британскому правлению на этом субконтиненте настал быстрый конец. Чиновники отправлены на родину, а колониальное управление передано индийцам.\n\nОдним из первых действий нового индийского правительства стало подписание договора о широкомасштабном сотрудничестве с государством [GER.GetNameDef]. Индийские власти не желают комментировать слухи о том, что это – цена, которую им пришлось заплатить за немецкую поддержку."
 news.350.t: "Мирное воссоединение государства [ROOT.GetNameDef]"
 news.350.desc: "\n\nПрислушавшись к воле [ROOT.GetAdjective]ого народа, [ROOT.GetLeader] успешно проводит мирное объединение [ROOT.GetAdjective]их регионов ([ROOT.GetRulingIdeology]). Пока неясно, какой эффект это окажет на мир в целом, но как минимум в городе [ROOT.Capital.GetCapitalVictoryPointName] люди празднуют это историческое событие."
 election.6.a: "В интересах государства [Root.GetName] мы должны объединиться с фашистами."
 political.9.d: "Некоторые утверждают, что они это предвидели. И те, кто предупреждал об угрозе, и те, кто призывал фашизм для спасения государства [Root.GetName], сегодня увидели, что их пророчества исполнились: военные в городе [Root.Capital.GetName] свергли правительство, сформированное партией [Root.GetRulingParty], и захватили власть. [Root.GetLeader] исчез и, по слухам, бежал из страны, так что сопротивления заговорщикам никто не оказывал.\n\nНовое [Root.GetAdjective]ое правительство не собирается давать недовольным шанса как-то проявить себя. Было объявлено военное положение. Учитывая скорость всех этих перемен, похоже, страна очень скоро изменится."
 political.10.d: "Попытки фашистов возродить в народе националистический дух имели определенный успех, но и сопротивление таким идеям по-прежнему велико. Генералы, планирующие свергнуть нынешнюю власть, разочарованы тем, что у самих [Root.GetAdjective]их граждан мало доверия к партии [Root.GetFascistParty].\n\nОни по-прежнему убеждены, что [Root.GetLeader] скоро лишится народной поддержки, но не уверены, какой курс лучше избрать. Некоторые призывают к немедленному перевороту, пока слабостью государства [Root.GetName] не воспользовались враги. Однако с учетом ограниченной народной поддержки это, скорее всего, запалит костер гражданской войны."
 political.11.d: "В фашизме всегда переплетались политика и военная сила. Одновременно с расширением политического влияния фашисты начали создавать военизированные организации для защиты как от внешней, так и от внутренней угрозы, причем к последней они относят своих политических противников. Многих беспокоит такое развитие событий, однако на волне милитаристского подъема все больше добровольцев вливается в наши вооруженные силы.\n\nПолитические лидеры движения показали, что оппоненты не зря опасаются их. Когда армия становится политизирована на всех уровнях, враги государства [Root.GetName] и враги фашизма начинают выглядеть очень похоже."
 political.14.d: "Как ни странно, идея проведения референдумов и смягчения репрессий против врагов режима получила определенную поддержку в рядах партии [Root.GetRulingParty]. Ее лидер смотрит на это скептически, однако курс перемен поддерживают влиятельные партийцы.\n\nВозможно, они полагают, что на практике это мало что изменит, либо и впрямь предают партийные идеалы, как утверждают их оппоненты. В любом случае, если общество потребует таких перемен, некоторые лидеры государства [Root.GetName] готовы к компромиссу."
 political.15.d: "Как и стоило ожидать, после смягчения ограничений на публичную антиправительственную пропаганду голоса недовольных стали звучать громче. Пока что организованные акции протеста и памфлеты распространены в основном в университетах или в бедных районах государства [Root.GetName], но движение ширится, в этом сомнений нет.\n\nМнение лидеров нации разделилось. [Root.GetLeader], несгибаемый лидер правящей партии, не желает никаких публичных дебатов. И все же первые шаги сделаны, обратного пути уже нет."
 political.21.d: "Сделав вид, будто они требуют референдум для получения власти мирным путем, и столкнувшись с отказом, фашисты использовали значительную общественную поддержку и связи в [Root.GetAdjective]ой армии, чтобы устроить переворот. Правительство, которое возглавляет партия [Root.GetRulingParty], не подчинилось их требованиям и утверждает, что будет до победного конца бороться за сохранение государства [Root.GetName] таким, каким мы его знаем."
 political.26.d: "После нескольких месяцев громогласной борьбы с режимом, главой которого является [Root.GetLeader], призывов ко всеобщим выборам и принятия либеральных законов о свободе слова и собраний, движение развалилось. Сейчас людей куда больше заботит стабильность государства [Root.GetName], если в нем пройдут такие реформы, и они видят в демократах в первую очередь бунтарей и смутьянов.\n\nИнтересно, что несколько вождей этого движения пропали или внезапно прекратили деятельность. Возможно, кто-то из них отправился в изгнание, когда увидел всю бесплодность своих усилий. [Root.GetRulingParty] и правительство отрицают, что имеют к этому отношение."
 political.27.a: "За будущее государства [Root.GetName]"
 political.28.d: "Кажется, эта ужасная гражданская война, опустошившая нашу родину, наконец закончилась, и мы достигли некоторого политического компромисса. Теперь, когда мы окончательно примирились со своими [Root.GetAdjective]ими товарищами, мы сможем восстановить нашу великую нацию. Врагам, которые планировали нажиться на нашем внутреннем конфликте, придётся столкнуться с единым [Root.GetAdjective]ми государством.\n\nНовое государство [Root.GetName], в котором царит [Root.GetRulingIdeology], больше никогда не будет разделено!"
 political.31.desc: "Война разделила нашу страну. Теперь, когда у нас снова мир, пора начать восстановление. [ROOT.GetAdjective]ие альянсы ([ROOT.GetRulingIdeology]) очень хотят воссоединения."
 political.32.desc: "Пришло время заново воссоединить [ROOT.GetAdjective]ое государство ([ROOT.GetRulingIdeology]), восставшее из пепла после войны. Держава [ROOT.GetNameDefCap] снова будет единой."
 yugoslavia.8.d: "[From.GetNameDefCap] требует, чтобы мы передали им полный контроль над нашей страной. Граждане Югославии станут де-факто жителями государства [From.GetNameDef] или одной из его марионеток. Скорее всего, это единственный способ избежать жертв среди югославского народа, хотя мы и можем оказать сопротивление и надеяться на поддержку."
 germany.99.t: "Разделить Грецию"
 germany.100.t: "Разделить Грецию"
 germany.101.t: "Разделить Грецию"
 germany.115.d: "В соответствии с Данцигским соглашением, [GER.GetNameDef] соглашается передать Данциг под контроль государства [GER.GetNameDef]."
 germany.118.d: "Война в Европе быстро подходит к концу, и совсем скоро победители будут решать судьбу Европы.\n\nМы можем предложить государству [yalta_partner.GetNameDef] провести конференцию по послевоенному разделу государства [GER.GetNameDef], чтобы разграничить наши сферы влияния на континенте.\n\nНаши «друзья» в государстве [yalta_partner.GetNameDef] намекают, что заинтересованы в подобной конференции. Несомненно, они ожидают компенсацию за свои потери."
 yalta_division_tt: "Следующие регионы будут отнесены к сфере интересов Союзников:\n§Y[42.GetName]§!, §Y[50.GetName]§!, §Y[51.GetName]§!, §Y[52.GetName]§!, §Y[53.GetName]§!, §Y[54.GetName]§!, §Y[55.GetName]§!, §Y[56.GetName]§!, §Y[57.GetName]§!, §Y[58.GetName]§!, §Y[59.GetName]§!.\n\nСледующие регионы будут отнесены к сфере интересов [SOU.GetAdjective]ого государства:\n§Y[60.GetName]§!, §Y[61.GetName]§!, §Y[62.GetName]§!, §Y[63.GetName]§!, §Y[64.GetName]§!, §Y[65.GetName]§!, §Y[66.GetName]§!, §Y[67.GetName]§!.\n\n [POL.GetAdjective]ие претензии на следующие регионы будут признаны всеми сторонами:§Y[66.GetName]§!, §Y[67.GetName]§!, §Y[68.GetName]§!, §Y[63.GetName]§!, §Y[5.GetName]§!.\n\n"
 morgenthau_division_tt: "[FRA.GetFlag] [FRA.GetNameDefCap] получает регион §Y[42.GetName]§!\n[POL.GetFlag] Польша получает регионы §Y[67.GetName]§! и §Y[5.GetName]§!.\n[SOV.GetFlag] [SOV.GetNameDefCap] получает регион §Y[763.GetName]§!\nВ следующих регионах будет создана международная зона под [ENG.GetFlag] [ENG.GetAdjective]им управлением: §Y[51.GetName]§!, §Y[52.GetName]§! и §Y[56.GetName]§!.\n В [yalta_partner.GetAdjective]ой зоне влияния будет основано независимое [GER.GetFlag] Северогерманское государство в регионах §Y[58.GetName]§!, §Y[59.GetName]§!, §Y[51.GetName]§!, §Y[61.GetName]§!, §Y[62.GetName]§!, §Y[63.GetName]§!, §Y[68.GetName]§!, §Y[66.GetName]§!, §Y[65.GetName]§!, §Y[64.GetName]§! и §Y[60.GetName]§!. \nВ регионах §Y[54.GetName]§!, §Y[50.GetName]§!, §Y[52.GetName]§! и §Y[53.GetName]§! будет основано независимое [GER.GetFlag] Южногерманское государство."
 germany.1190.t: "Конференция в Торонто"
 germany.1190.desc: "Сейчас, когда война с государством [GER.GetNameDef] идет к неизбежному завершению, [yalta_origin.GetNameDef] обращается к нам с вопросом о конференции, на которой обсудят будущее Европы.\n\nНам предложены три варианта раздела государства [GER.GetNameDef], в результате которых мы получим ограниченное влияние над восточным регионом. Основной промышленный регион попадет под контроль Союзников, и они же получат ограниченный контроль над южным регионом. Эти меры ослабят Германию, но и наше влияние над Центральной Европой окажется под вопросом."
 germany.122.a: "Раз они хотят войны, так пусть ее и получат!"
 germany.123.d: "[From.GetLeader], глава [From.GetAdjective]ого государства, совершает глупую дипломатическую ошибку, отказываясь выполнить все [Root.GetAdjective]ие требования!\n\nОни решили не отдавать Судеты и практически заставили нас объявить войну, издеваясь над нашим стремлением защитить [Root.GetAdjective]их братьев и сестер."
 germany.123.a: "Значит, так и будет!"
 germany.127.d: "Поскольку мы вместе сражаемся против государства [SOV.GetNameDef], возможно, нам стоит заключить формальный союз и пригласить новых союзников по борьбе с коммунизмом в наш альянс."
 war_justification.1.t: "[Root.GetLeader] высказывается против государства [From.GetName]"
 war_justification.1.d: "«Принадлежит ли государство [From.GetName] [From.GetAdjective]ому народу? Зададим другой вопрос: принадлежит ли будущее [From.GetAdjective]ому народу или государству [Root.GetNameDef]?»\n\nВ сегодняшней речи [Root.GetLeader] демонстрирует, что [Root.GetName] на пути к войне. Политическая напряженность нарастает на протяжении месяца, и, похоже, [Root.GetAdjective]ий народ уже смирился с тем, что война неизбежна."
 war_justification.3.d: "«Есть ли худшая угроза нашему образу жизни, да и вообще любому образу жизни, чем коммунизм? Чума, угрожающая привести к власти в каждой стране не хозяев, а рабов, уничтожить само понятие государства, народа, его истории. Мы захватим государство [From.GetName] и искореним заразу».\n\nНенависть лидера [Root.GetLeader] к коммунистам стала известна, когда партия [Root.GetRulingParty] пришла к власти, и со временем только усилилась. Крестовый поход против марксизма может начаться именно здесь."
 war_justification.4.d: "«[From.GetAdjective]ий народ не выпустит власть из рук так просто. И все же он должен понимать, что пути развития наших держав неумолимо ведут к столкновению. Мы должны быть готовы к этому. [From.GetName] – это страна, которая не сдастся без боя».\n\nНесмотря на схожесть идеологии, правительства государств [From.GetName] и [Root.GetName] развернули подготовку к вооруженному конфликту, не пытаясь решить проблемы мирным путем."
 war_justification.5.d: "«Мы укрепили социалистическое общество в государстве [Root.GetName], однако многие другие народы еще страдают от деспотии. Трудящиеся государства [From.GetName] не имеют права голоса или своей организации, и все попытки ввести социализм будут жестоко подавляться государственным аппаратом, во главе которого стоит [From.GetLeader]. Мы не можем ждать, пока жернова мировой революции провернутся и освободят [From.GetAdjective]ий народ. Наша революция доказала, что мы умеем сражаться с угнетателями, теперь пора раздавить капиталистов и в городе [From.Capital.GetName]!»\n\n[Root.GetLeader] больше не пользуется дипломатическим языком, когда говорит о партии [From.GetRulingParty], которую возглавляет [From.GetName]. Концепция стирания границ теперь сводится к уничтожению совершенно определенной границы между двумя странами."
 war_justification.6.d: "«Есть ли ложь большая, чем так называемая свобода [From.GetAdjective]ого народа? Раньше они были рабами князей и герцогов, претендовавших на владение землей, теперь же рабочие вынуждены продавать свой труд тем, кто якобы владеет фабриками. Нельзя называть свободой право выбора хозяина. Точно так же и их свобода выбирать себе вождей является ложной, ведь пропаганда никогда не позволит прийти к власти истинным социалистам. Если народу так промыли мозги, спасти его может только [Root.GetAdjective]ое вмешательство».\n\n[Root.GetLeader] выступает против правительства государства [From.GetName] уже долгое время, на каждом съезде партии, но теперь эти речи звучат еще более открыто. Сложно поверить, что конфликт разрешится мирным путем."
 war_justification.8.d: "«Есть ли общество более отвратительное для будущего революции, более чуждое трудящимся, чем фашистский режим государства [From.GetName]? Призывая народ фанатично отдавать все свои силы на развитие устаревшего национального государства, они обрядили дикарство в современные наряды и пытаются выставлять себя альтернативой будущему, в котором неизбежна победа рабочего класса по всему миру. Очевидно, что фашисты нанесут удар по нашим союзникам, это лишь вопрос времени. А значит, мы должны ударить первыми».\n\nМежду нами и [From.GetAdjective]им народом не было ничего, кроме презрения. Однако в последнее время ненависть усиливается: похоже, конфликт разгорится очень скоро."
 war_justification.9.d: "«Несмотря на все попытки отыскать дипломатическое решение конфликта между нами и государством [From.GetName], переговоры вновь были сорваны, и у нас не осталось выбора. Авторитарный режим, лидером которого является [From.GetLeader], показал себя неразумным и глухим к чаяниям народа. Если только [From.GetAdjective]ое руководство не изменит курс коренным образом, нам придется начать борьбу».\n\n[Root.GetAdjective]ое вмешательство во внутренние дела государства [From.GetName] в последнее время стало особенно явным, хотя некоторые оппозиционные политики утверждали, что партия [Root.GetRulingParty] стремилась к войне с самого начала. Впрочем, каковы бы ни были первоначальные намерения сторон, сейчас война представляется неизбежной."
 war_justification.10.t: "[Root.GetLeader] призывает к вмешательству во внутренние дела государства [From.GetName]"
 war_justification.10.d: "«С тяжелым сердцем мы признаем: у нас нет иного пути, кроме захвата государства [From.GetName]. Никакой другой выход из создавшейся ситуации невозможен, мы должны получить стратегическое преимущество. Мы не считаем, что [From.GetAdjective]ий или [Root.GetAdjective]ий народ хотят войны, но исторический процесс не дает нам выбора. Остается надеяться, что проявив силу сейчас, мы избежим кровопролития в будущем».\n\nНесмотря на распространенную теорию о том, что демократические страны не воюют друг с другом, все указывает на то, что в скором времени начнется [Root.GetAdjective]ая агрессия против государства [From.GetName]. И, как кажется, нас ждут и другие неожиданные повороты."
 war_justification.11.d: "«Без сомнений, коммунистический режим государства [From.GetName] представляет одну из главных опасностей для свободы и порядка в нашу эпоху. Неутомимо и безжалостно он стремится лишить [From.GetAdjective]ий народ надежды на построение процветающего демократического общества и поглотить соседние страны. Если мы ничего не сделаем сейчас, то не сумеем остановить эту лавину неудавшихся социальных экспериментов. Сколько смертей нам еще нужно, чтобы наконец вмешаться?»\n\nОбщество активно обсуждает тот факт, что [From.GetAdjective]ие агенты могут вести подрывную деятельность против демократии. Оппозиция утверждает, будто с помощью «красного пугала» страну подталкивают к войне с государством [From.GetName], но пока народ охотно соглашается с позицией партии [Root.GetRulingParty]."
 war_justification.12.d: "«Современная история, а возможно, и история в целом не знает тирании хуже, чем та стальная узда, в которой [From.GetRulingParty] держит государство [From.GetName]. Нас убеждают не провоцировать конфликт, верить, будто [From.GetLeader] станет соблюдать договоренности и обещания. Но те, кто так говорит, не понимают, что договоренности с фашистами невозможны: для этих бесчестных лжецов важна только грубая сила, а бумага, на которой написаны договоры, горит так же легко, как книги противников фашизма».\n\nОбщественность долгое время надеялась избежать прямой конфронтации с государством [From.GetName], но теперь против такой позиции активно выступает [Root.GetLeader]. Говоря словами Макиавелли, мы лишь оттягиваем войну, и это идет врагу на пользу. Возможно, нам имеет смысл нанести удар первыми."
 war_justification.13.t: "[Root.GetLeader] призывает к войне против государства [From.GetName]"
 war_justification.13.d: "«Мы мирный народ, но один лишь национальный характер не может определить весь исторический курс. Сейчас время войны. Слишком долго [From.GetAdjective]ий народ владел столь необходимыми нам богатствами и по-прежнему не желает расставаться с ними по-хорошему. Как бы мы ни старались построить современное государство, есть споры, которые решаются только в бою, как это было принято у наших предков».\n\n[Root.GetLeader] демонстрирует неприкрытую враждебность в адрес государства [From.GetName] для оправдания агрессии. Часть населения поддерживает такой курс, но решение лидер будет принимать единолично."
 war_justification.15.d: "«Дух [Root.GetAdjective]ой нации крепок, но не всем странам так повезло. В государстве [From.GetName] все прежние традиции были уничтожены, законные правители убиты, и все это во имя великой марксистской революции. Наш долг – навести в мире порядок, очистить его от кровавых узурпаторов и в борьбе с этой угрозой укрепить державу [Root.GetName]».\n\nПартия [Root.GetRulingParty] всегда противостояла коммунизму, и государство [From.GetName] являлось постоянным объектом ее нападок. Трудно сказать, являются ли коммунисты реальной угрозой для [Root.GetAdjective]ой нации, но по [From.GetAdjective]ому коммунизму скоро может быть нанесен упреждающий удар."
 war_justification.16.d: "«Мои оппоненты пытаются утверждать, будто мое правление ничем не отличается от того, что творит партия [From.GetRulingParty] в государстве [From.GetName]. Они категорически неправы. Все успехи лидера [From.GetLeader] — результат всеобщей деструктивной веры в то, что можно силой подчинить себе другие народы, но эта иллюзия скоро пройдет. Партия [Root.GetRulingParty] не желает подчиняться таким тенденциям. Я сделаю все необходимое для устранения угрозы, даже если это будет означать войну».\n\n[Root.GetLeader] проводит враждебную политику в отношении [From.GetAdjective]ой нации. Своих лидеров мы можем называть по-разному, а вот фашистами — только врагов."
 war_justification.17.d: "«Кто определяет границы государства, как они определяются? В прошлом, определяя, что [Root.GetName] заканчивается здесь, а тут начинается [From.GetName], люди руководствовались самыми разными причинами. Но мы живем в новую эпоху. Стратегическое значение границ трудно переоценить, и мы имеем полное право двигать их так, чтобы обеспечить своему народу безопасность».\n\n[Root.GetLeader] в своих последних речах утверждает, что нападение на государство [From.GetName] неминуемо. Есть те, кто готов против этого возражать, но в целом общество настроено на войну."
 war_justification.18.d: "«Нет сомнения: государство [From.GetName] готовится к войне. Изменения в экономической политике явно доказывают, что [From.GetAdjective]ий народ не хочет мира и ждет удобного случая, чтобы нанести нам удар. Будем ли мы сидеть сложа руки, пока они вооружаются, и знать, что [Root.GetName] без защиты? Или мы справимся с этой угрозой прежде, чем она нависнет над нами всерьез?»\n\nЯстребы из партии [Root.GetRulingParty] устремили взоры в сторону государства [From.GetName], утверждая, что лучшая защита — это нападение. Их точка зрения набирает популярность, и государство [Root.GetName] начинает готовиться к войне."
 war_justification.19.t: "[Root.GetLeader] недоволен [From.GetAdjective]ими провокациями"
 war_justification.20.t: "[Root.GetLeader] отстаивает право на захват государства [From.GetName]"
 war_justification.20.d: "«Если мы хотим получить стратегическое преимущество в вероятной – если не сказать неизбежной – войне с государством [From.GetName], пора отбросить всякие сомнения. Мы говорим о будущем наших детей и о том, чтобы обеспечить для державы [Root.GetName] надлежащее место в мире, не отказываясь от своих ценностей и идеалов. Пришло время действовать».\n\nЛидеры партии [Root.GetRulingParty] и в частности [Root.GetLeader] произносят пламенные речи, призывая общественность поддержать захват государства [From.GetName]. Ораторы не упоминают геополитические мотивы, которые легли в основу этой агрессии, но взывают к патриотизму, что отлично действует на народ."
 war_justification.201.t: "[From.GetLeader] выступает против государства [Root.GetName]"
 war_justification.203.d: "«Есть ли худшая угроза нашему образу жизни, да и вообще любому образу жизни, чем коммунизм? Чума, угрожающая привести к власти в каждой стране не хозяев, а рабов, уничтожить само понятие государства, народа, его истории. Мы захватим государство [From.GetName] и искореним заразу».\n\nНенависть лидера [From.GetLeader] к коммунистам стала известна, когда партия [From.GetRulingParty] пришла к власти, и со временем только усилилась. Крестовый поход против марксизма может начаться именно здесь."
 war_justification.205.d: "«Мы укрепили социалистическое общество в государстве [From.GetName], однако многие другие народы еще страдают от деспотии. Трудящиеся государства [Root.GetName] не имеют права голоса или своей организации, и все попытки ввести социализм будут жестоко подавляться государственным аппаратом, во главе которого стоит [Root.GetLeader]. Мы не можем ждать, пока жернова мировой революции провернутся и освободят [Root.GetAdjective]ий народ. Мы умеем сражаться с угнетателями, теперь пора раздавить капиталистов и в городе [Root.Capital.GetName]!»\n\nВ переговорах с нашим правительством [From.GetLeader] больше не пользуется дипломатическим языком. Концепция стирания границ теперь сводится к уничтожению совершенно определенной границы между двумя странами."
 war_justification.205.a: "[Root.GetLeader] — лучший лидер, чем какой-то революционер-оппортунист!"
 war_justification.206.d: "«Есть ли ложь большая, чем так называемая свобода [Root.GetAdjective]ого народа? Раньше они были рабами князей и герцогов, претендовавших на владение землей, теперь же рабочие вынуждены продавать свой труд тем, кто якобы владеет фабриками. Нельзя называть свободой право выбора хозяина. Точно так же и их свобода выбирать себе вождей является ложной, ведь пропаганда никогда не позволит прийти к власти истинным социалистам. Если народу так промыли мозги, спасти его может только [From.GetAdjective]ое вмешательство».\n\nКоммунистический режим государства [From.GetName] не признает, что наш народ обойдется без их социальных экспериментов, и открыто угрожает нашей безопасности. Сложно представить, что конфликт удастся решить мирным путем."
 war_justification.207.d: "«Товарищи, хотя величайших революционеров когда-то назвали предателями, теперь стало очевидно: сама революция была предана. Как иначе объяснить тот факт, что к власти в государстве [Root.GetName] пришла партия [Root.GetRulingParty], которая отбросила все марксистские идеи, чтобы построить псевдорабочее государство и править там на лживых основаниях? Укрепляя свои силы за счет мировой революции, они показали, что безразличны к тем идеалам, которые клялись защищать. Мы должны принести к ним истинную революцию».\n\nИзначально поддержав победу партии [Root.GetRulingParty] в столице ([Root.Capital.GetName]), [From.GetLeader] больше не разделяет взгляды лидера [Root.GetLeader]. Конфликт уже зашел настолько далеко, что они готовы навязывать нам истинный социализм силой."
 war_justification.208.d: "«Есть ли общество более отвратительное для будущего революции, более чуждое трудящимся, чем фашистский режим государства [Root.GetName]? Призывая народ фанатично отдавать все свои силы на развитие устаревшего национального государства, они обрядили дикарство в современные наряды и пытаются выставлять себя альтернативой будущему, в котором неизбежна победа рабочего класса по всему миру. Очевидно, что фашисты нанесут удар по нашим союзникам, это лишь вопрос времени. А значит, мы должны ударить первыми».\n\nМежду нами и [Root.GetAdjective]им народом не было ничего, кроме презрения. Однако в последнее время ненависть усиливается: [From.GetLeader] открыто призывает к войне."
 war_justification.209.d: "«Несмотря на все попытки отыскать дипломатическое решение конфликта между нами и государством [Root.GetName], переговоры вновь были сорваны, и у нас не осталось выбора. [Root.GetLeader] – авторитарный лидер, снова и снова демонстрирует свою глухоту к чаяниям народа. Если только [Root.GetAdjective]ое руководство не изменит курс коренным образом, нам придется начать борьбу».\n\nВопрос [From.GetAdjective]ого вмешательства встал только в последнее время, хотя некоторые оппозиционные политики утверждали, что партия [From.GetRulingParty] стремилась к войне с самого начала. Впрочем, каковы бы ни были первоначальные намерения сторон, сейчас война представляется неизбежной."
 war_justification.210.t: "[From.GetLeader] призывает к вмешательству во внутренние дела государства [Root.GetName]"
 war_justification.210.d: "«С тяжелым сердцем мы признаем: у нас нет иного пути, кроме захвата государства [Root.GetName]. Никакой другой выход из создавшейся ситуации невозможен, мы должны получить стратегическое преимущество. Мы не считаем, что [From.GetAdjective]ий или [Root.GetAdjective]ий народ хотят войны, но исторический процесс не дает нам выбора. Остается надеяться, что, проявив силу сейчас, мы избежим кровопролития в будущем».\n\nНесмотря на распространенную теорию о том, что демократические страны не воюют друг с другом, все указывает на то, что в скором времени начнется [From.GetAdjective]ая агрессия против государства [Root.GetName]. И, как кажется, нас ждут и другие неожиданные повороты."
 war_justification.211.d: "«Без сомнений, коммунистический режим государства [Root.GetName] представляет одну из главных опасностей для свободы и порядкий народ надежды на построение процветающего демократического общества и поглотить соседние страны. Если мы ничего не сделаем сейчас, то не сумеем остановить эту лавину неудавшихся социальных экспериментов. Сколько смертей нам еще нужно, чтобы наконец вмешаться?»\n\nНарождающееся рабочее движение напугало [From.GetAdjective]их лидеров. Представители их оппозиции говорят, что население намеренно запугивают «красным пугалом», готовя к войне, впрочем, с риторикой партии [From.GetRulingParty] охотно соглашается весь народ."
 war_justification.213.t: "[From.GetLeader] призывает к войне против государства [Root.GetName]"
 war_justification.213.d: "«Мы мирный народ, но один лишь национальный характер не может определить весь исторический курс. Сейчас время войны. Слишком долго [Root.GetAdjective]ий народ владел столь необходимыми нам богатствами и по-прежнему не желает расставаться с ними по-хорошему. Как бы мы ни старались построить современное государство, есть споры, которые решаются только в бою, как это было принято у наших предков».\n\nВ недавней речи, обращенной к [From.GetAdjective]ому народу, [From.GetLeader] проявляет неприкрытую враждебность в адрес государства [Root.GetName], оправдывая агрессивную политику своего государства. Часть населения поддерживает такой курс, но решение лидер будет принимать единолично."
 war_justification.215.d: "«Дух [From.GetAdjective]ой нации крепок, но не всем странам так повезло. В государстве [Root.GetName] все прежние традиции были уничтожены, законные правители убиты, и все это во имя великой марксистской революции. Наш долг – навести в мире порядок, очистить его от кровавых узурпаторов и в борьбе с этой угрозой укрепить державу [From.GetName]».\n\nПартия [From.GetRulingParty] всегда противостояла коммунизму, и государство [Root.GetName] являлось постоянным объектом ее нападок. Хотя коммунизм является естественной следующей ступенью исторического развития, их вожди так этого боятся, что готовы напасть на [Root.GetAdjective]ий народ."
 war_justification.217.d: "«Кто определяет границы государства, как они определяются? В прошлом, определяя, что [From.GetName] заканчивается здесь, а тут начинается [Root.GetName], люди руководствовались самыми разными причинами. Но мы живем в новую эпоху. Стратегическое значение границ трудно переоценить, и мы имеем полное право двигать их так, чтобы обеспечить своему народу безопасность».\n\n[From.GetLeader] в своих последних речах утверждает, что нападение на государство [Root.GetName] неминуемо. Есть те, кто готов против этого возражать, но в целом общество настроено на войну."
 war_justification.218.d: "«Нет сомнения: государство [Root.GetName] готовится к войне. Изменения в экономической политике явно доказывают, что [Root.GetAdjective]ий народ не хочет мира и ждет удобного случая, чтобы нанести нам удар. Будем ли мы сидеть сложа руки, пока они вооружаются, и знать, что [From.GetName] без защиты? Или мы справимся с этой угрозой прежде, чем она нависнет над нами всерьез?»\n\nЯстребы из партии [From.GetRulingParty] устремили взоры в сторону государства [Root.GetName], утверждая, что лучшая защита — это нападение. Их точка зрения набирает популярность, и государство [From.GetName] начинает готовиться к войне."
 war_justification.220.t: "[From.GetLeader] отстаивает право на захват государства [Root.GetName]"
 war_justification.220.d: "«Если мы хотим получить стратегическое преимущество в вероятной – если не сказать неизбежной – войне с государством [Root.GetName], пора отбросить всякие сомнения. Мы говорим о будущем наших детей и о том, чтобы обеспечить для державы [From.GetName] надлежащее место в мире, не отказываясь от своих ценностей и идеалов. Пришло время действовать».\n\nЛидеры партии [From.GetRulingParty] и в частности [From.GetLeader] произносят пламенные речи, призывая общественность поддержать захват государства [Root.GetName]. Ораторы не упоминают геополитические мотивы, которые легли в основу этой агрессии, но взывают к патриотизму, что отлично действует на народ."
 war_justification.301.d: "«У нас был шанс нанести удар по врагу, но партия [Root.GetRulingParty] им не воспользовалась. И это не просто пример позорно упущенной возможности укрепить международную позицию государства [Root.GetName]; это признак того, что за всеми их утверждениями о защите интересов [Root.GetAdjective]ого народа ничего не стоит. Пора менять политику».\n\nНаша неспособность грамотно вести столь ожидаемую войну вызвала уничижительную критику со стороны наших политических противников. Если мы откажемся от военных планов, то будет сложнее убедить народ, что мы ведем государство [Root.GetName] в верном направлении."
 nuke_dropped.1.d: "В первый и, хочется верить, последний раз в истории ядерная бомба была взорвана в ходе военных действий. Объектом бомбардировки является [From.From.GetName]. Огромный масштаб разрушений говорит о мощи нового оружия, которое вызывает страх не только тем, на что оно способно, но и тем, какие последствия это несет и для тех, кто его использует, и для всего человечества.\n\nМир затаил дыхание в ожидании, что последует дальше. Согласится ли [From.From.Owner.GetName] капитулировать, чтобы избежать дальнейшей агрессии, или это лишь укрепит боевой дух и желание нанести ответный удар?"
 nuke_dropped.2.d: "«На улицах творится ад».\n — Куниёси Аикава\n\nСегодня над Хиросимой на высоте 580 метров была взорвана ядерная бомба. Более двух третей города были мгновенно уничтожены. Хотя здания здесь строились с учетом частых землетрясений, уцелело лишь несколько строений.\n\nОбщественное сознание склонно преувеличивать мощь атомной бомбы и принижать ее цену — цену в человеческих жизнях. Ни одна из сторон не желает задумываться об ужасах атомной бомбардировки, но в историю это событие войдет тысячами и миллионами жизней, испарившихся в мгновение ока или угасших на отравленной земле."
 nuke_dropped.3.d: "Ядерная бомба, первоначально предназначавшаяся для Кокуры, взорвалась сегодня над Нагасаки. Погодные условия вынудили самолеты отклониться от курса, и сочетание дыма, облаков и технических неполадок стало тем фактором, который, возможно, изменил ход истории.\n\nВ связи с тем, что город расположен в долине, действие бомбы оказалось ограничено этой территорией, но разрушительный эффект все равно огромен. Пострадало несколько военных объектов, но это ничто в сравнении с человеческими жертвами. Пройдут десятилетия, прежде чем мы полностью осознаем долгосрочный эффект воздействия этого оружия."
 nuke_dropped.4.d: "Сегодня в [GetDateText] столица Германии Берлин была подвергнута ядерной атаке. Город пережил несколько бомбардировок и в эту войну, и в прошлую, но это не идет ни в какое сравнение с тем, что произошло сейчас. Со времен Тридцатилетней войны Берлин не знал таких глобальных разрушений — с учетом размеров города, это считалось невозможным.\n\nБункер фюрера, как утверждается, пережил взрыв, по крайней мере частично, поскольку бомба сдетонировала вдали от запланированного эпицентра, и утверждается, что [From.From.Owner.GetLeader] все еще жив и в ярости. Каким образом эвакуировать [From.From.Owner.GetAdjective]их лидеров и можно ли защитить их от радиации — это уже другой вопрос."
 nuke_dropped.5.d: "Сегодня ядерным взрывом был уничтожен Лондон. Несмотря на все системы противовоздушной обороны, [From.From.Owner.GetNameDef] оказался не готов к нападению. В [GetDateText] Биг Бен отзвонил время в последний раз и растаял от жара взрыва. По первым донесениям, Букингемский дворец был полностью уничтожен, местонахождение королевской семьи неизвестно.\n\nПодтверждается, что [From.From.Owner.GetLeader] выжил и намерен выступить по радио с речью. Британцам, совершенно павшим духом, жизненно необходимо вернуть волю к сопротивлению — или убедительно призвать к капитуляции."
 nuke_dropped.6.d: "Город Киото, ведущий [From.From.Owner.GetAdjective]ий промышленный центр, подвергся сегодня ядерному удару. Есть подозрения, что город был выбран в качестве мишени еще и потому, что является интеллектуальным центром.\n\nКрасота и историческая значимость Киото заставляла многих думать, что он уцелеет, но, вероятно, враг посчитал, что разрушение именно такого места даст дополнительное психологическое воздействие. Город расположен в низине, поэтому воздействие взрыва оказалось ограничено территориально, но старый императорский дворец и многие промышленные здания оказались полностью разрушены."
 nuke_dropped.7.d: "Сегодня в сердце Японской империи был нанесен ядерный удар. Столица Токио, хотя и подвергалась обычным бомбардировкам, никогда не рассматривалась как основная мишень для этого нового оружия. Однако в итоге из-за политической значимости новой столицы и близости императорского дворца, который был разрушен до основания, всепожирающий огонь все-таки обрушился с неба.\n\nХотя утверждается, что [From.From.Owner.GetLeader] жив, возникает вопрос, как далеко готовы зайти враги Японии. Если война не завершится сейчас, какие цели еще остались? Что еще им может угрожать?"
 nuke_dropped.8.d: "Ядерная бомба была взорвана сегодня над столицей Соединенных Штатов. Этот удар был нанесен одновременно и по политическому центру, и по историческому наследию США. Белый дом, Капитолий и ряд других значимых зданий и памятников оказались стерты с лица земли. Даже вашингтонский пожар столетней давности не может по разрушительной силе сравниться с тем, что сотворило с городом это новое оружие.\n\nХотя президент [From.From.Owner.GetLeader] находился в безопасности, случившееся глубоко потрясло нацию. Без сомнения, США надеялись оставаться первой и единственной страной, владеющей таким оружием. Эти мечты были разбиты вдребезги самым трагическим образом."
 nuke_dropped.9.d: "Ядерный взрыв сегодня потряс город Рим и заставил людей по всему миру содрогнуться. Многие полагали, что благодаря историческому и культурному наследию этот древний город никогда не станет мишенью для столь разрушительного оружия. Ватикан также был отчасти уничтожен, местонахождение Папы Римского остается неизвестным, так что взрыв привел в ужас не только всех итальянцев, но и всех католиков.\n\nВ последние десять лет Рим стремительно развивался, и какое-то время еще казалось, что город способен помочь нации возродиться после окончания войны. Увы, эти мечты обратились в прах вместе с тысячами людей."
 nuke_dropped.10.d: "Сегодня ядерная бомба была взорвана над городом Парижем, что привело к бесчисленным жертвам и разрушениям. Франция пребывает в шоке после того, как ее столица подверглась самой масштабной атаке за всю свою историю, в которой были и войны, и революции. Парижане еще могли ожидать, что город будет захвачен, но не уничтожен настолько решительно и беспощадно.\n\nБольше не будет парадов победы на Елисейских полях у Триумфальной арки. Возможно, в грядущие десятилетия возродится новый Париж, однако города, который был всем нам так дорог, теперь не существует."
 nuke_dropped.11.d: "Москва, город, который многие тщетно пытались завоевать, сегодня стала мишенью ядерной атаки. Взрыв был нацелен на Кремль, где заседает [From.From.Owner.GetAdjective]ое правительство, и сердце города было почти полностью уничтожено.\n\n[From.From.Owner.GetLeader] успел вовремя эвакуироваться и уцелел благодаря тому, что в последнее время готов был к любой угрозе, с любой возможной и невозможной стороны. Но от такого беспощадного врага нелегко будет укрыться даже на бескрайних просторах. Если все так пойдет и дальше, вскоре вся страна будет представлять собой лишь два вида пустошей: те, что были тут и прежде, и те, что созданы взрывами."
 nuke_dropped.12.d: "Сегодня город Копенгаген был разрушен ядерным взрывом. Нейтралитет позволил Дании избежать всех ужасов мировой войны и разрастись, столица страны никогда не подвергалась разрушениям со времен наполеоновских войн. Выпадение радиоактивных осадков наблюдалось также в районе Эресунна, и теперь уцелевшие пытаются попасть в Фюн и перебраться на континент, опасаясь новых атак.\n\nМестонахождение короля Кристиана Х неизвестно, и дух нации сильно подорван атакой. Посмотрим, не станет ли это началом заката одной из старейших европейских держав."
 nuke_dropped.13.d: "Прекрасный город Стокгольм, гордая Северная Венеция, сегодня пережил ядерный взрыв. Несмотря на все свои прошлые попытки сохранять нейтралитет, шведы все же оказались втянуты в международный конфликт и уплатили самую высшую цену. Эпицентр взрыва пришелся на центр южной части Стокгольма, отведенной под будущую застройку и городское развитие; теперь там все полностью уничтожено.\n\nПрактически весь город неузнаваем, однако старые постройки на Слюссене сохранились лучше, чем можно было ожидать. Решено было оставить их так навечно, в память о стойкости города."
 soviet.35.t: "[From.GetNameDefCap] хочет стать частью государства [SOV.GetNameDef]"
 usa.18.t: "[From.GetName] вмешивается в войну против государства [being_attacked.GetName]"
 usa.19.t: "[From.GetNameWithFlag] получает военную цель «Марионетка (приоритет)» в отношении государства [Root.GetName]"
 usa.23.d: "Государство [From.GetName] теперь гораздо жестче осуществляет доктрину Монро. Помимо политического влияния, которое они уже имеют в нашей стране, официальные лица государства [From.GetName] заявляют теперь, что готовы вмешаться в любой конфликт между странами Америки."
 generic.1.d_neutral_good: "Уже довольно давно [From.GetAdjective]ое правительство демонстрирует желание сблизить исторические пути наших стран и проявляет особый интерес к [Root.GetAdjective]ой политике. С недавнего времени это стало более заметно: партия [From.GetRulingParty] начала пропагандировать свою идеологию — [From.GetRulingIdeology], выступая с публичными речами, а также распространяя печатные материалы среди [Root.GetAdjective]ого населения. \n\nТеперь даже некоторые политики и видные чиновники под влиянием [From.GetAdjective]ой пропаганды начали выступать за то, чтобы постулаты этой идеологии стали господствующими в государстве [Root.GetName]."
 generic.1.d_bad: "Уже довольно давно [From.GetAdjective]ое правительство демонстрирует желание сблизить исторические пути наших стран, часто вмешиваясь во внутренние дела государства [Root.GetName]. В последнее время это вмешательство стало особенно активным, и партия [From.GetRulingParty] начала открыто пропагандировать идеологию [From.GetRulingIdeology], совершенно не считаясь с [Root.GetAdjective]ими политическими традициями. Множество материалов, в которых восхваляется [From.GetRulingIdeology], также распространяются среди [Root.GetAdjective]ого населения. Похоже, что даже некоторые политики и видные чиновники под влиянием [From.GetAdjective]ой пропаганды начали выступать за то, чтобы постулаты этой идеологии стали господствующими в государстве [Root.GetName]."
 country_capitulated.0.d_neutral_both_no_faction: "\n[Root.GetAdjective]ие власти создали правительство в изгнании, а капитуляцию основных сил принял представитель государства [From.From.GetNameDef], теперь контролирующий главный регион страны.\n\nНесмотря на то, что [From.From.GetName] и [Root.GetName] завершили свой конфликт, [From.From.GetNameDef] продолжает вести полномасштабную войну в других регионах."
 country_capitulated.0.d_neutral_prev_no_faction: "\n[Root.GetAdjective]ие Власти создали правительство в изгнании, а капитуляцию основных сил принял представитель государства [From.From.GetNameDef], теперь контролирующий главный регион страны.\n\n[Root.GetName] была незначительной частью крупного конфликта. Война, в которую втянуты [From.From.GetNameDef] и остатки альянса [Root.GetFactionName], продолжается в других регионах."
 country_capitulated.0.d_neutral_prev_faction: "\n[Root.GetAdjective]ие власти создали правительство в изгнании, а капитуляцию основных сил принял представитель государства [From.From.GetNameDef], теперь контролирующий главный регион страны.\n\n[From.From.GetNameDef] и [Root.GetNameDef] являлись незначительными участниками крупного конфликта. Война, в которую втянуты [From.From.GetFactionName] и остатки альянса [Root.GetFactionName], продолжается в других регионах."
 country_capitulated.0.d_positive_collab_diff_ideology: "\n[Root.GetNameDef] объявляет о своей полной капитуляции перед государством [From.From.GetNameDef]. [From.From.GetAdjective]ие войска вместе с независимыми [Root.GetAdjective]ими сторонниками идеологии «[From.From.GetRulingIdeology]» добились того, что [Root.GetLeader] вместе с правительством уходят в отставку. Сейчас основано новое правительство, которое будет возглавлять государство [Root.GetNameDef], в чём ему поможет [From.From.GetNameDef]. [From.From.GetLeader] отмечает, что это взаимное соглашение приведёт к началу в государстве [Root.GetNameDef] новой эпохи мира и процветания.\n[Root.GetLeader] в ответ заметил, что даже в ссылке он продолжит сражаться за державу [Root.GetNameDef] и будет поддерживать сопротивление у себя на родине."
 country_capitulated.0.d_positive_collab_invaded_same_ideology: "\n[Root.GetNameDef] объявляет о своей полной капитуляции перед государством [From.From.GetNameDef]. Несколько [Root.GetAdjective]их граждан, недовольных идеологией «[From.From.GetRulingIdeologyNoun]», которую принёс в государство [Root.GetNameDef] [Root.GetLeader], присоединились к [From.From.GetAdjective]им солдатам, чтобы лишить его власти и учредить новое правительство, которое возглавит [From.From.GetNameDef]. [From.From.GetLeader] отмечает, что это взаимное соглашение приведёт к началу эпохи мира и процветания в государстве [From.From.GetNameDef].\n[Root.GetLeader] в ответ заметил, что [From.From.GetLeader] не есть истинный [From.From.GetRulingIdeology], что даже в ссылке он продолжит сражаться за державу [Root.GetNameDef] и будет поддерживать сопротивление у себя на родине."
 country_capitulated.0.d_negative_collab_diff_ideology: "\n[Root.GetNameDef] объявляет о своей полной капитуляции перед государством [From.From.GetNameDef]. Очевидно, что снисходительность [Root.GetAdjective]ого правительства по отношению к симпатизирующим идеологии «[From.From.GetRulingIdeology]» сыграла свою роль в падении государства [Root.GetName]. [Root.GetFascistLeader] теперь занимает ведущую роль и будет править страной во имя режима, который установил [From.From.GetLeader].\n[Root.GetLeader] утверждает, что это не конец [Root.GetAdjective]ого суверенитета и что правительство, находясь в ссылке, будет поддерживать сопротивление в стране."
 news.289.t: "Государство [alliance_applicant.GetNameDefCap] вступает в альянс [alliance_inviter.GetFactionName]"
 news.289.d: "\nГосударства [alliance_inviter.GetNameDef] и [alliance_applicant.GetNameDef] опубликовали сегодня совместное заявление о том, что последнее стало полноправным членом альянса [alliance_inviter.GetFactionName]. Будущее покажет, какие цели, захватнические или оборонительные, преследует это сотрудничество, но военные обеих стран, вне всяких сомнений, уже готовят совместные планы."
 generic.5.t: "Государство [From.GetNameDefCap] приглашает государство [Root.GetNameDef] в альянс [alliance_inviter.GetFactionName]"
 generic.5.d.c: "Наши идеологические союзники из государства [alliance_inviter.GetNameDef] обратили внимание на наш посильный вклад в защиту интересов рабочего класса, и сегодня утром мы получили предложение присоединиться к альянсу [alliance_inviter.GetFactionName]. Объединив усилия с другими социалистическими странами, мы раздуем пламя мировой революции с новой силой."
 news.298.t: "Венгрия денонсирует Трианонский договор"
 news.298.desc: "В сегодняшней речи [HUN.GetLeader] заявил об отказе соблюдать условия договора, навязанного союзными державами по итогам Великой войны. Трианонский договор, подписанный бурлящей Венгрией в 1920 г., серьезно сократил размеры страны и численность ее вооруженных сил.\n\n[HUN.GetLeader] в своей речи намекает, что имеет виды на потерянные два десятилетия назад территории."
 news.300.t: "Венгрия требует передать Трансильванию"
 news.300.desc: "В дальнейших попытках избавиться от последствий Трианонского договора Венгрия отправила Румынии ультиматум с требованием вернуть Трансильванию. Официального ответа пока что не последовало, однако Венгрия дала понять, что в случае отказа не постесняется применить силу."
 news.301.t: "Румыния возвращает Трансильванию"
 news.301.desc: "Румыния объявила, что уступает требованиям и возвращает Трансильванию Венгрии. Это объединение заметно увеличивает территорию и мощь венгерской державы; кроме того, нет никаких сомнений, что успех такого масштаба приведет к дальнейшим претензиям на потерянные территории со стороны Венгрии."
 news.302.t: "Румыния отказывает Венгрии"
 news.302.desc: "Срок ультиматума прошел, но Румыния не утруждала себя ответом. Разъяренные власти Венгрии уже выступили с критикой румынского правительства, утверждая, что «приверженность незаконным договорам приведет к дестабилизации региона». Обе державы готовятся к военным действиям, которые могут начаться со дня на день."
 news.303.desc: "Продолжая борьбу с последствиями Трианонского договора, Венгрия потребовала возвращения Южной Словакии у ее текущего владельца — это [From.GetName]. Ответа от [From.GetAdjective]ого руководства пока не последовало, однако в венгерской риторике четко прослеживается угроза военного конфликта, и отказ может привести к новой войне в регионе."
 news.304.desc: "[From.GetName] официально уступает венгерским требованиям: уже предприняты первые спешные шаги по немедленному возвращению этой территории под венгерский контроль. Нет никаких сомнений, что подобный успех приведет к дальнейшим претензиям на потерянные территории со стороны Венгрии."
 news.305.t: "[From.From.GetName] отказывает Венгрии"
 news.305.desc: "Переговоры закончились ничем, и [From.From.GetName] официально объявляет об отказе удовлетворить венгерские требования и вернуть Южную Словакию. Разъяренные власти Венгрии уже выступили с критикой правительства, которое возглавляет [From.From.GetName], утверждая, что «его приверженность незаконным договорам приведет к дестабилизации региона». Обе державы готовятся к военным действиям, которые могут начаться со дня на день."
 news.306.desc: "Венгры, воодушевленные своими предыдущими успехами по возвращению потерянных территорий, на этот раз обратились к Югославии с требованием вернуть Воеводину. Югославы стараются найти дипломатическое решение, в то время как венгерское терпение тает; если требования не будут удовлетворены, вероятность мирного разрешения конфликта крайне мала."
 news.307.desc: "Югославия решила уступить венгерским требованиям и начала процесс передачи Воеводины своему соседу. Нельзя отрицать, что Венгрия постепенно становится могущественной региональной державой, несмотря на очевидно агрессивные методы."
 news.308.t: "Югославия отказывает Венгрии"
 news.308.desc: "Югославия отклонила венгерские требования и не планирует расставаться с Воеводиной; Венгрия же, в свою очередь, также не стремится к смягчению конфликта и продолжает угрожать применением силы для возвращения «законных территорий». Обе державы готовятся к военным действиям, которые могут начаться со дня на день."
 news.309.desc.a: "Венгрия открыто заявила, что Словакия должна снова стать частью великой державы: или войдя в нее, или в статусе автономного региона. Ультиматум сопровождается угрозой применения силы. Дипломаты нескольких европейских государств отчаянно пытаются найти мирное решение очередного кризиса."
 news.309.desc.b: "Венгрия открыто заявила, что Словакия должна снова стать частью великой державы: или войдя в нее, или в статусе автономного региона. Ультиматум сопровождается угрозой применения силы. Словацкое правительство отчаянно пытается найти дипломатическое решение очередному венгерскому кризису."
 news.310.desc.b: "После тщательного обдумывания словаки решили уступить требованиям Венгрии. В отсутствие иных вариантов им пришлось распрощаться с независимостью, чтобы сохранить жизни своих граждан. Нет сомнений, что это только увеличит напористость Венгрии по отношению к ослабленным соседям."
 news.311.t: "[From.From.GetName] отказывает Венгрии"
 news.311.desc.b: "Словаки, изо всех сил цепляющиеся за свою независимость, ответили отказом на требования Венгрии и начали укреплять свою границу. Венгрия пока не предпринимает никаких мер для смягчения ситуации; похоже, грядет война."
 news.312.desc.a: "По настоянию Венгрии Италия, Австрия и Венгрия обновили подписанные в 1934 г. Римские протоколы. Соглашение, являющееся де-факто декларацией дружбы, затрагивает вопросы экономического и политического сближения и может стать прологом к полноценному союзу, направленному на сдерживание растущих ревизионистских и экспансионистских тенденций Германии."
 news.312.desc.b: "По настоянию Венгрии Италия и Венгрия обновили подписанные в 1934 г. Римские протоколы. Соглашение, являющееся де-факто декларацией дружбы, затрагивает вопросы экономического и политического сближения и может стать прологом к полноценному союзу, направленному на сдерживание растущих ревизионистских и экспансионистских тенденций Германии."
 news.314.desc: "Из Венгрии приходят сообщения о том, что Миклош Хорти был застрелен террористом-одиночкой у дверей здания парламента в Будапеште. Он был спешно доставлен в госпиталь, но, по заключению докторов, умер в пути. Террорист, ликвидированный полицией при попытке скрыться, был опознан как член коммунистической партии.\n\nУбийство вызвало бурную реакцию в стране: Хорти был известным противником коммунизма, вносившим ощутимый вклад в сдерживание революционно настроенных элементов. Отсутствие старого адмирала во внутренней политике может привести к значительному росту коммунистического влияния."
 news.315.desc: "Австрия напрочь отвергла венгерские призывы о проведении референдума, игнорируя нарастающую воинственность соседа. Венгрия, в свою очередь, обвинила австрийское правительство в вопиющем нарушении демократических свобод и заявила, что не постесняется применить силу, чтобы защитить желание австрийского народа объединиться со своими венгерскими братьями. Обе стороны начали мобилизацию; вооруженный конфликт кажется неизбежным."
 stability.40.t: "Новый курс для государства [Root.GetNameDef]"
 news.334.d: "[USA.GetAdjective]ая и [ENG.GetAdjective]ая канонерские лодки, задействованные при эвакуации гражданских лиц в ходе конфликта между государствами [JAP.GetName] и [CHI.GetName], были атакованы [JAP.GetAdjective]ой авиацией. Несмотря на то, что канонерская лодка «Панай» имела на борту четкие опознавательные знаки [USA.GetAdjective]ого судна, на нее были сброшены две бомбы, в результате чего она затонула. Три [USA.GetAdjective]их и один [ITA.GetAdjective]ий гражданин, другие получили ранения. В ходе отдельной атаки на корабль Её Величества «Лейдибёрд» погиб один [ENG.GetAdjective]ий моряк.\n\nКак [USA.GetAdjective]ое, так и [ENG.GetAdjective]ое правительство выразили резкий протест. Инцидент подчеркивает напряженность между тремя крупнейшими морскими державами."
 news.334.a: "Неужели [JAP.GetName] не имеет представления о границах дозволенного?"
 generic.20.d_enemies: "Сегодня поступило сообщение из державы [From.GetNameDef]. В нём содержится требование: [Root.GetLeader] должен признать, что [From.GetLeader] — глава государства, а нашу нацию нужно организовать в нечто более соответствующее видению [From.GetAdjective]им правительством державы [Root.GetNameDef]. Приняв эти требования, мы станем марионеткой государства [From.GetNameDef].\n\nНам не хотелось бы отдавать свою независимость нашим врагам за рубежом, но в этом сообщении содержится определённый элемент угрозы, позволяющий предположить, что в случае отказа выполнить то, что требует [From.GetLeader], мы вскоре окажемся в состоянии войны с державой [From.GetNameDef]."
 generic.21.d: "[From.GetAdjective]ое правительство согласилось оставить свою независимость и стать марионеткой государства [Root.GetNameDef]. Мы уверены, что это приведёт нас к величию и поспособствует [Root.GetAdjective]им интересам в регионе."
 generic.22.d: "Сегодня прибыли дипломаты из государства [From.GetNameDef]. Они сообщили, что отклоняют наше предложение объединить государства [From.GetNameDef] и [Root.GetNameDef]. Как бы досадно это ни было, остаётся доступным — и весьма соблазнительным — вариант призвать государство [From.GetNameDef] к порядку силой."
 generic.23.d: "Сегодня к нам явилась враждебно настроенная делегация из государства [From.GetNameDef] и заявила свои претензии на всю территорию региона [demanded_prov_target.GetName]. [From.GetLeader] требует, чтобы мы немедленно вернули территорию, в противном случае неизбежна война. Наши визитёры утверждают, что [demanded_prov_target.Owner.GetAdjective]ий контроль над этим регионом нелегитимен и что [demanded_prov_target.GetName] — неотъемлемая часть [From.GetAdjective]ого государства.\n\nЕсли мы примем их требования, [demanded_prov_target.GetName] отойдёт государству [From.GetNameDef], но мы сохраним все национальные территории и претензии в регионе. В случае отказа, судя по всему, неизбежна война между нашими нациями."
 lar_collab_gov.1.d: "Государство [From.GetNameDefCap] недавно стало усердствовать в наращении сотрудничества с нашей нацией. Несколько [This.GetAdjective]их политиков начали весьма положительно высказываться о [From.GetAdjective]ом режиме, и многие его приверженцы в нашем регионе считают, что [From.GetRulingIdeology] идеология должна выражаться в прямой поддержке государства [From.GetNameDef].\n\nРастущее [From.GetAdjective]ое влияние в нашей стране непременно ослабит [Root.GetAdjective]ое сопротивление и может даже привести к основанию нового [From.GetRulingIdeology] правительства в сотрудничестве с государством [From.GetNameDef], если держава [Root.GetNameDef] капитулирует."
 germany.1041.b: "Здесь [FROM.GetAdjective]ая военная машина остановится."
 germany.1042.desc: "[ROOT.GetAdjective]ая мощь не знает границ — Судетская область полностью отошла нам. [FROM.GetAdjective]ая нация может спать спокойно... Но это пока."
 germany.1043.desc: "Несмотря на явный дисбаланс сил, [FROM.GetAdjective]ие дипломаты отказались выполнить наши требования и уступить нам Судетскую область. Время войны."
 generic_purchase_ships_events.04.desc: "Государство [FROM.GetNameDefCap] предлагает приобрести у нас часть законсервированных крупных кораблей. Эти корабли уже не состоят на службе — они устарели, и на них нет современного вооружения. Но продав их государству [FROM.GetNameDef], мы рискуем усугубить и без того ожесточенную гонку морских вооружений в регионе."
 AAT_germany.1.desc: "[FROM.GetNameDefCap] обращается к нам с предложением, выгодным для экономик обеих стран. Их промышленности нужны наши природные ресурсы, а нам нужны инвестиции для развития нашей промышленности. Заманчивое предложение, но не станет ли оно сделкой с дьяволом?"
 AAT_germany.2.desc: "[FROM.GetName] отклоняет наше предложение, утверждая, что оно не соответствует их интересам.\nПредставители страны подчеркивают, что не имеют ничего против нас, просто сейчас у них другие приоритеты."
 AAT_germany.3.desc: "[FROM.GetName] принимает наше взаимовыгодное предложение. Будем надеяться, это прибыльное соглашение не станет последним"
 GER_autobahn_desc: "Проект постройки скоростных автомагистралей, осуществляемый с большим успехом с 1933 года, сократил безработицу и стал символом экономического восстановления Германии. Но многое еще предстоит сделать."
 GER_wunderwaffe: "Вундерваффе"
 SOV_MOLOTOV_RIBBENTROP_NAME_COMMUNIST: "Пакт Молотова — Риббентропа"
 GER_soviet_ally_desc: "Возможно, невзирая на все идеологические расхождения с державой [GER.GetRussiansDemonym], которыми страдает [GER.GetUSSRAllianceDesc], нам удастся сосредоточиться на том, что нас объединяет, — на ненависти к эгоистичному либерализму и разлагающемуся Западу. Став союзником государства [GER.GetTheUSSRName], мы получим доступ ко всем необходимым ресурсам и, разумеется, к его военной мощи..."
 GER_anti_comitern_pact: "Антикоминтерновский пакт"
 GER_anti_comitern_pact_desc: "Вмешательство во внутренние дела других государств, которое позволяет себе Коммунистический интернационал, ставит под угрозу не только их социальное благополучие, но и мир во всем мире! Мы предложим всем странам, выступающим против коммунистов, подписать пакт, призванный сдерживать красную угрозу."
 GER_anti_soviet_pact: "Антисоветский пакт"
 GER_ussr_war_goal_desc: "Мы можем сосредоточить все пропагандистские усилия на подготовке народа Германии — и всего мира — к войне против государства [SOV.GetNameDef]."
 GER_anschluss_desc: "Аншлюс, или присоединение Австрии, — давняя мечта немецкого народа. Версальский договор запрещает такое присоединение, и все же пришло время осуществить эту мечту. Мы должны дать австрийцам шанс разделить наше славное будущее!"
 GER_anschluss_eq_trigger_tt: "Более §Y40 000§! ед. пехотного снаряжения в армии"
 anschluss_mefo_bills_tt: "Австрийское золото используется для снижения стоимости §Yвекселей «МЕФО»§!.\n"
 end_of_czechoslovakia_mefo_bills_tt: "Чехословацкое золото используется для снижения стоимости §Yвекселей «МЕФО»§!.\n"
 GER_trade_interdiction_desc: "Наши верфи вовсю строят подлодки, но нам нужно понять, как использовать их наилучшим образом. Надо предоставить адмиралам все необходимое для проведения боевых учений..."
 yugoslavia_mefo_bills_tt: "Югославское золото используется для снижения стоимости §Yвекселей «МЕФО»§!.\n"
 GER_second_ljubljana_award_tt: "Это событие позволит потребовать земли для государства [Root.GetName] или ценного союзника."
 GER_form_the_reichskommissariats: "Создание рейхскомиссариатов"
 GER_form_the_reichskommissariats_desc: "Мы сможем эффективнее распоряжаться ресурсами, промышленными мощностями и рабочей силой, если организуем квазиавтономные подчиненные нам правительства на оккупированных территориях."
 GER_reichskommissariats_tt: "Позволяет создать подчинённые государства на завоёванных территориях.\n"
 GER_crossing_the_atlantic_desc: "Сломив все сопротивление на континенте, нам придется переориентировать ВПК на создание могучего флота, чтобы быть готовыми к противостоянию с Британией и США. Мы не отступим, «до тех пор, пока, в благословенное Богом время, Старый мир, со всей его силой и мощью, не подчинит новый своей воле»."
 GER_safeguard_the_baltic_desc: "Прибалтийские страны совсем недавно были частью Российской империи. Следует ожидать, что [GER.GetRussiansDemonym] рано или поздно предпримет новую попытку аннексировать их. Чтобы не допустить этого, мы предложим им поддержку в случае [SOV.GetAdjective]ого вторжения."
 GER_support_the_finns_desc: "Финнам вовсю угрожает [GER.GetRussiansDemonym]. Мы гарантируем им защиту от коммунистической отравы и окажем скромную промышленную помощь."
 SOV_DANUBIAN_MEMBERSHIP_DESC_COMMUNIST: "коммунизм"
 GER_pool_technical_know_how_tt: "Каждое государство союза получит национальный дух."
 SOV_infrastructure_effort_desc: "Территории государства [ROOT.GetNameDefCap] велики, но по большей части не заселены. Мы должны обеспечить возможность быстрой транспортировки продукции и оборудования через всю страну."
 SOV_claim_on_sinkiang: "Потребовать Синьцзянь"
 SOV_claim_on_sinkiang_desc: "Синьцзянь под управлением товарища Шэн Шицая и без того фактически является марионеточным государством при СССР. Нам стоит закрепить это официально..."
 SOV_claim_on_sinkiang_threat: "Советы требуют Синьцзянь"
 USA_reinforce_monroe_doctrine_desc: "Принятая сто лет назад доктрина Монро закрепляет за США право противодействовать любым попыткам Европы превратить Америку в колонию, а также невмешательство в европейские дела. Выступая в роли миротворцев на обоих континентах, мы повысим свое влияние в этих регионах."
 USA_pax_americana_tt: "@США §YСоединенные Штаты§! смогут вмешиваться в войны, ведущиеся на Американском континенте"
 secret_bonus: "Бонус к вундерваффе"
 FRA_extra_research_slot: "Доп. ячейка для исследований"
 FRA_extra_research_slot_2: "Доп. ячейка для исследований II"
 ENG_war_with_ussr: "Война с [SOV.GetAdjective]им государством"
 CAN_defence_scheme_no_1: "Оборонительная схема № 1"
 CAN_defence_scheme_no_1_desc: "Пришла пора сдуть пыль с нашей «Оборонительной схемы № 1» — плана, разработанного в период между войнами и предусматривающего контратаку на США в случае войны."
 CAN_defence_scheme_no_2: "Оборонительная схема номер 2"
 CAN_defence_scheme_no_2_desc: "Оборонительная схема номер 2 — наш запасной план на случай войны между США и Японской империей в Тихом океане. В идеале мы хотели бы сохранить нейтралитет, но, как бы ни развивались события, нам необходима надежная оборона на западном побережье."
 NZL_department_of_scientific_and_industrial_research: "Управление научных исследований"
 RAJ_royal_indian_artillery: "Индийская артиллерия"
 RAJ_revive_the_screw_guns_effect: "Откроет доступ к: §HГорная пушка§!\n§HАртиллерия\n    Горы§!: Скорость перемещения: §G+15%§!\n§HПТО\n    Горы§!: Скорость перемещения: §G+15%§!"
 RAJ_royal_indian_navy: "Королевский индийский ВМФ"
 RAJ_royal_indian_navy_desc: "Нам необходимо как можно скорее расширить состав Королевского индийского флота. Новые тактические методы и новые корабли должны стать главной задачей."
 RAJ_cruiser_effort_desc: "Для развития индийского флота нам пока что хватит и крейсеров."
 HUN_protect_czechoslovakia_tt: "\nВероятность подчинения увеличится, если:\n - Уровень §Hмировой напряженности§! высок\n - Государство не состоит в §Hальянсе§!\n - Государство имеет §Hвысокое мнение§! о нас\n - В государстве действует §Hпакт о ненападении§! на нас"
 CAN_offer_concessions_for_labrador_tooltip: "§H[ENG.GetName]§! с большей вероятностью рассмотрит просьбу, чем прямое требование. Держава §Gс большей вероятностью§! уступит нашей просьбе, если она:\n — Находится в состоянии войны\n — Высокого мнения о нас\n — Имеет прогресс капитуляции выше §H25%§!\nИсповедует ту же идеологию, что и мы\n\nЕсли они согласятся:\n"
 RULE_ALLOW_WARGOALS: "Цели войны"
 RULE_ALLOW_RELEASE_NATIONS_SOVIET_TOOLTIP: "§Y[ROOT.GetNameDefCap]§! может не освободить это государство, пока не завершит фокус §Y$SOV_autonomous_soviet_republics$§!."
