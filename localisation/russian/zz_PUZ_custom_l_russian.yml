 GRE_GATHERING_STORM_DESC: "больше я вам ничего не скажу"больше я вам ничего не скажу"больше я вам ничего не скажу"больше я вам ничего не скажу"Греция переживает кризис. В 1935 году в ожесточённой грызне роялистов и республиканцев за душу нации пала Вторая греческая республика. Король, чужак-автократ, остаётся крайне противоречивой фигурой с неясной судьбой. \n\nЗлобные реваншисты-болгары погрязли в собственных междоусобных дрязгах и тихо догнивают на севере, а на востоке турки, давние враги и внезапные союзники Греции, переживают политические метаморфозы. И это ещё не говоря о чудовище, что ворочается по ту сторону Адриатики..."
 TUR_GATHERING_STORM_DESC: "больше я вам ничего не скажу"больше я вам ничего не скажу"больше я вам ничего не скажу"больше я вам ничего не скажу"На пепелище Османской империи родилась Турецкая республика. За независимость Турция заплатила кровью и пулями во время Национальной кампании 1923 года, и, хотя она сражалась за правое дело, потери по сей день лежат на сердцах турецкого народа тяжким грузом. \n\nВ дальних регионах сеют религиозную заразу консерваторы, изо всех сил отрицающие масштабную модернизацию, а курдские националисты сеют смуту на востоке страны. Хвалёный президент Мустафа Кемаль Ататюрк должен объединить страну или передать факел лидеру, который действительно сможет это сделать, да поскорее — в Европе назревает большая беда."
 ETH_GATHERING_STORM_DESC: "больше я вам ничего не скажу"больше я вам ничего не скажу"больше я вам ничего не скажу"больше я вам ничего не скажу"У Эфиопии многовековая история и императорская династия ей под стать. Хайле Селассие сделал многое для модернизации империи, но процесс был прерван, поскольку Италия нападала на Эфиопию второй раз за 40 лет. Ситуация безрадостна, но если империя соберется с силами, она сможет остановить захватчиков еще раз.\n\nЧтобы Эфиопия осталась свободной, надо освободить от европейского ига всю Восточную Африку — раз и навсегда."
 FIN_GATHERING_STORM_DESC: "больше я вам ничего не скажу"больше я вам ничего не скажу"больше я вам ничего не скажу"больше я вам ничего не скажу"Финляндия — молодая страна, получившая независимость от России в 1917 году после кровавой гражданской войны. Шрамы от той войны до сих пор свежи, а коалиционное правительство до сих пор не научилось работать эффективно. Советский Союз стремится овладеть финскими территориями близ Ленинграда, а Финляндия плохо готова к потенциальному конфликту, но тем не менее имеет долгую историю военных подвигов и доблести, а ее солдаты безоговорочно преданы стране.\n\nСейчас, когда повсюду растет напряжение и назревает глобальный конфликт, будущее Финляндии находится в очень шатком равновесии."
 SWE_GATHERING_STORM_DESC: "больше я вам ничего не скажу"больше я вам ничего не скажу"больше я вам ничего не скажу"больше я вам ничего не скажу"Хоть и сохранив нейтралитет в Великой войне, Швеция претерпела немало трудностей из-за британских попыток блокады Германии. Пока на континенте растет напряжение, шведский народ беспокоится, что ему снова придется страдать из-за дел великих держав.\n\nСоциал-демократы тем временем пытаются найти баланс между созданием социального государства, способного поддерживать бедняков, и созданием достаточно боеготовной армии, которая сможет сохранить вековую традицию нейтралитета."
 NOR_GATHERING_STORM_DESC: "больше я вам ничего не скажу"больше я вам ничего не скажу"больше я вам ничего не скажу"больше я вам ничего не скажу"Со времен обретения независимости от Швеции в 1905 году Норвегия с трудом находит политическую опору и лишь сейчас начинает демонстрировать признаки стабильности и отхода от Трудных тридцатых.\n\nСейчас, когда южные соседи погрузились в конфликт и война кажется неизбежной, Норвегия должна найти способ сохранить свою хрупкую независимость. Кабинет Нюгорсвольда делает ставку на нейтралитет и разоружение, чтобы показать великим европейским державам, что его страна не представляет угрозы. Пока, впрочем, неясно, к чему приведет такой подход."
 DEN_GATHERING_STORM_DESC: "больше я вам ничего не скажу"больше я вам ничего не скажу"больше я вам ничего не скажу"больше я вам ничего не скажу"В Европе снова растет напряженность, а у Дании тем временем слабая армия и ее экономика до сих пор страдает от последствий Великой депрессии.\n\nДатчане должны найти способ справиться с высокой безработицей и растущим движением экстремистов, осмысливая в то же время критически политику нейтралитета и умиротворения.\n\nДания по-прежнему распоряжается собственной судьбой, но надолго ли? Время покажет."
