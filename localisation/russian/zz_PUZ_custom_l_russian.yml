 ITA_bop_praise_the_army: "Похвалить армию"
 ITA_bop_praise_the_army_desc: "Отважные бойцы наших сухопутных войск — основа безопасности и стабильности государства [ITA.GetName]. Они достойны восхищения итальянского народа!"
 ITA_bop_praise_the_airforce: "Похвалить ВВС"
 ITA_bop_praise_the_airforce_desc: "Отважные бойцы наших ВВС — основа безопасности и стабильности государства [ITA.GetName]. Они достойны восхищения итальянского народа!"
 ITA_bop_praise_the_navy: "Похвалить флот"
 ITA_bop_praise_the_navy_desc: "Отважные бойцы нашего флота — основа безопасности и стабильности государства [ITA.GetName]. Они достойны восхищения итальянского народа!"
 SWI_concessions_to_fascists: "Уступки [ROOT.GetAdjective]ой партии [FROM.GetRulingIdeology]"
 SWI_concessions_to_communists: "Уступки [ROOT.GetAdjective]ой партии [FROM.GetRulingIdeology]"
 SWI_concessions_to_democrats: "Уступки [ROOT.GetAdjective]ой партии [FROM.GetRulingIdeology]"
 SWI_concessions_to_political_party_desc: "[ROOT.GetAdjective]ая [FROM.GetRulingIdeology] — идеология, которую мы резко осуждаем. Это может испортить наши отношения с [FROM.GetAdjective]им народом и спровоцировать дипломатический инцидент или даже вторжение. Возможно, нам стоит смягчить свою позицию, [FROM.GetRulingIdeologyNoun] — не так уж плохо."
 SWI_ask_for_guarantees: "Попросить гарантии у государства [FROM.GetName]"
 SWI_purchase_democratic_planes_fighters: "Закупить истребители у государства [FROM.GetName]"
 SWI_purchase_democratic_planes_fighters_desc: "Защита неба над государством [ROOT.GetName] не может ждать, пока мы обретем возможность сами производить свои самолеты, так что пока нам придется полагаться на поставки истребителей из государства [FROM.GetName]."
 SWI_purchase_democratic_planes_cas: "Закупить бомбардировщики у государства [FROM.GetName]"
 SWI_purchase_democratic_planes_cas_desc: "Наши производственные мощности пока ограничены, и мы должны полагаться на государство [FROM.GetName] в деле снабжения наших ВВС бомбардировщиками, что необходимы для поддержки войск."
 SWI_purchase_fascist_planes_fighters: "Закупить истребители у государства [FROM.GetName]"
 SWI_purchase_fascist_planes_fighters_desc: "Защита неба над государством [ROOT.GetName] не может ждать, пока мы обретем возможность сами производить свои самолеты, так что пока нам придется полагаться на поставки истребителей из государства [FROM.GetName]."
 SWI_purchase_fascist_planes_cas: "Закупить бомбардировщики у государства [FROM.GetName]"
 SWI_purchase_fascist_planes_cas_desc: "Наши производственные мощности пока ограничены, и мы должны полагаться на государство [FROM.GetName] в деле снабжения наших ВВС бомбардировщиками, что необходимы для поддержки войск."
 SWI_federal_council_decisions_category_desc_alt: "Нельзя ожидать, что [SWI.GetLeader], глава государства [SWI.GetNameDef], будет выполнять все функции в стране со столь важной миссией. Вот почему лидер должен полагаться на совет, которому будет делегирована часть функций устаревшей Ассамблеи.\n\n§YВедущие советники:§! \n[SWI_GetCouncilor1name] \n[SWI_GetCouncilor2name] \n[SWI_GetCouncilor3name]"
 SWI_promoting_to_president_TT: "\n§Y[?SWI.temp_character_president.GetName]§! уйдет с поста политического советника и станет президентом государства [SWI.GetNameDef]. Когда через год будет избран новый президент, §R[?SWI.temp_character_president.GetSheHe] больше не будет политическим советником или президентом конфедерации.§!"
 SWI_building_up_military_readiness_mission_desc: "Мы направляем свою нацию к укреплению обороны государства [ROOT.GetName]. Выпущены в продажу военные облигации, граждане тренируются дома, образуются ассоциации, в школах и на предприятиях проводятся занятия по военной подготовке. Мы должны быть готовы любой ценой."
 BBA_italo_ethiopian_war_events.10.desc: "Совет Лиги Наций решил ввести торговое эмбарго против государства [ITA.GetNameDef] в ответ на нападение на страну [ETH.GetNameDef]. Под санкции подпадают все ресурсы, которые могут быть использованы для производства вооружений. Санкции вступают в действие немедленно и будут осуществляться до тех пор, пока агрессор не прекратит нападать на державу [ETH.GetNameDef]."
 BBA_italo_ethiopian_war_events.11.desc: "Делегаты государства [ETH.GetName] в Лиге Наций потребовали закрыть Суэцкий канал для кораблей державы [ITA.GetName], чтобы тем самым усилить санкции против нее. После долгих дебатов Совет решил выполнить это требование. Поэтому стране [ROOT.GetNameDef] поручено останавливать все [ITA.GetAdjective]ие суда, которые пытаются пройти через канал."
 BBA_italo_ethiopian_war_events.14.desc: "Совет Лиги Наций обсудил просьбу государства [ETH.GetName] о военном вмешательстве в войну с Италией. В итоге совет не призвал к полномасштабной интервенции, но в своем заявлении рекомендовал государствам — членам Лиги любыми средствами поддержать державу [ETH.GetName] и в том числе разрешить добровольцам сражаться на ее стороне."
 BBA_italo_ethiopian_war_events.15.desc_a: "Лига Наций приняла резолюцию, призывающую поддержать государство [ROOT.GetName], и после этого в страну прибыли добровольцы из самых разных стран. Из них формируют интернациональные бригады. Будем надеяться, что эти добровольцы не просто хотят сражаться, а умеют это делать."
 BBA_italo_ethiopian_war_events.16.desc: "Лига Наций не решилась создать вооруженные силы, которые изгнали бы государство [ITA.GetName] с территории страны [ROOT.GetName]. Вместо этого они призвали другие страны отправить войска, чтобы восстановить статус-кво. Есть признаки, указывающие на то, что такие страны, как [FROM.GetName], организуют свои экспедиционные корпуса. Пока не ясно, ограничатся ли они разговорами или на самом деле помогут нам."
 BBA_italo_ethiopian_war_events.100.t: "Запрос от государства [FROM.GetNameDef]"
 BBA_italo_ethiopian_war_events.113.desc: "Лига Наций потребовала, чтобы государство [FROM.GetNameDef] немедленно прекратило военные действия против державы [ETH.GetName]. Однако [FROM.GetLeader] отказывается выполнять требования Лиги Наций. Это вопиющее нарушение международных законов, и поэтому совет Лиги Наций призвал ввести санкции против государства [FROM.GetNameDef]."
 BBA_italo_ethiopian_war_events.121.desc: "Долгая, ожесточенная борьба наконец-то закончилась. Лидер [FROM.GetLeader] принял наши требования и остановил агрессию против государства [ROOT.GetName]. [ROOT.GetLeader] теперь в центре всех разговоров, ведь именно благодаря этому правительству [ROOT.GetNameDef] может пережить трудные времена, успешно отбив нападение европейских колониалистов."
 BBA_italo_ethiopian_war_events.200.desc: "Общественность всегда активно сочувствовала делу государства [ROOT.GetName]. Никто, однако, не ожидал, что государство продержится дольше месяца-другого. Наше упорное сопротивление [ITA.GetAdjective]им захватчикам помогает завоевать поддержку по всему миру, и лидеры наций начинают воспринимать государство [ROOT.GetName] серьезно."
 BBA_italo_ethiopian_war_events.201.a: "Мы должны воспользоваться этим, чтобы изгнать врага из государства [ROOT.GetName]"
 BBA_italo_ethiopian_war_events.204.desc: "Повсюду народ восстает против захватчиков. И стар и млад вступают в движение сопротивления, что вынуждает государство [ITA.GetName] трудиться еще усерднее. Те из местных, кто не может сражаться, делают оружие и снаряжение для армии."
 BBA_italo_ethiopian_war_events.400.desc: "[AFA.GetLeader], султан государства [AFA.GetNameDef] давно находится под сильным [ROOT.GetAdjective]им влиянием. Как и на прошлой войне, он сохранил нейтралитет, несмотря на то что формально входит в [ETH.GetAdjective]ую империю. Строго говоря, султан до сих пор сохраняет власть лишь благодаря [ROOT.GetAdjective]ой доброй воле. Хоть страна и продала свое побережье государству [ROOT.GetName], она все еще остается помехой нашему завоеванию. Возможно, если [?ITA.ITA_capture_state.GetName] будет в оккупации, это убедит султана сдать и остальные свои территории."
 BBA_italo_ethiopian_war_events.401.t: "Ультиматум от государства [FROM.GetName]"
 BBA_italo_ethiopian_war_events.402.desc: "[FROM.GetNameDefCap] принимает наше требование разрешить использовать [FROM.GetAdjective]ие территории как базу для военных операций против государства [ETH.GetName]. Это фактически означает, что [FROM.GetName] теряет независимость."
 BBA_italo_ethiopian_war_events.403.desc: "К сожалению, дипломатическое давление оказалось недостаточным, чтобы обеспечить Италии контроль над территорией государства [FROM.GetNameDef]. [FROM.GetLeader] убежден, что его страна может выстоять против военной мощи державы [ROOT.GetName]."
 BBA_italo_ethiopian_war_events.503.desc: "Эфиопское правительство отказало британцам в их требовании заключить с нами мир. В итоге [ENG.GetLeader] изгоняет эфиопов из государства [ENG.GetNameDef], ясно давая всем понять, чье сотрудничество там ценят больше. Теперь у нас есть возможность дополнительно упрочить свои позиции в Африке!"
 BBA_italo_ethiopian_war_events.510.desc: "Нам сообщили, что итальянцы начали кампанию по дезинформации, чтобы подорвать наш режим и нашу легитимность. Их наглая ложь может склонить часть наших подданных на сторону государства [ITA.GetNameDef] и ослабить наши права на трон. Мы должны восстановить свою власть над Эфиопией, пока враг не навредил нам еще сильней!"
 BBA_ethiopia_balance_of_power_events.10.desc: "Из-за постепенной децентрализации государства [THIS.GetNameDef] центральное правительство, как и ожидалось, потеряло изрядную часть своей власти. Дошло уже до того, что разные регионы провозглашают независимость от державы [THIS.GetNameDef]. Если мы хотим сохранить контроль над ними, действовать надо быстро."
 ETH_breakup_tt: "§RСтановится независимым от государства [ROOT.GetName]§!"
 ETH_breakup_fight_tt: "§RСтановится независимым от государства [ROOT.GetName], а [ROOT.GetName] объявляет войну§!."
 BBA_ethiopia_balance_of_power_events.22.desc: "Недавние события показали, что многие наши офицеры не умеют вести современную войну. Вероятнее всего, дело в том, что мы исторически склонны передавать офицерские звания по наследству и раздавать с политическими целями, не руководствуясь при этом собственно заслугами кандидатов. Теперь, когда государство [ETH.GetNameDef] захлестнула волна реформ, пора принять решение о будущем военной иерархии."
 BBA_ethiopia_balance_of_power_events.26.desc: "Недавние события показали, что многие наши офицеры не умеют вести современную войну. Вероятнее всего, дело в том, что мы исторически склонны передавать офицерские звания по наследству и раздавать с политическими целями, не руководствуясь при этом собственно заслугами кандидатов. Теперь, когда государство [ETH.GetName] захлестнула волна реформ, важно сделать меритократию основным фактором в продвижении по службе."
 BBA_ethiopia_balance_of_power_events.56.desc: "Работа, проделанная центральным правительством для улучшения администрации государства [ROOT.GetName] и для интеграции разных регионов, привела к экономическому буму в регионе [?ROOT.ETH_bop_state.GetName]. Регион привлекает мигрантов из других частей страны и промышленность в нем развивается."
 BBA_ethiopia_exile_events.01.a: "Дело государства [FROM.GetName] — это наше дело"
 BBA_ethiopia_exile_events.02.t: "Повышенный уровень сопротивления в северных регионах государства [ETH.GetName]"
 BBA_ethiopia_exile_events.02.desc: "[ETH.GetLeader] бежит из страны, но по-прежнему призывает сторонников нападать на [ROOT.GetAdjective]ие войска. Эти речи привели к тому, что в северных и центральных регионах государства [ETH.GetName] повысился уровень сопротивления захватчикам."
 BBA_ethiopia_exile_events.03.t: "Партизаны-коммунисты на юге государства [ETH.GetName]"
 BBA_ethiopia_exile_events.03.desc: "Появились сообщения о нападениях на [ROOT.GetAdjective]ие войска в южной части государства [ETH.GetName]. Полагают, что за этими нападениями стоит организация под названием «Черные львы»."
 BBA_ethiopia_exile_events.06.desc: "[FROM.GetLeader] просит передать под контроль державы регион [550.GetName], если нам удастся захватить его у государства [550.Owner.GetNameDef]. Этот регион уже находился под [ETH.GetAdjective]им управлением, так что исторический прецедент для таких территориальных претензий существует. [FROM.GetLeader] также заявляет о том, что весь народ хабеша должен жить в одной стране, и утверждает, что с момента [ITA.GetAdjective]ой оккупации региона [550.GetName] у государства [FROM.GetNameDef] не было выхода к морю."
 BBA_ethiopia_exile_events.22.desc: "[ROOT.GetLeader] обещает лидеру [FROM.GetLeader] выделить один из островов страны [ROOT.GetName] в качестве базы для правительства. Именно там будут размещены войска, которые начнут освобождать страну [FROM.GetName] от захватчиков. Это официальное признание лидера [FROM.GetLeader] в качестве правителя страны [FROM.GetNameDef], поэтому [ITA.getName] будет считать это объявлением войны. Кроме того, это возможность усилить влияние государства [ROOT.GetNameDef]."
 BBA_ethiopia_exile_events.23.desc: "В качестве жеста доброй воли и по случаю признания лидера [ROOT.GetLeader] законным правителем государства [ROOT.GetNameDef] [FROM.GetLeader] передает лидеру [ROOT.GetLeader] остров. [?ETH.japanese_island.GetName] станет базой для войск, которые будут освобождать страну [ROOT.GetName].\n\n [FROM.GetNameDef] поможет стране [ROOT.GetName] вернуть утраченные территории. В благодарность за это [ROOT.GetLeader] дает клятву верности лидеру [FROM.GetLeader], тем самым сделав две страны союзниками в борьбе с европейским империализмом."
 BBA_ethiopia_exile_events.30.desc: "[FROM.GetNameDefCap] предлагает нам подать совместную заявку на вступление во фракцию-оппонент государства [ITA.GetNameDef]. Такой поступок идет вразрез с нашей исторической политикой, но, с другой стороны, она и так уже нарушена тем, что мы позволили [FROM.GetAdjective]ому лидеру остаться в государстве [ROOT.GetName]."
 BBA_ethiopia_exile_events.40.a: "Пусть [ITA.GetName] уходит из государства [FROM.GetName]"
 BBA_ethiopia_exile_events.41.desc_back_off: "Очевидно, что [FROM.GetLeader] встал на сторону нашего врага. [?global.ETH_peace_country.GetLeader] получил разрешение проживать в государстве [FROM.GetNameDef] и уже довольно давно делает там вид, что все еще находится у власти. Ложь бывшего лидера государства [?global.ETH_peace_country.GetNameDef], очевидно, повлияла на то, что [FROM.GetLeader] думает о государстве [ROOT.GetNameDef], в худшую сторону. Теперь [FROM.GetNameDef] требует, чтобы мы просто ушли из государства [?global.ETH_peace_country.GetName] и забыли о наших разногласиях."
 BBA_ethiopia_exile_events.43.desc: "[FROM.GetLeader] понимает необходимость государства [ETH.GetName] уступить территорию, чтобы завершить конфликт и при этом позволить нам сохранить лицо. Скоро мы сможем забыть об этом неудавшемся вторжении и остаться с гордо поднятыми головами."
 BBA_ethiopia_exile_events.45.desc_cede_territory: "[FROM.GetLeader] договаривается о мире с государством [FROM.FROM.GetNameDef]. К сожалению, оба лидера решили за нашими спинами, что [FROM.FROM.GetName] получает часть территории государства [ROOT.GetName]. Мы ничего не можем с этим поделать."
 BBA_ethiopia_exile_events.52.desc: "Его Величество [ETH.GetLeader] провел в своей резиденции званый вечер, который оказался крайне успешным. Пока гости беседовали и наслаждались деликатесами со всего мира, [?ETH.host_nation.GetAdjective]ие политики слушали рассказы [ETH.GetAdjective]их беженцев о жестокой [ITA.GetAdjective]ой оккупации их родных земель. Многие склонились к тому, чтобы направлять больше [?ETH.host_nation.GetAdjective]их ресурсов на помощь в освобождении государства [ETH.GetNameDef]."
 BBA_ethiopia_exile_events.53.desc: "За последние месяцы было предпринято немало усилий по лоббированию поддержки среди наших хозяев за помощь в освобождении государства [ETH.GetNameDef]. Его Величество написал членам правительства и военной верхушке письма в поддержку нашего дела. Изгнанники тем временем по очереди дают интервью и пишут статьи в разные газеты, чтобы заручиться поддержкой у [?ETH.host_nation.GetAdjective]ой публики. Хоть это было и непросто, кажется, что настроение нации сдвигается в сторону прямой военной поддержки освобождения государства [ETH.GetNameDef]."
 BBA_ethiopia_exile_events.54.desc: "Наши недавние усилия по сбору средств увенчались большим успехом. Возрос приток денег в имперскую казну от благотворителей по всему миру. Похоже, в мире много тех, кто разделяет наше недовольство оккупацией государства [ETH.GetNameDef]."
 BBA_ethiopia_exile_events.57.desc: "На недавний призыв к [?ETH.host_nation.GetAdjective]им морякам и кораблям, желающим выйти в полные врагов воды, откликнулось множество добровольцев. Отставные моряки, гражданские моряки и молодые добровольцы в поисках приключений вызвались служить на разномастный флот из грузовых кораблей, набранных нами на судоразделочных заводах государства [?ETH.host_nation.GetNameDef]."
 BBA_ethiopia_imperial_events.20.desc: "Заручившись поддержкой среднего класса и крестьянства государства [ETH.GetName], Рас $ETH_ras_imru_haile_selassie$ объявил, что $ETH_haile_selassie$ официально оставляет трон и в государстве [ETH.GetNameDef] вводятся всеобщие выборы. Поскольку народ и, что в данном случае еще важнее, [ETH.GetAdjective]ая армия считают его настоящим героем второй Итало-эфиопской войны, он смог заручиться лояльностью военных, а поддержка отсутствующего императора так и не сформировалась."
 BBA_ethiopia_anti_colonialism_events.2.desc: "[?global.african_supporting_country.GetLeader], лидер страны [?global.african_supporting_country.GetNameDef], просит немедленно положить конец войне с [?global.african_revolt_country.GetAdjective]им повстанцами. [?global.african_supporting_country.GetAdjective]ие дипломаты призывают страну [ROOT.GetName] признать независимость государства [?global.african_revolt_country.GetNameDef]. Они не говорят открыто о том, что в случае отказа [?global.african_supporting_country.GetNameDef] объявит нам войну, но ясно дают понять, что это возможно."
 BBA_ethiopia_anti_colonialism_events.5.t: "[FROM.GetName] вступает в войну против государства [?global.african_colonial_country.GetName]"
 BBA_ethiopia_anti_colonialism_events.6.desc: "После сильного дипломатического давления со стороны государства [ROOT.GetName], в том числе после встреч между лидерами [ROOT.GetLeader] и [?global.african_colonial_country.GetLeader], [?global.african_colonial_country.GetAdjective]ое правительство решило уступить и признало [?global.african_revolt_country.GetAdjective]ую независимость. \nБлагодаря прямому [ROOT.GetAdjective]ому вмешательству война за независимость [?global.african_revolt_country.GetAdjective]ого народа наконец-то закончилась. [?global.african_revolt_country.GetNameDefCap] — свободная страна, и [ROOT.GetLeader] наверняка будет вечно считаться героем в государстве [?global.african_revolt_country.GetNameDef]."
 BBA_ethiopia_industrial_financial_events.2.b: "Лишь бы у нас оставалась хоть какая-то автономия"
 BBA_ethiopia_industrial_financial_events.3.desc: "Как мы ни старались объяснить ситуацию, [FROM.GetLeader] отказывается выполнять наши требования по дальнейшей интеграции экономик. [FROM.GetLeader] утверждает, что независимость государства [FROM.GetName] неприкосновенна и обсуждению не подлежит."
 BBA_ethiopia_industrial_financial_events.5.desc: "[FROM.GetLeader] подписывает документ, согласно которому [ROOT.GetName] и [FROM.GetName] объединяются. Экономические политики двух стран будут согласованы, министерства иностранных дел будут слиты в одно. Юридические системы будут объединены, чтобы облегчить полное сотрудничество.\n[FROM.GetNameDefCap] с этого дня будет неотъемлемой частью государства [ROOT.GetName]."
 ETH_start_civil_war: "§Y$ETH_haile_selassie_gugsa$§! начнет §Yгражданскую войну§!, противником в которой станет §Y$ETH_haile_selassie$§!, когда фокус §Y$ETH_declare_for_italy$§! будет завершен."
 ETH_italy_refuse_cooperation: "Фокус §Y$ETH_reach_out_to_the_italians$§! будет отменен, фокус §Y$ETH_rally_around_the_emperor$§! будет завершен автоматически. "
 ETH_start_civil_war_gojjam: "§Y$ETH_hailu_tekle_haymanot$§! начнет §Yгражданскую войну§!, противником в которой выступит §Y$ETH_haile_selassie$§!, после того как будет завершен фокус §Y$ETH_declare_for_italy$§!."
 ETH_start_civil_war_jimma: "§Y$ETH_abba_jofir$§! начнет §Yгражданскую войну§!, противником в которой выступит §Y$ETH_haile_selassie$§!, после того как будет завершен фокус §Y$ETH_declare_for_italy$§!."
 BBA_ethiopia_fascist_events.54.b: "Нет, нам ни к чему усиливать государство [FROM.GetName]"
 BBA_ethiopia_fascist_events.57.a: "Усиление государства [FROM.GetName] снимет нагрузку с наших войск в регионе."
 BBA_ethiopia_fascist_events.58.a: "Отличный день для государства [ETH.GetName]!"
 BBA_ethiopia_communist_events.01.desc: "Коммунистическое руководство государства [ETH.GetName] обратилось к нам за помощью в борьбе с итальянскими фашистами. Новый режим в городе [ETH.Capital.GetCapitalVictoryPointName] по-прежнему непрочен, и, возможно, нам удастся переманить его на свою сторону, если мы окажем ему поддержку. Однако наши действия могут привести к эскалации войны, и, несомненно, [ITA.GetName] будет в бешенстве."
 BBA_ethiopia_communist_events.03.t: "[SOV.GetName] отправляет помощь в государство [ETH.GetName]."
 BBA_ethiopia_communist_events.04.desc: "В ближайшие месяцы [SOV.GetName] пришлет нам материальную помощь, а также позволит «добровольцам» из [SOV.GetAdjective]их вооруженных сил сражаться плечом к плечу вместе с нами против государства [ITA.GetName]. Это, несомненно, склонит чашу весов в нашу пользу, однако пока неясно, как [ITA.GetAdjective]ое правительство отреагирует на присутствие [SOV.GetAdjective]их войск."
 BBA_ethiopia_communist_events.06.desc: "При поддержке государства [SOV.GetName] армейские офицеры распустили временное [ETH.GetAdjective]ое правительство. Они утверждают, что [SOV.GetAdjective]ая разведка предоставила им сведения о том, что правительство под руководством лидера [ROOT.GetLeader] предало народ. Члены этого правительства якобы вели переговоры о полной оккупации страны [ITA.GetAdjective]ими войсками, надеясь получить за это огромные суммы денег. После столкновений с «Черными львами» члены правительства были либо убиты, либо арестованы. \n\nАрмия взяла управление страной на себя, намереваясь восстановить порядок и нейтрализовать сообщников лидера [ROOT.GetLeader]. Пока неясно, как долго будет действовать новая военная администрация."
 BBA_ethiopia_communist_events.11.desc: "Новое руководство государства [ETH.GetNameDefCap] признало, что его вооруженные силы не готовы к ведению современной войны, и обратилось к нам за помощью в реорганизации армии. Это отличная возможность для наших офицеров, ведь они научатся действовать в самых разных условиях. Кроме того, мы получаем шанс изменить баланс политических сил внутри страны [ETH.GetName]."
 BBA_ethiopia_communist_events.17.desc: "Делегация из государства [ETH.GetNameDef] убеждает наших министров и генералов прислать их стране старую бронетехнику, чтобы тем самым помочь в войне с державой [ITA.GetName]. Очевидно, [ETH.GetAdjective]ие войска терпят поражение в боях с [ITA.GetAdjective]ими танками. Если мы пришлем нашу технику, это, несомненно, поможет отбросить наступающих [ITA.GetAdjective]их солдат, но [SOV.GetNameDef] и [ITA.GetName] окажутся на ножах."
 BBA_ethiopia_communist_events.22.desc: "[ITA.GetAdjective]ое правительство до сих пор игнорирует наши требования прекратить войну против державы [ETH.GetName]. Нам стало ясно, что оно понимает только язык силы. Если мы будем придерживаться выбранного курса, то конфликт между странами [SOV.GetName] и [ITA.GetName] станет неизбежным. Если мы уступим сейчас, то утратим все, что получили, поддерживая государство [ETH.GetName], и наше дипломатическое влияние в мире сильно пострадает."
 bba_news.1.desc: "Сегодня лидеров стран мира потрясла новость о возможном начале крупномасштабной войны. Советский лидер [SOV.GetLeader] потребовал, чтобы [ITA.GetLeader] остановил агрессию, которую [ITA.GetName] развязывает против государства [ETH.GetNameDef]. [SOV.GetLeader] четко заявил о том, что если [ITA.GetName] не выполнит это требование, [SOV.GetLeader.GetSheHe] применит силу, чтобы достичь своих целей. За последние месяцы [SOV.GetAdjective]ое правительство поставляло государству [ETH.GetNameDef] снаряжение и советников, но теперь становится ясно, что оно считает эту страну частью своей сферы влияния."
 bba_news.2.desc: "\n[ITA.GetName] неожиданно соглашается заключить перемирие с государством [ETH.GetName]. [ITA.GetAdjective]ие войска начали отступать к исходным границам со страной [ETH.GetNameDef], освобождая захваченные территории. Несомненно, [ITA.GetLeader] принял такое решение, увидев готовность государства [SOV.GetNameDefCap] вступить в войну на стороне Эфиопии. Пока неясно, как [ITA.GetAdjective]ий народ отреагирует на это унижение."
 bba_news.7.t: "[ITA.GetName] начинает аннексию государства [AFA.GetNameDef]"
 bba_news.7.desc: "Ходят слухи о неминуемой аннексии государства [AFA.GetNameDef] [ITA.GetAdjective]ими войсками. [ITA.GetAdjective]ая армия уже собирается на границе изолированной нации, а источники утверждают, что [AFA.Capital.GetCapitalVictoryPointName] подвергается дипломатическому давлению и принуждается к бескровной капитуляции. Пока неясно, сможет ли [AFA.GetLeader] сопротивляться [ITA.GetAdjective]ому давлению, но сейчас ситуация выглядит удручающей."
 bba_news.8.desc: "[AFA.GetNameDef] принимает [ITA.GetAdjective]ие требования о подчинении — что, вероятно, и неудивительно. Хоть [AFA.GetAdjective]ое правительство и оттягивало момент, надеясь избежать оккупации, со временем все отчетливее становилось ясно, что колониальные державы региона не придут к нему на помощь, а соседи, [ETH.GetName], не смогут выделить войска в помощь. Видя, как безрадостно развивается ситуация, правительство уступило [ITA.GetAdjective]им требованиям, чтобы его народ не пал жертвой напрасного кровопролития.\n\n[ITA.GetAdjective]ие войска сейчас выдвигаются в эту небольшую страну, чтобы занять новые позиции на границе государства [ETH.GetNameDef]. Пока неясно, будет ли оккупация постоянной и как она повлияет на общий [ITA.GetAdjective]ий конфликт с державой [ETH.GetName]."
 BBA_ethiopia_communist_events.30.desc: "Представители государства [ETH.GetNameDefCap] хотят договориться о перемирии в конфликте между нашими странами. Война идет не так успешно, как мы надеялись, и перемирие даст нам возможность собрать силы в регионе или разобраться с другими неотложными проблемами."
 BBA_ethiopia_communist_events.32.desc: "[ITA.GetAdjective]ое правительство отказалось заключить перемирие. Похоже, они твердо намерены уничтожить государство [ETH.GetNameDefCap]. Теперь наш народ знает, что переговоры с фашистами невозможны и что защитить нашу свободу мы сможем только в том случае, если удвоим усилия."
 BBA_ethiopia_communist_events.38.desc: "Добровольцы из государства [ETH.GetNameDef], которые недавно воевали с фашистами в своей стране, прибыли в Испанию, чтобы помочь нам. [ETH.GetLeader] клянется поддержать нас и обещает в ближайшие месяцы прислать материальную помощь."
 BBA_ethiopia_communist_events.40.desc: "Нам не удалось сохранить контроль над нашей территорией в Африке. Правительство государства [ETH.GetName] достигло своих целей и теперь вышло на связь, надеясь заключить мирный договор с нами."
 BBA_ethiopia_communist_events.55.b: "Этих предателей нужно немедленно экстрадировать в государство [JAP.GetName]!"
 BBA_ethiopia_communist_events.56.b: "Возможно, мы можем сделать что-то еще в поддержку борьбы государства [ETH.GetNameDef]..."
 BBA_ethiopia_communist_events.57.desc: "Мы получили официальный запрос от правительства государства [JAP.GetName] — оно требует экстрадиции любых [JAP.GetAdjective]их подданных, прибывающих в страну, чтобы присоединиться к нашему революционному движению. Пока неясно, что именно с ними намерены делать, но нам вполне четко дали понять, что в случае невыполнения просьбы нас ждут последствия."
 BBA_ethiopia_communist_events.60.desc: "Послы из государства [FROM.GetNameDef] отклонили наше предложение мира. Они утверждают, что наше нападение было абсолютно безосновательно, и потому они примут от нас лишь безоговорочную капитуляцию, поскольку мы — угроза миру в регионе."
 BBA_ethiopia_communist_events.62.desc: "Дипломаты из государства [FROM.GetNameDef] сообщили нам, что их правительство желает отказаться от претензий на освобожденную нами [?ETH.ETH_disputed_colony.GetAdjective]ую территорию. Теперь они выводят свои войска к новообразованным границам региона."
 BBA_african_union_events.4.desc: "Организация африканского единства учредила банк под названием [ETH_GetCentralBankName]. Ему поручено создать валюту для растущей организации. Планируется выпустить общую денежную единицу и начать объединение экономического пространства государств-участников. Это, несомненно, принесет пользу экономике в будущем, но вызовет проблемы в краткосрочной перспективе, так как людям придется привыкать к новым деньгам."
 BBA_african_union_events.5.desc: "Правительство государства [FROM.GetNameDefCap] считает, что ему не требуется [ETH_GetCentralBankName]. Оно предпочитает самостоятельно управлять своей валютой и торговыми тарифами."
 BBA_african_union_events.22.desc: "Верхушка государства [FROM.GetNameDef] с негодованием отвергает наши попытки запугать ее. Маловероятно, что в ближайшем будущем она пойдет на сотрудничество."
 BBA_african_union_events.23.desc: "Верхушка государства [FROM.GetNameDef] общими усилиями пытается облегчить наше беспокойство насчет подстраивания политики под Организацию африканского единства. Она дошла уже до того, что обещает в дальнейшем консультироваться с нашими послами, прежде чем принимать поспешные решения в будущем."
 BBA_italy_second_italo_ethiopian_war.1.desc: "Мы обратили войска государства [FROM.GetName] в бегство! Наша могучая армия нанесла им такой урон, что [FROM.GetAdjective]ое правительство теперь ползает на коленях, умоляя о мире. Наша страна сильно пострадала от войны, и мир был бы очень кстати, но еще мы получили шанс воспользоваться победой и сделать так, чтобы ни одно неразумное европейское государство больше не пыталось покорить непокорную Эфиопию!"
 BBA_italy_missiolinis.71.desc: "С тех пор как дуче сформировал Aeronautica, она стала символом национальной гордости и одной из лучших ВВС мира. Единственная проблема в том, что она слишком мала, и теперь дуче убедили заказать дополнительные самолеты, чтобы усилить Aeronautica."
 BBA_italy_missiolinis.73.desc: "Муссолини лично заинтересовался усилением ВВС и использовал производство новых самолетов как возможность продемонстрировать мощь итальянской промышленности. Aeronautica стала центральным элементом пропаганды, восхваляющей итальянскую авиацию и инженерную мысль."
 BBA_italy_naval_cooperation_programs.06.desc: "Недальновидность государства [FROM.GetName] поражает! Отказ от совместного участия в морских маневрах для подготовки флотов лишь ярче показывает его заносчивость."
 BBA_italy_naval_cooperation_programs.10.desc: "Вопреки ожиданиям, нам не удалось быстро убедить государство [FROM.GetName] приобрести наши устаревшие корабли сопровождения. Нам придется обратиться к кому-нибудь еще, чтобы избавиться от них."
 BBA_italy_naval_cooperation_programs.17.t: "[ITA.GetAdjective]ие сверхмалые подводные лодки прибывают в государство [ROOT.GetName]"
 BBA_italy_human_torpedo_raid.1.t: "Налет на государство [?ITA.ITA_raided_state_var.GetName]"
 BBA_italy_bop.3.desc: "[?ITA.ITA_reclaimed_core.GetName] возвращается под наш контроль благодаря нашим победоносным войскам, и боевой дух итальянцев растет. Возможно, именно сейчас мы изменим ход войны и вытесним врагов из нашего любимого государства [ITA.GetNameDef]."
 BBA_italy_civil_war.6.t: "Независимость для государства [ROOT.GetNameDef]"
 ITA_we_will_transfer_the_following_states_tt: "Следующие регионы перейдут под контроль государства §Y[RDS.GetFlag][RDS.GetNameDef]§!:"
 BBA_italy_civil_war_monarchist_tt: "Мы получим статус §Y$RDS_DEF$§!, став разжигателями гражданской войны с идеологией §Y$neutrality$§!. [GetRdsOverlord]"
 BBA_italy_civil_war_communist_tt: "Мы получим статус §Y$RDS_DEF$§!, став разжигателями гражданской войны с идеологией §Y$communism$§!. [GetRdsOverlord]"
 BBA_italy_civil_war_democratic_tt: "Мы получим статус §Y«$RDS_DEF$»§!, став разжигателями гражданской войны с идеологией §Y«$democratic$»§!. [GetRdsOverlord]"
 BBA_italy_civil_war.101.desc: "[FROM.GetLeader], мудрый лидер государства [FROM.GetName], щедро возвращает нам контроль над итальянской территорией! Это не только значительно повысит боевой дух войск, но и усилит наши возможности по освобождению всей Италии."
 BBA_italy_interaction_events.2.desc: "Президент государства [SWI.GetNameDef] сегодня объявил о конце эпохи для страны. Он уступит нам итальянский регион [846.GetName] и откажется от претензий на любые италоговорящие города в регионе. Сегодня и размер, и мультиэтнические ценности государства [SWI.GetName] претерпели удар — ведь итальянский язык больше не является там официальным."
 BBA_italy_interaction_events.8.desc: "[ITA.GetLeader] из государства [ITA.GetNameDef] отправляет нам ультиматум: [ITA.GetName] требует разрешить оккупацию региона Далмация. Если не выполнить это требование, нас, вероятнее всего, ждет военный конфликт."
 BBA_italy_interaction_events.9.desc: "[FROM.GetLeader] из государства [FROM.GetNameDef] достойно принимает наши требования по оккупация Далмации и уступает эту территорию нам. Очевидно, это государство не желает злить нас, что лишь поможет Италии укрепить свою позицию на Балканах."
 BBA_italy_interaction_events.10.desc: "[FROM.GetLeader] из государства [FROM.GetNameDef] по своей глупости отказывает нам в нашем законном требовании. Настало время сразить государство [FROM.GetName] одним быстрым ударом. Такой шаг, несомненно, даст нам права на Далмацию в ближайшем будущем."
 BBA_italy_interaction_events.14.desc: "[ITA.GetLeader] требует обеспечить гарантии безопасности наших наций, что вполне справедливо. Куда хуже то, что [ITA.GetLeader] требует полностью демилитаризировать регионы [342.GetName] и [339.GetName], что плохо повлияет на нашу обороноспособность — ведь тогда мы не сможем установить защитные позиции на случай атаки со стороны государства [ITA.GetName] или любых его союзников."
 BBA_italy_interaction_events.21.a: "Выкуси, Греция, мы были первыми!"
 BBA_italy_interaction_events.26.a: "Они поняли, что им не сравниться с нами!"
 BBA_italy_interaction_events.42.desc: "[FROM.GetName] скромно принимает наше предложение защиты и склоняется перед законными правителями Средиземноморья. Сегодня воссияла новая яркая звезда Иберии и государства [ITA.GetNameDef]."
 BBA_italy_interaction_events.44.desc: "Государство [FROM.GetLeader] запустило инициативу по заключению союза с нациями Южной Америки и объединению латинских культур в рамках одних владений. Кажется, это хорошая возможность защититься от государства [USA.GetNameDef]. Что мы ответим?"
 BBA_italy_interaction_events.45.desc: "[FROM.GetName] скромно принимает наше предложение альянса и присоединяется к нам для совместной борьбы с нашим общим врагом. Сегодня воссияла новая яркая звезда Южной Америки и государства [ITA.GetNameDef]."
 BBA_italy_interaction_events.71.desc: "К нам прибыл посланник от государства [ITA.GetNameDef] с вопросом, не желаем ли мы забыть о наших разногласиях и образовать новое правительство под итальянским надзором. Посланник также сообщил, что его держава начнет организацию новой администрации в нашей стране хоть с нашей помощью, хоть без нее. Если мы откажемся от предложения, остальной мир предпочтет нам эту новую администрацию."
 BBA_italy_communist_events.03.t: "Международная поддержка государства [ROOT.GetNameDef]"
 BBA_italy_communist_events.03.desc: "Правительство государства [FROM.GetName] выслушало наш призыв к товарищам-коммунистам о помощи и решило нам помочь. Это усилит не только наши связи, но и нашу оборону, и теперь мы сможем защитить нашу дорогую республику."
 BBA_italy_communist_events.06.desc: "Наши братья по оружию из государства [FROM.GetName] предложили собрать Большую комиссию с участниками из Испании и других стран, чтобы таким образом укрепить наше сотрудничество. Они утверждают, что вместе нам будет проще противостоять капитализму и фашизму и что однажды мы сможем сокрушить их."
 BBA_italy_communist_events.07.desc: "Наши товарищи из государства [FROM.GetName] согласились объединить силы и создать Большую комиссию! Вместе мы сможем противостоять натиску капитализма и фашизма, а также распространить нашу славную революцию по всему миру!"
 BBA_italy_democratic_events.03.desc: "Гражданская война принесла немало горя и пролитой крови, она потрясла самые основы государства [FROM.GetName]. Хаос также привел к вакууму власти, который сейчас заполняется в регионе [?ROOT.ITA_mafia_epicenter_state.GetName] поднявшей голову мафией. Пожалуй, разгром мафии был единственным хорошим достижением фашистов."
 BBA_italy_anti_colonialism_events.02.t: "Предложение о перемирии от государства [FROM.GetName]"
 BBA_italy_anti_colonialism_events.02.desc: "Новое правительство государства [FROM.GetName] прибыло к нам и предлагает заключить перемирие. Похоже, что за время гражданской войны они устали от кровопролития и борьбы."
 BBA_italy_anti_colonialism_events.03.desc: "[FROM.GetLeader] из государства [FROM.GetName] соглашается на наше предложение перемирия и желает дать миру шанс. Мы можем наконец-то оставить величайшие злодеяния Муссолини позади и начать все заново."
 BBA_italy_anti_colonialism_events.05.desc: "Правительство государства [FROM.GetName] пытается получить прямой контроль над нашими территориями и интегрировать нас в состав [FROM.GetAdjective]ой администрации. Пока неясно, как именно это повлияет на наш народ, культуру и традиции."
 BBA_italy_anti_colonialism_events.06.t: "[FROM.GetAdjective]ая интеграция в государство [ROOT.GetNameDef]"
 BBA_italy_anti_colonialism_events.08.desc: "Кажется, новое правительство государства [FROM.GetName] желает хотя бы частично исправить несправедливость, от которой пострадал [ROOT.GetAdjective]ий народ. Оно решило инвестировать в нашу страну."
 BBA_italy_anti_colonialism_events.09.t: "[FROM.GetAdjective]ое правительство давит на государство [ROOT.GetName]"
 BBA_italy_anti_colonialism_events.09.desc: "Похоже, что [FROM.GetAdjective]ая жажда экспансии не знает границ! К нам явилась делегация из государства [FROM.GetName] с предложением о подчинении. Они утверждают, что для нас мало что изменится, что мы по-прежнему будем управлять своими землями, но вдобавок получим [FROM.GetAdjective]ое покровительство — и временами должны будем проявлять послушание."
 BBA_italy_anti_colonialism_events.12.desc: "[FROM.GetLeader], лидер государства [FROM.GetName], резко противится нашему предложению защиты и сотрудничества и в самых резких выражениях велит нашей делегации немедленно убраться домой."
 BBA_italy_anti_colonialism_events.55.t: "Восточная Африка голосует за выход из состава государства [ROOT.GetNameDef]"
 BBA_italy_anti_colonialism_events.61.t: "Южная Африка голосует за выход из состава государства [ROOT.GetNameDef]"
 BBA_italy_anti_colonialism_events.63.t: "Ближний Восток голосует за выход из состава государства [ROOT.GetNameDef]"
 BBA_italy_anti_colonialism_events.100.desc: "Мы приняли делегацию из государства [FROM.GetName], которое желает упрочить связи с нами. Послы много говорили о нашей общей истории и о том, насколько сильнее мы станем, если объединимся. Нет сомнения в том, что лидерами этого потенциального союза будущие партнеры видят себя. Хоть подобное соглашение и может быть выгодным в определенном смысле, с ним мы утратим всякую автономию."
 BBA_italy_anti_colonialism_events.101.t: "[FROM.GetNameDefCap] интегрируется в государство [ROOT.GetNameDef]"
 bba_news.108.d: "Дипломаты из новообразованного итальянского правительства отправлены на переговоры с албанским правителем, королем Зогу, чтобы упрочить связи между двумя странами и попытаться вынудить Зогу обширнее реализовать в Албании социалистическую политику.\n\nВозможно, чувствуя, что дни албанской монархии сочтены, — а возможно, исключительно от нелюбви к социализму — король Зогу отказался говорить с итальянскими представителями и побудил албанский народ сопротивляться давлению со стороны государства [ITA.GetNameDef].\n\nТем не менее иностранные военные эксперты согласны, что у государства [ALB.GetNameDef] мало шансов сопротивляться вторжению, если итальянское правительство перейдет к действиям."
 bba_news.109.desc: "Случилось нечто беспрецедентное: Большой фашистский совет государства [FROM.GetName] захватил власть. [?ITA.ITA_var_deposed_leader.GetName] теперь смещен и посажен под домашний арест. Все это мотивировано попыткой спасти страну от военных неудач и некомпетентности дуче, создавших напряженность в государстве [FROM.GetName] и потенциально способных привести к гражданской войне."
 bba_news.110.desc: "[FROM.GetLeader], свеженазначенный лидер государства [FROM.GetName], не в силах совладать с растущей напряженностью, разделившей недавно [FROM.GetAdjective]ий народ. Из-за этого разразилась гражданская война, разрывающая страну изнутри. Разные группировки, от коммунистов до роялистов и демократов, сражаются за власть и создают непостоянные альянсы, пока фашисты всеми силами стремятся удержаться у руля.\n\nХоть исход гражданской войны до сих пор неясен, помощь извне непременно сыграет важную роль в будущей победе."
 bba_news.111.desc_single_proclamation: "Тысячи и тысячи анархистов со всего мира стекаются в государство [FROM.GetName] после того, как правительство объявило об основании анархистской конфедерации. В объявлении было заявлено о сокрушении капитализма и победе над фашизмом везде, где будет обнаружено это зло."
 bba_news.666.desc: "Папа [FROM.GetLeader] потряс мировых лидеров: его силами смещен король [?ITA.ITA_var_deposed_leader.GetName] из государства [FROM.GetName]. Власть короля папа присвоил себе, заявив, что так хочет бог. Хоть многие итальянцы также потрясены этим, папская власть пользуется в стране широкой поддержкой, и некоторые считают эти неожиданные перестановки в правительстве началом новой и славной эры для государства [FROM.GetNameDefCap]."
 bba_news.201.desc: "Несмотря на то, что во время войны в Лондоне действовало [POL.GetAdjective]ое правительство в изгнании, союзники решили вместо него признать легитимной администрацией государства [POL.GetName] коммунистов, взращенных [SOV.GetAdjective]ими силами. Согласно дипломатическим источникам, Союзники и [SOV.GetName] достигли соглашения о послевоенном разделе Европы на сферы влияния. К несчастью для [POL.GetAdjective]ого правительства в Лондоне, крупным камнем преткновения для [SOV.GetAdjective]ого соглашения был [SOV.GetLeader], желавший видеть Польшу в составе [SOV.GetAdjective]ой сферы влияния.\n\nМногие считают такой шаг предательством государства [POL.GetName], но есть и те, кто возражает: учитывая, что [SOV.GetAdjective]ие войска уже заняли страну, не стоит отвергать их ультиматум и рисковать будущей стабильностью Европы."
 bba_news.100.desc_many_purged: "Несколько высокопоставленных членов фашистской партии были недавно освобождены от должностей. [Root.GetLeader] становится абсолютным лидером государства [ROOT.GetNameDefCap]. Чистке подверглись все потенциальные союзники прежнего дуче, Бенито Муссолини, что лишает его всякой надежды вновь возглавить Италию."
 bba_news.102.desc_innocent: "Ко всеобщему удивлению, экс-дуче был признан невиновным по всем пунктам обвинения и полностью оправдан. Муссолини теперь может доживать свою жизнь как свободный гражданин государства [ROOT.GetNameDefCap]. Он пока не раскрывал никаких планов, но нельзя отрицать то влияние, которым бывший дуче еще пользуется среди многих людей."
 bba_news.103.desc_communists: "Бывший лидер государства [FROM.GetNameDefCap] Бенито Муссолини найден мертвым. Судя по всему, он был убит коммунистами. Новый режим, который возглавляет [FROM.GetLeader], отреагировал быстро и задержал нескольких сочувствующих коммунистам. Обстановка в стране накалилась, многие взывают к справедливости и требуют отомстить тем, в ком видят врагов."
 bba_news.103.desc_coverstory: "Бывший лидер государства [FROM.GetNameDefCap] Бенито Муссолини пытался бежать из-под домашнего ареста, куда был помещен после отстранения от власти. Несколько вооруженных людей штурмовали жилище Муссолини, последовала перестрелка, в ходе которой он был ранен и позже скончался."
 bba_news.106.desc_king: "Умер старый король государства [FROM.GetName] Виктор Эммануил III. Он провел Италию через две мировые войны, служил символом стабильности и сплачивал вокруг себя [FROM.GetAdjective]ий народ в эти трудные времена. Скорбящие вышли на улицы, чтобы продемонстрировать свою признательность и поддержку почившему королю.\n\nНация надеется, что единственный наследник короля, принц Умберто, станет для [FROM.GetAdjective]ого народа такой же надежной опорой. Принц скоро будет коронован и станет королем Умберто II — да правит он долго!"
 bba_news.106.desc_emperor: "Умер старый император государства [FROM.GetName] Виктор Эммануил III. Он провел Италию через две мировые войны, служил символом стабильности и сплачивал вокруг себя [FROM.GetAdjective]ий народ в эти трудные времена. Скорбящие вышли на улицы, чтобы продемонстрировать свою признательность и поддержку почившему императору.\n\nНация надеется, что единственный наследник императора, принц Умберто, станет для [FROM.GetAdjective]ого народа такой же надежной опорой. Принц скоро будет коронован и станет императором Умберто I государства [FROM.GetName] — да правит он долго!"
 BBA_switzerland.3.desc: "Скоро состоится суд над Давидом Франкфуртером, убившим в феврале представителя нацистской партии в Давосе. Мы обещали ему справедливый и беспристрастный суд, но есть, разумеется, и другие варианты.\n\nМы могли бы тайно освободить его и завербовать для разведопераций; или можно умаслить государство [?SWI.SWI_fascist_germany.GetNameDef], отменив суд и сразу вынеся приговор.\n\nКак бы мы ни поступили, удовлетворить сразу все стороны будет невозможно."
 BBA_switzerland.4.t: "[?SWI.SWI_fascist_germany.GetLeader] радуется решению государства [SWI.GetName]"
 BBA_switzerland.4.desc: "[?SWI.SWI_fascist_germany.Getleader], лидер государства [?SWI.SWI_fascist_germany.GetNameDef], выражает свою благодарность державе [SWI.GetNameDef] за то, что та быстро разобралось с убийцей Вильяма Густлоффа. Теперь всем очевидно, какую позицию занимает [SWI.GetName] в таких делах. Такое пренебрежение правами человека и демократическими ценностями несомненно улучшит отношение к нам государства [?SWI.SWI_fascist_germany.GetName]. \n\nНесмотря на позитивную оценку главы государства, нам ясно дали понять, что идеальным выходом для нацистской партии в данном случае была бы экстрадиция виновного в государство [?SWI.SWI_fascist_germany.GetNameDef], даже если сейчас [SWI.GetNameDef] такой вопрос не рассматривает."
 BBA_switzerland.5.desc: "Власти государства [SWI.GetName] объявили, что дело Давида Франкфуртера, признавшегося в убийстве председателя отделения НСДАП в Давосе, будет рассматриваться на справедливой и беспристрастной основе по граубюнденским законам, как и любое другое дело об убийстве.\n\nУчитывая наше влияние на беззащитного соседа и тот факт, что Густлофф был функционером нацистской партии, мы могли бы послать юриста, представляющего интересы вдовы Густлоффа, чтобы тот продавливал суд к решению, выгодному нам. Так мы сможем убедиться, что наказание будет под стать преступлению.\n\nЕсли выражаться более прагматично, такая мера может вынудить государство [SWI.GetNameDef] наконец занять чью-то сторону, отринув эту тонкую завесу нейтралитета, на который они так любят упирать."
 BBA_switzerland.6.desc: "Юрист, представляющий интересы вдовы Густлоффа и, без сомнения, отправленный к нам государством [?SWI.SWI_fascist_germany.GetNameDef], пытается надавить на Федеральный совет, чтобы суд вынес как можно более суровый приговор Давиду Франкфуртеру. Это весьма необычный запрос, и он, очевидно, вызван стремлением государства [?SWI.SWI_fascist_germany.GetNameDef] влиять на нас.\n\nЕсли мы примем их требование, это может сказаться на нашей репутации в мире — но мы, если хотим его отвергнуть, должны быть уверены, что можем себе это позволить."
 BBA_switzerland.8.desc: "Все государство [SWI.GetName] и его соседи пристально следят за судом над Давидом Франкфуртером. Итог процесса решит не только участь убийцы, явившегося с повинной, но и судьбу государства [SWI.GetNameDef] в целом; он покажет, до какой степени держава готова поступиться своими институтами и традициями.\n\nВ суде все указывает на справедливый приговор к тюремному заключению, но влияние совета может изменить решение суда и, возможно, саму суть страны."
 BBA_switzerland.8.c: "Мы не можем рисковать, настраивая против себя государство [?SWI.SWI_fascist_germany.GetNameDef]. Ему нужно дать максимальный срок!"
 BBA_switzerland.10.t: "[?SWI.SWI_fascist_germany.GetNameDefCap] довольствуется решением государства [SWI.GetNameDef]"
 BBA_switzerland.10.desc: "Представители государства [?SWI.SWI_fascist_germany.GetNameDef] и вдова Густлоффа выразили свою благодарность державе [SWI.GetNameDef] за строгий приговор Франкфуртеру. Теперь нет сомнения, чью позицию [SWI.GetNameDef] занимает в подобных делах. [?SWI.SWI_fascist_germany.GetName] непременно пересмотрит свое отношение к государству [SWI.GetName] в лучшую сторону.\n\nНесмотря на позитивную оценку, нам ясно дали понять, что идеальным исходом для нацистской партии в данном случае была бы экстрадиция виновного в государство [?SWI.SWI_fascist_germany.GetNameDef]."
 BBA_switzerland.11.desc_GER: "[SWI.GetNameDefCap] имеет наглость дать убийце Густлоффа каких-то 18 лет тюрьмы! Досадный итог, но у нас не было возможности усиливать давление, так как это могло привести к призывам бойкотировать Олимпиаду.\n\nСейчас мы хотя бы можем сделать из Густлоффа мученика государства [?SWI.SWI_fascist_germany.GetNameDef] и использовать его убийство в своей пропаганде. Возможно, в будущем вторжении мы сумеем добраться до Франкфуртера, и тогда справедливость восторжествует."
 BBA_switzerland.12.desc: "Теперь, когда война окончена и $GER_fascism_DEF$ больше не существует, Давид Франкфуртер через своего законного представителя Георга Бруншвига попросил помиловать его за убийство Вильгельма Густлоффа в 1936 году.\n\nПоскольку мы больше не окружены фашистскими государствами, а деяние Франкфуртера получило новый контекст из-за обнаруженных в ходе войны преступлений нацизма, нет практически никакого риска в том, чтобы помиловать его. Можно даже запретить ему въезд в государство [ROOT.GetName] — просто на всякий случай."
 BBA_switzerland.14.desc: "Федеральный совет получил петицию, подписанную 200 участниками нескольких правых группировок, которые надеются подтолкнуть государство [ROOT.GetNameDef] к более теплым отношениям с державой [SWI_get_fascist_neighbor] с сохранением при этом относительного нейтралитета. Достичь этого они хотят, введя жестокую цензуру на любые негативные упоминания в прессе об этом государстве, чтобы избежать его гнева."
 BBA_switzerland_trade.4.desc: "Похоже, что торговое соглашение с нами принесло огромную пользу государству [FROM.GetName], потому что оно готово рискнуть своим нейтральным статусом ради того, чтобы получать нашу продукцию.\n\n У этого соглашения немного минусов для нас, если, конечно, мы не собираемся напасть на государство [FROM.GetName]."
 BBA_switzerland_trade.11.desc: "Мы уже используем рынки государства [FROM.GetName], чтобы обойти торговые запреты, вызванные политической обстановкой в мире. Наращивание наших запасов в этом государстве может укрепить его, но это дополнительно усилит нашу экономику."
 BBA_switzerland_trade.14.t: "[FROM.GetNameDefCap] будет инвестировать в государство [ROOT.GetName]"
 BBA_switzerland_fascist.3.desc: "[FROM.GetNameDef] заявляет, что имеет право на регион [848.GetName] после выборов 1919 года, на которых большинство жителей проголосовали за присоединение к государству, называвшемуся в то время Швейцарской конфедерацией. Хоть они и ушли от демократии, а само голосование было несколько десятков лет назад, передав им ответственность за этот регион, мы сможем высвободить ресурсы, затраченные на удержание территории, и проверить способности (а главное — лояльность) государства [FROM.GetName]."
 BBA_switzerland_fascist.4.desc: "Несмотря на то что мы отчетливо продемонстрировали свои лояльность и возможности, [FROM.GetNameDef] отвергает нашу просьбу. С расширением государства [ROOT.GetNameDef] в регион [?SWI.SWI_requested_territory.GetName] придется подождать — возможно, до тех пор, пока мы не решим, что наше подчинение державе [FROM.GetName] больше не имеет смысла."
 BBA_switzerland_fascist.7.desc: "На собрании в городе [ROOT.GetCapitalVictoryPointName] [ROOT.GetLeader] объявляет о том, что [FROM.GetName] заверяет в прочном сотрудничестве наших стран, и о защите государства [ROOT.GetName] от общих врагов.\n\nДружественные нам офицеры и функционеры из державы [FROM.GetNameDef] сейчас переходят на нашу сторону, чтобы помочь нарастить военную мощь, которая затем пойдет на службу к ним."
 BBA_swiss_expansion.1.desc: "Несмотря на все усилия наших пропагандистов, демократия не распространилась в кантонах государства [?SWI.SWI_influence_target_state.GetName] так повсеместно, как мы ожидали. Вряд ли референдум по присоединению к нам будет успешным.\n\nЭто не значит, что мы должны оставить попытки. Мы заронили зерно, и его можно вырастить в полноценный побег, что повысит наши шансы на успех."
 BBA_swiss_expansion.2.desc: "После масштабной пропагандистской кампании народ региона [?SWI.SWI_influence_target_state.GetName] всецело поддерживает присоединение к государству [ROOT.GetNameDef].\n\nЭто означает, что будь регион [?SWI.SWI_influence_target_state.GetName] демократическим, как наше государство, он уже вошел бы в наш состав. К сожалению, это не так, и потому ему понадобится наша помощь, чтобы пополнить список кантонов державы [SWI.GetName].\n\nТеперь мы можем потребовать референдума в регионе, чтобы решить, войдет ли он в состав государства [ROOT.GetNameDef]."
 BBA_swiss_expansion.3.desc: "Эти якобы нейтральные негодяи из государства [FROM.GetName] имеют наглость требовать себе регион [?SWI.SWI_state_being_claimed.GetName]. Они утверждают, что народная поддержка присоединения к государству [FROM.GetNameDef] достаточно высока, чтобы референдум по этому вопросу решился в их пользу.\n\nМожно разрешить провести в регионе [?SWI.SWI_state_being_claimed.GetName] референдум, который мы наверняка проиграем, или рисковать войной, отказав им."
 BBA_swiss_expansion.5.desc: "Несмотря на народную поддержку демократии и государства [ROOT.GetNameDef], [FROM.GetName] игнорирует жителей региона [?SWI.SWI_state_being_claimed.GetName] в их желании провести референдум о присоединении к конфедерации.\n\nДля нас это очевидный призыв взять оружие и защищать свои кантоны от тирании государства [FROM.GetNameDef]."
 BBA_swiss_expansion.6.desc: "Похоже, [FROM.GetName] требует, чтобы к его конфедерации присоединился регион [848.GetName]. Государство ссылается на референдум 1919 года, где подавляющее большинство проголосовало за вступление в состав государства [FROM.GetNameDef] в роли кантона, но в этом было отказано самой державой [FROM.GetAdjective]ой. Похоже, теперь они передумали.\n\nОчевидно, что вне зависимости от того, согласимся мы или нет, держава настроена на экспансию, и нам следует соблюдать всяческую осторожность, а также быть готовыми защищать свою территорию, даже если мы примем требования."
 BBA_swiss_expansion.6.b: "[ROOT.GetName] никогда не уступит свою территорию!"
 BBA_swiss_expansion.8.desc: "[FROM.GetNameDefCap] все понимает правильно и соглашается с нами, что место региона [848.GetName] — в составе державы [ROOT.GetNameDef] в качестве ее нового кантона.\n\nЭто лишь первый шаг государства [ROOT.GetName] на пути к более демократичной Европе."
 BBA_swiss_expansion.9.desc: "Потребовав передачи региона [848.GetName] под надуманным предлогом, [FROM.GetNameDef] предлагает взять наши территории, чтобы якобы защитить нас от державы [GER.GetNameDef], которая, как утверждается, скоро попытается аннексировать государство [ROOT.GetNameDef].\n\nХоть это и звучит правдоподобно, и вместе нам было бы проще отражать вторжение, наш суверенитет — пожалуй, слишком высокая цена.\n\nКонечно, в случае отказа они вполне могут напасть на нас."
 BBA_swiss_expansion.15.desc: "Нашим усилиям по объединению государства [AUS.GetNonIdeologyName] с государством [ROOT.GetNonIdeologyName] противится [FROM.GetName]. Держава проводит кампанию в поддержку своей мерзкой системы управления и против нас.\n\nПроталкивать идею аншлюса, пока идет эта клеветническая кампания, мы не сможем, так что с исполнением пророчества нам придется подождать!"
 BBA_swiss_expansion.17.desc_no_alps: "Настал радостный день для государства [ROOT.GetNonIdeologyName]. Держава [FROM.GetNameDef] согласилась с нашей просьбой о независимости. Это значит, что мы снова вольны идти своим собственным путем и задавать свою внешнюю политику. С другой стороны, и заботиться о себе мы теперь должны сами."
 BBA_swiss_expansion.19.desc: "Декларация нашей независимости не порадовала нашу бывшую метрополию, государство [FROM.GetNameDef]. Она объявила нам войну, надеясь захватить нашу страну силой. Давайте же возьмемся за оружие и покажем, что [ROOT.GetName] так просто не покорится."
 ETH_available_as_air_chief_tt: "Можно назначить главнокомандующим ВВС: "
 ETH_develop_the_capital_region_desc: "Для блага нашего народа и безопасности государства [ETH.GetNameDef] мы должны нарастить темпы индустриализации. Следовательно, мы будем вкладывать средства в окрестности города [ETH.Capital.GetCapitalVictoryPointName], превратив их в индустриальный центр государства [ETH.GetName]."
 ETH_expanding_the_railway_network_desc: "Железные дороги очень важны для доставки ресурсов на заводы и далее, на внутренние и зарубежные рынки. Расширив сеть железных дорог, мы сможем эффективнее перевозить ресурсы, а также упростим народу государства [ETH.GetName] переезд в растущие промышленные города."
 ETH_reform_the_currency_desc: "Хотя оборот [ETH.GetAdjective]их банкнот в последние годы повысился, многие до сих пор предпочитают пользоваться валютой других наций, проводя сделки на территории государства [ETH.GetName]. Мы должны реформировать быр так, чтобы его охотнее принимали и в нашей стране, и за рубежом."
 ETH_the_state_court_desc: "Правовая система государства [ETH.GetName] основана на древних практиках многовековой давности. С нашей недавней волной реформ пришло время привести законы в соответствие с Конституцией и основать современный государственный суд, где будут слушаться дела государственной важности."
 ETH_connecting_the_south_desc: "Южные районы государства [ETH.GetName] изолированы от столичного региона гористым ландшафтом. Чтобы полностью интегрировать их в нашу быстро растущую экономику, мы должны соединить их с индустриальным центром железными дорогами."
 ETH_invest_in_the_north_desc: "На севере государства [ETH.GetName] начинается производство машин. Нужно поддержать его дополнительными инвестициями, чтобы помочь расширить растущую индустрию."
 ETH_invest_in_the_east_desc: "Инвестируя в восточные регионы, мы сможем воспользоваться их историческими торговыми маршрутами и превратить восток в промышленный центр для обработки ресурсов государства [ETH.GetName] и подготовки их к экспорту."
 ETH_invest_in_the_west_desc: "Разные регионы государства [ETH.GetName] имеют доступ к самым разным ресурсам. Инвестируя в западные территории, мы сможем быстро нарастить индустриализацию производства одежды и воспользоваться уже существующими в этой области наработками."
 ETH_modernizing_the_industry_desc: "В последние годы мы добились немалого прогресса, наращивая объемы промышленности. Останавливаться, однако же, не стоит, ведь экономический спрос постоянно меняется и появляются новые методы производства. Нужно стремиться провести электричество и другие достижения индустрии по всей территории государства [ETH.GetName] и продолжить модернизацию экономики."
 ETH_animal_husbandry_desc: "Лошади и верблюды играют ключевую роль в доставке товаров и людей по всей территории государства [ETH.GetNameDef]. Нужно увеличить инвестиции в животноводство, чтобы поставки этих животных и их качество не снижались."
 ETH_invite_foreign_prospectors_tt: "Открывает решения §Y$ETH_prospect_for_resources$§! на севере государства [ROOT.GetName]. Требуются §Y$excavation2$§! и более §Y2§! доступных §Yгражданских фабрик§!, чтобы принять решение о разработке.\n\n"
 ETH_a_last_stand_desc: "Неудачи не должны нас останавливать. В качестве крайней меры мы можем отступить в регион $VICTORY_POINTS_13244$ и подготовиться к обороне там. Он находится в самой западной части государства [ROOT.GetName], и итальянцам, действующим там, будет сложно наладить снабжение своей армии."
 ETH_the_patriots_desc: "Хоть раньше патриоты Годжама мешали планам имперского правительства государства [ETH.GetName] на этот регион, теперь они помогают нам, не допуская [ITA.GetAdjective]их представителей к управлению им. Мы должны всячески помогать патриотам, чтобы основать в стране свой плацдарм и не давать [ITA.GetAdjective]им силам слишком расслабиться."
 ETH_the_heroes_of_ethiopia_desc: "Многие из наших военных лидеров показали себя отличными стратегами. Несмотря на подавляющее преимущество противника в материальном обеспечении, наши командиры сумели остановить врага. Мы должны наградить этих героев за их вклад в выживание государства [ETH.GetNameDef]."
 ETH_fait_accompli_tt: "§Y[ITA.GetNameWithFlag]§! подпишет мирный договор с государством §Y[ROOT.GetNameWithFlag]§!, уступив все африканские регионы, находящиеся под контролем государства [ROOT.GetNameDef].\n "
 ETH_reclaiming_ethiopia_desc: "Мы постепенно убеждаем принимающую страну в необходимости признать лидера [ETH.GetLeader] в качестве законного правителя государства [ETH.GetName], несмотря на то что его территория незаконно оккупирована державой [ITA.GetName]. Еще немного, и, возможно, мы наконец-то сможем начать кампанию по освобождению нашей родины."
 ETH_reclaiming_ethiopia_exile_tt: "Эффекты, если у государства [ROOT.GetName] есть правительство в изгнании:"
 ETH_ethiopia_recognized_tt: "[ROOT.GetLeader] признается истинным руководителем государства [ROOT.GetNameDef]:\n §Y[ROOT.GetName]§! может призвать союзников объявить войну врагу."
 ETH_jah_desc: "Растафарианское движение неожиданно создало сеть сторонников государства [ETH.GetName] во всем мире. Многие считают, что наш император, [ETH.Getleader], — культовая фигура, а некоторые даже утверждают, что это воплощение бога, Джа, если быть точным. Возможно, нам стоит воспользоваться этим, поддержав движение растафарианцев."
 ETH_peoples_army: "Народная армия"
 ETH_peoples_army_desc: "Несмотря на первые неудачи, мы адаптировались к условиям современной войны и, применяя нестандартную тактику, сумели остановить [ITA.GetAdjective]их захватчиков. Мы можем включить новые методы в нашу военную доктрину и обучить наших офицеров ведению асимметричных военных действий."
 ETH_transformation_of_nature: "Трансформация природы"
 ETH_demand_DJI_desc: "Освободив регион [AFA.GetName], мы теперь управляем значительным числом афарцев. Афар, однако же, остается разделенным из-за [FRA.GetAdjective]ой оккупации государства [DJI.GetName]. Потребовав освободить народ Афара от империалистического правления, мы, возможно, сумеем заручиться лояльностью афарцев и заодно приобрести стратегически важный порт."
 ETH_seek_new_trading_partners_desc: "Люди всего мира мечтают о богатствах, которыми обладает наша страна, однако мы вынуждены торговать только с [SOV.GetAdjective]им правительством. Нам нужно установить контакты с другими странами и показать, что мы не просто часть государства [SOV.GetName]. Если нам это удастся, тогда мы сможем обогатить [ETH.GetAdjective]ий народ."
 ETH_african_union_desc: "Пришло время, когда народы Африки должны объединиться в Африканский союз. Мы станем первой супердержавой Африки, и тогда империалисты и фашисты уже не посмеют нам угрожать. "
 ETH_african_central_bank_2_tt: "$MODIFIER_STABILITY_FACTOR$: §R-5%§! \n$modifier_production_speed_industrial_complex_factor$: §R-10%§! \n$modifier_production_speed_infrastructure_factor$: §R-10%§!"
 ETH_an_empire_in_the_shade_of_the_sun_desc: "Его Величество [ETH.GetLeader] — император без империи. Это не только унизительно для него, но и мешает нам заключать договоренности по освобождению государства [ETH.GetName]. Возможно, наши друзья в городе [JAP.Capital.GetCapitalVictoryPointName] будут готовы передать нам контроль над островом, чтобы мы могли использовать его как плацдарм для постепенного освобождения родной земли."
 ETH_an_audience_with_countryleadertitle_desc: "[GER.GetLeader] строит амбициозные планы по преобразованию не только государства [GER.GetNameDef], но и всего мира. Аудиенция у [GER.GetAdjective]ого лидера даст миру понять: [ETH.GetLeader] — по-прежнему единственный истинный правитель государства [ETH.GetName]."
 ETH_german_mediation_desc: "[GER.GetAdjective]ие и [ITA.GetAdjective]ие амбиции начинают совпадать, но проблема государства [ETH.GetName] остается камнем преткновения для наращивания сотрудничества двух наций. Возможно, [GER.GetLeader] сможет убедить потенциального партнера, и [ITA.GetLeader] согласится прекратить свою бессмысленную оккупацию и позволит Императору вернуться на свое законное место. Тогда [ETH.GetName] вновь обретет правителя."
 ETH_joint_swedish-ethiopian_intelligence_program_desc: "Прямая помощь государству [ETH.GetName] поднимет вопросы о нейтралитете державы [SWE.GetName]. Возможно, однако, что последняя готова оказать помощь тайком, чтобы иметь возможность все отрицать. Задействовав свои связи в регионе и ресурсы государства [SWE.GetName], мы сможем ослабить [ITA.GetAdjective]ое колониальное правление в Африке."
 ETH_can_start_a_civil_war_tt: "[ROOT.GetName] может начать гражданскую войну, завершив фокус §Y$ETH_declare_for_italy$§!."
 ETH_expand_the_bodyguard_desc: "Силовые структуры государства [ETH.GetName] начинают распадаться, и становится все труднее определить, кому можно доверять. В эти непростые времена будущему лидеру нашей великой нации нужен постоянный телохранитель, преданный только ему и защищающий его от предателей."
 ETH_invite_italian_settlers_tt: "§Y2 региона во владении§! получат несколько поселенцев из государства [ITA.GetName], сами регионы будут изменены от сельских или пастбищных и получат §Yновые ячейки для строительства.§!"
 ETH_amedeos_feast_of_maskal_desc: "Чтобы гарантировать продолжительную стабильность государства [ETH.GetName], мы соберем оставшихся расов на Маскальский пир принца Амедео в городе [ETH.Capital.GetCapitalVictoryPointName]. Там мы встретимся с вице-королем [ITA.GetAdjective]ой Восточной Африки и обсудим будущее региона."
 ETH_raid_italian_depots_tt: "В наступающем §Yгоду§! будут случайным образом происходить налеты, каждый раз добавляя [ITA.GetFlag]§Y[ITA.GetAdjective]ие§! снаряжения в запасы государства [ETH.GetFlag]§Y[ETH.GetName]§!."
 ETH_reclaim_the_empire_desc: "Нами правит наш великий лидер [ETH.GetLeader]. Благодаря этому мы отвергли разрушительное влияние государства [ITA.GetName] на нашу великую нацию и заново открыли для себя огромную мощь своего народа. Теперь перед нами стоит большая задача: надо вернуть себе свои законные земли и объединить [ETH.GetAdjective]ий народ."
 ETH_the_liberator_of_country_short_desc: "[ETH.GetLeader] — настоящий герой, который привел нас к тому, что мы освободились от вредного влияния государства [ITA.GetName] и добились независимости. Неизвестно, что уготовило нам будущее, но мы знаем: оно будет славным, пока нас ведет в него освободитель [ETH.GetName]."
 ETH_consolidate_east_africa_desc: "Повсюду вокруг нас меняется мировой порядок, рушатся старые империи. Единственный способ сохранить себе место в этом новом порядке — завоевания и демонстрация способности превозмочь любые трудности. Следовательно, мы объединим Восточную Африку под своим контролем и покажем миру мощь государства [ETH.GetName]."
 ETH_reintegrate_aussa_desc: "Вероломный султанат Ауса неоднократно предавал нас, выбирая [ITA.GetAdjective]ую сторону. Пора нам расформировать султанат и интегрировать этот регион в состав государства [ETH.GetName]."
 ETH_communist_seize_assets_desc: "Пока наш народ едва сводит концы с концами, дореволюционная элита государства [ETH.GetName] присвоила себе обширные ресурсы в виде иностранной валюты, произведений искусства и, конечно же, земли. Надо конфисковать эти ресурсы во имя народа и перераспределить богатства."
 ETH_tax_exemption_default_desc: "Чтобы избежать раздробления государства [ETH.GetName], мы должны следить, чтобы аристократы оставались довольными. Следовательно, мы будем награждать их за давнюю лояльность, предоставляя им новые налоговые льготы и позволяя сохранить еще большую часть своих богатств."
 ETH_seize_assets_default_desc: "Наши аристократы — одни из богатейших людей государства [ETH.GetName], и потому нет никакого экономического смысла позволять им избегать налогов с помощью архаичных законов и лазеек. Необходимо должным образом взимать с аристократии налоги и пускать полученные средства на дальнейшую индустриализацию империи."
 ITA_defeat_in_ethiopia_flag: "[ITA.GetNameDefCap] терпит поражение на территории государства [ETH.GetNameDef]"
 ITA_italian_tankettes_flamethrower_tt: "\nКогда изучена технология §Y$tech_engineers2$§!:\n"
 ITA_forza_navale_especiale_rm_tt: "$ITA_modify_regia_marina_dynamic_modifier_ns_intro$ \n$MODIFIER_NAVAL_INVASION_PREPARATION$: §G-10,0%§! \n$MODIFIER_NAVAL_INVASION_CAPACITY$: §G+10§! \n$MODIFIER_AMPHIBIOUS_INVASION$: §G+5,0%§! \n$MODIFIER_SPECIAL_FORCES_CAP$: §G+2,0%§! \n\n"
 ITA_anglo_italian_agreements_suez_tt: "Суэцкий канал не заблокирован для государства [ROOT.GetName] либо заблокирован для государства [ITA.GetName] более чем §Y365§! дней."
 ITA_anglo_italian_agreements_suez_unlocked_tt: "§GСуэцкий канал больше не будет заблокирован для государства [ROOT.GetName]§!."
 ITA_in_our_controlled_states_cw: "в наших контролируемых [RDS.GetAdjective]их регионах"
 ITA_battaglioni_m_re_tt: "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$modifier_army_sub_unit_militia_max_org_factor$: §G+5,00%§! \n$modifier_army_sub_unit_militia_defence_factor$: §G+5,00%§! \n§Y$blackshirt_assault_battalion$§! — батальоны также будут улучшены по завершении фокуса §Y$ITA_battaglioni_d_assalto$§!.\n\n"
 ITA_independence_overlord_fallback_accept_tt: "[ROOT.GetAdjective]ая метрополия убирает марионеточный режим из государства [ROOT.GetName]. \nПолучает §Y$ITA_granted_us_independence$§! (мнение о §Yбывшей метрополии§! §Y50§!)."
 ITA_defend_the_land_faction_tt: "Начнется событие §Y«[ROOT.GetName] приглашает нас в альянс $ITA_united_socialist_front$»§!."
 ITA_italia_libera_faction_tt: "Начнется событие §Y«[ROOT.GetName] приглашает нас в альянс $ITA_free_states_of_europe$»§!."
 ITA_european_democracies_bonus_per_ally_tt: "\nПолучает §G+2,00%§! к стабильности и §G+25§! к политической власти за каждую независимую демократическую страну в альянсе государства [ROOT.GetName] (максимум §Y+10,00%§! к стабильности и §Y+125§! к политической власти).\n\n"
 ITA_peace_preservation_ns_tt: "\nПолучает национальный дух §Y$ITA_peace_keepers_of_europe$§!, дающий (фабрики, производящие товары народного потребления: §Y-2,0%§! за каждую гарантируемую страну (макс. §Y-10,0%§!), поддержка войны: §G+1,00%§! за каждую гарантируемую страну (макс. §Y+10,0%§!), еженедельный прирост людских ресурсов: §G+100§! за каждую гарантируемую страну (макс. §Y+1000§!))."
 SWI_national_redoubt_desc: "Анри Гизан предлагает другой способ защиты государства [ROOT.GetName]. Вместо того чтобы пытаться защитить границы нашей страны любой ценой, мы можем стратегически сдать Швейцарское плато и отступить в Альпы, где всякая попытка оккупации обойдется противнику очень дорого."
 SWI_expedite_mobilization_desc: "Задача нашей небольшой регулярной армии — сдерживать врага, пока народ государства [ROOT.GetName] берется за оружие и образует народное ополчение, костяк наших вооруженных сил. Вот почему время подготовки ополчения должно быть как можно меньше, чтобы не опасаться, что нашу армию сметет враг."
 SWI_the_army_position_desc: "Мы расположим свое гражданское ополчение и регулярную армию на границах государства [ROOT.GetName], и потому, чтобы эффективнее сдерживать врага, им понадобятся укрепления."
 SWI_fortify_ticino_desc: "Мы — нейтральная держава между тремя исторически враждебными нациями, и смерть может явиться с любой из сторон. Расслабляться нельзя: [ITA.GetName] может напасть с той же вероятностью, что и [GER.GetNameDef] или [FRA.GetName], и когда кто-то атакует, идти он будет через регион [846.GetName]. Вот почему мы должны превратить его в неприступную крепость ради блага государства [SWI.GetNameDef]."
 SWI_fortify_sargans_gotthard_and_st_maurice_desc: "Наши Альпы — гордость государства [ROOT.GetName], и в эти неспокойные времена мы можем укрепить их, чтобы гарантировать безопасность нашей Конфедерации."
 SWI_ban_the_communist_party_desc: "Коммунистические партии представляют большую опасность для государства [SWI.GetNameDef]. Несмотря на расстояние между нами и державой [SOU.GetNameDef], ее революционное влияние явственно ощутимо. Нельзя рисковать дестабилизацией своей страны в такие опасные времена. Необходимо действовать быстро и запретить любую партию, желающую подорвать работу нашего правительства."
 SWI_withdraw_from_the_league_of_nations_desc: "Наше членство в Лиге Наций несовместимо с нейтралитетом, который мы хотим сохранить для государства [ROOT.GetName], и потому мы должны покинуть эту умирающую организацию. Этот шаг покажет нашу приверженность истинному нейтралитету нашим соседям и, как мы надеемся, убедит их, что [ROOT.GetName] не представляет угрозы."
 SWI_limited_censorship_of_the_press_desc: "Силы, желающие захвата государства [ROOT.GetName], пойдут на все, чтобы оправдать вторжение в нашу страну. Свобода прессы, хоть она и жизненно необходима для здоровой демократии, должна сейчас отойти на второй план, чтобы не подпитывать амбиции наших соседей."
 SWI_pro_helvetia_desc: "Духовная национальная оборона государства [ROOT.GetName] требует, чтобы [ROOT.GetAdjective]ая культура оставалась единой, неделимой и отличной от соседской. Новая организация под названием Pro Helvetia будет сохранять и пропагандировать наши общие швейцарские ценности, глубоко связанные с нашей демократией, а также обеспечивать выживание самого государства в непростые времена."
 SWI_german_industrial_investments_desc: "Промышленная мощь державы [?SWI.SWI_biggest_fascist.GetNonIdeologyName] неоспорима. Если мы хотим выжить в грядущей войне, нам понадобится собственная индустриальная база — залог конкурентоспособности и козырь в переговорах. Факт инвестиции в нас государства [?SWI.SWI_biggest_fascist.GetNameDefCap] также означает, что у него есть причина сохранить державу [ROOT.GetNonIdeologyName] целой."
 SWI_join_the_axis_desc: "Вот и все. Мы сделали свою ставку на выживание государства [ROOT.GetNonIdeologyName] в грядущей буре. Мы встретим эту бурю под знаменами альянса государства [?SWI.SWI_biggest_fascist.GetName]. Будем надеяться, что этот выбор правильный."
 SWI_ask_for_vorarlberg_desc: "Теперь, когда мы уже достаточно долго пробыли под крылом государства [?SWI_fascist_overlord.GetName] и доказали свою лояльность, ему пора доверить нам то, что наше по праву. Регион [848.GetName] проголосовал за присоединение к нам, еще когда государство [ROOT.GetNonIdeologyName] было демократической конфедерацией, так что нет сомнения в том, что он сохранит свое намерение и сейчас."
 SWI_connect_to_the_maginot_line_desc: "Ветер войны дует в направлении государства [FRA.GetName], и есть все шансы, что врагу придется атаковать так называемую линию Мажино. Это ставит нас в опасную ситуацию — ведь [?SWI.SWI_biggest_fascist.GetNonIdeologyName] может захотеть обойти ее и напасть на нас. Вот почему мы должны действовать совместно с державой [FRA.GetName] и открыть общий фронт."
 SWI_take_a_stance_desc: "Фашистское государство [?SWI_biggest_fascist.GetNonIdeologyName] выстроило самую отвратительную и низкую политическую систему. [?SWI_biggest_fascist.GetNameDefCap] — смертельный враг державы [ROOT.GetName] в ее новой форме. Вот почему мы должны стоять насмерть и защищать свою демократию любой ценой."
 SWI_alpine_aspirations_desc: "Центральное правительство государства [ROOT.GetNonIdeologyName] расширилось и созрело в Гельветическую республику. Теперь у нас есть ресурсы для управления более крупной территорией. Следует попросить государство [FRA.GetNameDef] расширить нашу зону контроля, чтобы мы стали ближе к объединению Альп под одним знаменем."
 SWI_share_spy_networks_desc: "Цель государства [?SWI.SWI_best_dem_ally.GetNameDefCap] такая же, как и у нас, — не подпустить к себе фашизм. Для ее достижения нам не нужно напрямую противодействовать державе [?SWI.SWI_biggest_fascist.GetNameDef]. [ROOT.GEtName] располагает опытными оперативными агентами, способными влиться в [GER.GetAdjective]ое, [ITA.GetAdjective]ое и [FRA.GetAdjective]ое общества. Мы можем поделиться ими с государством [?SWI.SWI_best_dem_ally.GetNonIdeologyName]."
 SWI_lay_the_groundwork_desc: "Чтобы быть готовыми к полномасштабной войне, нам сначала нужно заиметь хорошую базу. Необходимо улучшить и модернизировать инфраструктуру и транспортные сети государства [ROOT.GetName]. Лишь тогда можно будет эффективно мобилизовать наших граждан на фронт."
 SWI_exiled_government_desc: "Кажется, несмотря на все свои старания, мы не смогли защитить родину, и теперь нам остается лишь воевать за нее издалека. [ROOT.GetAdjective]ие демократические ценности позволили нашей стране процветать достаточно долго, и нашей главной целью будет вернуть их. В конце концов, суть государства [ROOT.GetName] определяется не его территорией или языком, на котором говорят его жители, а нашими взаимными уважением и поддержкой."
 SWI_press_for_vorarlberg_desc: "Пока [AUS.GetAdjective]ое правительство разгромлено, мы должны исполнить демократическую волю региона [848.GetName], выраженную в референдуме 1919 года, и интегрировать его в состав нашего демократического государства. Долг государства [ROOT.GetNameDef] — защищать этот регион от фашизма и автократии."
 SWI_pre_empt_anschluss_desc: "Ходят слухи, что [GER.GetNameDef] собирается аннексировать государство [AUS.GetName] во имя [GER.GetAdjective]ого единства. [ROOT.GetNAmeDef] не может допустить такого, ведь это позволит государству [GER.GetNameDef] делать такие же заявления и про наши немецкоговорящие кантоны. Нужно поторопиться и подготовить оборону всего государства [AUS.GetName]."
 SWI_demand_italian_alps_desc: "Десятилетиями государство [ITA.GetName] без всякого стеснения заявляло права на наши кантоны, говорящие на [ITA.GetAdjective]ом языке. Раз они могут выдвигать такие требования, то и мы можем требовать присоединения их Альп к нашему демократическому режиму. В конце концов, [ROOT.GetNameDef] имеет на них ничуть не меньшие права, чем [ITA.GetNameDef] на Тичино."
 SWI_switzerland_on_the_offense_desc: "Мы не можем сидеть в своих горах, сложа руки, и ждать, пока на нас нападут. Мы должны перехватить инициативу и атаковать врага раньше, чем он вторгнется в наши границы. Лишь тогда мы сможем гарантировать выживание государства [ROOT.GetNameDef]. В конце концов, лучшая защита — нападение."
 SWI_a_swiss_navy_desc: "Впервые в [ROOT.GetAdjective]ой истории мы оказались на берегу моря. Это значит, что мы теперь можем вести морские бои, — но также и то, что у нас появился новый фронт, который надо защищать. Нам следует нарастить свои усилия, чтобы построить флот для государства [ROOT.GetName]."
 HOA_develop_capitalstate_desc: "Для блага нашего народа и безопасности государства [ROOT.GetNameDef] мы должны нарастить темпы индустриализации. Следовательно, надо вкладывать средства в окрестности города [ROOT.Capital.GetCapitalVictoryPointName], превратив их в индустриальный центр страны."
 HOA_the_adjective_regional_development_fund_desc: "Регионы государства [ROOT.GetNameDef] стагнируют и отчаянно нуждаются в инвестициях. Создав региональный фонд развития, мы сможем дать местным правительствам средства для модернизации их региона."
 HOA_support_the_agrarians_desc: "Деревенское население государства [ROOT.GetNameDef], занятое в сельском хозяйстве, — костяк нашей нации. Мы должны поддержать его в его жизненно важной работе."
 HOA_the_adjective_air_fleet_desc: "Воздушная война быстро становится ключевой ареной, на которой определяются победители в конфликтах. Следовательно, мы должны основать свои ВВС и подготовить их к защите небес государства [ROOT.GetNameDef]."
 HOA_warrior_tradition_desc: "У государства [ROOT.GetNameDefCap] долгая история отважных воинов, защищающих свои дома от завоевателей. Сейчас нам как никогда важно опереться на эту традицию, чтобы оборонять родину."
 HOA_names_finest: "Лучшие люди государства [ROOT.GetName]"
 HOA_eyes_on_the_imperialists_desc: "Империалистические державы региона глядят на независимость государства [ROOT.GetNameDef] с презрением. Надо сохранять бдительность и не стать жертвой их амбиций."
 HOA_improving_the_educational_system_desc: "Судьба нации — в руках наших детей. Следовательно, дав им лучшее образование из возможных, мы по максимуму вложимся в будущее государства [ROOT.GetNameDef]."
 HOA_promote_countryadjective_nationalism_desc: "Народ государства [ROOT.GetNameDef] больше не станет терпеть угнетение иностранными державами. Нужно воспользоваться моментом и ускорить приближение независимости."
 ETH_prince_regent_idea_desc: "Пора император $ETH_haile_selassie$ отсутствует, пропагандируя [ROOT.GetAdjective]ое дело в Лиге Наций, Рас $ETH_ras_imru_haile_selassie$ должен оборонять страну от захватчиков и фактически исполнять обязанности лидера государства [ROOT.GetName] до возвращения императора."
 ITA_deck_conversions_dynamic_modifier_tt: "§Y$carrier$§!: $production_cost_tt$ §G-20,00%§! \n§Y$carrier$§!: размер палубы: §R-1%§! \n§Y$carrier$§!: броня: §R-10%§! \n"
 ITA_strengthened_the_airforce: "Усиление военно-воздушных сил"
 ITA_disgruntlement_in_the_airforce: "Недовольство в военно-воздушных силах"
 ITA_northern_designer_tt: "Этот конструктор находится в северной части Италии. Завершение фокусов §Y«$ITA_strengthen_northern_industry$»§! и §Y«$ITA_new_industrialization_program$»§! улучшит этого конструктора."
 ITA_southern_designer_tt: "Этот конструктор находится в южной части Италии. Завершение фокусов §Y«$ITA_modernize_the_mezzogiorno$»§! и §Y«$ITA_new_industrialization_program$»§! улучшит этого конструктора."
 ITA_italian_hegemony_subjects_desc: "Объединившись под гегемонией государства [ITA.GetNameDef], мы служим защитниками фашизма, бастионом истины и просвещения. Никто и ничто не встанет у нас на пути!"
 SWI_spirit_of_saint_bernard_idea_tooltip: "Возмещение потерь благодаря полевым госпиталям: §G+20%§!\nПотеря опыта: §G-30%§!"
 SWI_army_limitations_TT: "§RНельзя готовить регулярные войска вне гражданского ополчения, нельзя изменять существующие шаблоны вне решений о боевой готовности§!\n\n§YШвейцария§! полагается на готовность гражданского населения при необходимости взяться за оружие. Количество обучаемых бойцов ополчения ограниченно, как изначально ограничена и их §Yорганизация§!.\n\nПо завершении фокуса §Y«$SWI_armed_neutrality$»§! ополчение можно будет расширить, улучшить и в итоге отправить на фронт решением §Y«$SWI_activate_militia$»§!. Пока ополчение находится на фронте, штрафы для швейцарской экономики постепенно накапливаются, но после отзыва ополчения они будут сброшены."
 SWI_old_switzerland_idea_desc: "После долгого периода жестокой войны и несправедливой экспансии народ государства [ROOT.GetName] требует ни много ни мало возвращения к нейтралитету и демократии довоенных лет. Эти смутные времена скоро закончатся."
 SWI_start_gold_trade_with_switzerland_dynamic_mod_TT: "Добавляется §Y$SWI_gold_trade_with_switzerland$§!, что дает:\n $MODIFIER_CONSUMER_GOODS_FACTOR$: §G[?SWI.SWI_gold_trade_consumer_goods_factor_increase|%]§!\n $MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G[?SWI.SWI_gold_trade_building_speed_factor_increase|%]§!\n $MODIFIER_RESEARCH_SPEED_FACTOR$: §G[?SWI.SWI_gold_trade_research_speed_factor_increase|%]§!\n $MODIFIER_PRODUCTION_LACK_OF_RESOURCE_PENALTY_FACTOR$: §G[?SWI.SWI_gold_trade_lack_of_resource_penalty_factor_increase|%]§!\n $MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$: §G[?SWI.SWI_gold_trade_factory_max_efficiency_factor_increase|%]§!"
 SWI_improve_gold_trade_with_switzerland_dynamic_mod_TT: "§Y$SWI_gold_trade_with_switzerland$§! изменится на:\n $MODIFIER_CONSUMER_GOODS_FACTOR$: §G[?SWI.SWI_gold_trade_consumer_goods_factor_increase|%]§!\n $MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G[?SWI.SWI_gold_trade_building_speed_factor_increase|%]§!\n $MODIFIER_RESEARCH_SPEED_FACTOR$: §G[?SWI.SWI_gold_trade_research_speed_factor_increase|%]§!\n $MODIFIER_PRODUCTION_LACK_OF_RESOURCE_PENALTY_FACTOR$: §G[?SWI.SWI_gold_trade_lack_of_resource_penalty_factor_increase|%]§!\n $MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$: §G[?SWI.SWI_gold_trade_factory_max_efficiency_factor_increase]§!"
 SWI_Start_swiss_gold_market_dynamic_mod_TT: "Добавляется §Y$SWI_swiss_gold_market$§!, что дает:\n $MODIFIER_CONSUMER_GOODS_FACTOR$: §G[?SWI.SWI_gold_trade_consumer_goods_factor_increase|%]§!\n $MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G[?SWI.SWI_gold_trade_building_speed_factor_increase|%]§!\n $MODIFIER_RESEARCH_SPEED_FACTOR$: §G[?SWI.SWI_gold_trade_research_speed_factor_increase|%]§!\n $MODIFIER_PRODUCTION_LACK_OF_RESOURCE_PENALTY_FACTOR$: §G[?SWI.SWI_gold_trade_lack_of_resource_penalty_factor_increase|%]§!\n $MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$: §G[?SWI.SWI_gold_trade_factory_max_efficiency_factor_increase|%]§!"
 SWI_improve_swiss_gold_market_dynamic_mod_TT: "§Y$SWI_swiss_gold_market$§! изменится на:\n $MODIFIER_CONSUMER_GOODS_FACTOR$: §G[?SWI.SWI_gold_trade_consumer_goods_factor_increase|%]§!\n $MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G[?SWI.SWI_gold_trade_building_speed_factor_increase|%]§!\n $MODIFIER_RESEARCH_SPEED_FACTOR$: §G[?SWI.SWI_gold_trade_research_speed_factor_increase|%]§!\n $MODIFIER_PRODUCTION_LACK_OF_RESOURCE_PENALTY_FACTOR$: §G[?SWI.SWI_gold_trade_lack_of_resource_penalty_factor_increase|%]§!\n $MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$: §G[?SWI.SWI_gold_trade_factory_max_efficiency_factor_increase]§!"
 SWI_remove_swiss_gold_dynamic_mod_TT: "  $MODIFIER_CONSUMER_GOODS_FACTOR$: §G[?SWI_gold_trade_consumer_goods_factor|%]§!\n $MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G[?SWI_gold_trade_building_speed_factor|%]§!\n $MODIFIER_RESEARCH_SPEED_FACTOR$: §G[?SWI_gold_trade_research_speed_factor|%]§!\n $MODIFIER_PRODUCTION_LACK_OF_RESOURCE_PENALTY_FACTOR$: §G[?SWI_gold_trade_lack_of_resource_penalty_factor|%]§!\n $MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$: §G[?SWI_gold_trade_factory_max_efficiency_factor]§!"
 SWI_seized_gold_dynamic_mod_TT: "  $MODIFIER_CONSUMER_GOODS_FACTOR$: §G[?PREV.SWI_gold_seized_consumer_goods_factor|%]§!\n $MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G[?PREV.SWI_gold_seized_building_speed_factor|%]§!\n $MODIFIER_RESEARCH_SPEED_FACTOR$: §G[?PREV.SWI_gold_seized_research_speed_factor|%]§!\n $MODIFIER_PRODUCTION_LACK_OF_RESOURCE_PENALTY_FACTOR$: §G[?PREV.SWI_gold_seized_lack_of_resource_penalty_factor|%]§!\n $MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$: §G[?PREV.SWI_gold_seized_factory_max_efficiency_factor]§!"
 SWI_add_stolen_gold_dynamic_mod_TT: "  $MODIFIER_CONSUMER_GOODS_FACTOR$: §R[?SWI_gold_seized_bad_consumer_goods_factor|%]§!\n $MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §R[?SWI_gold_seized_bad_building_speed_factor|%]§!\n $MODIFIER_RESEARCH_SPEED_FACTOR$: §R[?SWI_gold_seized_bad_research_speed_factor|%]§!\n $MODIFIER_PRODUCTION_LACK_OF_RESOURCE_PENALTY_FACTOR$: §R[?SWI_gold_seized_bad_lack_of_resource_penalty_factor|%]§!\n $MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$: §R[?SWI_gold_seized_bad_factory_max_efficiency_factor|%]§!"
 GRE_hold_national_showcase_for_investors_fra_desc: "«Мы устроим здесь, в колыбели западной цивилизации, масштабную демонстрацию, чтобы привлечь инвестиции в наш обедневший промышленный сектор."
 GRE_attend_talks_with_the_presidium_desc: "Мы отправим представителей в президиум государства [FROM.GetNameDefCap], чтобы обсудить возможности их скромных инвестиций в нашу военную промышленность."
 GRE_host_soviet_bureaucrats_in_greece_desc: "Представители государства [FROM.GetNameDefCap] проедут по нашей стране и решат, хотят ли они сделать умеренные инвестиции в нашей военную промышленность."
 GRE_soviets_rebuffed: "§YИтальянские§! инвестиции не приняты"
 TUR_the_constitutional_arrows_category: "Закон № 3115"
 TUR_republicanism_decision: "Республика"
 TUR_the_enemy_within_desc: "Наша страна разделена по политическому, этническому и религиозному признакам; эти разногласия угрожают развалить нацию и ввергнуть нас в хаос. В нашей родной стране действуют враждебные нам силы. Нельзя, чтобы они восторжествовали над законным правительством государства [ROOT.GetNameDef]."
 integrate_the_magyars_desc: "[TUR_subdue_the_magyars.GetDesc]"
 assimilate_the_chinese_turks_desc: "[TUR_cin_turkleri.GetDesc]"
 unite_with_the_finno_ugrians_desc: "[TUR_crowning_ourselves_with_the_fin_ugor.GetDesc]"
 form_country_turan_syria_required_states_tt: "Контролирует регионы §Y[799.GetName]§! и §Y[680.GetName]§!."
