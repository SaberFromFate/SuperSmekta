 BALTIC_promote_communism_desc: "Многие крестьяне государства [From.Owner.GetNameDef] по-прежнему считают социализм враждебным своему образу жизни. Возможно, нам не удастся залечить шрамы, оставленные Красной Армией, но мы можем убедить народ, что наша революция не настолько кровава."
 BALTIC_belarus_uprising_desc: "Белорусский народ разрывается на части. Половина нации желает остаться в составе государства [SOV.GetNameDef], другая же половина хочет перейти под крыло Балтии."
 SOV_propaganda_campaign_locked_slot_tt: "Эта ячейка пропагандистского плаката сейчас заблокирована. Ее можно разблокировать, завершив следующий фокус: §Y[GetCollectivistAndPossitiveFocuses][GetKomsomolFocus]§!"
 SOV_paranoia_system: "Прирост политической власти"
 SOV_paranoia_bg_tooltip: "Если значение £SOV_paranoia_text_icon §Yпаранойи§! превышает §Y25§!, может произойти случайная чистка. \nЧем выше значение £SOV_paranoia_text_icon §Yпаранойи§! и чем дольше оно держалось на этом уровне, тем выше вероятность чистки. \nЕсли значение £SOV_paranoia_text_icon §Yпаранойи§! превысит §R75§!, может произойти большая чистка. \n\nОпределенные §Yфокусы§!, §Yрешения§! и §Yэффекты§! будут немедленно повышать/понижать уровень £SOV_paranoia_text_icon §Yпаранойи§!, определенные черты советников и лидеров государства будут постепенно повышать §Yпаранойю§!. \n\nПо завершении фокуса §Y[GetAppropriateLastPurgeFocusName]§! система £SOV_paranoia_text_icon §Yпаранойи§! будет убрана."
 SOV_daunt_generals_tt: "До пяти командиров армий получат черту §YУничтожен Сталиным§!:\n- Скорость восстановления дивизии: §R-10,0%§! \n- Скорость пополнения: §R-2,0%§!"
