 SOV_the_zinovyevite_terrorist_center: "Зиновьевская террористическая ячейка"
 SOV_they_will_know_fear_desc: "Наши враги научились бояться Красной армии и советского народа. Мы выдержали натиск противника, и теперь пришло время нанести ответный удар. Надо разработать новые военные машины, способные прорвать даже самую прочную оборону противника. Такие военные машины должны вселять страх в сердца врагов одним своим названием…"
 SOV_architect_of_communism: "Архитектор коммунизма"
 SOV_anti_fascist_policies: "Антифашистская коалиция"
 SOV_the_khakimov_proposal_desc: "Товарищ Хакимов неустанно трудился над улучшением наших отношений с государством [SAU.GetNameDef]. Некоторые эксперты полагают, что этот регион чрезвычайно богат природными ресурсами, которые, без сомнения, захотят эксплуатировать капиталисты. Нам нужно и дальше развивать отношения взаимодоверия, чтобы уберечь государство [SAU.GetNameDef] от вступления в какой-либо враждебный блок и первыми получить права на разработку любых найденных ресурсов."
 SOV_anti_capitalist_policies: "Антикапитализм"
 SOV_baltic_security: "Обезопасить Прибалтику"
 SOV_secure_leningrad: "Захватить регион [195.GetName]"
 SOV_support_afghan_ideology: "Продемонстрировать, что афганск. [GetIdeologyNameWithCaps] пользуется нашей поддержкой"
