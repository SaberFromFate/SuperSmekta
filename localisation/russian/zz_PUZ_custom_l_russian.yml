 BUL_ultimatum_is_major: "\n— §RВеликая держава§!"
 BUL_fate_of_the_balkans_demand_submission_desc: "[ROOT.GetAdjective]ая делегация отправится в [FROM.GetAdjective]ую столицу и потребует признать державу [ROOT.GetNameDef] метрополией государства [FROM.GetName]."
 BUL_fate_of_the_balkans_demand_submission_tt: "Если боеспособность армии государства [FROM.GetNameDef] ниже, шанс подчинить его повышается."
 bftb_greece.3.desc: "Самопровозглашенное фашистское движение Греции переориентировалось согласно нашей новой политической реальности. Разозленные и разочарованные греческие беженцы, изгнанные из Турции, начинают сходиться под знамена нового радикального политического движения Георгиоса Космидиса, также греческого беженца.\n\nКосмидис — ярый сторонник Великой идеи и возвращения наших исторических территорий, которыми сейчас владеет [TUR.GetNameDef]. Его взгляды гораздо радикальнее, чем у кого-либо в венизелистской администрации. Есть мнения, что Космидис желает отодвинуть границы государства [ROOT.GetNameDef] дальше, чем просто за Эгейское море, что он строит планы на всю Анатолию. Однако относиться к таким мнениям стоит скептически — что за безумец стал бы строить планы на все государство [TUR.GetNameDef]?"
 bftb_greece.6.desc: "Подлые анатолийские фашисты сеяли хаос и не желали идти на переговоры с правительством с самого зарождения своего вредоносного движения. Но теперь всё, похоже, меняется: нам предлагают заключить сделку века — объединить наши силы с анатолийскими фашистами, чтобы сообща свергать государство [TUR.GetNameDef].\n\nНельзя отрицать, многие в нашей администрации заключили бы сделку с дьяволами нашей нации уже затем, чтобы те прекратили мешать правительству. Также нельзя отрицать, что есть среди нашей администрации и такие, кто находит цели НСГ естественными и даже правильными. К счастью, магнат Аристотель Онассис предложил нам альтернативу: он, будучи сам из Анатолии, образует движение противодействия, используя для этого свою славу, деловую хватку и личное состояние. С помощью такого движения он намерен подорвать основу НСГ. Эти меры, разумеется, не гарантируют нам победу над движением, но на Онассиса, во всяком случае, положиться можно."
 bftb_greece.7.desc: "Дело наконец дошло до пересмотра Севрского и Лозаннского договоров с великими державами Европы и повторного рассмотрения принципов Великой идеи. Судьба государства [TUR.GetNameDef] не может быть решена исключительно нами, нам нужно сперва заручиться поддержкой государств [ENG.GetNameDef], [FRA.GetNameDef] и [ITA.GetNameDef] (будь она проклята), если мы хотим пригласить на свою конференцию и их."
 bftb_greece.8.desc: "Мы получили интересное предложение от державы [FROM.GetNameDef], которая, очевидно, хочет изменить границы государства [TUR.GetNameDef]. [FROM.GetNameDef] желает устроить обсуждение с европейскими державами, победившими в Великой войне, и изменить условия Севрского и Лозаннского мирных договоров, которые мы пытались обязать соблюдать государство [TUR.GetNameDef].\n\nПредставители государства [FROM.GetNameDef] заверяют наших представителей, что победа над государством [TUR.GetNameDef] материально выгодна нам и что в планы [FROM.GetAdjective]ого правительства не входит уничтожение государства [TUR.GetNameDef]. Представители [FROM.GetNameDef] правительства настаивают: эта конвенция — лишь для уточнения границ, не для реализации реваншистских мечтаний."
 bftb_greece.9.desc: "Приглашения на Гераклионскую конвенцию по изменению границ государства [TUR.GetNameDef] были отправлены всем интересным нам державам. Мы ожидали, что на нашу встречу явятся все приглашённые, но похоже, что там будет лишь государство [ENG.GetNameDef]. У наших отношений с государством [ENG.GetNameDef] долгая история, поэтому многие наши чиновники убеждены, что Гераклионскую конвенцию можно будет провести так, чтобы оба наших народа извлекли из неё свою выгоду."
 bftb_greece.10.desc: "Приглашения на Гераклионскую конвенцию по изменению границ государства [TUR.GetNameDef] были отправлены всем интересным нам державам. Мы ожидали, что на нашу встречу явятся все приглашённые, но похоже, что там будет лишь государство [FRA.GetNameDef]. Реакцию [ROOT.GetAdjective]их представителей на такие известия лучше всего описывает слово «уныние». Ни наша политическая элита, ни наши военные специалисты не уверены, что Гераклионская конвенция даст желаемые результаты, если с нами будет только государство [FRA.GetAdjective]ое, но всё же мы продолжим действовать по плану."
 bftb_greece.11.desc: "Наши удручённые представители обсуждают ужасные новости: одно лишь государство [ITA.GetNameDef] заинтересовалось тем, чтобы решить судьбу государства [TUR.GetNameDef] на Гераклионской конвенции. В итоге мы поняли, что единственно верным сейчас будет отменить конвенцию полностью. Принять такое решение было нелегко, ведь многие венизелисты в правительстве прекрасно знают, что вся легитимность их движения базировалась на идее отмщения за 1922 год, и теперь она поставлена под удар.\n\n[ROOT.GetAdjective]ий народ недоволен недостатком новостей о некогда столь освещаемом событии. НСГ сразу же решает возглавить народное недовольство и всячески критикует наше правительство за слабость и неспособность сдержать обещания. Как же [ROOT.GetLeader] теперь выведет нас из этих мутных вод?"
 bftb_greece.12.t: "Гераклионскую конвенцию посещают государства [ENG.GetNameDefCap] и [FRA.GetNameDef]"
 bftb_greece.12.desc: "Официальные лица, собравшиеся в столице, рады были услышать, что и [ENG.GetNameDef], и [FRA.GetNameDef] отправят своих делегатов на Гераклионскую конвенцию. Подготовка к встрече в верхах уже началась, конвенция будет проведена в ближайшие дни.\n\nНаши делегаты распределят сферы влияния на севере и юге государства [TUR.GetName], после чего будет окончательно решено, должны ли мы получить принадлежащие нам по праву территории вдоль Эгейского побережья. Скоро будет вершиться история, и [ROOT.GetNameDef] окажется в самом центре этого процесса."
 bftb_greece.13.desc: "Официальные лица, собравшиеся в столице, рады были услышать, что и [ENG.GetNameDef], и [FRA.GetNameDef] отправят своих делегатов на Гераклионскую конвенцию, но эта радость быстро угасла после новости об участии в конвенции державы [ITA.GetNameDef]. Многие наши политические фигуры высказали в частных беседах обеспокоенность тем, что [ITA.GetAdjective]ие махинации могут лишить смысла всю конвенцию, но [ROOT.GetLeader] по-прежнему убеждён, что пригласить государство [ITA.GetNameDef] было правильным решением. Подготовка к встрече в верхах уже началась, конвенция будет проведена в ближайшие дни.\n\nНаши делегаты распределят сферы влияния на севере и юге государства [TUR.GetName], после чего будет окончательно решено, должны ли мы получить принадлежащие нам по праву территории вдоль Эгейского побережья. Скоро будет вершиться история, и [ROOT.GetNameDef] окажется в самом центре этого процесса."
 bftb_greece.15.desc: "Тема первого раунда голосования — нужно ли разрешить государству [FRA.GetNameDef] получить [FRA.GetAdjective]ий мандат в [TUR.GetAdjective]ом Курдистане при капитуляции государства [TUR.GetNameDef]. Многие из явившихся [FRA.GetAdjective]их официальных лиц считают такое положение дел вполне логичным, учитывая близость державы [FRA.GetNameDef] к региону и отчётливый национализм, уже заметный в [TUR.GetAdjective]ий Курдистане. Впрочем, дома у них такую идею могут воспринять в штыки, учитывая, насколько уже чрезмерно растянута [FRA.GetAdjective]ая империя.\n\nЕсли [FRA.GetAdjective]ий народ получит свою концессию в государстве [TUR.GetNameDef], он будет обязан по условиям договора прийти на помощь государству [GRE.GetNameDef] в войне с державой [TUR.GetNameDef]. Если данное предложение не пройдёт, то вне зависимости от исхода Гераклионской конвенции государство [FRA.GetNameDef] не будет связано обязательствами с державой [GRE.GetNameDef], когда начнётся война."
 bftb_greece.19.desc: "Большинство присутствующих делегатов решило, что государство [ENG.GetNameDef] должно получить армянский протекторат, вырезанный из территории свергнутого государства [TUR.GetName]. [ENG.GetAdjective]ие представители высоко отозвались о делегатах за их мудрость в государственных делах и передали [ENG.GetAdjective]ому правительству поручения о планировании установления своей администрации в регионе."
 bftb_greece.21.desc: "Тема этого раунда голосования — может ли [ITA.GetNameDef] получить колониальные территории на юге державы [TUR.GetNameDef], когда [TUR.GetNameDef] сдастся. У каждого из присутствующих есть свои сомнения насчёт того, чтобы свободно отдавать часть средиземноморской территории [ITA.GetAdjective]ому государству, но [ITA.GetAdjective]ие делегаты неизменно повторяют то, что сказал [ITA.GetLeader]: это было бы только справедливо в свете доставшейся им «испорченной победы».\n\nДругие присутствующие перед официальным началом Гераклионской конвенции решили, что [ITA.GetAdjective]ое вмешательство во вторжение в государство [TUR.GetNameDef] нежелательно. Если держава [ITA.GetNameDef] получит свои уступки, она будет связана пактом о ненападении с державой [GRE.GetNameDef] и пактом о невмешательстве в случае войны с государством [TUR.GetNameDef]. Если данное предложение не пройдёт, то вне зависимости от исхода Гераклионской конвенции государство [ITA.GetNameDef] не будет связано обязательствами с державой [GRE.GetNameDef], когда начнётся война, и может даже вмешаться в происходящее."
 bftb_greece.22.desc: "Большинство присутствующих делегатов решило, что государство [ITA.GetNameDef] должно получить колонии, вырезанные из территории побеждённого государства [TUR.GetName]. [ITA.GetAdjective]ие представители высоко оценили принятое собравшимися решение, и многие из участников [ITA.GetAdjective]ой делегации спешно отправились домой, чтобы [ITA.GetLeader] узнал хорошие новости."
 bftb_greece.23.desc: "Большинство присутствующих делегатов решило, что [ITA.GetNameDef] не получит колонии в южной части державы [TUR.GetNameDef], и признало само такое желание [ITA.GetAdjective]им подстрекательством к войне. [ITA.GetAdjective]ие представители раскритиковали решение и заявили, что оно лишний раз демонстрирует правильность самого понятия «испорченная победа», как называют её [ITA.GetAdjective]ие жители. [ITA.GetAdjective]им представителям было указано остаться на конвенции вне зависимости от их личного мнения о случившемся — несомненно, для того, чтобы они могли повлиять на вердикт по последнему и самому важному пункту повестки дня."
 bftb_greece.24.desc: "Тема этого раунда голосования — должны ли великие державы допускать само существование т. н. Великой идеи — давно вынашиваемой реваншистской идеи о Великой Греции. [GRE.GetAdjective]ий национальный лидер [GRE.GetLeader] нанёс внезапный визит в зал, где проходила Гераклионская конвенция, и произнёс пылкую речь о том, что Великая идея — больше чем просто отъём территории, что это священная мечта, которую веками лелеет [GRE.GetAdjective]ий народ по всему миру.\n\nНет ни малейшего сомнения: если Великую идею здесь отвергнут, все уступки и обещания, сделанные на Гераклионской конвенции, утратят силу. От решения, принимаемого сегодня, может зависеть само будущее демократии и целостности государства [GRE.GetNameDef]."
 bftb_greece.31.desc: "Чиновники из Политбюро государства [SOV.GetNameDef] решили наконец-то посвятить нас в свои тайные планы касательно будущего державы [TUR.GetNameDef], в которых мы играем важнейшую роль. План довольно простой: [TUR.GetNameDef] получает с нашей помощью заведомо неприемлемый ультиматум от имени государства [SOV.GetNameDef] и мировой революции, после чего мы используем неизбежный [TUR.GetAdjective]ий отказ как повод к войне и провоцируем конфликт в Эгейском регионе.\n\nНаше верховное командование рекомендует разместить лучшие войска вдоль фракийской границы с государством [TUR.GetNameDef] и готовить солдат к атакам на [TUR.GetAdjective]ую территорию у берегов наших эгейских островов. Многие в нашей администрации и вооружённых силах сомневаются, что мы сможем одолеть [TUR.GetAdjective]ую армию в бою один на один, но государство [SOV.GetNameDef] обещало помочь нам, начав вторжение на севере, если наш изначальный штурм на Константинополь не удастся."
 bftb_greece.32.desc: "Официальные лица нашей страны возмутились, прочитав совершенно нереалистичные и неразумные требования жалких марксистов из страны [FROM.GetNameDef]. Заявив, что действует от лица государства [SOV.GetNameDef], [FROM.GetNameDef] требует от нас выполнить все требования Лозаннского мирного договора и допустить в нашу страну [SOV.GetAdjective]их солдат в качестве «надежной и непредвзятой третьей стороны», чтобы они могли обеспечить соблюдение нами условий договора. \n\nЧего [FROM.GetAdjective]ая держава надеется достичь столь абсурдными требованиями, если не конфликта на наших границах? Мы изо всех сил старались обеспечить мир, но, похоже, им он был не нужен. Если государство [SOV.GetNameDef] и впрямь действует [FROM.GetAdjective]ими руками, то, возможно, лишь капитуляция спасет нас и не позволит [SOV.GetAdjective]им солдатам силой захватить власть в нашей стране. Но ведь раньше мы никогда не отказывались от борьбы за правое дело. Заслуживаем ли мы власти, если не готовы сражаться за свои ценности?"
 bftb_greece.37.desc: "[FROM.GetAdjective]ие агитаторы, штурмовавшие наши границы, изгнаны, но, судя по донесениям наших наблюдателей, всё только начинается. [FROM.GetAdjective]ие войска собираются вдоль Эгейских островов и подводят вооружение ужасающе близко к государству [339.GetName]. Есть новости и хуже: значительно активизировалось движение войск вдоль [SOV.GetAdjective]ой границы, и судя по перехваченным сообщениям, в любой момент может начаться штурм на севере. Мы должны быть готовы, мы должны всё выдержать."
 bftb_greece.38.desc: "К сожалению, наши войска не смогли пробиться сквозь [FROM.GetAdjective]ую оборону в государстве [341.GetName]. Верховное командование, конечно же, разочаровано результатами, но не удивлено. Если [FROM.GetAdjective]ие войска не начнут ответные действия, мы должны атаковать снова. На этот раз [SOV.GetNameDef] нападёт на [FROM.GetAdjective]ие позиции на севере, пока мы устроим два береговых штурма с территории государства [187.GetName] на государства [339.GetName] и [340.GetName]. Разве при таком сценарии мы можем проиграть?"
 bftb_greece.38.a: "Для государства [FROM.GetNameDef] игра была подставной с самого начала..."
 bftb_greece.39.desc: "Наши войска, не готовые к такому отчаянному штурму от [FROM.GetAdjective]их вооружённых сил, были отброшены назад на территории державы [341.GetName], что стало огромной потерей для нации. [FROM.GetAdjective]ие войска не прекратили своё продвижение, и теперь наверняка неизбежно объявление войны. Наш проигрыш досаден, но поправим — война только началась, и наш народ будет твёрдо стоять плечом к плечу против давнего врага."
 bftb_greece.41.desc: "Штурм [FROM.GetAdjective]ие войсками государства [339.GetName] закончился провалом, но и мы немало пострадали. [ROOT.GetLeader] поневоле проводит параллели с 1919 годом, когда [FROM.GetAdjective]ие силы вовсю атаковали государство [339.GetName].\n\nЧиновники в столице оплакивают погибших в недолгой осаде державы [339.GetName], народ же разъярён тем, как наш давний недруг продолжает атаковать наш суверенитет. Внезапное нападение на государство [341.GetName] — само по себе низость, но потери, понесённые в державе [339.GetName], забывать нельзя. Если [FROM.GetAdjective]ое правительство слишком трусливо, чтобы открыто объявить войну, мы сделаем это за него."
 bftb_greece.43.desc: "Штурм [FROM.GetAdjective]ими войсками государства [339.GetName] увенчался успехом для них и разгромным поражением для нас. [ROOT.GetLeader] поневоле проводит параллели с 1919 годом, когда [FROM.GetAdjective]ие силы взяли контроль над государством [339.GetName].\n\nВ столице царит уныние, но весь народ разъярён тем, как наш давний недруг продолжает атаковать наш суверенитет. Внезапное нападение на государство [341.GetName] — само по себе низость, но потери, понесённые в державе [339.GetName], забывать нельзя. Если [FROM.GetAdjective]ий народ так желает очередной войны, мы устроим ему войну, которую он не забудет никогда."
 bftb_greece.44.desc: "Как и ожидалось, Красная армия быстро расправилась с жалкими [FROM.GetAdjective]ими гарнизонами в государстве [354.GetName] и проложила путь для вполне воодушевляюще рутинного вторжения. Пока мы атакуем их с севера, [GRE.GetAdjective]ие войска нападут с запада. У врага нет шансов."
 bftb_greece.45.desc: "Правительство было ошеломлено вестью о том, что наши войска, расположенные в государстве [354.GetName], успешно прогнали вторгшихся к нам [FROM.GetAdjective]их солдат и удержали свои позиции, несмотря на огромное превосходство противника. Мы получили срочное коммюнике от [FROM.GetAdjective]ого посла, который активно извинялся за инцидент, и узнали, что за всей операцией стоит [GRE.GetAdjective]ий режим. Нас заверили, что в случае, если наша борьба с государством [GRE.GetNameDef] перерастет в войну, стоит ожидать [FROM.GetAdjective]их ответных мер."
 bftb_greece.46.desc: "Стало известно, что атака на государство [354.GetName] обернулась полным и безоговорочным провалом, нанёсшим удар как по нашей репутации в мире, так и по самооценке нашего верховного командования. Мы принесли свои самые искренние извинения [FROM.GetAdjective]ому правительству и прекратили всякую поддержку [GRE.GetAdjective]ого режима, который по-прежнему противостоит [FROM.GetAdjective]ому государству на западе."
 bftb_greece.47.t: "[FROM.GetNameDefCap] прорывает наши позиции в державе [354.GetName]!"
 bftb_greece.47.desc: "Мало кого из советников удивило, что [FROM.GetAdjective]ие войска смогли оттеснить наши войска на севере, но разочарования это не умаляет. [FROM.GetAdjective]ие силы не прекратили поползновения на границе [354.GetName] территории: мы получаем доклады о масштабных передвижениях войск у наших границ и даже сообщения о [FROM.GetAdjective]их солдатах, переходящих демаркационную линию в государстве [800.GetName]. Это означает одно: вторжение. Мы должны готовиться к худшему."
 bftb_greece.48.desc: "Мерзкий марксистский режим государства [FROM.GetNameDef] вооружил террориста Иосипа Броза Тито и побудил его начать восстание на юге! Возможно, мы могли бы пренебречь опасностью, если бы не тот факт, что [FROM.GetAdjective]ие провокаторы активно сотрудничают с новоявленным режимом на юге в надежде свергнуть наше правительство. Похоже, нам не остаётся иного выбора, кроме как раздавить повстанцев и затем пойти маршем на [FROM.GetAdjective]ую столицу, чтобы призвать их к порядку."
 bftb_greece.52.desc: "Мы только что закончили принимать в своих доках оружие и добровольцев из государства [FROM.GetNameDef]. Эта поддержка очень кстати; она гораздо больше всего, что мы могли ожидать, и пригодится нам в ближайшие месяцы."
 bftb_greece.53.desc: "Мы только что закончили выгружать в своих доках материальную помощь от государства [FROM.GetNameDef]. Эта поддержка очень кстати; она показывает, кто остался нам другом в эти непростые времена, и пригодится нам в ближайшие месяцы."
 bftb_greece.54.desc: "[FROM.GetAdjective]ий дипломат сообщил нам, что наш призыв о помощи не нашёл понимания и что помощи от государства [FROM.GetNameDef] ждать не стоит. Ситуация сложилась не в нашу пользу, но мы продержимся и без помощи иностранных держав."
 bftb_greece.58.desc: "[FROM.GetAdjective]ий делегат прибыл к нам, чтобы обсудить будущее кипрской королевской колонии. [FROM.GetAdjective]ий представитель заявил, что попытки построить кипрскую нацию обречены на провал, поскольку кипрский народ на самом деле — [FROM.GetAdjective]ий народ.\n\n[FROM.GetAdjective]ий посланник предъявил письмо от [FROM.GetAdjective]го премьер-министра, в котором [FROM.GetLeader] подробно излагает историю концепции так называемого энозиса и призывает к союзу Кипра и государства [FROM.GetNameDef]. [FROM.GetAdjective]ого делегат попытался заверить нашего представителя, что дело здесь не в грубом ирредентизме с [FROM.GetAdjective]ой стороны, что Кипр и [FROM.GetNameDef] делят общее культурное наследие, историю, язык и, в [FROM.GetAdjective]ой перспективе, общую судьбу.\n\nНаши военные чиновники подчеркнули важность Кипра как стратегической военной базы в Средиземноморье; советники же по внешней политике отмечают, что сильный [FROM.GetAdjective]ий союзник сам по себе значит намного больше, чем даст нам Кипр в роли авиабазы и морской базы. Выбор в конечном счёте должен будет принять [ROOT.GetAdjective]ий кабинет министров, но следует проследить, чтобы [FROM.GetAdjective]ий представитель не ждал нашего ответа слишком долго."
 bftb_greece.59.desc: "В столице царит радостное настроение: [ROOT.GetLeader] объявил нации, что теперь, спустя столько лет, [ROOT.GetAdjective]ие мечты об энозисе с Кипром наконец станут реальностью благодаря нашим [FROM.GetAdjective]им друзьям. Наши управленцы сразу же отправились на Кипр, чтобы убедиться, что передача власти пройдёт как можно более спокойно.\n\nЭто поистине великий и исторический день для государства [ROOT.GetNameDef]. Кипр долго присутствовал в [ROOT.GetAdjective]ом коллективном сознании, и теперь он наконец-то вернётся в лоно цивилизации, из которой появился."
 bftb_greece.68.desc: "Мы встретились с делегатами из государства [FROM.GetNameDef] и с облегчением узнали, что [FROM.GetAdjective]ая администрация выразила желание видеть державу [FROM.GetNameDef] в альянсе [ROOT.GetFactionName]. Сюрпризом это не назовёшь: [FROM.GetAdjective]ая позиция без нас была несостоятельна. Надо решить, на пользу или во вред нашим целям пойдёт их партнёрство в нашем альянсе."
 bftb_greece.91.desc: "В циничной попытке привлечь новых последователей Георгиос Космидис открыл на средства своего фонда центр помощи для таких же, как он, беженцев из государства [TUR.GetNameDef]. Это было бы похвально, не используй Космидис центры помощи для вербовки людей в своё безумное движение.\n\nМы теперь находимся в трудном положении: очевидно, что Космидис намеревается и дальше открывать такие центры, чтобы привлекать к себе маргинальных беженцев из Анатолии. Надо ли закрыть эти центры, чтобы не дать ему отравлять страну? Или лучше уберечь свою репутацию и не мешать их работе? Есть мнение, что пусть лучше обедневшие беженцы трудятся в фашистских центрах помощи, чем с трудом выживают в трущобах."
 bftb_greece.102.desc: "Полиция не смогла ни предвидеть, ни предотвратить недавний налёт коммунистов на наш завод, где мы производим ружья для армии. Марксисты вынесли с завода всё, что смогли, после чего попытались его сжечь — но, к счастью, только повредили здание.\n\nНет необходимости гадать, почему бандиты предприняли дерзкий налёт на оружейный завод: они, без сомнения, хотят использовать наше оружие против нас же, когда обретут поддержку и выйдут из тени. Вероятно, нас ждёт одна из худших гражданских войн в истории государства [ROOT.GetNameDef]..."
 bftb_greece.105.desc: "Судьбоносный день наконец настал: лидер венизелистов вышел из тени и осудил декрет короля как незаконную и беспрецедентную угрозу демократии государства [FROM.GetNameDef]. По мнению лидера, у них нет выбора, кроме как насильственно свергнуть монархию и восстановить уже дважды исчезавшую Эллинскую Республику.\n\n[ROOT.GetLeader] заклеймил всех повстанцев предателями и пообещал с корнем вырвать марксистское и республиканское движения, чтобы в государстве [ROOT.GetNameDef] вновь воцарился порядок. Похоже, что политическая арена державы [ROOT.GetNameDef] превратилась в арену гладиаторскую, откуда уйдут с победой лишь сильнейшие."
 bftb_greece.168.desc: "Хитрые мелкие паразиты из государства [FROM.GetNameDef] придумали способ использовать нашу финансовую пирамиду против нас. Небольшая уловка, созданная так, чтобы мы могли использовать несовершенство плана Шахта в свою пользу, обернулась против нас же, на что мы никак не рассчитывали. Мы можем либо сохранить лицо и дать [FROM.GetAdjective]им хитрецам одержать эту маленькую победу, либо перестать притворяться, что играем по правилам, и прекратить переговоры с [FROM.GetAdjective]им народом."
 bftb_greece.181.desc: "Эти мошенники из государства [FROM.GetNameDef] хотят вынудить нас инвестировать в кучу камней, которую они называют родиной! Наши профсоюзы пикетируют нас и обвиняют в том, что мы усугубляем проблему безработицы, нарочно отвергая предложения таких щедрых [FROM.GetAdjective]их дельцов. Чушь! За версту видно, что их подкупили. И всё же все карты у них на руках. Может, нам пойти по пути наименьшего сопротивления и дать профсоюзам, а следовательно, и [FROM.GetNameDef] дельцам то, что им нужно? Или стоит проявить принципиальность во времена, когда она может обойтись нам дорого?"
 bftb_greece.186.desc: "Мы приняли делегата из государства [FROM.GetNameDef]. Он передал, что его правительство обеспокоено растущим в их стране [ROOT.GetAdjective]им политическим влиянием. Ему дали полномочия заключить сделку: его страна поможет нам сырьём, а мы прекратим захватывать её государственные институты.\n\nМы, разумеется, отрицали любое вмешательство в чужие дела, хоть и знаем, что на самом деле это не так. Предложение весьма щедро — сразу видно, что [FROM.GetAdjective]ое правительство и правда желает сохранить суверенитет. Поставки сырья нам бы пригодились. С другой стороны, удобно было бы воспользоваться полной зависимостью от нас государства [FROM.GetNameDef]..."
 bftb_greece.190.desc: "Мы только что имели удовольствие принять у себя представителей государства [FROM.GetNameDef], один из которых произнёс речь перед Президиумом. В этой речи была особо подчёркнута сильная связь между нашими странами. Выслушать такое приятно, но всё же истинная цель [FROM.GetAdjective]ого визита — обсудить инвестиции в их развивающуюся нацию. Теория марксизма говорит нам, что революция может происходить только в индустриальном обществе, но наша история и опыт [FROM.GetAdjective]ого народа свидетельствуют об обратном.\n\nНаше правительство полагает, что мы должны помочь [FROM.GetAdjective]им гражданам, поскольку у нас есть нужные ресурсы. С другой стороны — и это не оспаривается правительством — наши ресурсы пригодились бы нам самим. Как же нам поступить?"
 bftb_greece.190.a: "[ROOT.GetNameDefCap] направит часть ресурсов на развитие государства [FROM.GetNameDef]."
 bftb_greece.192.desc: "Мы приняли делегата из государства [FROM.GetNameDef], который передал, что его правительство обеспокоено растущим в их стране [ROOT.GetAdjective]им политическим влиянием. Ему дали полномочия заключить сделку: его страна инвестирует средства в наши бедные регионы, а мы прекратим захватывать её государственные институты.\n\nМы, разумеется, отрицали любое вмешательство в чужие дела, хоть и знаем, что это на самом деле не так. Предложение весьма щедро — сразу видно, что [FROM.GetAdjective]ое правительство и правда желает сохранить суверенитет. Поставки сырья нам бы пригодились, но с другой стороны, удобно было бы воспользоваться полной зависимостью от нас государства [FROM.GetNameDef]..."
 bftb_greece.217.desc: "Фашизм всегда был представлен в государстве [ROOT.GetNameDef] достаточно умеренно, но в годы, когда правит [ROOT.GetLeader], он развился до такого масштаба, когда величайшие фашистские мыслители страны могут встретиться и обсудить будущее страны. [ROOT.GetLeader] предлагает перенести его отчетливо авторитарный стиль правления непосредственно в форму фашизма, чтобы минимизировать нестабильность. Георгиос Меркурис, признанный национал-социалист, считает, что лучший путь развития для государства [ROOT.GetNameDef] — избавиться от непопулярного короля, чтобы ввести нацию в очень радикальную сферу политики.\n\n[ROOT.GetLeader] много говорил о видении Великой Греции, что тянется от Албании до Кипра, но Меркурис, не желая, чтобы его обошли, считает, что [ROOT.GetAdjective]ий народ должен в поисках величия ставить перед собой ещё более амбициозные цели. Метаксас полагает, что в ближайшем будущем образуется Третья эллинская цивилизация, новая ступень эллинской нации, но Меркурис считает, что она будет вдохновлена Первой эллинской цивилизацией. Две влиятельные политические фигуры выражают два абсолютно разных мнения — вот фашистизированное будущее государства [ROOT.GetNameDef], что обсуждается на Самосе."
 bftb_greece.218.a: "Нельзя, чтобы фашисты решали судьбу государства [ROOT.GetNameDef]!"
 bftb_greece.220.desc: "В столице царит радостное настроение: [ROOT.GetLeader] объявил нации, что теперь, спустя столько лет, [ROOT.GetAdjective]ие мечты об энозисе с Кипром наконец станут реальностью благодаря нашим [FROM.GetAdjective]им друзьям. Наши управленцы сразу же отправились на Кипр, чтобы убедиться, что передача власти пройдёт как можно более спокойно.\n\nЭто поистине великий и исторический день для государства [ROOT.GetNameDef]. Кипр долго присутствовал в [ROOT.GetAdjective]ом коллективном сознании, и теперь он наконец-то вернётся в лоно цивилизации, из которой появился."
 bftb_greece.223.desc: "Большинство присутствующих делегатов решило, что государство [ENG.GetNameDef] должно получить армянский протекторат, вырезанный из территории свергнутого государства [TUR.GetName]. [ENG.GetAdjective]ие представители высоко отозвались о делегатах за их мудрость в государственных делах и передали [ENG.GetAdjective]ому правительству поручения о планировании установления своей администрации в регионе."
 bftb_greece.225.desc: "Большинство присутствующих делегатов решило, что государство [ITA.GetNameDef] должно получить колонии, вырезанные из территории побеждённого государства [TUR.GetName]. [ITA.GetAdjective]ие представители высоко оценили принятое собравшимися решение, и многие из участников [ITA.GetAdjective]ой делегации спешно отправились домой, чтобы [ITA.GetLeader] узнал хорошие новости."
 bftb_greece.227.t: "Усиливаются стычки на [GRE.GetAdjective]ой границе с войсками государства [TUR.GetNameDef]"
 bftb_greece.227.desc: "[GRE.GetAdjective]ая атака на государство [341.GetName] завершилась, как и ожидалось, неудачей, и в разгар конфликта в Эгейском море мы получили отличную возможность вмешаться в него от имени государства [GRE.GetNameDef]. Нам нужно подвести свои войска к Кавказу, чтобы обосноваться на [TUR.GetAdjective]ой границе. Когда [GRE.GetAdjective]ие союзники подадут сигнал, мы возьмём [TUR.GetAdjective]ие силы в клещи и принудим их к легитимизированной войне."
 bftb_greece.233.desc: "Премьер-министр и диктатор государства [ROOT.GetNameDef] скончался после продолжительной болезни. Он умер за границей, изгнанный из завоеванной страны. Хотя [ROOT.GetAdjective]ий народ не особо его любил, он стал символом национального единства и сопротивления во времена кризиса. Эммануил Цудерос, венизелист и символ единства, занял место Метаксаса в качестве премьер-министра державы [ROOT.GetNameDef]."
 bftb_turkey.1.desc: "Президент [TUR.GetLeader] сообщил нам, что [TUR.GetNameDef] готовится снова милитаризировать Турецкие проливы. [TUR.GetAdjective]ое правительство хочет, чтобы мы подкрепили его претензии на территориальные воды и так изменили Лозаннский договор, чтобы эти претензии стали легитимными. \n\nЕсли поддержать [TUR.GetAdjective]ие претензии на Турецкие проливы, [TUR.GetNameDef], несомненно, будет у нас в долгу и, возможно, сможет оспаривать господство государства [ITA.GetNameDef] в средиземноморском регионе. С другой стороны, ввязавшись в этот кризис, мы можем оказаться в оппозиции к государству [SOV.GetNameDef], что в худшем случае способно вылиться в войну."
 bftb_turkey.2.desc: "[ENG.GetLeader] выпускает заявление, в котором говорится, что [ENG.GetNameDef] намеревается помочь нам вернуть контроль над своими проливами. Поддержка государства [ENG.GetNameDef] много для нас значит и значительно усилит нашу легитимность на мировой арене."
 bftb_turkey.2.a: "Теперь ждем ответ государства [SOV.GetNameDef]"
 bftb_turkey.3.desc: "[ENG.GetLeader] написал большое письмо, адресатом которого стал сам [TUR.GetLeader]. В письме говорится, что [ENG.GetNameDef] сейчас не может позволить себе впутываться в международный кризис. Причинами для отказа [ENG.GetLeader] объявил недостаточную общественную поддержку войны в государстве [ENG.GetNameDef] и собственную неуверенность в [TUR.GetAdjective]ой готовности воевать против государства [SOV.GetNameDef].\n\n[ENG.GetName] признаёт наш контроль над Турецкими проливами, но на этом вся поддержка заканчивается."
 bftb_turkey.3.a: "Теперь ждем ответ государства [SOV.GetNameDef]"
 bftb_turkey.4.desc: "[TUR.GetLeader] объявил, что Турецкие проливы переходят под полный контроль государства [TUR.GetNameDef], что дает [TUR.GetAdjective]ому правительству возможность перекрывать их по своему усмотрению! Это абсолютно неприемлемо: [TUR.GetAdjective]ое правительство решило, будто у него есть право запирать наш флот в Черном море, когда ему это политически выгодно."
 bftb_turkey.5.desc: "Официальные представители государства [SOV.GetNameDef] ясно дали понять, что находят наш односторонний захват Турецких проливов незаконным и пойдут на крайние меры, чтобы отменить наше решение. Несмотря на давление со стороны наших дипломатов, [SOV.GetAdjective]ие официальные лица отказались исключить возможность военного вторжения в государство [TUR.GetNameDef]. \n\nСохранять текущее положение дел невозможно, что, без сомнения, понимает и [SOV.GetNameDef]. Если мы предложим компромиссное решение со свободным доступом ко всем черноморским странам, государство [SOV.GetNameDef] будет вынуждено его принять, чтобы не стать парией на международной арене."
 bftb_turkey.6.desc: "[SOV.GetAdjective]ое правительство выпустило резкое заявление с завуалированными намеками на будущие последствия и наказание за нарушение мира, но с глазу на глаз с нашими официальными лицами заверили, что никаких ответных мер государство [SOV.GetNameDef] предпринимать не намерено. \n\n[TUR.GetLeader] произнес в Стамбуле прочувствованную речь, которую вещали по радио на всю страну. В ней он объявлял случившееся большой победой государства [TUR.GetNameDef]. Правительство всячески поддержало эту меру, и теперь можно ожидать повсеместных празднований."
 bftb_turkey.8.desc: "[SOV.GetName] оспаривает план государства [TUR.GetNameDef] по возвращению контроля над проливами, но [TUR.GetNameDef] не реагирует на [SOV.GetAdjective]ие угрозы. [TUR.GetNameDef] стремится утвердить свой суверенитет, [SOV.GetNameDef] желает доминировать в регионе, и ситуация грозит вылиться в вооруженный конфликт. \n\nБаланс сил теперь зависит от нас: мы должны выбрать, легитимизировать ли нашу поддержку государства [TUR.GetNameDef], чтобы сдержать Советский Союз, или умыть руки и наблюдать, как обе страны лавируют, чтобы избежать столкновения, к которому сами же и пришли."
 bftb_turkey.9.desc: "Премьер-министр [ENG.GetLeader] публично заявил, что в связи с растущим напряжением между нами и государством [SOV.GetNameDef] [ENG.GetNameDef] не может позволить себе втягиваться в «региональный спор». Вспомнив о [ENG.GetAdjective]их потерях в Великой войне, [ENG.GetLeader] призвал вести политику задабривания государства [SOV.GetNameDef]. \n\nВ Анкаре это заявление было встречено с неодобрением: [TUR.GetLeader] осудил трусость государства [ENG.GetNameDef]."
 bftb_turkey.9.a: "Все потеряно. Мы должны безоговорочно выполнять капризы государства [SOV.GetNameDef]."
 bftb_turkey.10.desc: "Даже перед гораздо более сильным оппонентом [TUR.GetLeader] отказывается идти на компромисс по вопросам [TUR.GetAdjective]их прав на Турецкие проливы. Отношения между странами значительно накалились, на [TUR.GetAdjective]о-[SOV.GetAdjective]ую границу выведены войска. [TUR.GetLeader] назвал этот кризис «моментом истины для государства [TUR.GetNameDef]» и пообещал, что [TUR.GetNameDef] никогда не склонится перед [SOV.GetAdjective]ой тиранией."
 bftb_turkey.11.a: "Мир должен бояться мощи государства [SOV.GetNameDef]."
 bftb_turkey.13.desc: "Шесть часов назад [SOV.GetAdjective]ие войска начали обстреливать [TUR.GetAdjective]ие стратегические базы в Трабзоне и объявили, что входят на территорию государства [TUR.GetNameDef], чтобы освободить [TUR.GetAdjective]их рабочих в рамках марксистского освободительного движения. Предатель Шефик Хюсню уже объявил о создании правительства Турецкой народной республики в изгнании, которое, без сомнения, в ближайшем будущем будет действовать по указке державы [SOV.GetNameDef]. \n\n[TUR.GetLeader] с печалью в голосе объявил в Стамбуле, что в государство [TUR.GetNameDef] пришла война, но затем на смену печали пришел энтузиазм, и президент начал пылко рассуждать о том, что сама судьба снова призывает [TUR.GetAdjective]ий народ биться за свою свободу и независимость. Хоть шрамы, нанесенные Войной за независимость, еще свежи, [TUR.GetAdjective]ий народ впал в раж и спешит записаться в армию.\n\nНадолго ли хватит этого энтузиазма?"
 bftb_turkey.14.a: "Борьба на грядущих выборах будет идти за сердца жителей государства [TUR.GetName]"
 bftb_turkey.18.desc: "Для зарождающейся демократии государства [TUR.GetNameDef] настал черный день: раскрыт заговор о подтасовке результатов выборов в пользу оппозиционного движения Аднана Мендереса в сельских провинциях державы [TUR.GetNameDef]. Заговор, в который были вовлечены религиозные лидеры, работники местных администраций и даже государственные служащие, предотвращен, а заговорщики арестованы. Доказательства связи с заговором Мендереса или его оппозиционного движения не найдены, но наша реакция, несомненно, повлияет на его избирательную кампанию."
 bftb_turkey.21.desc: "Долгожданный день выборов наконец-то настал. Несмотря на скверную погоду и личные трудности, люди всей страны собрались на участках для голосования в своих провинциях и заполнили бюллетени, поставив отметки напротив своих любимых партий. Никто не ожидал такой массовой явки избирателей, особенно в свете слишком быстрого перехода к демократии. Предвыборная гонка проходила не совсем честно, но любой сторонник демократии рад был видеть, что столько [TUR.GetAdjective]их граждан пришло голосовать на первые свободные выборы государства [TUR.GetName].\n\nКандидаты шли вровень, и на подсчет голосов и определение результата выборов ушло немало времени. В итоге победителем на первых выборах государства [TUR.GetNameDef] становится…"
 bftb_turkey.21.a: "…республиканское движение!"
 bftb_turkey.22.desc: "После того, как на выборах победила Демократическая партия, конфликт в государстве [TUR.GetNameDef] был практически неизбежен. После выборов напряжение между правительством и вооруженными силами продолжало расти, и теперь, похоже, оно достигло пика. Офицеры уже захватили контроль над западными, самыми богатыми районами, где они, как считается, пользуются народной поддержкой. \n\nНа востоке курдское ополчение начало готовиться к вооруженной борьбе за свою независимость. С нашей стороны глупо было считать, что союз с курдами продлится долго, но с их стороны еще глупее думать, будто мы не подавим в зародыше их жалкие попытки вырвать себе кусок нашей суверенной территории. \n\nБорьба за душу государства [TUR.GetNameDef] началась, и проигрывать нам нельзя."
 bftb_turkey.24.j: "Хм… Может быть… Бывший халиф?.."
 bftb_turkey.25.desc: "[TUR.GetLeader] написал резкое письмо, в котором потребовал, чтобы турецкому населению сирийской провинции Хатай дали исполнить их демократическое право на референдум и возможность решить, хотят ли они присоединиться к государству [TUR.GetNameDef] или бессрочно оставаться в составе Сирии. Наша колониальная полиция обнаружила незаконную деятельность на [TUR.GetAdjective]ой границе: [TUR.GetAdjective]ие граждане проникают на территорию государства и провоцируют беспорядки в провинции Хатай. Очевидно, что [TUR.GetNameDef] планирует подтасовать результаты референдума так, чтобы обеспечить [TUR.GetAdjective]ую победу, но все же нам выгоднее, если [TUR.GetNameDef] останется нам другом. Кто знает, как далеко готов зайти [TUR.GetLeader], чтобы интегрировать Хатай в состав государства [TUR.GetNameDef]?"
 bftb_turkey.25.a: "Мы позволим Хатаю перейти в состав государства [TUR.GetNameDef]."
 bftb_turkey.26.desc: "[TUR.GetLeader] произнес краткую речь в Антакье, поздравив жителей Хатая с вхождением в состав государства [TUR.GetNameDef] и с благодарностью отметив, что [FROM.GetLeader], лидер государства [FROM.GetNameDef], уважает демократическую волю народа. Хоть сирийскими официальными лицами это заявление было встречено с яростью, в Хатае и государстве [TUR.GetNameDef] настроение в целом хорошее и многие [TUR.GetAdjective]ие граждане отправились из своих домов в Хатай, чтобы поздравить новоявленных земляков с вступлением в державу [TUR.GetNameDef] и обменяться подарками."
 bftb_turkey.27.desc: "[TUR.GetLeader] провел бурный митинг в Газиантепе, где заявил, что [FROM.GetNameDef] притесняет турков за границей, и пылко осудил соседей. [TUR.GetAdjective]ий народ разделил это возмущение, и теперь отношения между жителями Хатая и народом государства [FROM.GetNameDef] накалились. Пока что Хатай нам недоступен, но мы всегда будем помнить об этом предательстве."
 bftb_turkey.31.t: "[FROM.GetNameDefCap] предлагает нам эксклюзивные права на ресурсы в государстве [342.GetName]"
 bftb_turkey.31.desc: "[FROM.GetAdjective]ое правительство обратилось к нам с удивительным предложением. Они хотят передать нам право на сто процентов всех природных руд и металлов, добываемых в государстве [342.GetName], взамен на архипелаг Додеканес.\n\nНаше правительство больше привыкло получать территории, чем отдавать их, но [TUR.GetNameDef] предлагает нам источник ресурсов, которые могут быть очень важны для поддержания военной экономики. Стоит также учитывать, что когда война начнётся всерьёз, доступа к этим ресурсам у нас может и не остаться. Принимать ли [FROM.GetAdjective]ое предложение или нет, решать исключительно нам."
 bftb_turkey.32.desc: "[FROM.GetAdjective]ое правительство обратилось к нам с интригующим предложением. [FROM.GetAdjective]ая делегация представила нам портфолио, в котором описана историческая и стратегическая важность Додеканеса для государства [FROM.GetNameDef], и набросала список недвижимости и предприятий, которые нам готовы продать в обмен на архипелаг.\n\nНаше правительство больше привыкло получать территории, чем отдавать их, но нельзя отрицать, что дополнительная промышленная мощь была бы очень кстати для [ROOT.GetAdjective]ой военной машины. Нам надо решить, что более ценно для нашей нации — усиление индустрии или архипелаг Додеканес."
 bftb_turkey.34.desc: "[FROM.GetAdjective]ие власти вернули нам острова Оники в обмен на эксклюзивные права на ресурсы в государстве [342.GetName]. Официальные лица в частном порядке выразили своё недовольство таким неприкрытым случаем сознательного колониализма в государстве [342.GetName], но многие из голосов были заглушены общим приятным волнением по поводу аннексии новой провинции государства [TUR.GetNameDef].\n\n[TUR.GetLeader] прибыл с личным визитом на Родос, где заверил давно угнетаемых граждан, что все их жалобы будут услышаны и разобраны [TUR.GetAdjective]им правительством. На архипелаге тем временем распространялась новая методичка, в которой всячески превозносилась историческая и этническая связь островов с государством [TUR.GetNameDef]."
 bftb_turkey.35.desc: "[FROM.GetAdjective]ие власти вернули нам острова Оники в обмен на часть плодов труда нашей индустрии. Официальные лица в частном порядке выразили своё недовольство тем, что нам приходится платить за веками принадлежавшее нам, но многие из голосов были заглушены общим приятным волнением по поводу аннексии новой провинции государства [TUR.GetNameDef].\n\n[TUR.GetLeader] прибыл с личным визитом на Родос, где заверил давно угнетаемых граждан, что все их жалобы будут услышаны и разобраны [TUR.GetAdjective]им правительством. На архипелаге тем временем распространялась новая методичка, в которой всячески превозносилась историческая и этническая связь островов с государством [TUR.GetNameDef]."
 bftb_turkey.36.desc: "К удивлению многих [TUR.GetAdjective]их официальных лиц, [FROM.GetAdjective]ие власти вернули нам острова Оники в обмен на взаимное подписание договора, который по большому счёту не обязывает ни одну из сторон выполнять его бессмысленные условия. [FROM.GetLeader] нанёс личный визит, в ходе которого он и [TUR.GetLeader] подписали так называемый Пакт о силе. Оба лидера пообещали и дальше поддерживать отношения между двумя соседними морскими державами в свете этого исторического обмена территориями. Ажиотаж распространился по всей державе [TUR.GetNameDef]: многие радуются аннексии новой провинции государства [TUR.GetNameDef].\n\n[TUR.GetLeader] прибыл с личным визитом на Родос, где заверил давно угнетаемых граждан, что все их жалобы будут услышаны и разобраны [TUR.GetAdjective]им правительством. На архипелаге тем временем распространялась новая методичка, в которой всячески превозносилась историческая и этническая связь островов с государством [TUR.GetNameDef].\n\n[GRE.GetAdjective]ое правительство осудило обмен территориями и призвало другие великие державы также осудить то, что они называют несправедливым и незаконным нарушением суверенитета [GRE.GetAdjective]ого народа на островах Оники. Международное сообщество в массе своей хранит молчание по поводу этого обмена — вероятно, чтобы не злить [TUR.GetAdjective]ое правительство."
 bftb_turkey.38.desc: "[FROM.GetAdjective]ое правительство признало, что отправляет в Грузию геологоразведчиков, чтобы оценить перспективы разработки наших полезных ископаемых, и представило нам портфолио, где предложило способ организовать совместную добычу, выгодную обоим нашим государствам. Сам случай, когда государственный деятель признаёт, что занимается определённого вида шантажом, а затем использует это признание для взаимовыгодной сделки, довольно необычен, но так уж у нас сложились обстоятельства. [FROM.GetAdjective]ое правительство известно тем, что не любит рисковать понапрасну.\n\n[FROM.GetAdjective]ое портфолио составлено тщательно и подробно, [FROM.GetAdjective]ие представители готовы разрабатывать найденные ими месторождения и передавать большую часть добычи нам, вывозя остальное в государство [354.GetName]. Мы, вероятно, ещё много лет не сможем узнать, что нашли [FROM.GetAdjective]ие изыскатели, но мы можем использовать присланные нам планы, чтобы улучшить горнодобывающую промышленность Грузии и добывать пусть и меньше ископаемых, но зато без привлечения [FROM.GetAdjective]ой помощи. Нам предстоит решить, надо ли принять помощь [FROM.GetAdjective]ого правительства или работать самим."
 bftb_turkey.39.desc: "[TUR.GetAdjective]ие представители высоко оценивают свою работу: [FROM.GetAdjective]ое правительство только что сообщило нам, что хочет начать совместную добычу руды в Грузии, как и запланировано в представленных нами документах.\n\nУже идут приготовления, чтобы обеспечить немедленную подготовку к перевозке добытой в Грузии руды в государство [354.GetName], где мы сможем очистить и использовать её."
 bftb_turkey.41.desc: "[FROM.GetLeader], президент государства [FROM.GetNameDef], возглавил инициативу по формальному преобразованию Балканского пакта в более обширный и всеохватывающий стратегический альянс под названием Балканская антанта. Все участники Балканского пакта приглашены вступить в альянс [FROM.GetFactionName] — в том числе и мы.\n\nПредставители государства [FROM.GetNameDef] заверили, что связи, образовавшиеся среди наций альянса [FROM.GetFactionName], будут служить далеко не только военным целям, и уже представили планы по совместному развитию наших финансовых систем, оборонительных стратегий и многому другому."
 bftb_turkey.44.desc: "Мы получили план обороны от государства [FROM.GetNameDef]. Этот план предполагает, что [FROM.GetAdjective]ое правительство возьмёт на себя ответственность за защиту наших владений в Леванте. [FROM.GetLeader] утверждает, что географическая близость государства [FROM.GetNameDef] упрощает защиту этих территорий и управление ими и что, если сдать эти территории государству [FROM.GetNameDef], освободившиеся ресурсы можно направить куда-нибудь ещё.\n\nЭто предложение не лишено логики, но мы поставлены... в интересное положение. Мы захватили Палестину, Иорданию и Синай у побеждённой Османской империи. Готовы ли мы отдать их её [FROM.GetAdjective]им наследникам? Впрочем, безотносительно исторических фактов, стоит подумать, как отреагирует [FROM.GetAdjective]ое правительство на наш отказ, который могут принять за знак нашего недоверия или и вовсе решить, что мы не ценим их место в этом альянсе. Государство [FROM.GetNameDefCap] уже демонстрировало в прошлом свою непредсказуемость, и мы, к сожалению, не можем быть уверены, что [FROM.GetAdjective]ие власти в случае отказа не пойдут на принцип."
 bftb_turkey.45.desc: "[FROM.GetAdjective]ие колониальные офицеры уже оставляют свои посты и переезжают в соседние протектораты, чтобы помочь провести плавную передачу бывших [FROM.GetAdjective]их колоний. [FROM.GetLeader] написал письмо нашему президенту, объясняя, что [ROOT.GetNameDef] пользуется полным доверием государства [FROM.GetNameDef] касательно нашей способности защищать отданные нам провинции и управлять ими.\n\nМногие [ROOT.GetAdjective]ие граждане считают передачу территорий большой победой и подтверждением того, что держава [ROOT.GetNameDef] снова сильна и уважаема во всём мире."
 bftb_turkey.46.desc: "[FROM.GetLeader], премьер-министр государства [FROM.GetNameDef], заявил, что сама мысль о сдаче [FROM.GetAdjective]их территорий в Леванте государству [ROOT.GetNameDef] недопустима и что в регионе следует оставить [FROM.GetAdjective]ое управление. [FROM.GetAdjective]ие войска в Леванте были приведены в полную боевую готовность на случай [ROOT.GetAdjective]ого вторжения в регион.\n\nМногие из наших правительственных чиновников выразили своё разочарование [FROM.GetAdjective]им решением, заявив, что это доказательство [FROM.GetAdjective]ого недоверия к нам как к союзникам. [ROOT.GetLeader] также высказал своё недовольство [FROM.GetAdjective]им решением и попросил у советников рекомендаций по ответным мерам."
 bftb_turkey.47.desc: "[FROM.GetLeader], президент государства [FROM.GetNameDef], связался с нами и выразил обеспокоенность безопасностью наших колоний в заливах Аравии. [FROM.GetAdjective]ий лидер предложил: пусть [FROM.GetNameDef] возьмёт ответственность за оборону и управление всем регионом. Это оправдано как самой историей государства [FROM.GetNameDef], так и его близостью к области.\n\nЧасть [ROOT.GetAdjective]их представителей выразили обеспокоенность предложением, ведь государство [FROM.GetNameDef] совсем недавно просило передать ему контроль над Левантским регионом. Аналитики обеспокоены тем, что эти дипломатические захваты территории стратегически спланированы государством [FROM.GetNameDef] так, чтобы утвердить новый статус-кво для региона, где неоспоримо влияние державы [FROM.GetNameDef], на весь субконтинент. Вне зависимости от будущих проблем государство [FROM.GetNameDef] всё же остаётся нашим союзником, и если мы хотим, чтобы это продолжалось и дальше, разумно будет уступить его просьбам о контроле над нашими аравийскими колониями."
 bftb_turkey.50.desc: "Представители государства [FROM.GetNameDef] изъявили желание купить у нас лёгкие танки. Выразив трепет перед тем, что они называют «[ROOT.GetAdjective]им гением» и «безупречным проектированием», [FROM.GetAdjective]ие представители сообщили, что государство [FROM.GetNameDef] попросту не может защищать свой суверенитет без [ROOT.GetAdjective]ой бронетехники."
 bftb_turkey.54.desc: "[FROM.GetAdjective]ое правительство отказалось отправлять нам даже шасси своей самой старой модели. Как видно, [FROM.GetAdjective]ая бронетехника предназначена только для [FROM.GetAdjective]ой армии, и верхушка государства [FROM.GetNameDef] ссылается на вопросы национальной безопасности как на повод не давать нам танки."
 bftb_turkey.58.desc: "[FROM.GetAdjective]ое правительство согласилось на все наши требования в обмен на нашу помощь. Хром уже начал поступать в наши порты в регионе [343.GetName], и, что более важно, мы научились новым методам добычи нефти на востоке государства [FROM.GetName]."
 bftb_turkey.60.desc: "[FROM.GetLeader] написал резкое письмо, в котором потребовал, чтобы турецкому населению сирийской провинции Хатай дали исполнить их демократическое право на референдум и возможность решить, хотят ли они присоединиться к государству [FROM.GetNameDef] или бессрочно оставаться в составе державы [ROOT.GetNameDef]. Наши вооруженные силы обнаружили незаконную деятельность на [ROOT.GetAdjective]о-[FROM.GetAdjective]ой границе: [FROM.GetAdjective]ие граждане проникают на территорию государства и провоцируют беспорядки в провинции Хатай. Очевидно, что [FROM.GetNameDef] планирует подтасовать результаты референдума так, чтобы обеспечить [FROM.GetAdjective]ую победу, но, возможно, умнее всего будет просто отдать провинцию Хатай государству [FROM.GetNameDef]. Враждебно настроенная армия государства [FROM.GetNameDef] у наших границ — не лучшее развитие событий."
 bftb_turkey.61.desc: "[ROOT.GetLeader] произнёс небольшую речь в Антакье, заявив, что [ROOT.GetNameDef] с радостью принимает жителей Хатая в свой состав, и с благодарностью отметив, что [FROM.GetLeader], лидер государства [FROM.GetNameDef], уважает демократическую волю хатайского народа. Хотя сирийские официальные лица встретили это заявление с яростью, объединение Хатая и державы [ROOT.GetNameDef] было радостным, и многие [ROOT.GetAdjective]ие граждане отправились из своих домов в примкнувший регион, чтобы поздравить новоявленных земляков с присоединением к державе [ROOT.GetNameDef] и обменяться подарками. [FROM.GetLeader] никак не прокомментировал случившееся, но источники, близкие к [FROM.GetAdjective]ому лидеру, говорят, что [FROM.GetAdjective]ий народ верит: это лишь временно, и так или иначе Хатай в будущем вернётся к ним."
 bftb_turkey.63.desc: "[FROM.GetLeader] и [ROOT.GetLeader] провели встречу, чтобы обсудить всеобъемлющий средиземноморский союз, участники которого разделяют позицию по кризисам с военным вторжением. Есть мнение, что если [FROM.GetNameDef] добровольно свяжет себя с нами союзом, это придаст больше легитимности нашим региональным целям, даже если придётся отказаться от поддержки более крупных держав. Стоит также учитывать, что, в отличие от нас, [FROM.GetNameDef] положительно оценивается народностями Балкан и Средиземноморья. Возможно, это государство сможет конвертировать репутацию в дипломатическую победу, заручившись поддержкой стран, которые в противном случае не стали бы иметь с нами дела.\n\nМы находимся на распутье: то ли нам принять предложение мира от государства [FROM.GetNameDef] и с помощью их пера заточить свой меч для борьбы с другими великими державами; то ли связаться с презренными тевтонами и скосить под корень, словно сорняки в саду, все слабые государства, что взывают к нам? Мы и только мы можем решить судьбы балканских наций — мы либо спасём их от [GER.GetAdjective]ой и [SOV.GetAdjective]ой гегемонии, либо поможем захватчикам и ускорим падение наших соседей. Выбор за нами."
 bftb_turkey.66.t: "[FROM.GetNameDefCap] предлагает план по разделению государства [GRE.GetNameDef]"
 bftb_turkey.66.desc: "[FROM.GetNameDefCap] предлагает, признавая всю прискорбность такого положения дел, уничтожить регионы государства [GRE.GetNameDef] ради национальной безопасности. Наши представители искренне и всецело согласны с мнением наших [FROM.GetAdjective]их союзников и напоминают им, что именно такова и была наша официальная позиция с самого начала.\n\n[FROM.GetNameDefCap] предлагает разделить державу [GRE.GetNameDef] по географическому признаку: мы получим регионы [185.GetName], [186.GetName] и [182.GetName], что закрепит наше доминирование над Восточным Средиземноморьем и Ионическим морем. [FROM.GetNameDefCap] возьмёт себе оставшиеся [GRE.GetAdjective]ие регионы, что гарантирует [FROM.GetAdjective]ий контроль над Эгейским морем, с которым и так уже граничат многие территории державы.\n\nСоглашение составлено по большей части справедливо — справедливее, чем в принципе можно ожидать для такой ситуации. И всё же мы давно мечтали сделать город [47.Capital.GetName] жемчужиной нашей империи, а такой план определённо заставит нас отказаться от этой мечты на обозримое будущее. Готовы ли мы расстаться с планами на город [47.Capital.GetName] ради мира в Средиземноморье?"
 bftb_turkey.67.desc: "Прибыли шокирующие новости из региона [676.GetName]: бывший премьер-министр Рашид Али аль-Гаялани попытался свергнуть правительство, которое возглавляет [ROOT.GetLeader]. Аль-Гаялани поддерживает большая часть армии и даже отчасти народ.\n\nПрактически нет сомнений, что ключевую роль в организации переворота и снабжении оружием предателей из Золотого квадрата сыграло иностранное вмешательство. Считается, что из всех потенциально вовлечённых в переворот государственных деятелей самую важную роль в поддержке фашистского переворота сыграл [FROM.GetNameDef].\n\nЗолотой квадрат твёрдо стоит на позиции насильственного удаления [ENG.GetAdjective]их империалистов с помощью государства [GER.GetNameDef], и многие в народе находят такую позицию весьма похвальной. Возможно, только с фашизмом мы образуем свободную Аравию..."
 bftb_turkey.75.desc: "Поступили шокирующие новости из государства [IRQ.GetNameDef]: [ROOT.GetAdjective]их представителей, управляющих нефтяными запасами страны, отвели к [IRQ.GetAdjective]ой границе под вооружённой охраной и выгнали насильно! Не менее тревожны и слухи о том, что новое [IRQ.GetAdjective]ое правительство планирует пригласить на наши территории [GER.GetAdjective]ую армию.\n\nБолее того, разведка предполагает, что за всем этим стоит [FROM.GetNameDef] в рамках помощи союзу [GER.GetFactionName]! Нам надо решить, как теперь поступить: [IRQ.GetAdjective]ие представители могут занять более нейтральное положение, если мы примем их решение по захвату нефти, но можем ли мы позволить себе отдать эту нефть в [GER.GetAdjective]ие руки?"
 bftb_turkey.93.a: "Простого «нет» было бы достаточно…"
 bftb_turkey.131.t: "[FROM.GetNameDefCap] соглашается на разделение государства [GRE.GetNameDef]"
 bftb_turkey.131.desc: "[FROM.GetNameDef] и мы пришли к соглашению о разделении территорий государства [GRE.GetNameDef]. [FROM.GetNameDefCap] получит регионы на границе с Восточным Средиземноморьем и Ионическим морем, а нам достанутся дальние [GRE.GetAdjective]ие регионы, с которыми мы делим побережье Эгейского моря. Печально, но [GRE.GetNameDef] не оставляет нам иного выбора."
 BUL_popular_suspicions_about_death_basic: "Однако точная причина смерти до сих пор не выяснена. Ходят слухи, что Борис был отравлен на последней встрече, — многие считают, что за убийством стоит [GER.GetLeader]. Есть те, кто убежден, что царя отравил НКВД. Кто-то говорит, что ответственность несёт [ENG.GetNameDef], а кто-то, что особенно неприятно, имеет наглость винить в смерти царя [BUL.GetAdjective]ое правительство…"
 BUL_popular_suspicions_about_death_assassinated: "Управление национальной безопасности приступило к расследованию цареубийства. Официальные рапорты, согласно которым у преступника при себе были болгарские, немецкие и английские документы, лишь усложняют дело и дают пищу для необоснованных слухов. Большинство болгар считает, что всему виной [GER.GetLeader], НКВД или [ENG.GetAdjective]ая держава, но есть и наглецы, утверждающие, что к смерти царя приложило руку само правительство…"
 bftb_bulgaria_imro.1.a: "Мы вернулись в начало 1930-х годов…"
 bftb_bulgaria_imro.2.a: "Пора вновь разобраться с ВМРО…"
 bftb_bulgaria_fatherland_front.2.desc_has_bzns_support: ". \nС мест докладывают, что поддержка аграриев в сельских регионах Мезии сыграла в перевороте решающую роль"
 bftb_bulgaria_rearmament.2.a: "Мы должны найти другие методы убеждения…"
 bftb_bulgaria_nationalization.1.desc_regency_council: "Богдар Филов и [BUL.GetLeader]"
 bftb_bulgaria_nationalization.1.a: "Сейчас мы ничего не можем поделать…"
 bftb_bulgaria_nationalization.1.c: "Отправим к ним дипломатов… на танках!"
 bftb_bulgaria_nationalization.2.a: "Как трагично…"
 bftb_bulgarian_claims.1.desc: "К нашему правительству обратилась делегация государства [BUL.GetNameDef] с просьбой [ROOT.GetAdjective]ой поддержки их претензий на Балканах. Они предлагают тайно собраться и обсудить грядущую [BUL.GetAdjective]ую экспансию в этом регионе. Взамен [BUL.GetAdjective]ая держава и [ROOT.GetNameDef] станут союзниками, а страна вступит в альянс [ROOT.GetFactionName]."
 bftb_bulgarian_claims.9.a: "Ну, может, позже…"
 bftb_bulgaria_german_influence.6.t: "[BUL.GetLeader] соглашается заменить Кёсеиванова"
 bftb_bulgaria_scw_volunteers.1.desc_republicans_defeated: "оплакивая ужасающую потерю, с которой ещё долго не сможет смириться [FROM.GetNameDef] — государство, склонившееся перед фашистской тиранией… \nКак бы то ни было, среди"
 bftb_bulgaria_scw_volunteers.1.b: "Они защищали свободу как могли…"
 bftb_bulgaria_scw_volunteers.1.desc_nationalists_defeated: ", раздавленные страшным поражением, с которым ещё долго не сможет смириться [FROM.GetNameDef] — государство, отныне полностью захваченное красными… \nКак бы то ни было, наши"
 bftb_bulgaria_scw_volunteers.2.b: "Испания — это просто разминка…"
 bftb_bulgaria_soviet_influence.3.a: "Пора искать новых союзников…"
 bftb_bulgaria_soviet_influence.6.a: "Этим решением [FROM.GetNameDef] обрекает себя на незавидную участь…"
 bftb_bulgaria_balkan_federation.2.a: "Амбициозный проект…"
 bftb_bulgaria_balkan_federation.3.a: "Какая дерзость со стороны Болгарии…"
 bftb_bulgaria_balkan_federation.5.desc: "[BUL.GetAdjective]ое правительство предлагает нам заняться созданием единого правительства объединённых Балкан для развития сотрудничества и взаимопонимания балканских народов. [BUL.GetLeader] утверждает, что это — последний большой шаг для Балканской федерации, который позволит отринуть прежние распри и навсегда закрепить единство и мир между нашими народами. \n[BUL.GetNameDef] ожидает ответа [ROOT.GetAdjective]ого правительства, чтобы приступить к окончательному объединению наших народов."
 bftb_bulgaria_balkan_federation.12.a: "Ради сохранения мира мы готовы удовлетворить их требования…"
 bftb_bulgaria_balkan_federation.15.b: "Разберёмся с [ITA.GetAdjective]ими захватчиками позже…"
 bftb_bulgaria_balkan_federation.16.a: "Мы должны предотвратить новую войну на Балканах любой ценой…"
 bftb_bulgaria_fate_of_the_balkans.3.a: "Судя по всему, [FROM.GetLeader] — попросту тупица…"
 bftb_bulgaria_fate_of_the_balkans.4.a: "Мы не в том положении, чтобы отказываться…"
 bftb_bulgaria_fate_of_the_balkans.6.a: "[FROM.GetLeader] не может мыслить здраво…"
 bftb_bulgaria_fate_of_the_balkans.7.a: "Мы не в том положении, чтобы отказываться…"
 bftb_bulgaria_fate_of_the_balkans.10.b: "Жалкий выбор жалкого лидера…"
 bftb_bulgaria_political_leaders.1.b: "Нам нужен сторонник более радикальных взглядов… Назначим Александра Цанкова!"
 bftb_bulgaria_british_influence.1.desc: "Болгарский премьер-министр [BUL.GetLeader] прибыл к нам с целью заключить соглашение с государством [ENG.GetNameDef] и юридически оформить обещание защитить болгарские земли. \nКак заявляет [BUL.GetLeader], его партия желает упрочить связи с [ENG.GetAdjective]им правительством, но опасается за территориальную целостность государства [BUL.GetNameDef] в случае отказа от сотрудничества с другими великими державами, чьи амбиции угрожают Балканам. В частности, речь идёт о [GER.GetAdjective]ой, [ITA.GetAdjective]ой и [SOV.GetAdjective]ой нациях."
 bftb_bulgaria_british_influence.4.desc: "[FROM.GetAdjective]ое правительство не выказало интереса в усилении связей между нашими странами и отмело наше предложение оформить соглашение о поддержке независимости государства [BUL.GetNameDef] и развитии сотрудничества между нами."
 bftb_bulgaria_democratic_international_policies.4.desc: "К нам прибыли представители государства [BUL.GetNameDef]. Они надеются, что [ROOT.GetLeader] признает легитимность [BUL.GetAdjective]ого правительства на бывших болгарских территориях, оккупированных войсками Союзников, и, следовательно, передаст административный контроль над регионом государству [BUL.GetNameDef]."
 bftb_news.1.desc: "Этим утром [BUL.GetAdjective]ий лидер [BUL.GetLeader] выступил с официальным заявлением, в котором публично осудил действия Внутренней македонской революционной организации. \n[BUL.GetAdjective]ий министр внутренних дел также сообщил о вступлении в силу пакета чрезвычайных мер, которые позволят правительству выделить дополнительные ресурсы на борьбу с ВМРО, чтобы раз и навсегда покончить с этой террористической организацией. \nЭто заявление демонстрирует, что [BUL.GetAdjective]ое правительство стремится искоренить один из главных источников конфликта и напряжённости на Балканах…"
 bftb_news.1.c: "Похоже, дни ВМРО сочтены…"
 bftb_news.2.desc: "Этим утром [BUL.GetAdjective]ий лидер [BUL.GetLeader] открыто заявил, что правительство начнет переговоры с Иваном Михайловым, одним из руководителей Внутренней македонской революционной организации, о прекращении вооружённых столкновений между ВМРО и [BUL.GetAdjective]ми властями. По словам министра внутренних дел, государство [BUL.GetNameDef] должно сотрудничать с этой организацией, чтобы освободить многочисленных македонцев, проживающих в державах [YUG.GetNameDef] и [GRE.GetNameDef]. Это сильное заявление, и оно, несомненно, подольёт масла в огонь балканского конфликта и увеличит напряжённость между великими державами, у которых есть интересы в этом регионе…"
 bftb_news.2.c: "Похоже, конфликт на Балканах скоро вспыхнет с новой силой…"
 bftb_news.3.a: "Теперь он покоится с миром… чего не скажешь о стране!"
 bftb_news.4.c: "Неожиданный поворот событий…"
 bftb_news.5.c: "Смелый ход со стороны болгар…"
 bftb_news.7.b: "Похоже, [BUL.GetLeader] пребывает во власти иллюзий о собственном величии…"
 bftb_news.9.c: "Очередная попытка объединить Балканы, обречённая на неудачу…"
 bftb_news.10.desc: "Бывшее правительство государства [BUL.GetOldNameDef] объявило том, что отныне их страна называется [BUL.GetNameDef]. Так они намереваются совершить следующий шаг после создания альянса [BUL.GetFactionName] и предложить своим союзникам объединиться под властью одного централизованного правительства. \nКак заявляет [BUL.GetLeader], [BUL.GetNameDef] стремится достичь полного сотрудничества между балканскими странами, забыть о конфликтах прошлого и укрепить единство балканских народов."
 bftb_news.12.c: "Похоже, болгары отчаянно ищут новых друзей…"
 bftb_news.12.d: "Они заключили сделку с дьяволом…"
 bftb_news.14.desc: "В качестве первого шага по восстановлению отношений между государством [BUL.GetNameDef] и его балканскими соседями [BUL.GetAdjective]ое правительство подписало договор о дружбе с державой [YUG.GetNameDef], по которому обе страны закрепили свое стремление развивать дружеские отношения и способствовать экономическому взаимодействию. \nНекоторые заявляют, что истинные намерения [BUL.GetAdjective]ого правительства не ограничиваются дружескими отношениями с соседями — в действительности они стремятся создать Балканскую федерацию, способную противостоять великим европейским державам. \nНо пока подобные заявления являются лишь простыми предположениями…"
 bftb_news.16.desc: "\n[BUL.GetAdjective]ое правительство в поисках поддержки со стороны великих держав, способных обеспечить независимость и территориальную целостность государства [BUL.GetNameDef], отправило делегацию в государство [ENG.GetNameDef], чтобы договориться о подписании соглашения с [ENG.GetAdjective]им правительством. \nПомимо пунктов, посвященных военным вопросам, этот договор включает в себя экономическое соглашение, предоставляющее [ENG.GetAdjective]им капиталистам налоговые послабления на территории государства [BUL.GetNameDef]."
 bftb_news.202.e: "Это доказывает слабость государства [TUR.GetNameDef]..."
 bftb_news.207.t: "[TUR.GetNameDefCap] соглашается на охрану Балкан"
 bftb_news.207.desc: "Сегодня [TUR.GetLeader] объявил всему миру, что [TUR.GetNameDef] намеревается расширить балканоцентричную внешнюю политику и гарантировать независимость всех союзных народов. Международные наблюдатели поняли, что [TUR.GetNameDef] занимает более решительную позицию и планирует свести отношения с крупными державами к минимуму, чтобы сосредоточиться на безопасности в регионе. \n\nХотя одни приходят в восторг от [TUR.GetAdjective]ого решения, другие видят в нём источник серьёзных проблем. В частности, [ITA.GetAdjective]ие власти заметно встревожились и принялись умолять [TUR.GetAdjective]ое правительство отказаться от этого гибельного курса, который не приведёт ни к чему, кроме конфликтов в регионе. В ответ [TUR.GetAdjective]ое правительство заявило, что [ITA.GetNameDef] — их оппоненты в регионе."
 bftb_news.209.desc: "Турецкие завоевания дошли до той точки, когда турецкие власти сочли уместным объявить о переименовании страны: теперь она называется [TUR.GetNameDef]. Дебют этой новой империи многих поверг в шок, ведь лишь немногие из сторонних наблюдателей верили, что Турция в ближайшие десятилетия сможет хотя бы оправиться от Войны за независимость, не говоря уже о создании новой империи, раскинувшейся на несколько континентов. \n\nСогласно докладам, молодое [TUR.GetAdjective]ое государство еще не закончило с экспансией, и [TUR.GetLeader] заявляет, что завоевания продолжатся, пока все турки мира не обретут свободу. Мир может лишь следить за этим, затаив дыхание."
 TUR_civil_war_tt: "§RЧистка наших вооруженных сил от кемалистов приведет к гражданской войне. Прочность нашей начальной позиции будет зависеть от того, насколько сильны исламисты в центральных регионах и провели ли мы реформу армии. Когда этот фокус будет выполнен, Курдистан отколется и станет сражаться за свою свободу, если на момент завершения фокуса уровень стабильности будет ниже 60%.§!"
 TUR_restack_the_officer_corps_desc: "Офицерский корпус поддерживает ключевые ценности Турции, но эти ценности… изменились. Если офицеры не хотят символизировать собой текущие ценности идеологии кемализма, мы их к этому принудим."
 TUR_reclaim_macedonia_desc: "Неблагодарные псы, живущие к западу от нас, сыграли важную роль в падении последней Османской империи. Греки ненавидели нас с тех самых пор, как мы разобрали их жалкую и немощную империю на части, и теперь они удерживают у себя, отняв у нас, большую часть Фракии и Македонии. Пора спасти наших товарищей, заодно отомстив врагам…"
 TUR_reinstate_the_darulfununu_sahane_desc: "Мы признаём, что многие наши институты и технологии… несколько устарели. Мы же меж тем живём в эпоху современной войны. Хорошо, что наша промышленность и модернизация нашей страны находится на нынешнем уровне — спасибо за это упорному труду османской бюрократии! Мы создадим в Стамбульском университете школу, которая будет поощрять технологическое и научное сотрудничество с нациями, сходными с нашей по духу."
 TUR_imperial_factories_desc: "У кемалистов была интересная идея так называемого этатизма, и, хоть мы никогда бы не стали открыто поддерживать идеологический столп кемалистов, нельзя не признать, что централизованная организация и государственный контроль средств производства могут быть… полезными. Не стоит сравнивать это с коммунизмом или фашизмом — все заводы будут принадлежать султану. Мы лишь будем управлять ими от его имени!"
 TUR_continue_to_prioritise_balkan_integrity_desc: "В наших интересах всегда было сохранение мира на Балканах. Следует признать: мы чувствуем определенную ответственность за защиту соседей и помощь им, особенно если учитывать наше… печальное совместное прошлое. Те времена прошли — мы придем к ним не как завоеватели, но как верные друзья, которые хотят защитить более слабых соседей от новых врагов."
 TUR_american_motor_factories_desc: "Большая часть нашей тяжелой промышленности, связанной с производством машин, зависит от сотрудничества с американцами. Мы обычно не отличались сговорчивостью в том, что касается международных инвестиций, но если ослабить наши нормы ради американских друзей… Кто знает, что тогда будет?"
 TUR_taking_over_defense_of_the_gulf_desc: "Мы можем немного облегчить жизнь нашим [ENG.GetAdjective]им союзникам, предложив им охранять их ближневосточные владения. Они, скорее всего, примут наше предложение, учитывая весь наш вклад в дело войны… и тот факт, что они все равно не смогли бы помешать нам просто захватить эти территории."
 TUR_lift_the_turkiye_komunist_partisis_exile_desc: "Многие члены Турецкой коммунистической партии до сих пор пребывают в изгнании на землях государства [SOV.GetNameDef] или скрываются в тайных европейских ячейках. Возможно, мы не во всём согласны с ТКП, но остаемся их товарищами по классовой борьбе. Пора им вернуться домой."
 BUL_nationalization_desc: "Иностранный капитал позволил нам возводить новые промышленные комплексы в Болгарии с размахом, невиданным прежде на Балканах. Но магнаты, владеющие ими, все сильнее присасываются к нашей экономике, и потому пора нам лишить их средств производства и изгнать из страны. Стоит, правда, учитывать, что такая мера разозлит зарубежные правительства и, если дипломатия подведет, нам придется отстаивать свое решение в бою…"
 BUL_utmost_optimization_tt: "Эффекты изменятся, если завершить фокус §YПривлечь иностранный капитал§!."
 BUL_modern_tactics_desc: "Чтобы современный флот мог действовать наиболее эффективно, нужна современная тактика. Но мы не должны полагаться при столкновении с мощными вражескими армиями только на наш флот, ведь одна из главных слабостей кораблей — их уязвимость к атакам авиации…"
 BUL_full_voting_rights_for_women_desc: "Если мы хотим, чтобы в стране царили свобода, равенство и прогресс, нужно предоставить полное избирательное право женщинам и поддержать Болгарский женский союз в его попытках повысить социальную осведомленность о проблемах женщин государства [ROOT.GetNameDef]."
 BUL_soviet_bulgarian_treaty_of_mutual_assistance_desc: "[SOU.GetNameDef] — влиятельный союзник, который может ускорить развитие нашей экономики и обеспечить территориальную целостность государства [ROOT.GetNameDef] в это непростое время. Мы должны попробовать укрепить связи с [SOU.GetAdjective]им правительством и получить его поддержку, чтобы выстоять против окружающих нас многочисленных врагов."
 BUL_soviet_military_exercises_desc: "Наши вооружённые силы должны учиться у умелой и дисциплинированной Красной армии. Мы должны пригласить военных советников из государства [SOV.GetNameDef], чтобы они помогли разработать в державе [ROOT.GetNameDef] программу военного обучения, основанную на советской."
 BUL_treaty_of_perpetual_friendship_desc: "В качестве первого шага в развитии хороших отношений с нашими балканскими соседями мы должны обратиться к югославскому правительству и предложить ему договор об основах сотрудничества между нашими странами. По этому договору [ROOT.GetNameDef] наконец-то откажется от притязаний на свои исконные земли в составе государства [YUG.GetNameDef]."
 BUL_legalize_the_agrarian_party_desc: "Экономические идеи болгарского Аграрного национального союза могут отличаться от наших, но если отбросить мелочи, то его члены легко вольются в нашу политику. Поэтому мы должны продолжать легализацию этой организации и стремиться к сотрудничеству между нашими партиями, ведь, если мы хотим установить в Болгарии подлинную демократию, нам понадобится вся доступная поддержка…"
 BUL_the_salonika_agreement_desc: "Очевидно, что Болгария сама по себе не представляет угрозы странам, создавшим Балканскую Антанту для совместной борьбы с нашим государством, поэтому нужно восстановить дружеские отношения с соседями. И кто может быть лучшим кандидатом на заключение договора, если не [GRE.GetLeader], лидер государства [GRE.GetNameDef]?"
 BUL_join_the_allies_desc: "Мы должны официально оформить своё стремление присоединиться к альянсу [ENG.GetFactionName] и отправить прошение [ENG.GetAdjective]ому правительству о включении в альянс государства [ROOT.GetNameDef]."
 BUL_crush_the_communists_desc: "Несмотря на многократные репрессии в этом веке, коммунисты до сих пор рыщут где-то в тенях, пополняя свои ряды за счет изгоев и презренных. Наш долг — покончить с ними раз и навсегда любыми средствами…"
 BUL_the_fate_of_the_balkans_desc: "Болгария слишком долго зависела от воли соседей и союзных им великих европейских держав… Но времена меняются: наша страна стала мощнее всех на Балканах. Болгария достаточно сильна, чтобы наконец-то заявить о своём превосходстве и покорить своих жалких соседей."
 BUL_potential_civil_war_low_requirement_tt: "§RЕсли§! по выполнении этого фокуса §Yуровень стабильности§! §Rниже§! §R30%§!, §Rначнется гражданская война!§!"
 BUL_balkan_federation_of_socialist_republics_faction_tt: "Получает событие §Y«Болгария приглашает нас в Балканскую федерацию социалистических республик»§!."
 BUL_has_abolished_monarchy_tt: "Отказ от болгарской монархии"
 BUL_bulgarian_administration_of_the_balkans_cores_tt: "§Y[106.GetName]§!, §Y[803.GetName]§! и §Y[77.GetName]§! становятся национальными территориями, если их контролирует государство [ROOT.GetNameDef].\nТекущие эффекты:"
 BUL_nationalist_propaganda_combo_tt: "Если национальный дух §YСудьба Балкан§! ещё активен после завершения этого фокуса:\n- Увеличивает длительность §YСудьбы Балкан§! (§Y+365§! дней).\n- Получает улучшенную версию национального духа §YПропаганда националистов§!."
 BUL_guardians_of_the_balkans_remove_ns_tt: "По завершении этого фокуса национальный дух §YСудьба Балкан§! будет убран, если он ещё активен."
 BUL_the_return_of_ferdinand_opinion_tt: "Получает модификатор §YСтарые враги§! (мнение о государствах [GRE.GetFlag]§Y[GRE.GetNameDef]§!, [ROM.GetFlag]§Y[ROM.GetNameDef]§!, [YUG.GetFlag]§Y[YUG.GetNameDef]§!, [TUR.GetFlag]§Y[TUR.GetNameDef]§! §R-25§!"
 BUL_carry_the_revolution_abroad_comintern_invitation_tt: "Независимые коммунистические балканские страны получат событие, приглашающее их присоединиться к альянсу государства [ROOT.GetFlag]§Y[ROOT.GetName]§!"
 BUL_support_macedonian_organizations_rearmament_tt: "\n§RЗавершение этого фокуса приведет к дестабилизации Балкан, после чего§! §Y[ROOT.GetNameWithFlag]§! §Rбольше не сможет использовать решение о перевооружении§! §YПродемонстрировать свою мирную политику§!."
 BUL_land_reorganization_tt: "Добавлены §Y2§! ячейки для строительства во всех национальных регионах под полным контролем государства [ROOT.GetFlag][ROOT.GetNameDef]:"
 BUL_a_balkan_confederation_faction_tt: "Начнется событие §Y«[BUL.GetNameDef] приглашает нас в альянс [GetDemocraticBalkanConfederationName]»§!."
 BUL_assert_our_claims_historical_claims_tt: "Делает национальными все исторические земли, контролируемые государством §Y[BUL.GetNameWithFlag]§!.\nИсторические земли: §Y[106.GetName]§!, §Y[803.GetName]§!, §Y[77.GetName]§!, §Y[184.GetName]§!, §Y[731.GetName]§!."
 BUL_historical_states_tt: "\nИсторические земли: §Y[106.GetName]§!, §Y[803.GetName]§!, §Y[77.GetName]§!, §Y[184.GetName]§!, §Y[731.GetName]§!."
 BUL_condemn_macedonian_organizations_rearmament_tt: "\nПри завершении этого фокуса государство §Y[ENG.GetNameWithFlag]§! будет более склонно снять ограничения с болгарской армии через решение §YПереговоры по болгарскому перевооружению§!."
 GRE_political_instability_dummy_desc: "\n\nС 1924 по 1935 год у нас было двадцать три смены правительства, тринадцать переворотов и диктатура! Народ достаточно натерпелся и уже готов к какой-то стабильности в правительстве, но вместе с тем не особенно надеется, что какое-либо из правительств продержится долго. Мы должны доказать, что это не так, и положить конец постоянным распрям, чтобы усмирить наших политических противников."
 TUR_sectarian_woes_desc: "§WВнутреннее разделение государства [TUR.GetNameDefCap] географически представлено при помощи§! §Yкоэффициентов регионов§!§W: §! £faction_tur_kemalist §Yкемалистов§! §Wможно найти в западных и северных частях страны, религиозных§! £faction_tur_traditionalist §Yтрадиционалистов§! §W— в центральных регионах и на юге, а§! £faction_tur_kurdish §Yкурдов§! §W— на юго-востоке страны.§! \n\n§WВзаимодействия с различными§! §Yдвижениями§! §Wдоступны во вкладке§! §Yрешений§!§W, а также в виде§! §Yэффектов от фокусов§! §Wи§! §Yвариантов ответа в событиях§!§W.§! \n\nТурцию одолевают внутренние разногласия, возникающие на идеологической, религиозной и этнической почвах. Кемалисты надеются превратить Турцию в светское государство, но среди населения велика доля тех, кто настроен решительно против самой концепции секуляризма. На востоке курдский народ доставил турецкому правительству немало проблем и, похоже, готов бунтовать против ассимиляции. Чтобы уладить разногласия в государстве, нужно решать их либо ласковой рукой, либо железным кулаком."
 TUR_sectarian_woes_1_desc: "§WВнутреннее разделение государства [TUR.GetNameDefCap] географически представлено при помощи§! §Yкоэффициентов регионов§!§W: §! £faction_tur_kemalist §Yкемалистов§! §Wможно найти в западных и северных частях страны, религиозных§! £faction_tur_traditionalist §Yтрадиционалистов§! §W— в центральных регионах и на юге, а§! £faction_tur_kurdish §Yкурдов§! §W— на юго-востоке страны.§! \n\n§WВзаимодействия с различными§! §Yдвижениями§! §Wдоступны во вкладке§! §Yрешений§!§W, а также в виде§! §Yэффектов от фокусов§! §Wи§! §Yвариантов ответа в событиях§!§W.§! \n\nТурцию одолевают внутренние разногласия, возникающие на идеологической, религиозной и этнической почвах. Кемалисты надеются превратить Турцию в светское государство, но среди населения велика доля тех, кто настроен решительно против самой концепции секуляризма. Чтобы уладить разногласия в государстве, нужно решать их либо ласковой рукой, либо железным кулаком."
 TUR_sectarian_woes_desc_2: "§WВнутреннее разделение государства [TUR.GetNameDefCap] географически представлено при помощи§! §Yкоэффициентов регионов§!§W: §! £faction_tur_kemalist §Yкемалистов§! §Wможно найти в западных и северных частях страны, религиозных§! £faction_tur_traditionalist §Yтрадиционалистов§! §W— в центральных регионах и на юге, а§! £faction_tur_kurdish §Yкурдов§! §W— на юго-востоке страны.§! \n\n§WВзаимодействия с различными§! §Yдвижениями§! §Wдоступны во вкладке§! §Yрешений§!§W, а также в виде§! §Yэффектов от фокусов§! §Wи§! §Yвариантов ответа в событиях§!§W.§! \n\nТурцию одолевают внутренние разногласия, возникающие на идеологической, религиозной и этнической почвах. На востоке курдский народ доставил турецкому правительству немало проблем и, похоже, готов бунтовать против ассимиляции. Чтобы уладить разногласия в государстве, нужно решать их либо ласковой рукой, либо железным кулаком."
 TUR_economic_collapse_desc: "Мы разорены. Этатизм избавил нас от боли Великой депрессии, но избегать экономическую катастрофу вечно у нас не вышло. Мы подвели свою страну, свой народ, свою идеологию и навсегда запятнали наследие самого Ататюрка…"
 TUR_reappropriated_exploitative_finance_desc: "Мы пустим богатства иностранных узурпаторов и наших собственных презренных паразитов-капиталистов на строительство общества, которое будет отвечать интересам рабочего класса государства [TUR.GetNameDef]."
 TUR_legacy_of_ataturk_defiled_desc: "Мы подвели его: разве мог бы Отец Турков смотреть на нынешнее положение государства [ROOT.GetNameDef] и не испытывать презрения? Нам остается лишь надеяться, что его идеи о будущем страны были ошибочными, а наши нет..."
 TUR_republicanism: "Республика"
 BUL_second_national_catastrophe_desc: "После нашего поражения в Великой войне Нейиский договор заставил нас уступить обширные территории Югославии, Греции и Румынии; до недавнего времени Лига Наций требовала от нас в первую очередь выплачивать крупные суммы в счёт репараций, что ухудшало экономику и неизбежно повышало долг страны. Дух нации так полностью и не оправился от такого удара, и неудивительно, что в Болгарии этот договор известен как Вторая национальная катастрофа…"
 BUL_second_national_catastrophe_tt: "Будет удалено после восстановления Великой Болгарии:\nПолный контроль над §YСофией§!, §YПловдивом§!, §YМезией§!, §YБургасом§!, §YЮжной Сербией§!, §YМакедонией§!, §YЦентральной Македонией§!, §YФракией§! и §YДобруджей§!."
 BUL_ferdinands_puppet_desc: "[ROOT.GetNameDef] находится в подчинении у Фердинанда I, царя государства [BUL.GetNameDef], который обладает значительным влиянием на [ROOT.GetAdjective]ое правительство и держит в своих руках политику, экономику и промышленность страны."
 BUL_the_bulgarian_threat_desc: "[BUL.GetNameDef] своими амбициями на Балканах несёт значительную угрозу целостности государства [ROOT.GetNameDef] и свободе [ROOT.GetAdjective]ого народа."
 BUL_national_industrial_concern_upgrade_tt: "\nЗавершение фокуса §YМаксимальная оптимизация§! улучшит этого конструктора."
 BUL_national_naval_designer_upgrade_tt: "\nЗавершение фокуса §YФлот Эгейского моря§! улучшит этого конструктора.\n"
 BUL_national_military_designer_upgrade_tt: "\nЗавершение фокуса §YБалканская Пруссия§! улучшит этого конструктора.\n"
 GATHERING_STORM_NAME: "Великий пиздец грядет"
 GATHERING_STORM_DESC: "больше я вам ничего не скажу)0)"
 ENG_GATHERING_STORM_DESC: "Мы вдвоем с [УДАЛЕНО]\nКетер изучали\nЯ мудак, и он мудак\n[ДАННЫЕ ПРОПАЛИ]"
 FRA_GATHERING_STORM_DESC: "Все объекты класса "Кетер"\nПодросли на целый метр\nИ какой теперь длины?\n[Данные удалены]"
 GER_GATHERING_STORM_DESC: "Как-то раз к любимой теще\nЗашёл в гости на блины\nА она по стенам ходит\n[ДАННЫЕ УДАЛЕНЫ]"
 ITA_GATHERING_STORM_DESC: "Мы с милёнком у метро\nВидели [УДАЛЕНО]\nКетер то или Евклид\nВсё равно ████ болит"
 JAP_GATHERING_STORM_DESC: "Мимо SCP-120\nЯ без шуток не хожу\nЕсли ███ туда засуну —\nУстраненью подлежу"
 SOV_GATHERING_STORM_DESC: "Опа опа\nЗеленая ограда\nИгорь стал объектом фонда\nтак ему и надо"
 USA_GATHERING_STORM_DESC: "Как-то раз мы на базаре\nС другом меряли штаны,\nSCP-████ видали\n[ДАННЫЕ УДАЛЕНЫ]"
 OTHER_GATHERING_STORM_DESC: "больше я вам ничего не скажу"больше я вам ничего не скажу"больше я вам ничего не скажу"больше я вам ничего не скажу"Прочие страны, большие и малые, не готовы в бездействии, затаив дыхание, ожидать, чем закончится новый мировой конфликт. Прошлая война во многом перекроила атлас мира, изменив соотношение сил, и теперь крупные игроки готовы это повторить. Всем придется принимать непростые решения и искать баланс между своими идеалами и холодным прагматизмом, чтобы повлиять на то, каким станет мир в будущем."
 POL_GATHERING_STORM_DESC: "больше я вам ничего не скажу"больше я вам ничего не скажу"больше я вам ничего не скажу"больше я вам ничего не скажу"Разделенная между тремя империями на протяжении многих веков, Польша наконец-то вновь обрела независимость. Но сейчас она в шатком положении. \n\nК востоку от нее – Советский Союз, который не забыл унизительного поражения в польско-советской войне. \n\nНа западе – германский фюрер Адольф Гитлер, открыто заявляющий о желании расширить «жизненное пространство» и о том, что бывшие немецкие территории, теперь входящие в состав Польши, станут первой целью этого плана."
 CAN_GATHERING_STORM_DESC: "больше я вам ничего не скажу"больше я вам ничего не скажу"больше я вам ничего не скажу"больше я вам ничего не скажу"Канада вступила в Великую войну обычной колонией, а вышла из нее нацией. Рожденная в грязи Пашендейля, Канада делает первые робкие шаги на мировой арене. \n\nБудущее этой новой нации под вопросом, ведь она еще не оправилась от Великой депрессии, а изнутри ее раздирают противоречия между англо- и франкоговорящими гражданами."
 AST_GATHERING_STORM_DESC: "больше я вам ничего не скажу"больше я вам ничего не скажу"больше я вам ничего не скажу"больше я вам ничего не скажу"Австралийцы кровью вписали свое имя в учебники истории, посвященные Великой войне. Они помнят, какую жертву принесли в ходе Дарданелльской операции, равно как и имена тех, кто отдавал приказы. \n\nАвстралия сейчас находится на распутье: сохранить верность своим колониальным хозяевам из далекой Европы, которые скоро вступят в новую войну, или сосредоточиться на тех угрозах, что гораздо ближе к родным берегам?"
 SAF_GATHERING_STORM_DESC: "больше я вам ничего не скажу"больше я вам ничего не скажу"больше я вам ничего не скажу"больше я вам ничего не скажу"Когда началась Великая война, многие жители Южной Африки не захотели сражаться на стороне своих британских хозяев. Почти на всем протяжении Великой войны южноафриканская армия гонялась за немецкими войсками в их африканских колониях, но без особых успехов. \n\nТеперь на горизонте возникли тучи новой войны. Как и тогда, часть жителей Южной Африки считает, что стране не следует сражаться с Германией. Некоторые даже уверены, что потомкам буров пора сделать ставку на свободу, которая была недоступна их предкам."
 NZL_GATHERING_STORM_DESC: "больше я вам ничего не скажу"больше я вам ничего не скажу"больше я вам ничего не скажу"больше я вам ничего не скажу"Эта крохотная нация из южной части Тихого океана храбро сражалась в Великой войне. Ее армия понесла тяжелые потери в кровавых битвах за Галлиполи и на Западном фронте. Почти половина всех мужчин призывного возраста воевала за рубежом, и многие из них не вернулись домой.\n\nЧерез двадцать лет после окончания Великой войны граждане Новой Зеландии с тревогой наблюдают за мировыми событиями, ведь на сей раз угроза значительно ближе к их берегам..."
