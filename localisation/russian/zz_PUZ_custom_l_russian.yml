 AST_destroyer_4_desc: "В эсминцах типа «Бэттл» представлено развитие британских эсминцев за годы войны. Корабли были заказаны в рамках военно-морской программы 1942 и 1943 годов. Они были хорошо вооружены как орудиями, так и торпедами. Это, а также скорость и дальность действия, сделали их достаточно универсальными кораблями, но позднее появление не позволило внести ощутимый вклад в победу."
 AST_light_cruiser_4_desc: "Эти крейсеры, также известные как тип «Свифтшур», были спроектированы как улучшенная версия типа «Уганда» с учетом модификаций, утвержденных в 1941 году. Они имели большую дальность действия и больше установок ПВО, чем тип «Уганда», но основное вооружение было сокращено до трех трехорудийных башен. Большинство заказанных судов были впоследствии отменены, поскольку уже не могли повлиять на исход войны. "
