 CARRIER_STACK_PENALTY_LORE: "§LИдеальный состав авианосного ударного соединения: 4 авианосца, от 6 до 8 кораблей обеспечения и не менее 18 миноносцев, желательно 24. Больше четырех авианосцев в соединении нельзя использовать эффективно из-за нехватки свободного воздушного пространства. Если авианосцев меньше четырех, вы неэкономно используете корабли обеспечения и охранения.\nАдмирал Марк Митшер§!"
