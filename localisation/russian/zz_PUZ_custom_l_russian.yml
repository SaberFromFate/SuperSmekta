l_russian:
 NOR_democratic_preparation_decisions_category_desc: "Если мы хотим конкурировать с миром, нашей молодой нации предстоит проделать долгий путь. Десятилетия небрежения и годы Великой депрессии оставили нашу промышленность в печальном состоянии, выйти из которого можно лишь общими усилиями.\n\nК сожалению, это скажется на нашей обороноспособности и готовности к войне, но мы верим: политика полного невооруженного нейтралитета покажет всем, что мы не представляем угрозы и интереса для врагов.\n\n\nОбщее развитие государства [NOR.GetName]: [?NOR.NOR_country_preparedness]/30"
 NOR_historical_deploy_prep_decisions_category_desc: "Несмотря на все наши старания, на наши берега пришла война. До сих пор мы концентрировались на развитии промышленности, экономики и инфраструктуры на наших территориях, но теперь нам нужно найти способ воспользоваться всем этим для защиты государства [NOR.GetNameDef].\n\n\nПотенциальная боеготовность государства [NOR.GetName]: [?NOR.NOR_country_preparedness]/30"
 NOR_allied_democratic_preparation_decisions_category_desc: "Это правительство уверено, что враги атакуют с минуты на минуту. Мы должны строго придерживаться политики вооружения населения государства [NOR.GetName], чтобы бороться с возможным вторжением — даже если это означает превентивный удар. Нужно мобилизовать страну и взять в свои руки власть для решительной победы над противником.\n\nНациональная боеготовность: [?NOR.NOR_country_preparedness]/30"
 NOR_communist_preparation_decisions_category_desc_stalinist: "Народ государства [ROOT.GetName] слишком долго был слеп. Пришла пора откликнуться на зов наших братьев и сестер из державы [SOU.GetNameDef].\n\nОни на личном примере показывают, чего может достичь [ROOT.GetName], захватив средства производства и объединившись под одним знаменем и одним лидером, который поведет войска в бой против тирании Осло.$NOR_revolution_support_counter$"
 NOR_communist_preparation_decisions_category_desc_trostkyist: "Пора народу государства [NOR.GetName] прислушаться к учению Маркса и Троцкого и подготовиться к неминуемому столкновению, которое превратит нашу страну в оплот коммунизма в Скандинавии.\n\nПора войти в горнило перманентной революции и объединить страну перед силами капитализма, засевшим в Осло.$NOR_revolution_support_counter$"
 NOR_prepare_state_historical_desc: "Наша промышленная база разрушена, но мы готовы приложить усилия, чтобы улучшить положение народа государства [ROOT.GetName] и наши шансы на выживание, если случится самое страшное."
 NOR_expedite_training_desc: "Для выживания важно подготовить войска как можно лучше, но все это будет бессмысленно, если войска закончат подготовку, а государства [NOR.GetName], которое надо защищать, к тому времени не останется. Нужно поднажать, пока враг не поспешил и не изгнал нас с наших земель."
 NOR_prepare_state_communist_desc: "Народ государства [FROM.GetName] слишком долго пребывал в дреме, позволяя эксплуатировать себя. Нужно посеять зерна будущей революции"
 NOR_prepare_state_monarchist_desc: "Народу государства [FROM.GetName] надо напомнить о выборах 1905 г. и о том, почему именно подавляющее большинство отдало свой голос за короля. Очень скоро потребуется прямое вмешательство монарха."
 NOR_promote_the_armed_defense_of_the_country: "Подготовить вооруженную оборону государства [NOR.GetName]"
 NOR_request_reinstatement_desc: "Наш враг утрачивает контроль над землями государства [NOR.GetName], и, как нам кажется, сейчас самое время вернуть наше правительство на его законное место."
 NOR_foment_resistance_in_state_desc: "В народе государства [FROM.GetName] жив дух сопротивления, и люди дают отпор врагу! Просто нужно подтолкнуть бойцов, чтобы переломить ход противостояния."
 DEN_bop_motion_of_no_confidence_desc: "Судя по всему, текущее правительство неспособно на какие-либо действия по спасению государства [DEN.GetNameDef] и его жителей. Нужен новый, решительный лидер! [DEN.GetLeader] заслуживает вотума недоверия от парламента."
 DEN_bop_hold_a_military_parade_desc: "Проведя военный парад, мы повысим веру народа в нашу способность защитить государство [ROOT.GetNameDef]. Это непременно повысит боевой дух и решимость людей."
 DEN_bop_occupation_resistance_coordination_desc: "Если мы хотим вернуть себе свободу, надо собрать общее движение сопротивления и сражаться за одну цель — освобождение государства [ROOT.GetNameDef]."
 DEN_bop_occupation_sabotage_civ_industry_desc: "Наши местные заводы и фабрики вынуждены производить для государства [?DEN.DEN_overlord_nation.GetNameDef] разные материалы, которые то пускает на свои военные цели. Организовав саботаж этих заводов и фабрик, мы уменьшим запас материалов, что навредит немецкой военной мощи."
 DEN_bop_occupation_switch_ideology: "Принять идеологию «[?DEN.DEN_overlord_nation.GetRulingIdeologyNoun]»"
 DEN_resistance_category_desc: "Мы должны сопротивляться оккупантам и вернуть себе свободу! Достичь этого можно лишь совместными усилиями, и мы упорно идем к нашей общей цели — освобождению государства [ROOT.GetNameDef]."
 DEN_air_drills: "Подготовка авиации"
 DEN_fortification_category_desc: "Чтобы быть спокойными за будущее государства [ROOT.GetNameDef], мы должны готовиться к худшему и усиливать оборону. Нас смогут защитить лишь рубежи прочных, непробиваемых укреплений."
 DEN_integrate_iceland: "Интегрировать государство [ICE.GetFlag][Ice.GetNameDefCap]"
 DEN_demand_icelandic_territory: "Потребовать [ICE.GetFlag][Ice.GetAdjective]ую территорию"
 FIN_set_up_weapon_caches_in_state_desc: "В рамках секретной военной операции большие объемы оружия и снаряжения [ROOT.GetAdjective]ой армии будут спрятаны в схронах по всей территории государства [FROM.GetName], чтобы бойцы [ROOT.GetAdjective]ого сопротивления могли продолжать сражаться с захватчиками."
 FIN_can_demand_territory_if_occupying_tt: "\n\nМы сможем требовать территориальных уступок от государства [SOV.GetNameDef], если будем контролировать регионы §Y[213.GetName]§!, §Y[215.GetName]§! или §Y[216.GetName]§!."
 FIN_kullervo_manner_extradited_flag: "§Y$FIN_kullervo_manner$§! был экстрадирован из государства [SOV.GetName] (завершены фокус §Y«$FIN_approach_the_soviets$»§! и решение §Y«$FIN_request_extradition_of_kullervo_manner$»§!) до его смерти §Y31 января 1939 года§!."
 AAT_nordic_shared.3.desc: "Мы получили новости о том, что [FROM.GetAdjective]ий народ в случае чего встанет на защиту независимости государства [ROOT.GetName], а мы в свою очередь защитим их. Северные страны должны быть готовы ответить на любое вторжение как единая сила, а не как разрозненные нации."
 AAT_nordic_cooperation.1.desc: "Мы вновь и вновь находим свидетельства того, что нашим стараниям победить государство [?GLOBAL.NORDIC_country_to_defend.GetName] мешает тайная поддержка от державы [FROM.GetName].\n\nВозможно, пора научить их воевать по-настоящему."
 AAT_nordic_cooperation.3.a: "Ну что ж…"
 AAT_nordic_cooperation.9.t: "Лидеры государства [FROM.GetName] отвергли наше предложение!"
 AAT_norway.9.desc: "Правительство, которое возглавляют лейбористы и лично [NOR_johan_nygaardsvold.GetName], — первое стабильное правительство с четким большинством в нашей юной нации. Весь прошедший год кабинет упорно трудился, продвигая меры, которые медленно, но верно выведут государство [NOR.GetName] из глубокого экономического кризиса и помогут народу.\n\nРазумеется, такие меры можно осуществить лишь за счет военного бюджета, который был бы не лишним, если бы нашей стране вдруг начала грозить война. Будем надеяться, что ее не будет."
 AAT_norway.10.desc: "Война в Европе становится все более неизбежной, и Стортинг, [NOR.GetAdjective]ий парламент, качается на волнах хаоса и раздора. Ожидания, что кабинет Нюгорсвольда приведет страну в эру стабильности, давно забыты — члены правительства не могут согласиться ни по одному вопросу, чтобы провести государство [NOR.GetName] через грядущий шторм.\n\nВраги державы тем временем уже точат ножи и ждут, пока [NOR.GetName] падет во время войны, чтобы вдоволь попировать на обломках."
 AAT_norway.11.t: "Народ государства [ROOT.GetName] пробуждается!"
 AAT_norway.14.desc: "Видкун Квислинг, годами бывший главным проповедником фашизма в государстве [NOR.GetNonIdeologyName], предложил помощь во вторжении в свою страну.\n\nОн хочет с нашей помощью устроить в Осло переворот и основать там режим, дружественный государству [ROOT.GetNameDef]. Закрепившись там, он проложит путь нашим войскам и легитимизирует [ROOT.GetAdjective]ую оккупацию государства [NOR.GetName]."
 AAT_norway.14.b: "Этот шут? [NOR.GetNonIdeologyName] падет перед нами даже без его участия."
 AAT_norway.15.a: "К сожалению, будущее государства [NOR.GetName] может остаться за Квислингом"
 AAT_norway.16.desc: "Несмотря на то что нам пришлось бежать из государства [NOR.GetName], по крайней мере мы можем утешаться тем, что наши лидеры предусмотрительно подготовились к худшему и запасли ресурсы, которые помогут нам вернуть [NOR.GetAdjective]ую территорию.\n\nЭти инструменты облегчат нам путешествие обратно к древним берегам."
 AAT_norway.17.desc_fascist: "Глава государства [NOR.GetNameDef] требует от нас передать часть территории, называя это возвращением исторических земель. Ожидаемо, в случае отказа нам угрожают войной.\n\nРечь идет [GetNorwegianClaims]."
 AAT_norway.19.desc_monarchist: "Престижу нашей короны был нанесен серьезный удар, когда государство [FROM.GetName] отклонило наши законные территориальные претензии. Это равносильно оскорблению [ROOT.GetAdjective]ой короны, и мы такого не потерпим."
 AAT_norway_rikstanken.5.desc_SOV: "[FROM.GetAdjective]ое правительство обратилось к нам с просьбой продать ему большую партию танков. Оно хочет не только заключить торговое соглашение, но и взять курс на сближение наших двух наций.\n\nЭто наша возможность показать народу государства [FROM.GetName], чего можно достичь, захватив средства производства, — и нарастить сотрудничество в будущем."
 AAT_norway_rikstanken.5.desc_GER: "Представители [FROM.GetAdjective]ой администрации хотят закупить большую партию наших превосходных легких танков.\n\nТакже они продемонстрировали интерес к нашей идеологии и хотят продемонстрировать своему народу, как выглядит [ROOT.GetRulingIdeologyNoun] в высшей точке развития, чтобы распространить эту идеологию у себя."
 AAT_norway_rikstanken.9.desc: "[FROM.GetAdjective]ие лидеры согласились продать нам свои танки и заодно подписать соглашение, по которому [ROOT.GetName] и [FROM.GetAdjective]ие [FROM.GetRulingIdeologyNoun] станут ближе."
 AAT_norway_rikstanken.9.a: "Теперь победит [FROM.GetRulingIdeologyNoun]"
 AAT_norway_fascist.1.t: "Партия «Национальное единение» из государства [FROM.GetName] просит нас вторгнуться в их страну!"
 AAT_norway_fascist.1.desc: "Коалиция [FROM.GetAdjective]их националистов и фашистов, поддерживающих наше дело, предлагает свою помощь в завоевании государства [NOR.GetName]. Они заложили основы для захвата правительства и управления [FROM.GetAdjective]ими территориями от нашего имени.\n\nЕсли это правда, упускать такую возможность не стоит — но надо сперва убедиться, что мы готовы действовать."
 AAT_norway_fascist.2.desc: "Несмотря на наше щедрое предложение, [FROM.GetAdjective]ие представители сообщили нам, что, пожелай они вторгнуться в государство [ROOT.GetName], наша помощь им бы не понадобилась. Похоже, захватывать контроль над правительством державы [ROOT.GetNameDef] нам придется самостоятельно."
 AAT_norway_communist.2.desc: "Наши товарищи из государства [FROM.GetNameDef] с радостью готовы торговать с нами через северные порты, как когда-то их предки. Это взаимовыгодное соглашение продемонстрирует трудящимся наших стран крепкость коммунистического братства."
 NOR_exiled_monarchy_to_desc_DEN: "Низложенный король вернул себе датское имя — принц Карл — и возвращается в государство [DEN.GetName] к своему брату, королю Фредерику, чтобы приступить к выполнению обязанностей, которые возлагаются на членов монарших семей в датском обществе."
 NOR_exiled_monarchy_to_desc_ENG: "Поскольку возвращение домой, в государство [DEN.GetName], невозможно, низложенный король Хокон и его семья вынуждены поселиться в державе [ENG.GetName], где когда-то сыграли свадьбу принц Карл Датский и Мод Уэльская еще до того, как стали королевской четой."
 AAT_norway_communist.8.desc_DEN: "Покинув нас, чтобы основать свою королевскую семью в Норвегии, наш принц Карл — или король Хокон VII, как его долгие годы называли, — вернулся в государство [ROOT.GetName].\n\nОн был смещен и выслан из своей страны в результате кровавой коммунистической революции и теперь со своей семьей ищет прибежища в нашей стране."
 AAT_Sweden.11.desc: "После обмена враждебными выпадами между государствами [SWE.GetNameDef] и [GER.GetNameDef] немецкие рабочие смогли временно захватить заводы Landsverk и забаррикадироваться внутри. Военные должны со временем вернуть контроль над заводами, но в ходе столкновения неизбежен ущерб и какое-то время производства будут работать не на полную мощность.\nМало что известно о заводе Landsverk, расположенном в Германии, но шведские власти практически не сомневаются, что он в ответ уже захвачен правительством государства [GER.GetNameDef]."
 AAT_Sweden.19.desc: "Сегодня отличный день, ведь скоро [Nor.GetName] отпразднует воссоединение. [SWE.GetName] любезно принимает наш запрос на возврат Нарвика, где укрывалось [SWE.GetAdjective]ое правительство во время войны. Мы выразили глубочайшую благодарность [SWE.GetAdjective]ому правительству. Несомненно, случившееся укрепит связь между нашими странами на долгие годы."
 AAT_Sweden.19_tt: "§Y[ROOT.GetNameDefCap]§! — получена возможность награждать §Yнорвежским Почетным крестом за оборону§! §Yполевых командиров§!."
 AAT_Sweden.20.desc: "Пользуясь войной, государство [SWE.GetNameDef] самым бесстыдным образом оккупировало часть нашей страны под предлогом «спасения норвежского населения от еще более опасной оккупации». Затея оказалась обманом, придуманным [SWE.GetAdjective]им правительством, чтобы реализовать свои территориальные амбиции. Оно отказалось возвращать нам оккупированные территории, ссылаясь на «продолжающуюся мировую нестабильность и беспорядки после войны». Мы видим их насквозь — очевидно, это оппортунизм в самом примитивном проявлении, наглое мошенничество, угрожающее свободе и целостности нашего государства. Нарвик принадлежит Норвегии и останется в ее составе — если нужно, то и силой."
 AAT_Sweden.23.desc: "[FROM.GetName] просится в наш альянс, так как беспокоится из-за потенциальной послевоенной напряженности между державами-победительницами. Наличие в альянсе государства [FROM.GetName] расширило бы наше влияние в его регионе — но и обязало бы нас защищать его в случае новых конфликтов."
 AAT_Sweden.31.a_tt: "§RЭто приведет к тому, что [FROM.GetName] сможет сделать нас марионеткой§!"
 AAT_Sweden.37.t: "Судьба государства [DEN.GetName]"
 AAT_Sweden.38.t: "[FROM.GetName] начинает превращать государство [DEN.GetName] в свою марионетку"
 AAT_Sweden.44.desc: "В качестве жеста доброй воли [FROM.GetName] соглашается демилитаризовать регион [148.GetName]. Для нас это важный этап восстановления восточного королевства. Наше влияние на государство [FROM.GetName] понемногу растет."
 AAT_Sweden.48.desc: "Очевидно, что «беспокойство» наших соседей о своей безопасности было фальшивым. Правительство государства [FROM.GetName] теперь требует, чтобы мы объединились с ним в борьбе против общего врага с Востока. Если поддаться его требованиям, мы снова окажемся в [FROM.GetAdjective]ой сфере влияния и подорвем свою независимость. Остается вопрос — а точно ли альтернатива хуже?"
 AAT_Sweden_ball_bearing.1.t: "Задать условия торговли шарикоподшипниками для государства [FROM.FROM.GetName]"
 AAT_Sweden_flashpoints.13.desc: "Официальные лица государства [SOV.GetNameDef] принесли извинения за недавнюю атаку на Паялу и настояли, что случившееся было ошибкой пилотов. Также они предложили компенсировать нам нанесенный ущерб. Похоже, [SOV.GetAdjective]ая держава берет курс на сотрудничество, чтобы избежать эскалации конфликта."
 AAT_Sweden_flashpoints.15.desc: "В нашем воздушном пространстве недавно были замечены [SOV.GetAdjective]ие бомбардировщики. Они направлялись в государство [SWE.GetName], где сбросили бомбу на деревню, приняв ее за [FIN.GetAdjective]ую цель. С тех пор [SOV.GetNameDef] и [SWE.GetName] находятся в состоянии дипломатического конфликта, который развился до такой степени, что государство [SWE.GetName] решило активно поставлять нам оружие для борьбы с [SOV.GetAdjective]ими военными. Пока неизвестно, как на это отреагирует [SOV.GetAdjective]ая держава."
 AAT_Sweden_flashpoints.17.t: "[SWE.GetName] наращивает напряженность, вооружая государство [FIN.GetName]"
 AAT_Sweden_flashpoints.18.desc: "Наши намеренно провокационные поставки оружия государству [FIN.GetName] привлекли внимание державы [SOV.GetNameDef]. Дипломаты из Москвы сообщили нам, что [SOV.GetLeader] рассматривает наши действия как фактическое вступление в конфликт против государства [SOV.GetNameDef] и намеревается предпринять все необходимые действия."
 AAT_Sweden_flashpoints.22.desc: "[FIN.GetAdjective]ие дипломаты сообщили нам, что, несмотря на наличие общего врага в лице государства [SOV.GetNameDef], стратегические цели их правительства слишком отличаются от наших, и потому они вынуждены отклонить наше предложение об альянсе."
 AAT_Sweden_flashpoints.30.t: "Право прохода через территорию государства [SWE.GetName]"
 AAT_Sweden_flashpoints.30.desc: "Мы успешно закрепились в Скандинавии, но транспортировка войск и снаряжения через Датские проливы может быть опасной. В открытом море конвои часто становятся жертвами авиации и кораблей врага. Следовательно, будет правильно максимально сократить использование морских маршрутов.\n\nВозможно, стоит надавить на соседнее государство [SWE.GetName], чтобы то предоставило нам доступ к своим железным дорогам и линиям связи. При этом нужно сохранять такт и постепенно подтачивать нейтралитет соседа, чтобы не оттолкнуть его на сторону врага."
 AAT_Sweden_flashpoints.31.desc: "К нам обратились члены [GER.GetAdjective]ого правительства с просьбой разрешить ограниченное использование наших железных дорог для перевозки раненых и солдат в отпуске из государства [GER.GetNameDef] и обратно через территории держав [SWE.GetName] и [DEN.GetName]. Они настаивают, что эта просьба носит сугубо гуманитарный характер, но легко понять, что она поможет им постепенно лишить нас нейтралитета."
 AAT_Sweden_flashpoints.33.t: "Адольф Гитлер сомневается в [SWE.GetAdjective]ом нейтралитете"
 AAT_Sweden_flashpoints.33.desc: "Мы получили телеграмму, где [GER.Capital.GetCapitalVictoryPointName] в самых резких выражениях сообщает нам, что [GER.GetLeader] огорчается нашему отказу. Судя по всему, [GER.GetAdjective]ий лидер начинает сомневаться в нашем нейтралитете и считает, что наши последние действия свидетельствуют о росте симпатии к врагам государства [GER.GetName].\n\nПохоже, они вполне готовы эскалировать ситуацию до конфликта. Возможно, нам пора переосмыслить свою позицию."
 AAT_Sweden_flashpoints.34.a: "Начать приготовления к атаке государства [SWE.GetName] и отправить ему ультиматум."
 AAT_Sweden_flashpoints.35.desc: "[GER.GetNameDefCap] выдвигает жесткий ультиматум, в котором требует уступить его требованиям и предоставить доступ к инфраструктуре. В ультиматуме говорится, что в случае отказа они признают нас врагами государства [GER.GetNameDef] и предпримут все необходимые меры для защиты своих интересов в Скандинавии."
 AAT_Sweden_flashpoints.37.desc: "[SWE.GetAdjective]ое правительство резко отвергло наш ультиматум, заявив, что не стоит принимать нейтралитет за слабость или неподготовленность. Также оно отметило, что в случае необдуманных действий против государства [SWE.GetName] наша армия должна быть готова к большим потерям.\n\nВозможно, это просто блеф, чтобы избежать военных действий, но наблюдения за шведскими войсками показывают, что те вполне готовы драться за свою независимость."
 AAT_Sweden_flashpoints.37.b: "Начать вторжение в государство [SWE.GetName]."
 AAT_Sweden_flashpoints.39.desc: "[SWE.GetName] разрешает возвращать в государство [GER.GetNameDef] по своей железной дороге наших раненых и солдат в отпуске. При этом держава настаивает, что перевозить таким образом можно только невооруженных людей и с соблюдением строгих квот, чтобы в Швеции не скапливалось слишком много солдат сразу."
 AAT_Sweden_flashpoints.42.desc: "Не удовлетворившись нашими предыдущими уступками, правительство государства [GER.GetNameDef] запросило у нас право на проход войск, чтобы облегчить свои военные операции в Скандинавии. Очевидно, что таков был [GER.GetAdjective]ий план с самого начала, и отказ сдать последние остатки нейтралитета [GER.GetLeader] будет рассматриваться как повод для вторжения в государство [SWE.GetName]. С другой стороны, если мы разрешим проход, наши соседи и противники державы [GER.GetNameDef], вероятно, сочтут нас причастными к оккупации государства [NOR.GetName]."
 AAT_Sweden_flashpoints.43.desc: "[SWE.GetName] предоставляет нам полное право на проход войск по его территории. Это не только поможет нашим операциям в Скандинавии, но и повысит влияние на государство [SWE.GetName], которое теперь не сможет быстро присоединиться к врагам."
 AAT_Sweden_flashpoints.50.desc: "Мы всегда внимательно следили за действиями крайне левых, но это вряд ли убережет нас от подрыва коммунистами нашей военной эффективности или промышленности для облегчения [SOV.GetAdjective]ого вторжения в государство [SWE.GetName]. Следовательно, мы должны действовать на упреждение и активнее задерживать тех, кто замечен в сочувствии государству [SOV.GetNameDefCap] или просто в крайне левых взглядах."
 AAT_Sweden_flashpoints.53.b: "Мы сокрушим этих агентов государства [SOV.GetNameDef]."
 AAT_Sweden_flashpoints_civil_war_tt: "§RСнижение стабильности государства [SWE.GetFlag][SWE.GetName] может привести к гражданской войне, если у коммунистов сохранится высокая поддержка!§!"
 AAT_Sweden_flashpoints.60.desc: "[SWE.GetName] захватывает контроль над компанией Landsverk, в которой мы разрабатывали бронетехнику совместно с [SWE.GetAdjective]ой державой. В последнее время Landsverk уже не так полезны нам, как раньше, но сам факт захвата — явный знак того, что [SWE.GetName] желает дистанцироваться от государства [GER.GetNameDef]."
 AAT_Sweden_flashpoints.61.desc: "Правительство государства [GER.GetNameDef] резко отреагировало на наш захват Landsverk, конфисковав на своей территории несколько активов, связанных с [SWE.GetAdjective]ими гражданами. Мы хотели дистанцироваться от государства [GER.GetNameDef] постепенно, но это его решение вызвало ярость у [SWE.GetAdjective]ой публики."
 AAT_Sweden_flashpoints.62.t: "[FROM.GetName] вводит торговое эмбарго против государства [GER.GetNameDef]"
 AAT_Sweden_flashpoints.62.desc: "Сегодня государство [SWE.GetNameDef] вывело напряженность в отношениях на новый уровень, введя торговое эмбарго против державы [GER.GetNameDef]. Это решение сильно повлияет на нашу способность производить железо для оружейной промышленности."
 AAT_Sweden_flashpoints.63.desc: "Наше недавнее решение наложить эмбарго на государство [GER.GetNameDef] [GER.Capital.GetCapitalVictoryPointName] встречает с крайним недовольством. Там объявили ультиматум — вероятно, паникуя из-за своей исторической зависимости от [SWE.GetAdjective]ой железной руды. В нем сказано, что если мы немедленно не отменим эмбарго, они будут вынуждены принять решительные меры, в том числе и объявить войну."
 AAT_Sweden_flashpoints.70.desc: "Купленные нами корабли из государства [ITA.GetName] вышли из порта. На то, чтобы дойти до государства [SWE.GetNameDef], у них уйдет приблизительно месяц — по пути потребуется дозаправка."
 AAT_Sweden_flashpoints.71.t: "Бывшие [ITA.GetAdjective]ие корабли направляются в государство [SWE.GetName]"
 AAT_Sweden_flashpoints.71.desc: "Четыре бывших [ITA.GetAdjective]их эсминца сегодня прибыли в один из наших портов. Корабли были куплены [SWE.GetAdjective]им правительством и теперь в процессе перегона в государство [SWE.GetName]. Пока корабли на дозаправке, мы можем взять контроль над ними и в перспективе использовать их сами. Это, конечно, ухудшит отношения с державой [SWE.GetName]."
 AAT_Sweden_flashpoints.77.desc: "Корабли, закупленные нами у государства [ITA.GetNameDef], прибыли без каких-либо серьезных проблем. Экипажи, правда, сообщают об особенно тщательных проверках при дозаправках в портах."
 AAT_Sweden_flashpoints.80.desc: "Сославшись на свое затруднительное положение, держава согласилась, что лучше острова будем контролировать мы, чем иностранные оккупанты. Местные жители, большинство из которых и так говорит на [SWE.GetAdjective]ом языке, приняли это решение хорошо и продолжают жить как обычно."
 AAT_Sweden_flashpoints.83.desc: "[SWE.GetName] заявляет, что «не может потратить такую значительную сумму» из своих резервов за передачу Аландов."
 AAT_Sweden_flashpoints.83.a: "Значит, [SWE.GetName] не так уж и хочет эти острова."
 AAT_Sweden_BoP.14.d_non_aligned: "Наступил день выборов, и электорат проголосовал. В ближайшие дни $SWE_neutrality_party_long$ образует правительство большинства. План по усилению национальной обороны и политика привлечения голосов из сельской местности явно дали свои плоды. Теперь партии надо создать наяву ту романтическую версию государства [ROOT.GetName], которую она обещала избирателям."
 AAT_Sweden_BoP.14.d_fascist: "Наступил день выборов, и электорат проголосовал. В ближайшие дни $SWE_fascism_party_long$ образует правительство большинства, и сама партия, кажется, больше всех удивлена результатом. Как долго продержится под новым режимом демократический аппарат государства [ROOT.GetName], пока неясно."
 AAT_Sweden_nationalists.1.desc: "Представители ведущей национал-социалистической партии государства [SWE.GetName] обратились к нам с интересным предложением. Они сейчас занимаются свержением своего правительства и просят помощи в этом деле. В обмен на военную поддержку они согласны отдать страну в нашу сферу влияния."
 AAT_Sweden_nationalists.4.b: "$SWE_birger_furugard$ будет лидером государства [SWE.GetName] — это судьба."
 AAT_Sweden_nationalists.7.a: "Они восстановят государство [SWE.GetName]"
 AAT_Sweden_nationalists.11.desc: "Многие граждане государства [SWE.GetName], живущие за пределами крупных городов, считают, что политика социал-демократов не учитывает их интересы. Эти люди опасаются индустриализации, они боятся лишиться привычного образа жизни. Посеяв среди них семена протеста, мы смогли организовать волну народной поддержки националистического движения — оно обещает вкладывать средства в сельскую местность и восстановить традиционные ценности."
 AAT_Sweden_nationalists.20.desc: "Наш верный союзник, [FROM.GetName], просит нас расширить его ответственность, передав ему территории на севере государства [SOV.GetName]. Это позволит нам переложить бремя оккупации на наши зависимые государства и бросить все силы на борьбу с большим врагом."
 AAT_Sweden_nationalists.24.desc: "[FROM.GetName] принимает наше предложение. Когда придет время, они подпишут с нами мир на условиях статус-кво, чтобы мы вместе смогли победить государство [GER.GetName]."
 AAT_Sweden_nationalists.27.desc: "Наши верные союзники, [FROM.GetName], просят нас расширить их ответственность, передав им территории государства [FIN.GetName]. Это позволит нам переложить бремя оккупации на наши зависимые государства и бросить все силы на борьбу с большим врагом."
 AAT_Sweden_nordic_defense_council.1.t: "[SWE.GetNameDef] приглашает нас вступить в северный совет по обороне"
 AAT_Sweden_communism.5.desc: "На городских складах государства [ROOT.GetName] обнаружены многочисленные тайники с тяжелым вооружением. Найденные там записи позволили отследить покупателей: за всеми ними стоит [ROOT.GetFascistParty]. Лидеры боевой организации партии, так называемых штурмовиков-коричневорубашечников, были арестованы.\nПисьма, обнаруженные в одном из складов, раскрывают активную роль в заговоре генералов, которые украли это оружие и запутали бухгалтерские записи. В этом деле важно не рубить с плеча, ведь эти главари имеют значительный вес в определенных родах войск."
 denmark_political_events.1.desc: "[Den.GetLeader] сейчас находится под тяжелым огнем критики, и парламент требует отставки премьер-министра."
 denmark_political_events.2.desc: "Парламент решил вынести премьер-министру вотум недоверия. Вопрос теперь в том, кто займет место, которое освободит [Den.GetLeader]?"
 denmark_political_events.6.desc: "$DEN_neutrality_party_long$ испытывает разногласия насчет того, как планировать предвыборную кампанию. Кто-то не хочет накалять и без того непростую обстановку и сдерживает свою риторику. Кто-то считает, что для того, чтобы реализовать свое видение государства [DEN.GetNameDef], нужно атаковать в полную силу. Кто-то убежден, что лишь активно нападая на соперников, мы сможем ослабить их позиции и усилить свои."
 denmark_political_events.7.desc: "$DEN_fascism_party_long$ испытывает разногласия насчет того, как планировать предвыборную кампанию. Кто-то не уверен, что следует накалять и без того непростую обстановку и сдерживает свою риторику. Кто-то считает, что для того, чтобы реализовать свое видение государства [DEN.GetNameDef], нужно атаковать в полную силу. Кто-то убежден, что лишь активно нападая на соперников, мы сможем ослабить их позиции и усилить свои."
 denmark_political_events.8.desc: "Датские выборы окончены. Разные партии делали все возможное, чтобы убедить народ голосовать за свою программу. Есть мнение, что самое трудное только начинается, ведь нужно сформировать правительство. Выбор премьер-министра будет диктовать путь государства [DEN.GetNameDef] в обозримом будущем."
 denmark_political_events.9.desc: "Теперь, когда датские выборы окончены, ясно, что победила демократия. В отличие от зацикленных на одной идее коммунистов или фашистов, демократические партии не монолитны. У разных партий есть разное видение того, как лучше вести государство [Den.GetNameDef] через непростые времена. Вопрос в том, кому следует доверить формирование нового правительства?"
 denmark_occupation_event.1.desc: "Хоть мы недвусмысленно объявляли о своем нейтралитете, война пришла и в государство [DEN.GetNameDef]. Сдавшись сразу, мы, возможно, защитим народ от ее ужасов. В таком случае наша страна могла бы рассчитывать на поблажки и действовать относительно независимо."
 denmark_occupation_event.6.desc_asks_for_independence: "Наше верное марионеточное государство [FROM.GetNameDef] отправило к нам делегацию, возглавляет которую лично [FROM.GetLeader]. Делегация хочет обсудить выход из-под зависимости — и [ROOT.GetLeader] видится им ключом к свободе."
 denmark_occupation_event.7.desc: "[FROM.GetLeader] вновь отвергает все разумные доводы и отказывается признать нашу независимость. Мы должны заявить о своей свободе и сражаться за нее — похоже, только так и можно освободиться от рабства. Да, прольется кровь, но зато государство [ROOT.GetNameDef] снова будет свободным!"
 denmark_occupation_event.30.desc: "Эта операция тщательно планировалась, и все приготовления и долгое ожидание в итоге были не зря. Мы устроили диверсию на критически важных промышленных объектах, снабжавших государство [?DEN.DEN_overlord_nation.GetNameDef] датскими товарами. Такой смелый поступок ограничит поток продукции, идущей от нас к нашим так называемым хозяевам."
 denmark_resistance_event.1.desc: "Мы получили сообщение, доставленное в обстановке строжайшей секретности из государства [DEN.GetNameDef]. Там втайне ищут союзников, способных поддержать их претензии на суверенитет, и хотят вернуть независимость от государства [?DEN.DEN_overlord_nation.GetNameDef]. Стоит ли нам вставать на чью-то сторону в этом конфликте?"
 denmark_resistance_event.1.a: "За свободное государство [DEN.GetNameDef]!"
 denmark_resistance_event.10.t: "[FROM.GetNameDefCap] требует, чтобы в наш альянс вступило государство [DEN.GetNameDefCap]"
 denmark_resistance_event.10.desc: "Нам стало известно, что государство [FROM.GetNameDef] подписало соглашение с державой [DEN.GetNameDef], чтобы поддержать декларацию независимости и объединить войска. [FROM.GetLeader] теперь настаивает на соблюдении нами условий соглашения."
 denmark_resistance_event.13.desc: "Разведывательное агентство государства [FROM.GetNameDef] поступило крайне недальновидно и необдуманно. Оно не увидело пользы в совместном использовании разведданных и отклонило наше предложение."
 denmark_resistance_event.20.desc: "[DEN.GetLeader] отправляет нам секретный запрос — пробный шар насчет размещения датских войск на [ROOT.GetAdjective]ой территории в рамках подготовки к освобождению государства [DEN.GetNameDef]. Мы могли бы скрыть численность и истинное предназначение этих войск, назвав их «военной полицией»."
 denmark_resistance_event.23.desc: "Нам нанесла тайный визит датская делегация. Она интересуется, не хотим ли мы продать их стране несколько старых эсминцев. [DEN.GetNameDefCap] сейчас под давлением государства [?DEN.DEN_overlord_nation.GetNameDef], и такой запрос может означать, что готовится борьба за независимость. Стоит ли нам помочь этой стране обрести свободу?"
 denmark_overlord_events.2.desc: "Наш лидер, [ROOT.GetLeader], направляет королю государства [FROM.GetNameDef] искреннюю телеграмму с поздравлениями ко дню рождения, но в ответ получает лишь холодную и краткую отписку. Позднее датчане понимают серьезность такого проступка и предлагают, чтобы [ROOT.GetLeader] и кронпринц Фредерик встретились и наследник престола лично извинился за оскорбление.\nНо мы можем использовать этот инцидент как повод ужесточить контроль над нашим зависимым государством, которое имеет под нашим покровительством довольно серьезные привилегии."
 denmark_overlord_events.5.desc: "Наш лидер, [ROOT.GetLeader], направляет королю государства [FROM.GetNameDef] искреннюю телеграмму с поздравлениями ко дню рождения, но в ответ получает лишь холодную и оскорбительную отписку. Что хуже, теперь датчане отказываются признавать ошибку своего короля и подобающим образом извиняться.\nЭто отличный повод указать нашим подданным их место и напомнить им, что пожалованные им под нашим покровительством привилегии не стоит воспринимать как должное."
 denmark_overlord_events.20.desc: "Не секрет, что [FROM.GetnameDef] активно поддерживает такую идеологию, как [FROM.GetRulingIdeologyNoun], а [ROOT.GetRulingIdeologyNoun] для них — лишь объект презрения. Поэтому никого не удивило то, как охладились отношения державы с одним из сателлитов, который придерживается как раз этой ненавистной идеологии. Наша метрополия недвусмысленно указывает нам на то, что [ROOT.GetRulingIdeologyNoun] быть нашей идеологией не может."
 denmark_overlord_events.23.desc: "Мы смогли убедить датчан отказаться от своей идеологии. Теперь у них главенствует [FROM.GetRulingIdeologyNoun]."
 denmark_overlord_events.24.desc: "[FROM.GetLeader], лидер державы [FROM.GetNameDef], считающий, что [FROM.GetRulingIdeology] — лучшая из идеологий, отказывается прислушаться к голосу разума и поступить на благо своей страны. [FROM.GetRulingIdeologyNoun] славится жаждой власти своих проповедников, и нам не следует слишком удивляться датскому ответу. Пожалуй, придется показательно с ними разделаться..."
 denmark_overlord_events.25.t: "[FROM.GetNameDefCap] планирует насадить правительство, для которого во главе угла стоит [FROM.GetRulingIdeology]"
 denmark_overlord_events.25.desc: "Мы решительно отвергли [FROM.GetAdjective]ие требования, ведь [ROOT.GetRulingIdeologyNoun] для нас не просто идеология, но образ жизни. Впрочем, нам следовало ожидать, что такой ответ не примут. [FROM.GetAdjectiveCap]ая [FROM.GetRulingIdeologyNoun] не знает границ и обязательно постарается пробиться к власти."
 denmark_overlord_events.47.desc: "К нам явилась делегация из региона [FROM.GetCapitalVictoryPointName] и передала нам декларацию о том, что [ROOT.GetNameDef] официально войдет в состав великого государства [FROM.GetNameDef]."
 denmark_protection_event.2.desc: "Наш посланник в государство [FROM.GetNameDef] вернулся с хорошими новостями! [FROM.GetAdjective]ое правительство согласилось подписать наш договор, и теперь между нами действует пакт о ненападении. Это замечательный день для наших наций."
 denmark_protection_event.3.desc: "Наш посланник в государство [FROM.GetNameDef] вернулся с плохими новостями! [FROM.GetAdjective]ое правительство решило, что пакт о ненападении сейчас не в его интересах. Досадно, но переубедить их мы сейчас не можем."
 denmark_protection_event.4.desc: "Мы получили новости из государства [FROM.GetNameDef]. Они хотят увеличить объемы торговли между нашими странами. Если мы согласимся, то сделаем шаг к сближению с [FROM.GetAdjective]ой нацией."
 denmark_protection_event.7.desc: "Из государства [FROM.GetNameDef] нам поступило предложение заключить исследовательское соглашение. По его условиям мы будем делиться друг с другом нашими техническими достижениями. Как нам поступить?"
 denmark_protection_event.8.desc: "Сегодня утром мы получили сообщение из государства [FROM.GetNameDef]: они готовы принять наше предложение об исследовательском соглашении. Это отличные новости, наш технологический прогресс теперь ускорится."
 denmark_protection_event.9.desc: "Сегодня утром мы получили сообщение из государства [FROM.GetNameDef]: они отклоняют наш предложение об исследовательском соглашении. Увы, обмен технологиями с [FROM.GetAdjective]им правительством нам не светит."
 denmark_protection_event.100.desc: "[FROM.GetLeader], лидер государства [FROM.GetNameDef], предлагает нам объединить силы, и заявляет, что вместе мы сможем на равных противостоять сильнейшим мировым державам. Что мы ответим?"
 denmark_protection_event.101.desc: "Дипломаты из государства [FROM.GetNameDef] передают нам позицию своего руководства о нашем предложении альянса. [FROM.GetLeader] соглашается, что если мы не начнем вместе укреплять оборону, обе наши державы падут, когда война докатится до наших земель."
 denmark_protection_event.102.desc: "Дипломаты из государства [FROM.GetNameDef] передают нам позицию своего руководства о нашем предложении альянса. [FROM.GetLeader] считает, что если мы заключим такой договор, то обязательно начнем вмешиваться в их внутренние дела, и что им такой союз невыгоден. Другими словами, нам ответили отказом."
 denmark_protection_event.121.desc: "Лидер государства [FROM.GetNameDef] [FROM.GetLeader] с благодарностью принимает наше предложение об обмене технологиями; наши ученые уже начали координировать работу со своими зарубежными коллегами."
 denmark_protection_event.122.desc: "Лидер государства [FROM.GetNameDef] [FROM.GetLeader] заносчиво отвергает наше предложение обмениваться технологиями, заявив, что его страна не получит выгоды от такого обмена, и что мы лишь хотим заграбастать их научные достижения."
 denmark_protection_event.131.desc: "[FROM.GetLeader], лидер государства [FROM.GetNameDef], принимает наше приглашение вступить в альянс и уверяет нас в готовности прийти на помощь в час нужды, если мы возьмем на себя взаимные обязательства."
 denmark_protection_event.132.desc: "[FROM.GetLeader], лидер государства [FROM.GetNameDef], отклоняет наше приглашение вступить с нами в альянс, заявив, что их стране нет выгоды заключать союзы с дьяволом. Эти негодяи дестабилизируют регион, с ними нужно скорее разобраться!"
 denmark_protection_event.200.desc: "Перед лицом войны важно подготовить армию к будущим испытаниям. Пройдя усиленную подготовку, наши войска отлично смогут защитить границы государства [DEN.GetNameDef]."
 denmark_protection_event.201.desc: "Перед лицом войны важно подготовить флот к будущим испытаниям. Пройдя усиленную подготовку, наши моряки отлично смогут защитить воды государства [DEN.GetNameDef]."
 denmark_protection_event.202.t: "Подготовка авиации"
 denmark_protection_event.202.desc: "Перед лицом войны важно подготовить авиацию к будущим испытаниям. Пройдя усиленную подготовку, наши пилоты отлично смогут защитить небо государства [DEN.GetNameDef]."
 denmark_expansion_event.2.desc: "Этим утром мы получили новости: [ICE.GetAdjective]ое правительство любезно приняло наше предложение реинтегрировать их территорию в состав государства [DEN.GetNameDefCap]. Такая мера поможет обеим нашим нациям сражаться с врагом."
 denmark_expansion_event.4.desc: "Сегодня утром мы получили новости: [DEN.GetAdjective]ое правительство желает, чтобы мы передали ему права на государство [ICE.GetNameDef]. Оно утверждает, что территория острова по праву является частью территории этого государства."
 denmark_expansion_event.5.desc: "Судя по всему, государство [FROM.GetNameDefCap] приняло наши вполне оправданные требования контроля над державой [ICE.GetNameDef]. Приятно видеть, что дружественная нация ведет себя так разумно."
 denmark_expansion_event.10.b: "У государства [DEN.GetNameDefCap] нет права на наши земли."
 denmark_expansion_event.11.desc: "Отличные новости! Похоже, государство [SWE.GetNameDef] осознало, что своими ресурсами стоит поделиться с нами. Теперь его будет защищать наша современная армия!"
 denmark_expansion_event.13.desc: "Этим утром мы получили от [DEN.GetAdjective]ого правительства требование передать под его контроль государство [SWE.GetNameDef]. У нас есть свои связи с державой [DEN.GetNameDef], ведь наши монархи связаны семейными узами, но стоит помнить, что отказ может привести к войне с державой [DEN.GetNameDef] несмотря на кровное родство."
 denmark_expansion_event.20.desc: "С юга пришли мрачные новости: [DEN.GetNameDef] требует подчинения государства [NOR.GetNameDefCap] и нашего перехода под [DEN.GetAdjective]ое правление — впервые с 1814 года. Нам уже доводилось отстаивать свою независимость от шведов в отчаянных боях, но сможем ли мы бороться с датчанами?"
 denmark_expansion_event.23.desc: "Поскольку [DEN.GetNameDef] сейчас оккупирует державу [NOR.GetNameDef], их требование отдать эти земли было лишь вопросом времени. Эти наглецы утверждают, что [NOR.GetNameDef] — технически [DEN.GetAdjective]ая территория. У нас есть выбор: отдать датчанам государство [NOR.GetNameDef] или отказать им и готовиться к возможной войне."
 denmark_expansion_event.24.desc: "Похоже, [SWE.GetAdjective]ое правительство не лишено здравого смысла! Оно согласилось отдать в нашу власть государство [NOR.GetNameDef]. Мы рады, что они тоже считают нас полновластными правителями этих земель."
 denmark_trade_deal.2.desc: "Наша торговая делегация вернулась из государства [FROM.GetName] с хорошими новостями! [FROM.GetAdjective]ие представители подписали предложенное торговое соглашение, которое усилит наш агропромышленный сектор, создаст новые рабочие места и возможности."
 denmark_trade_deal.3.desc: "Наша торговая делегация вернулась из государства [FROM.GetName] разочарованной. Похоже, [FROM.GetAdjective]ое правительство не осознает многочисленные преимущества нашего торгового предложения. Это плохо скажется на нашем агропромышленном секторе, но мы справимся."
 denmark_trade_deal.8.desc_subjugation_cancelation: "Вся торговля датской продукцией прекращена в связи с [?DEN.DEN_overlord_nation.GetAdjective]им вторжением и подчинением государства [DEN.GetNameDef]."
 denmark_events.2.desc: "С тех пор как мы предприняли все усилия, чтобы финансировать укрепление границ, нам сообщают, что население начинает успокаиваться, особенно в том, что касается назревающей в Европе бури. Будем надеяться, что наша оборона выдержит натиск тех, кто захочет оккупировать государство [DEN.GetNameDef]."
 denmark_events.666.b: "Это явно чересчур…"
 iceland_events.1.desc: "[?ICE.overlord_attacker.GetAdjective]ие войска атаковали Данию. [ROOT.getName] заявляет о своем нейтралитете, ожидая, что его будут уважать все участвующие стороны.\n$ICE_sveinn_bjornsson$ объявлен регентом в отсутствие короля и фактически управляет внешней политикой государства [ROOT.GetName]. Разумеется, это следует считать временной мерой, пока ситуация не стабилизируется и мир не станет более мирным, но пока что [ROOT.GetName] фактически ведет себя, как суверенная нация."
 aat_news.2.t: "[ICE.GetAdjective]ко-[USA.GetAdjective]ое сотрудничество"
 aat_news.2.desc: "Удивительно, но [USA.GetAdjective]ое правительство провозгласило, что [ICE.GetName] находится в его сфере интересов, и по запросу [ICE.GetAdjective]ого правительства согласилось выделить войска на защиту государства [ICE.GetName]. Отныне вся исландская внешняя политика будет определяться [USA.GetAdjective]им правительством, а [ICE.GetName] фактически станет [USA.GetAdjective]ой марионеткой."
 iceland_events.2.desc: "[ICE.GetAdjective]ий посол в городе [ROOT.Capital.GetCapitalVictoryPointName] просит нас отправить войска в государство [FROM.GetName]. Фактически это просьба о [ROOT.GetAdjective]ой защите от возможного вторжения. В обмен на такую защиту они предлагают отдать нам на откуп управление своей внешней политикой."
 iceland_events.3.desc: "[FROM.GetAdjective]ое правительство приняло наш запрос на оборону государства [ROOT.GetName]. Будем надеяться, что наша страна выиграет от этого не только в плане защиты от вторжения, но и в финансовом от [FROm.GetAdjective]ого участия в жизни острова."
 iceland_events.4.desc: "К сожалению, [FROM.GetLeader] не желает вступаться за государство [ROOT.GetName]. Ссылаясь на то, что у государства [FROM.GetNameDef] и так достаточно проблем, [FROM.GetLeader] отказывается провозглашать державу [FROM.GetNameDef] защитницей страны [ROOT.GetNameDef]."
 iceland_events.10.desc: "Наши переговоры с датским двором зашли в тупик. Датчан до сих пор ранит тот факт, что [ROOT.GetName] больше не хочет быть субъектом государства [DEN.GetName]. Возможно, пора забыть об этом и жить дальше."
 iceland_events.13.desc: "[FROM.GetLeader] полностью понимает и поддерживает наш справедливый запрос о компенсации. [FROM.GetName] передаст державе [ROOT.GetName] как регион [101.GetName], так и регион [337.GetName]. Они согласны, что нам проще защищать эти острова и что усиление государства [ROOT.GetName] будет на руку всем."
 iceland_events.15.t: "Компенсация от государства [FROM.GetName]"
 iceland_events.17.desc_generic: "[FROM.GetAdjective]ий парламент объявил государство [FROM.GetNameDef] полностью независимым и суверенным, без каких-либо связей с любой другой нацией. Это значит, что они официально порвали с нами и в одностороннем порядке объявили независимость."
 iceland_events.19.desc: "Подстрекатели из государства [FROM.GetNameDefCap] решили не ратифицировать договор, дающий нам независимость. Вместо этого они настаивают, что [ROOT.GetName] — часть государства [FROM.GetName], и угрожают восстановить это единство насильно. Надо готовиться к грядущей буре."
 iceland_events.20.desc: "[ICE.GetLeader] из государства [ICE.GetNameDef] объявляет о создании новой Империи Северного моря, основанной на границах старинных владений викингов. Поскольку в те владения входила и Гренландия, нас теперь вежливо просят передать остров им."
 iceland_events.21.desc: "Слабые лидеры государства [FROM.GetNameDef] решили отдать нам контроль над Гренландией, поскольку, вероятно, не рискуют ввязываться в конфликт с нами. Это доказывает, что наша слава еще придет!"
 iceland_events.22.desc: "[FROM.GetLeader] из государства [FROM.GetNameDef] стоит на своем и не желает отдавать Гренландию. Похоже на намеренное самоубийство. Что ж, мы готовы помочь."
 iceland_events.24.desc: "Слабые лидеры государства [FROM.GetNameDef] решили отдать нам контроль над своими владениями в Северном море, поскольку, вероятно, не рискуют ввязываться в конфликт с нами."
 iceland_events.25.desc: "[FROM.GetLeader], лидер государства [FROM.GetNameDef], отказывается уступить нам свои владения в Северном море. Над нашими требованиями посмеялись, ответив, что, если мы хотим получить острова, нам придется взять их силой."
 iceland_events.26.desc: "С наших нефтеперерабатывающих заводов сообщили, что в окрестностях государства [ICE.GetName] закончилась нефть. Все запасы исчерпаны, новых месторождений нефти или газа не предвидится, и дальнейшая работа будет лишь напрасной тратой ресурсов."
 AAT_finland_misc_events.06.t: "[FROM.GetAdjective]ие военные вложения в государство [ROOT.GetName]"
 AAT_finland_diplomacy.01.desc: "К нам обратились дипломаты из государства [FROM.GetNameDef]. Они обдумывают идею национального объединения для взаимной защиты и процветания. Это означает слияние наших правительств, армий и промышленности в единый фронт, направленный против тех, кто угрожает безопасности такого союза.\n\nВ том, чтобы объединиться во времена международной нестабильности, может быть свой смысл, но решение в итоге принимать нам."
 AAT_finland_diplomacy.04.desc: "Наши торжествующие дипломаты вернулись из командировки в государство [FROM.GetName], но им, похоже, не удалось убедить [FROM.GetAdjective]ое правительство в пользе объединения. Собеседники не стали объяснять свой отказ подробно, и теперь наши чиновники гадают, каковы же будут последствия такого исхода.\n\nВозможно, нам следует усилить свою оборону на случай, если намерения соседей станут менее добрыми, или же обеспечить их... сотрудничество другими средствами."
 AAT_finland_diplomacy.07.desc: "Империалисты из государства [From.GetNameDef] отвергли нашу просвещенную петицию об объединении земель саамского народа. В своем официальном ответе они выражают сомнения в нашей готовности поддерживать культуру и благосостояние местного населения, но мы-то понимаем: истинная причина отказа в том, что эта держава хочет выглядеть крупнее на карте."
 AAT_finland_diplomacy.15.t: "[FROM.GetName] отныне часть государства [ROOT.GetNameDef]"
 AAT_finland_diplomacy.21.desc: "[FROM.GetLeader], лидер государства [FROM.GetNameDef], в своем величии клянется делать все, чтобы сохранить мир между нашими народами на долгие годы. Этот человек — поистине друг [FIN.GetAdjective]ого народа."
 AAT_finland_diplomacy.23.t: "[FROM.GetNameDefCap] ищет защиты от государства [SOV.GetNameDef]"
 AAT_finland_diplomacy.23.desc: "[FROM.GetLeader], лидер государства [FROM.GetNameDef], просит нас помочь стране в обороне от любой потенциальной агрессии со стороны государства [SOV.GetNameDef]. Лидер утверждает, что знает о готовящемся нападении, и мы — единственная надежда на выживание."
 AAT_finland_diplomacy.24.t: "[FROM.GetAdjective]ое правительство соглашается защитить государство [ROOT.GetNameDef]"
 AAT_finland_diplomacy.26.desc: "[FIN.GetLeader], лидер государства [FIN.GetNameDef], ищет защиты от державы [SOV.GetNameDef], которая впервые со времен гражданской войны начала с интересом поглядывать на земли соседей. В обмен на защиту от угрозы нам предлагают права на добычу [FIN.GetAdjective]их природных ресурсов."
 AAT_finland_diplomacy.28.desc: "[GER.GetLeader], лидер государства [GER.GetNameDef], демонстрирует свое коварство и отказывает нам в защите в обмен на ресурсы. Теперь наше будущее висит на волоске. Что ж, посмотрим, оправдаются ли такие эгоизм и самовлюбленность."
 AAT_finland_winter_war.03.desc: "К нам пришли новости от врагов из государства [FROM.GetNameDef]. Они предлагают заключить мир на условиях статус-кво: наши войска должны немедленно прекратить атаковать и уйти на свою территорию. Судя по всему, [FROM.GetNameDef] удовлетворится тем, что наши границы вернутся к довоенному состоянию и ни одна из сторон не расширит свою территорию.\n\nВряд ли наше население будет радо продолжать бои, учитывая, какие потери мы понесли в последнее время. Возможно, мы сможем убедить людей, что победа близка, но если ожидания не оправдаются, народное недовольство нашим правлением возрастет."
 AAT_finland_winter_war.05.desc: "Эти глупцы из государства [FROM.GetNameDef] ответили отказом на наше щедрое предложение мира. Они ошибочно убеждены, что их недавние потери — лишь досадная случайность и скоро все изменится. Мы понимаем, что это абсолютная ложь, придуманная, чтобы оградить правительство от гнева народа, но скоро истина все равно станет очевидна.\n\nНаши солдаты остаются на поле боя, их дух по-прежнему высок, они знают, что сражаются за правое дело, и готовы биться дальше."
 AAT_finland_winter_war.08.desc: "Эти глупцы из государства [FROM.GetNameDef] ответили отказом на наше щедрое предложение мира. Их отчаявшееся правительство цепляется за абсурдную идею о том, что еще способно победить. Их верхушка осознает, что если правда об истинном положении дел станет известна, ей придется иметь дело с массовыми восстаниями и, возможно, даже с революцией.\n\nНаши солдаты остаются на поле боя, их дух по-прежнему высок, они знают, что сражаются за правое дело, и готовы биться дальше, не сомневаясь в собственной победе."
 FIN_winter_war_push_back_tt: "\nЕсли мы оттесним [SOV.GetAdjective]ие войска и оккупируем регион §Y[195.GetName]§!, у нас появится возможность требовать переговоров о мире. \nЕсли мы будем также контролировать регион §Y[213.GetName]§!, §Y[215.GetName]§! или §Y[216.GetName]§!, у нас появится возможность требовать у государства [SOV.GetNameDef] передать эти регионы нам в качестве территориальных уступок."
 AAT_finland_continuation_war.01.desc: "Правящая верхушка государства [FROM.GetName] обратилась к нам по вопросам военного сотрудничества и совместной защиты от [SOV.GetAdjective]ой угрозы на востоке. Она предлагает нам право на размещение нашей армии на территории государства [FROM.GetName] при условии взаимной защиты границ и совместных вылазок на [SOV.GetAdjective]ие земли."
 AAT_finland_continuation_war.02.desc: "[FROM.GetLeader] дает зеленый свет нашему военному сотрудничеству против государства [SOV.GetNameDef]. Наши офицеры получили приглашение в город [FROM.Capital.GetCapitalVictoryPointName], чтобы начать там координацию объединенных вооруженных сил."
 AAT_finland_continuation_war.04.desc: "Наши планы сотрудничества с государством [FROM.GetNameDef] против государства [SOV.GetNameDef] теперь нарушены из-за недавнего изменения в геополитике. Мы приложили немало усилий к обдумыванию совместных операций, но теперь нам придется начинать все сначала как в военном, так и во внешнеполитическом плане."
 AAT_finland_continuation_war.05.t: "[FROM.GetAdjective]ая война с Советами"
 AAT_finland_continuation_war.05.desc: "Наши просчитанные дипломатические маневры и военное планирование принесли свои плоды: государство [FROM.GetNameDef] наконец-то приступило к операции «Барбаросса» — вторжению в державу [SOV.GetNameDef]. Теперь мы должны вспомнить о своих обязательствах и привести в исполнение свою часть плана."
 AAT_finland_continuation_war.06.desc: "[FROM.GetAdjective]ие войска начали свои запланированные атаки на [SOV.GetAdjective]ую позиции в соответствии с нашим соглашением о сотрудничестве. [FROM.GetAdjective]ие братья по оружию помогли нам растянуть советский фронт еще сильнее, и прорыв уже близок."
 AAT_finland_continuation_war.08.desc: "Правительство государства [FROM.GetNameDef] обратилось к нам с просьбой заключить перемирие, обещая нам дальнейшие территориальные уступки, а также разрыв всех отношений с государством [GER.GetNameDef]. Согласившись на это, мы можем полностью сосредоточить внимание на [GER.GetAdjective]их войсках и оттеснить их туда, откуда они пришли."
 AAT_finland_continuation_war.09.desc: "[FROM.GetLeader], лидер государства [FROM.GetNameDef], отклоняет наш запрос и утверждает, что мы должны готовиться к разрушению — ведь на этот раз [FROM.GetAdjective]ая армия не оставит нас так легко. Случилось самое худшее!"
 AAT_finland_continuation_war.11.t: "Наши офицеры начали покидать территорию государства [FIN.GetNameDef]"
 AAT_finland_continuation_war.12.desc: "[FIN.GetLeader], лидер государства [FIN.GetNameDef], обратился к нам сегодня с очень интересным предложением. Он утверждает, что держава [FIN.GetName] готова закончить войну с государством [SOV.GetNameDef], поскольку та разворачивается не в их пользу, и предлагает разрешить нам высадиться в Петсамо, вступить в наш союз, чтобы вместе изгнать [GER.GetAdjective]ие войска из Скандинавии и положить конец государству [GER.GetNameDef] раз и навсегда. Что мы на это ответим?"
 AAT_finland_continuation_war.13.desc: "Похоже, что представители государства [FIN.GetNameDef] обратились к основным демократическим державам в попытке улизнуть от войны с нами, предлагая им свое вступление в войну против [GER.GetAdjective]ой державы и тем самым фактически переходя на другую сторону. Если союзники согласятся на это, нам останется лишь жаловаться и требовать компенсации — но у нас, по крайней мере, появится новый напарник в борьбе с фашизмом."
 AAT_finland_political.04.desc: "У нас трагические новости. Президент государства [ROOT.GetName], [ROOT.GetLeader], больше не с нами. Здоровье лидера уже давно ухудшалось, из-за инсульта наступил паралич правой руки.\n\nСмерть наступила в результате сердечного приступа по пути домой после отставки с поста президента по состоянию здоровья, прямо на центральном вокзале Хельсинки. Во время прощания с главой государства почетный караул играл патриотический финский марш Porilaisten marssi, провожая президента в отставку."
 AAT_finland_political.07.desc: "Сейчас, когда самому существованию государства [ROOT.GetName] угрожает война, [ROOT.GetLeader] — уже не тот лидер, что подходит нам. На посту лидера нужен герой [ROOT.GetAdjective]ой войны за свободу, фельдмаршал Карл Густав Маннергейм. Если мы хотим сбросить вражеское иго и спасти отчизну, нам не обойтись без его военного опыта.\n\nМаннергейм с пылом приступил к своим новым обязанностям, заявив: «Эта война — не что иное, как продолжение и финальный акт нашей Войны за независимость. Мы сражаемся за свои дома, свою веру и свою страну»."
 AAT_finland_kinship_war.06.desc: "Пока в Советском Союзе разрушаются гражданские институты, многие местные националистические правительства объявляют о своей независимости — в том числе и правительство государства [KAR.GetNameDef]. Карельские ирредентисты и милитаристы объявили, что нас ждет вторая братская война, умеренные и социалисты же заявляют, что нам не стоит вмешиваться в советские дела."
 aat_news.105.desc: "В государство [FIN.GetNameDef] пришла война, и многие охотники, ополченцы из суоелускунты и члены стрелковых клубов взяли в руки оружие, чтобы биться с захватчиками. [FIN.GetAdjective]ая стойкость духа переполняет их, пока они отражают атаки врага, пользуясь тем, что [FIN.GetAdjective]ая природа стала для оккупантов настоящей Белой Смертью."
 AAT_finland_the_white_death.2.desc: "Наши бойцы сообщают о том, как целые колонны солдат внезапно попадают под обстрел в лесах государства [FIN.GetNameDef]. Среди солдат ходят слухи о так называемой Белой Смерти, воплощении мороза, которым славится держава [FIN.GetNameDef], и смертельно метких снайперах [FIN.GetAdjective]ой армии. При желании мы могли бы потратить немалые ресурсы на то, чтобы избавиться от этих помех, пока они не нанесли еще больший урон."
 AAT_finland_the_white_death.12.desc: "Поступили сообщения, что Хяюхя убит в бою разрывной пулей противника. Егеря забрали его тело с поля боя и доставили в столицу. Народ государства [FIN.GetNameDef] будет помнить Симо вечно и вечно будет благодарен ему."
 AAT_britain_narvik.2.t: "[ENG.GetName] вторгается в государство [SWE.GetName]"
 AAT_britain_narvik.2.desc: "[ENG.GetAdjective]ие войска пересекли границу государства [SWE.GetName] без объявления войны и при полном молчании [ENG.GetAdjective]ого правительства. [SWE.GetAdjective]ие власти в ярости от столь вопиющего пренебрежения [SWE.GetAdjective]им суверенитетом. Скорее всего, [ENG.GetAdjective]ие войска пытаются добраться до шахт в Елливаре и Кируне и устроить саботаж, после чего [GER.GeName] лишится доступа к качественной руде. Это станет ударом для [GER.GetAdjective]ой и [SWE.GetAdjective]ой экономик и подорвет [SWE.GetAdjective]ий нейтралитет."
 AAT_britain_narvik.3.desc: "[ENG.GetNameDefCap] без объявления войны устраивает незаконное вторжение на территорию государства [SWE.GetName], уничтожая наши шахты. Важнейший двигатель [SWE.GetAdjective]ой экономики превратился в разрушенный карьер. В качестве оправдания [ENG.GetAdjective]ое правительство заявило, что, если [GER.GetNameDefCap] ведет с вами торговлю, это равносильно союзу, а значит, их действия оправданны. Но, похоже, даже их собственные граждане недовольны подобным объяснением."
 AAT_britain_narvik.4.t: "[ENG.GetName] уходит из государства [SWE.GetName]"
 AAT_USA_events.03.desc: "Лидер государства [FROM.GetNameDef] [FROM.GetLeader] призывает нас выполнить свои обещания и вернуть Фарерские острова, раз уж они наконец освобождены от вражеской оккупации."
 AAT_USA_events.04.desc: "[FROM.GetLeader], лидер государства [FROM.GetNameDef], отказывается исполнить наши требования и заявляет, что по результатам референдума жители Фарерских островов решили остаться под [FROM.GetAdjective]ой властью."
 AAT_USA_events.05.desc: "[FROM.GetLeader], лидер государства [FROM.GetNameDef], призывает нас выполнить свои обещания и вернуть им Гренландию, раз уж они наконец освобождены от вражеской оккупации."
 AAT_USA_events.06.desc: "[FROM.GetLeader], лидер государства [FROM.GetNameDef], отказывается исполнить наши требования и заявляет, что по результатам референдума жители Гренландии решили остаться под [FROM.GetAdjective]ой властью."
 AAT_USA_events.07.desc: "[FROM.GetLeader], лидер государства [FROM.GetNameDef], держит своё слово и возвращает временно переданные территории, дождавшись освобождения нашей страны от вражеской оккупации."
 AAT_USA_events.08.desc: "[FROM.GetLeader] из государства [FROM.GetNameDef] обратился к нам с просьбой передать незаконно удерживаемую датскую территорию ее законным владельцам."
 AAT_USA_events.09.desc: "[FROM.GetLeader] из государства [FROM.GetNameDef] согласился вернуть незаконно удерживаемую датскую территорию ее законным владельцам."
 FIN_keepers_of_the_baltic_countries_desc: "Народ Балтики не заинтересован в том, чтобы его относили к обитателям государства [GER.GetNameDef] или [SOU.GetNameDef]. Мы же, имея общие с ним историю и взгляды, можем мирно вести эти нации, ничуть не вредя им."
 FIN_secure_the_baltic_sea: "Захватить Балтийское море"
 FIN_greater_finland: "Большая Финляндия"
 FIN_tactical_wargaming_department: "Отдел военных игр"
 FIN_academic_karelian_society: "Академическое карельское общество"
 FIN_bank_of_aland_desc: "Банк Аландов — краеугольный камень, на котором зиждется экономика государства [ROOT.GetName]. Он обеспечивает стабильность и поддержку, нужные для роста и процветания страны.\nИнвестируя в банк Аландов, [ROOT.GetName] инвестирует в свое будущее, закладывая фундамент сильной и процветающей нации."
 FIN_found_pohjolan_voima_desc: "С недавним расширением лесной промышленности и тяжелой промышленности возросла потребность в энергии. Мы централизуем ее производство и воспользуемся неисчерпаемым потенциалом водных масс, чтобы помочь индустриальному росту государства [ROOT.GetName]."
 FIN_expand_imatra_hydropower_plant_desc: "Иматринская ГЭС, основанная в 1922 году, стала надежным источником энергии для растущей промышленности государства [ROOT.GetName]. С расширением пятого и шестого блоков ГЭС станет еще мощнее и позволит развить индустриальную мощь региона [928.GetName]."
 FIN_national_firepower_desc: "Учитывая внешние угрозы, с которыми столкнулась наша нация, нам необходимо инвестировать большие средства в новые военные заводы. Эти заводы станут производить новейшие модели артиллерийских орудий для сухопутных войск и береговых батарей, чтобы у государства [ROOT.GetNameDef] хватало огневой мощи для обороны границ."
 FIN_outokumpu_for_defence_industry_desc: "Инвестиции в национальную металлообрабатывающую компанию Outokumpu Oy помогут повысить готовность государства [ROOT.GetName] к обороне. \nЕсли построить металлообрабатывающий завод в Пори и цех для электролиза меди, [ROOT.GetName] сможет обеспечивать себя медью и латунью."
 FIN_industrial_upgrade_in_harjavalta_desc: "В Харьявалте проводится модернизация и оптимизация добычи никеля и меди. Самые современные технологии и улучшенные методы обработки должны нарастить объем добычи этих важных ископаемых и укрепить позицию государства [ROOT.GetName] на рынке."
 FIN_expand_air_bases_desc: "Вокруг государства [ROOT.GetName] растет напряжение. Нужно проследить, чтобы у наших сил обороны было все нужное для эффективных действий.\nМы поддержим ВВС в их стремлении расширить количество авиабаз по всей стране, чтобы их пилоты могли быстро вступать в бой везде, где это потребуется."
 FIN_naval_airforce_desc: "Флот государства [ROOT.GetName] растет, а значит, следует нарастить и авиацию этого флота. Развитие морской авиации даст нам возможность доминировать в Балтийском море, координируя воздушные и морские атаки."
 FIN_modernize_production_lines_desc: "Чтобы создать авиапромышленность мирового класса, способную строить лучшие самолеты, [ROOT.GetAdjective]ое правительство вложит средства в улучшение национальных авиазаводов. Так у ВВС государства [ROOT.GetName] будет доступ к самым передовым и надежным технологиям."
 FIN_suomen_merivoimat_desc: "Флот государства [ROOT.GetName] должен быть готов защищать свою родину от любой потенциальной угрозы. Упор на изучение современной морской техники и разработку улучшенной программы подготовки позволит [ROOT.GetAdjective]им ВМФ стать грозной силой, защищающей наши интересы в море."
 FIN_the_merchant_fleet_desc: "В связи с войной торговый флот государства [ROOT.GetName] должен иметь возможность при необходимости транспортировать важные припасы. Вложив средства в производство новых судов, мы усилим логистику и сможем лучше продержаться в вооруженном конфликте."
 FIN_acquire_andros_dockyards_desc: "Заполучив верфи «Андрос» в Турку, мы значительно увеличим объем производства нашего ведущего корабельного КБ $FIN_crichton_vulcan_organization$. [ROOT.GetAdjective]ие ВМФ сможет нарастить качество и количество производимых кораблей, что повысит его мощь и влияние в регионе."
 FIN_innovative_designs_desc: "Наши инженеры готовы представить миру свой дерзкий проект «Хюёккяйсвауну», перспективный сверхтяжелый танк, который бросает вызов традициям строительства бронетехники. Да, проект весьма необычный, но он отражает готовность государства [ROOT.GetNameDef] пробовать новое и применять новые технологии на поле боя."
 FIN_northern_defense_front_countries_tt: "§YСкандинавские§! и §Yбалтийские государства§! будут более склонны принимать дипломатические запросы от государства [ROOT.GetName]."
 FIN_northern_defense_front_faction_tt: "Начнется событие §Y«[ROOT.GetName] приглашает нас в альянс $FIN_northern_defense_front_faction$»§!."
 FIN_finnish_influence_in_the_baltic_tt: "Затрагивает все независимые §Yстраны Балтии§!, а также государство §Y[POL.GetName]§!. \nЕсли [ROOT.GetFlag]§Y[ROOT.GetName]§! и страна придерживаются одинаковой идеологии: начинается событие §Y«[ROOT.GetName] приглашает нас в [GetAppropriateFinnishFactionInviteTooltip]»§!."
 FIN_preserve_sapmi_cores_tt: "\n§YКаждая национальная территория саамов§!, которую контролирует [ROOT.GetFlag]§Y[ROOT.GetNameDef]§!, становится национальной территорией государства [ROOT.GetFlag]§Y[ROOT.GetNameDef]§!."
 FIN_finnish_supremacy_in_the_north_invite_to_faction_tt: "Во всех независимых фашистских северных или балтийских государствах начнется событие §Y«[ROOT.GetNameDef] приглашает нас в альянс $FIN_finnish_supremacy_league$»§!."
 FIN_heimosodat_dec_tt: "Открывает решения §Y«$FIN_the_last_kinship_war$»§! — §Y«$FIN_stir_anti_soviet_sentiment_in_karelia$»§! в контролируемых Советским Союзом регионах §Y[215.GetName]§! и §Y[216.GetName]§!, также становится доступно решение §Y«$FIN_instigate_a_new_karelian_uprising$»§! против государства [SOV.GetNameDef].\n\n"
 FIN_socialist_welfare_traits_more_info_tt: "\nПо завершении фокуса §Y«$FIN_the_second_finnish_civil_war$»§! или §Y«$FIN_pragmatic_socialism$»§! становятся доступны новые подробности."
 FIN_socialist_welfare_if_leino_tt: "\nДействует, если §Y$FIN_yrjo_leino$§! назначен главой государства до завершения этого фокуса:"
 FIN_socialist_welfare_if_laaltonen_tt: "\nДействует, если §Y$FIN_aimo_aaltonen$§! назначен главой государства до завершения этого фокуса:"
 FIN_socialist_welfare_if_kuusinen_tt: "\nДействует, если §Y$FIN_otto_wille_kuusinen$§! назначен главой государства до завершения этого фокуса:"
 FIN_confederated_finno_russian_republics_state_modifier_tt: "\n§YКаждая национальная территория государства [SOV.GetNameDef], которую контролирует [ROOT.GetNameDef]§!:"
 SWE_delegation_to_berlin_tt: "Если §Y[GER.GetFlag][GER.GetNameDef]§! примет запрос, то присоединится к §Y[ROOT.GetFlag][ROOT.GetAdjective]им§! национал-социалистам в гражданской войне и §R[ROOT.GetFlag][SWE.GetNameDefCap] станет марионеткой государства [GER.GetNameDef]!§!"
 SWE_the_new_order_tt: "Как только воцарится $SWE_the_new_order$, мы установим статус-кво с каждым врагом государства [GER.GetNameDef]"
 SWE_bornholm_crisis_desc: "Мы потеряли остров Борнхольм в результате бунта несколько веков назад, хоть и не уступали его официально государству [Den.GetName]. Этот остров стратегически важен, т. к. помогает контролировать юг Балтийского моря, и очевидно, что [Den.GetName] не может его защитить. Мы можем и должны захватить контроль над ним — ради нашей же безопасности."
 SWE_join_the_anti_soviet_pact_desc: "Большинство наций боятся расцвета государства [SOV.GetNameDef], но не намерены никак этому мешать. Исключение составляют участники Антикоминтерновского пакта. Нам стоит явно продемонстрировать свои намерения, присоединившись к этому пакту."
 SWE_demand_demilitarization_of_finnish_border_desc: "В рамках наших планов по реинтеграции государства [FIN.GetName] нужно продолжать размывать его суверенитет, позволяя им поддерживать убедительную оборону против [SOV.GetAdjective]их войск на востоке. Следовательно, необходимо настоять на их демилитаризации на границе с нами, чтобы им труднее было защищаться от нас, если нам вдруг потребуется насильственно вмешаться в их дела."
 SWE_swedish_finnish_defense_agreement_desc: "Пока с угрозой государства [SOV.GetNameDef] не покончено, в наших интересах вести военное сотрудничество с [FIN.GetAdjective]ой державой. Однажды мы вернем ее под свое правление, сейчас же у нас есть проблемы поважнее."
 SWE_greater_nordic_reich: "Det Stornordiska Riket"
 SWE_betray_germany_plan_desc: "[GER.GetNameDefCap] скоро рухнет: государственные механизмы работают на пределе возможностей, и развал страны — только вопрос времени. Наша же задача — обеспечить себе будущее, ускорив этот процесс. Но для этого потребуется, чтобы все страны, с которыми враждует [GER.GetNameDef], подписали с нами сепаратный мир…"
 SWE_support_danish_communists_desc: "Стратегически выгодное расположение государства [DEN.GetName] между Балтийским и Северным морями дает ему неприемлемо высокий контроль над нашей национальной безопасностью. Единственный способ уберечься от потенциального предательства — поддержать [DEN.GetAdjective]ое коммунистическое движение и установить там дружественный нам режим."
 SWE_the_narvik_solution_desc: "Нарвик критически важен для поставок нашей железной руды и потому стал мишенью враждебно настроенных стран, надеющихся либо перехватить, либо нарушить эти поставки. Чтобы сохранить как свой нейтралитет, так и экспорт, мы должны снизить напряженность в регионе, взяв контроль над Нарвиком от имени государства [NOR.GetName]."
 SWE_infrastructure_desc: "Села — значительная часть государства [SWE.GetName], и эта часть прискорбно неразвита. Нужно исправить положение, чтобы эффективнее использовать наши природные ресурсы."
 SWE_lottakaren_desc: "Женщины государства [SWE.GetName] готовы защищать нацию ничуть не меньше мужчин. Профинансировав организацию, где женщин учат выполнять небоевые задачи, мы поможем вооруженным силам и повысим свою обороноспособность."
 SWE_per_albin_line_desc: "Береговая линия государства [SWE.GetName] обширна и по большей части беззащитна. Чтобы не допустить высадки противника на наши берега, необходимо возвести на них линию усиленных укреплений, которые оттеснят захватчиков обратно в Балтику."
 SWE_central_nordic_army_command_tt_2: "С большей вероятностью согласятся, если:\n — Они §Yвысокого мнения о нас§!\n — Наша §Yармия§! сильнее, чем их\n — У нас с ними одинаковый §Yтип правительства§!\n — Мы предоставим им §Yгарантии§!"
 SWE_rationing_desc: "Мы слишком хорошо помним, как непросто пришлось во время Великой войны простому народу государства [SWE.GetName]. Чтобы избежать такого бедствия в дальнейшем, следует ввести системы нормирования еды, топлива и других жизненно важных товаров."
 NOR_a_resurgent_labor_movement_desc: "Народ государства [NOR.GetName] больше не позволит капитализму дурачить себя. Люди наконец-то узрели истину и осознали, что их медленно топят в нищете, задуманной их же хозяевами. Они начинают поднимать голову и видят революцию на горизонте!"
 NOR_compromise_with_the_nkp_desc: "Безопасность нашей нации повисла на краю пропасти, и, возможно, компромисс с Коммунистической партией Норвегии с ее укоренившимся сталинизмом поможет нам заручиться поддержкой государства [SOU.GetNameDef]. Это куда лучше, чем подчиниться фашистам или капиталистам."
 NOR_prosecute_the_nkp_desc: "Отделение лейбористов от КПН, верной не столько рабочим государства [NOR.GetName], сколько Сталину, было ожидаемым. Слишком долго мы мирились с их существованием. Нужно уничтожить этих предателей, пока они не продали нас государству [SOU.GetName]."
 NOR_the_seeds_of_the_revolution_desc: "Капитализм создал инструмент собственного низвержения, и эта роль выпала нам. Мы должны посеять зерна лучшего будущего для жителей государства [NOR.GetName]. Затем мы будем терпеливо ждать возможности пожинать плоды своего труда."
 NOR_organize_partisan_militias_desc: "Очевидно, что капитализм не ослабит хватку на рабочих государства [NOR.GetName] без боя. Нужно вооружить и обучить всех желающих, чтобы в нужный день и час они восстали и проложили путь революции, которая разобьет оковы капитала."
 NOR_secure_the_swedish_iron_ore_desc: "Земли государства [SWE.GetName] скрывают огромные залежи высококачественной железной руды. Зимой, когда северные порты замерзали, эта руда вывозилась через Нарвик. Нельзя оставлять этот источник руды открытым и уязвимым для любого тирана. Надо захватить его, пока до этого не додумались наши враги."
 NOR_secure_denmark_desc: "Великие державы к югу от государства [NOR.GetName] давно уже сдерживает [DEN.GetName], наши бывшие владыки. Если слабая датская армия уступит натиску, путь к державе [NOR.GetName] будет открыт. Нужно не допустить этого, организовав оборону самим."
 NOR_field_hospitals_desc: "Население государства [NOR.GetName] не так огромно, как в других странах. Можно восполнить потери техники, но каждый потерянный товарищ — это минус один боец с капитализмом. Надо делать все для спасения каждого раненого солдата, чтобы как можно скорее вернуть его в строй, иначе мы рискуем утратить как людей, так и землю."
 NOR_vote_of_no_confidence_desc: "Можем ли мы верить, что Нюгорсвольд и его партия лейбористов сдержат напор большевиков и нацистов? После инцидента он больше напоминает греков, открывающих двери Трои, чем премьер-министра, готового защитить свою страну от коммунизма. Нельзя допустить, чтобы он сдал нашу зарождающуюся нацию государству [SOU.GetNameDef]."
 NOR_arrest_quisling_desc: "Составлено немало списков опасных личностей на территории государства [NOR.GetName], и бывший министр обороны Видкун Квислинг редко в них появляется. Его партия теряет популярность, друзей у него почти не осталось, а его преклонение перед Адольфом Гитлером — факт, способный сделать опасным кого угодно, — выставляет его жалким и ничтожным. Но, каким бы незначительным он ни был, осторожность никогда не повредит."
 NOR_cut_military_budget_desc: "Хоть весь мир сейчас и горит огнем, это не значит, что нам нужна армия. У нас есть четкая политика нейтралитета — а значит, мы можем направить на строительство справедливого и процветающего государства [ROOT.GetName] ресурсы, уходившие ранее на вооружение и оборону."
 NOR_coastal_defense_desc: "У государства [NOR.GetName] одна из длиннейших береговых линий в мире, и укрепить ее будет непросто — но сделать это надо, если мы хотим удержать свою недавно обретенную независимость."
 NOR_prepare_a_mobile_government_desc: "Теперь, когда началась война, наше правительство находится под прицелом вражеских сил. Они пойдут на все, чтобы уничтожить наших лидеров и подчинить себе народ государства [NOR.GetName]. Важно иметь возможность при необходимости быстро эвакуировать костяк правительства в безопасное место."
 NOR_establish_milorg_desc: "Сопротивление оккупации государства [NOR.GetName] по-прежнему сильно, но ему не хватает организованности и дисциплины. Хорошо скоординированное военное сопротивление, управляемое из изгнания, могло бы заложить основу для возвращения нашего правительства на [NOR.GetAdjective]ую землю."
 NOR_nasjonal_samling_desc: "Многие годы ведущую фашистскую партию государства [NOR.GetName] заслоняли собой главенствующие центристы и левые. Но сегодня с этим будем покончено. Мы должны сплотиться вокруг Видкуна Квислинга, нашего талантливого и обаятельного лидера, и создать настоящий [NOR.GetAdjective]ий фашистский режим."
 NOR_the_secret_army_desc: "С 1918 года автономные группы, именуемые Hemmelige Hæren, размещались по всей территории государства [NOR.GetName], чтобы принять меры в случае риска коммунистического восстания. Их клятву борьбы с коммунизмом можно превратить в верность идеям фашизма, а самое главное, мы сможем добиться их поддержки нашего собственного переворота."
 NOR_empower_hirden_desc: "Наша собственная военизированная организация, «Хирден», стояла в основе планов «Национального единения» в отношении будущего государства [NOR.GetName]. Для захвата власти и возможной борьбы важно уделить внимание этой организации."
 NOR_military_police_desc: "В свете растущего сопротивления нашему режиму нам требуются инструменты, чтобы пресечь его на корню. Возможно, улучшенная военная полиция — единственный способ защитить нашу власть, пока жители государства [NOR.GetName] не примут новый порядок."
 NOR_demand_king_haakons_rise_to_power_desc: "Благодаря воодушевляющей речи барона Веделя-Ярлсберга жители государства [NOR.GetName] поддерживают идею сильной монархии, контролирующей правительство. Проблема лишь в самом короле Хоконе VII: он продолжает настаивать на том, что стране требуется правительство из представителей народа. Похоже, короля нужно переубедить."
 NOR_rikstanken_desc: "Печальная истина состоит в том, что у государства [ROOT.GetName] никогда прежде не было танков. Если мы хотим добиться хоть какого-то шанса на победу, без бронетехники не обойтись. Вопрос в том, каким должен быть наш подход? Большое количество танков страна в нашей ситуации может не потянуть. Может, для начала опробовать одну-единственную модель? Или пожертвовать на строительство танков что-то еще, кроме денег."
 NOR_revamp_hydroelectric_capacity_desc: "Алюминий необходим для строительства самолетов и другой военной техники, но получение алюминия из бокситов — процесс энергоемкий и потому дорогой. К счастью для нас, топография государства [NOR.GetName] с его многочисленными озерами и реками идеально подходит для строительства ГЭС. Таким образом мы можем производить необходимый алюминий, несмотря на отсутствие у нас крупных залежей бокситовой руды."
 NOR_anti_air_construction_desc: "Непростой ландшафт государства [NOR.GetName] затрудняет вторжение противника, но наши небеса при этом открыты для его авиации. Нужно построить зенитные батареи."
 NORDIC_monarchist_second_selector_left: "Великое герцогство военно-воздушное"
 NORDIC_baltic_interests: "Стратегические интересы"
 ICE_republicanism: "Республика"
 ICE_completion_break_with_the_crown_tt: "При завершении фокуса §Y«$ICE_break_with_the_crown$»§!:"
 ICE_international_brigades_desc: "Несмотря на нашу победу, борьба с угнетением должна продолжаться, иначе триумф рискует оказаться временным. Сыны и дочери государства [ROOT.GetName] должны быть готовы помочь ему, держава же должна делать все, чтобы поддержать их готовность, вводя новые необходимые законы и поставляя оружие и снаряжение."
 ICE_transformation_of_nature: "Трансформация природы"
 ICE_securing_the_north_sea_passage: "Захват прохода в Северное море"
 DEN_side_with_unions_desc: "Лишь улучшив жилищные условия всех в государстве [Den.GetNameDef], мы сможем решить насущные проблемы рынка труда, а добиться этого возможно только усилением профсоюзов."
 DEN_five_year_plan_desc: "Чтобы у нашего народа было будущее, нам нужно создать комитет, способный разработать и внедрить новую смелую экономическую модель для государства [DEN.GetNameDef]. Пятилетний план приведет нас к процветанию!"
 DEN_align_industries_desc: "Эффективное распределение ресурсов и концентрация промышленности стали вопросами первостепенной важности. Координируя усилия и стандартизируя производство, мы гарантируем, что каждый завод, каждый рабочий и каждый ресурс в полной мере служат интересам государства [DEN.GetNameDef]."
 DEN_scandinavian_security_desc: "Скандинавия и Балтийское море на протяжении нескольких веков были средоточием геополитических интересов государства [DEN.GetNameDef]. Прежде чем переключаться на державы континентальной Европы, мы должны подчинить и усмирить свой северный фланг."
 DEN_swedish_steel_production_desc: "Мы установили свой контроль над минеральными богатствами в северной части государства [SWE.GetNameDef] и теперь можем распоряжаться всеми шахтами, чтобы повысить добычу и даже экспортировать часть ресурсов в обмен на гарантии безопасности."
 DEN_dano_german_military_cooperation_desc: "Чтобы модернизировать армию и достичь поставленных целей, нам может потребоваться помощь наших единомышленников из государства [GER.GetNameDef] в плане военного и технологического сотрудничества. Благодаря ему мы станем на шаг ближе к тому, чтобы воплотить свое видение будущего нашей страны."
 DEN_military_might_desc: "Военная мощь государства [DEN.GetNameDef] растет каждый день, но возможность для улучшений есть всегда. Необходимо направить средства на развитие подготовки Hæren и Королевских ВВС Дании и повышение их эффективности на поле боя."
 DEN_expand_the_brigades_desc: "Чтобы увеличить шансы датской бригады на освобождение государства [ROOT.GetNameDef], нам нужно добавить в ее дивизии больше людских ресурсов."
 DEN_buy_foreign_ships_desc: "Чтобы защитить береговую линию и многочисленные острова государства [DEN.GetNameDef], нам нужен компетентный флот. Конфиденциальные переговоры с симпатизирующими нам странами помогут нам заполучить в состав флота эсминцы."
 DEN_petition_for_independence_desc: "Мы сыграли свою роль и помогли нашей [?DEN.DEN_overlord_nation.GetAdjective]ой метрополии во всех ее начинаниях. Мы доказали свою надежность, и поэтому сейчас самое время попросить о независимости с условием, что мы останемся верным союзником государства [?DEN.DEN_overlord_nation.GetNameDef]."
 DEN_baltic_sea_domination_completed_tt: "Выполнен фокус §Y«$DEN_baltic_sea_domination$»§! и у государства [DEN.GetNameDef] есть"
 DEN_north_sea_ambitions_completed_tt: "Выполнен фокус §Y«$DEN_north_sea_ambitions$»§! и у государства [DEN.GetNameDefCap] есть"
 FIN_anti_soviet_sentiment_desc: "Жители этого региона настроены решительно против государства [SOU.GetNameDef], поскольку видят в нем не более чем Российскую империю под новым именем и угрозу их традиционному укладу."
 NOR_contested_leadership_ns_desc_ger: "Чего бы ни надеялся достичь Квислинг своим переворотом, у государства [GER.GetNameDef] были свои планы на правительство покоренной державы [NOR.GetNonIdeologyName]. Правда в том, что мало кто в Рейхе считает Квислинга подходящим для этой должности. Исключение — сам Гитлер, который на удивление благоволит [NOR.GetAdjective]ому мелкому тирану."
 NOR_liberate_finland_ns_desc: "Рабочие государства [FIN.GetName] явно нуждаются в освобождении. Они трудятся на благо не самих себя или своих сограждан-финнов, а кормят землевладельцев и промышленников. Поможем нашим товарищам освободить эту земли и использовать ее на благо революции."
 NOR_royal_navy_dmod_desc: "Наш гордый флот будет бороздить как моря вокруг государства [NOR.GetName], так и воды мирового океана. В конце концов, самой главной дорогой в наши земли является Северное море."
 SWE_fascist_counter_revolution_1_desc: "Сразу несколько военных деятелей выступили против нашей власти. Удержаться от высказывания своего мнения не смог даже король. От этих пережитков прошлого не требуется ничего, кроме как играть отведенную им роль… однако изо дня в день недовольство только растет."
 DEN_designer_can_be_improved_tt: "Этого конструктора можно улучшить, завершив фокус §Y«$DEN_aalborg_portland_cement_plant$»§!"
 DEN_securing_sweden_ns: "Захват государства [SWE.GetNameDef]"
 DEN_securing_norway_ns: "Захват государства [NOR.GetNameDef]"
 DEN_securing_norway_ns_desc: "Норвежцы на протяжении столетий были частью нашей державы. Пришло время вновь включить Норвегию в состав государства [DEN.GetNameDefCap]. Наши вооруженные силы готовились к этому дню и усердно тренировались, чтобы сокрушить любые враждебные норвежские силы."
 DEN_securing_finland_ns: "Захват государства [FIN.GetNameDef]"
 NORDIC_the_nordic_march_ns_desc: "Соседние государства пока еще не понимают, что презираемая ими «тирания» на самом деле не более чем ветер перемен. Как только он сметет со своего пути останки прежнего уклада, из руин восстанет новый скандинавский порядок… а мы получим возможность овладеть этим могуществом."
