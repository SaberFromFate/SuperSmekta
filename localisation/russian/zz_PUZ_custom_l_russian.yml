 light_tank_equipment_desc: "Легкие танки — маленькие и подвижные. Они подходят для разведки и боя с легкобронированными противниками."
 light_tank_equipment_1_desc: "Легкие танки — маленькие и подвижные. Они подходят для разведки и боя с легкобронированными противниками."
 light_tank_equipment_2_desc: "Легкие танки — маленькие и подвижные. Они подходят для разведки и боя с легкобронированными противниками."
 GER_light_tank_equipment_2_desc: "Pz.Kpfw. II создавался в качестве временной меры, пока велась разработка более современных образцов, однако принял активное участие в боевых действиях."
 light_tank_equipment_3_desc: "Легкие танки — маленькие и подвижные. Они подходят для разведки и боя с легкобронированными противниками."
 light_tank_destroyer_equipment_desc: "Самоходные противотанковые установки представляют собой танки с крупнокалиберными орудиями, закрепленными в корпусе, а не в башне. Легкие ПТ-установки используют шасси легких танков, благодаря чему достаточно мобильны, но несут не слишком мощное вооружение по сравнению с более тяжелыми образцами."
 light_tank_destroyer_equipment_1_desc: "Самоходные противотанковые установки представляют собой танки с крупнокалиберными орудиями, закрепленными в корпусе, а не в башне. Легкие ПТ-установки используют шасси легких танков, благодаря чему достаточно мобильны, но несут не слишком мощное вооружение по сравнению с более тяжелыми образцами."
 light_tank_destroyer_equipment_2_desc: "Самоходные противотанковые установки представляют собой танки с крупнокалиберными орудиями, закрепленными в корпусе, а не в башне. Легкие ПТ-установки используют шасси легких танков, благодаря чему достаточно мобильны, но несут не слишком мощное вооружение по сравнению с более тяжелыми образцами."
 light_tank_destroyer_equipment_3_desc: "Самоходные противотанковые установки представляют собой танки с крупнокалиберными орудиями, закрепленными в корпусе, а не в башне. Легкие ПТ-установки используют шасси легких танков, благодаря чему достаточно мобильны, но несут не слишком мощное вооружение по сравнению с более тяжелыми образцами."
 medium_tank_equipment_desc: "Средние танки умеренно мобильны и при этом универсальны: они способны выполнять роль разведки, поддержки и даже танков прорыва."
 medium_tank_equipment_1_desc: "Средние танки умеренно мобильны и при этом универсальны: они способны выполнять роль разведки, поддержки и даже танков прорыва."
 medium_tank_equipment_2_desc: "Средние танки умеренно мобильны и при этом универсальны: они способны выполнять роль разведки, поддержки и даже танков прорыва."
 medium_tank_equipment_3_desc: "Средние танки умеренно мобильны и при этом универсальны: они способны выполнять роль разведки, поддержки и даже танков прорыва."
 GER_medium_tank_artillery_equipment_1_desc: "Sd. Kfz. 138/1 «Грилле» («Сверчок») — самоходная артиллерийская установка, которая использовалась Германией во время Второй мировой войны. Было произведено приблизительно 490-500 САУ. Они входили в состав танковых дивизий на Восточном фронте, а также воевали в Польше и Франции. Использовались до 1945 года, успев за это время также послужить в Тунисе, где вели бой с вражеской артиллерией и танками."
 medium_tank_destroyer_equipment_desc: "Самоходные противотанковые установки представляют собой танки с крупнокалиберными орудиями, закрепленными в корпусе, а не в башне. Средние ПТ-установки используют шасси средних танков, благодаря чему достаточно мобильны и несут внушительное вооружение."
 medium_tank_destroyer_equipment_1_desc: "Самоходные противотанковые установки представляют собой танки с крупнокалиберными орудиями, закрепленными в корпусе, а не в башне. Средние ПТ-установки используют шасси средних танков, благодаря чему достаточно мобильны и несут внушительное вооружение."
 medium_tank_destroyer_equipment_2_desc: "Самоходные противотанковые установки представляют собой танки с крупнокалиберными орудиями, закрепленными в корпусе, а не в башне. Средние ПТ-установки используют шасси средних танков, благодаря чему достаточно мобильны и несут внушительное вооружение."
 medium_tank_destroyer_equipment_3_desc: "Самоходные противотанковые установки представляют собой танки с крупнокалиберными орудиями, закрепленными в корпусе, а не в башне. Средние ПТ-установки используют шасси средних танков, благодаря чему достаточно мобильны и несут внушительное вооружение."
 GER_medium_tank_destroyer_equipment_2_desc: "Самоходные установки Jagdpanzer IV входили в состав противотанковых отделений танковых дивизий, в том числе дивизий СС. Они сражались в Нормандии, Арденнах и на Восточном фронте, показав себя отличными истребителями танков. Замена танкам и штурмовым орудиям из них при этом не получилась. На более поздних этапах войны, однако, они все чаще использовались в качестве танков, поскольку их нечем было заменить."
 GER_medium_tank_aa_equipment_1_desc: "ЗСУ, получившая название «Мёбельваген» («мебельный грузовик») из-за угловатой формы башни в закрытом положении, была построена на шасси Pz III и вооружена счетверенной 20-мм пушкой."
 heavy_tank_destroyer_equipment_desc: "Тяжелый танк без башни, несущий крупнокалиберное орудие, закрепленное в корпусе."
 heavy_tank_destroyer_equipment_1_desc: "Тяжелый танк без башни, несущий крупнокалиберное орудие, закрепленное в корпусе."
 heavy_tank_destroyer_equipment_2_desc: "Тяжелый танк без башни, несущий крупнокалиберное орудие, закрепленное в корпусе."
 heavy_tank_destroyer_equipment_3_desc: "Тяжелый танк без башни, несущий крупнокалиберное орудие, закрепленное в корпусе."
 GER_super_heavy_tank_equipment_1_desc: "Panzerkampfwagen VIII «Маус» («Мышь») — немецкий сверхтяжелый танк периода Второй мировой войны, разработанный в конце 1944 года. Это самая тяжелая закрытая боевая машина из когда-либо построенных. Главным орудием являлась пушка KwK 44 L/55 калибром 128 мм с дополнительным соосным 75-мм орудием."
 GER_super_heavy_tank_destroyer_equipment_1: "SturmGeschütz auf Fahrgestell Maus"
 modern_tank_equipment_desc: "Современные танки достаточно универсальны, чтобы выполнять большинство боевых ролей, будь то разведка, огневая поддержка или лобовая атака."
 modern_tank_equipment_1_desc: "Современные танки достаточно универсальны, чтобы выполнять большинство боевых ролей, будь то разведка, огневая поддержка или лобовая атака."
 modern_tank_destroyer_equipment_desc: "Современные противотанковые САУ выросли из легких и средних ПТ-САУ и предпочитают тяжелой броне мобильность и низкий силуэт."
 modern_tank_destroyer_equipment_1_desc: "Современные противотанковые САУ выросли из легких и средних ПТ-САУ и предпочитают тяжелой броне мобильность и низкий силуэт."
 GER_modern_tank_destroyer_equipment_1_desc: "Являясь модернизированной версией JadgPanzer IV, E-25 была быстрее и лучше бронирована."
 modern_tank_aa_equipment_desc: "Современное зенитное вооружение, будь то ракеты или скорострельные пушки, представляет смертельную опасность для авиации."
 modern_tank_aa_equipment_1_desc: "Современное зенитное вооружение, будь то ракеты или скорострельные пушки, представляет смертельную опасность для авиации."
