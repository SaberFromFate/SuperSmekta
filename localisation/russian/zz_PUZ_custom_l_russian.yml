 ETH_recall_balco_safo_decision_desc: "$ETH_balcho_safo$ — ярый противник императорских амбиций и стремлений реформировать и централизовать государство [ROOT.GetName]. При всем при том он герой, сражавшийся при Мэкэлэ и одержавший славную победу при Адуа. Он популярен в народе, и если попросить его снова взять в руки оружие ради государства [ROOT.GetName], мы не только заполучим опытного командира, но и, вероятнее всего, обеспечим приток новых солдат под наши знамена."
 ETH_improve_country_category_desc: "Экономика государства [ETH.GetNameDefCap] держится в основном на сельском хозяйстве, где трудятся полунищие фермеры. Чтобы начать индустриализацию, нам нужны большие вложения в электрификацию и транспортную инфраструктуру — тогда больше людей сможет перебраться с ферм на заводы."
 ETH_build_local_resistance_force_desc: "Мы должны сделать все, что в наших силах, чтобы поддерживать движение сопротивления на оккупированных территориях. Это поможет ослабить [ITA.GetAdjective]ую хватку в регионе и отвлечет противника, пока мы готовимся к неизбежному освобождению государства [ETH.GetName]."
 ETH_launch_large_scale_uprising_desc: "Народ государства [ETH.GetName] жаждет сбросить иго иностранной оккупации. Нужно лишь подтолкнуть его к этому."
 ETH_coup_haile_selassie_imru_desc: "Демократически настроенный $ETH_ras_imru_haile_selassie$ правит страной в отсутствие императора. Несомненно, массы считают его истинным героем государства [ROOT.GetName] после того, как он возглавлял страну во время войны. Сейчас все громче раздаются призывы демократизации державы [ROOT.GetName]. Возможно, пришли времена, когда в государстве [ROOT.GetNameDef] действительно назрела необходимость перемен."
 ETH_formal_request_to_host_desc: "Нужно обратиться к [?ETH.host_nation.GetAdjective]ому правительству и попросить его поддержать правителя [ROOT.GetLeader] в войне против государства [ITA.GetNameDef]. Так начнется последний этап возрождения нашей нации."
 ETH_chitet_category_desc: "Созыв национального ополчения обеспечивает быстрый доступ к большому количеству войск в регионе. За прошедшие столетия ополчение сослужило стране добрую службу. Когда война закончится, ополченцев можно отправить по домам, чтобы они вернулись к мирной жизни."
 ETH_2ndItaloEthiopianWar: "[ITA.GetName] незаконно вторгается на наши земли. Хоть мы и полноправный член Лиги Наций, мировое сообщество никак не реагирует на это нападение, решив, что происходящее — просто незначительная стычка в одной из колоний. \nМы должны доказать Лиге Наций, что один из ее членов ведет полномасштабную войну против нас. Это заставит мир принять меры, и [ITA.GetLeader] пострадает."
 ETH_road_reform_local_BoP_desc: "Дорожная сеть государства [ETH.GetName] все сильнее мешает дальнейшему экономическому развитию. Теперь у нас достаточно политического влияния, чтобы настаивать на модернизации дорог. Улучшение дорожной сети между городами и деревнями пойдет на пользу жителям."
 ETH_road_reform_highways_BoP_tt: "Дорожная сеть государства [ETH.GetName] все сильнее мешает дальнейшему экономическому развитию. Нужно воспользоваться новообретенным влиянием и ускорить экономическое развитие и централизацию, начав строить вокруг столицы новые эффективные шоссе."
 ETH_invest_in_state_industry: "Инвестиции в промышленность государства [FROM.GetName]"
 ETH_anti_colonialism_decision_desc: "[FROM.GetAdjective]ому империализму в Африке нужно положить конец. Мир должен очнуться и понять, что эпоха [FROM.GetAdjective]ого колониализма закончилась. Люди государства [FROM.GetNameDef] должны оказать давление на своих лидеров и добиться независимости для африканских колоний."
 ETH_demand_peace_decision_desc: "Храбрый народ государства [FROM.GetName] восстал против [?FROM.previous_overlord.GetAdjective]ой тирании. Мы должны немедленно сделать так, чтобы [?FROM.previous_overlord.GetNameDef] покинул [FROM.GetAdjective]ую территорию."
 ETH_core_east_african_states: "Интегрировать регион [FROM.GetName]"
 invite_to_org: "Пригласить государство [FROM.OWNER.GetName] в организацию"
 threaten_org_member: "Поставить под угрозу лидерство государства [FROM.GetName]"
 threaten_member_state_desc: "Мы дадим лидерам государства [FROM.GetNameDef] понять, что если они не согласятся усилить интеграцию с Организацией африканского единства, лично их ожидают серьезные последствия..."
 ITA_missiolini_strengthen_the_airforce_desc: "Aeronautica стала символом национальной гордости и когда-то входила в число лучших ВВС мира. Нам нужно произвести еще самолеты, чтобы усилить свою авиацию и снова сделать ее великой."
 ITA_missiolini_occupy_dalmatia: "Оккупировать государство [103.GetName]"
 ITA_missiolini_occupy_dalmatia_occupation_effects: "\nЕсли [ROOT.GetFlag][ROOT.GetNameDef] контролирует территорию §Y[103.GetName]§!: \nНа каждой [YUG.GetFlag][YUG.GetAdjective]ой национальной территории, находящейся под полным контролем государства [ROOT.GetFlag][ROOT.GetNameDef]: \n Подчинение: §G+5,0%§!. \n Сопротивление: §G-5,0%§!"
 ITA_missiolini_occupy_greece_occupation_effects: "\nНа каждой [GRE.GetFlag][GRE.GetAdjective]ой национальной территории, находящейся под полным контролем государства [ROOT.GetFlag][ROOT.GetNameDef]: \n Подчинение: §G+5,0%§!. \n Сопротивление: §G-5,0%§!\n\nТекущие эффекты:"
 ITA_missiolini_occupy_ticino: "Оккупировать государство [846.GetName]"
 ITA_missiolini_occupy_ticino_occupation_effects: "\nВ регионе [846.GetName] и на каждой [SWI.GetFlag][SWI.GetAdjective]ой национальной территории, находящейся под полным контролем государства [ROOT.GetFlag][ROOT.GetNameDef]: \n Подчинение: §G+5,0%§!. \n Сопротивление: §G-5,0%§!\n\nТекущие эффекты:"
