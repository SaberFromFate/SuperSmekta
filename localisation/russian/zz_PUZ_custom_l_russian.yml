 FRA_weapons_purchases_category: "Купить оружие у государства [USA.GetNameDef]"
 FRA_intervene_on_side_of_FROM: "Вмешаться на стороне государства [From.GetNameDef]"
 instantiate_collaboration: "Создать коллаборационистское правительство на территории: [From.GetNameDef]"
 POR_arms_purchases_desc: "Военная промышленность и верфи государства [Root.GetNameDef] сейчас не могут удовлетворить нужды наших вооружённых сил. Следовательно, мы должны заключить сделки с иностранными державами, которые способны обеспечить нас современным вооружением и кораблями."
 lar_congress_of_paris.3.desc: "Делегация государства [From.GetNameDef] в принципе согласна с предлагаемыми территориальными изменениями. Нужно ещё проработать несколько мелких деталей и обсудить точное расположение новой границы, но крупных проблем, мешающих заключению соглашения, наши дипломаты не предвидят."
 lar_congress_of_paris.4.desc: "Делегация из государства [From.GetNameDef] объявила о завершении переговоров. Сославшись на фундаментальные разногласия касательно предложенных изменений, она покинула Париж и возвращается в государство [From.GetNameDef].\n\n Вскоре после её поспешного отъезда [From.GetAdjective]ий посол объявил, что [From.GetAdjective]ое правительство более не связано с нами каким-либо договором о взаимопомощи или союзом."
 lar_end_the_occupation.3.desc: "Несмотря на то что предложение объединиться против большевистской угрозы и тех, кто разжёг эту войну, было довольно щедрым, [From.GetLeader] грубо его отверг. По его словам, французы до сих пор не проявили в этой войне какой-либо боевой доблести, поэтому он не видит причины доверять защиту западных границ государства [From.GetNameDef] стране, которую однажды уже победили."
 lar_france_volunteers.1.t: "Добровольцы из государства [From.GetNameDef]"
 lar_spain.33.a: "Привлечь союзников из государства [union_militar_target_state_1.GetName] в Военный союз."
 lar_spain.33.b: "Привлечь союзников из государства [union_militar_target_state_2.GetName] в Военный союз."
 lar_spain.33.c: "Привлечь союзников из государства [union_militar_target_state_3.GetName] в Военный союз."
 lar_spain.52.desc: "В нашу страну начали прибывать грузы из государства [From.GetNameDef] — [From.GetAdjective]ое правительство перемещает свой золотой запас за границу, чтобы сберечь его на время гражданской войны."
 lar_spain.62.desc: "Благодаря постоянному [From.GetAdjective]ому вмешательству и подпольным ячейкам, получающим незаконную поддержку от государства [From.GetNameDef], за последние месяцы укрепились местные коммунистические группки, с которыми мы боролись годами. Эти группки, которым, без сомнения, пообещали дополнительную помощь из-за рубежа, теперь взяли оружие и вместе с нелояльными армейскими элементами устроили полномасштабное восстание, намереваясь силой свергнуть правительство."
 lar_spain.71.a: "Уничтожение государства [SOV.GetNameDef] — главная задача, всё остальное не так важно."
 occupied_countries.1.title: "Временное правительство государства [From.From.GetNameDef]"
 lar_portugal_iberian_summit.1.desc: "Мы приняли из государства [From.GetNameDef] посла с предложением забыть о наших разногласиях и вместе идти к общей цели. Это государство предлагает обсудить совместный запрос на вступление в альянс [?global.POR_iberian_summit_target.GetFactionName] и отправить этот запрос державе [?global.POR_iberian_summit_target.GetNameDef]. \n\n Надо оценить, есть ли у этого предложения шансы на успех и соответствует ли оно нашим интересам."
 lar_portugal_iberian_summit.5.desc: "Мы приняли из государства [From.GetNameDef] посла с предложением забыть о наших разногласиях и вместе идти к общей цели. Это государство предлагает обсудить совместный запрос на вступление в альянс [?global.POR_iberian_summit_target.GetFactionName] и отправить этот запрос державе [?global.POR_iberian_summit_target.GetNameDef]. \n\n Надо оценить, есть ли у этого предложения шансы на успех и соответствует ли оно нашим интересам."
 lar_portugal_naval_blockade.2.desc: "Сегодня прибыл посол из государства [From.GetNameDef] и сообщил, что наше предложение по избеганию британской морской блокады было принято. Мы будем отправлять своими конвоями товары туда, куда не могут попасть [From.GetAdjective]ие корабли. Взамен они будут поставлять нам продукцию с одного из своих заводов, чтобы обеспечить нас материалами для наших проектов."
 lar_portugal_promote_monarchist_cause.3.desc: "При помощи [POR.GetAdjective]ого правительства бразильские монархисты захватили контроль над Рио-де-Жанейро и подняли по всей стране оружие против противостоящих нам фашистских предателей. \nВраг пытается заручиться поддержкой разных группировок в нашей стране, но верные подданные возрожденного государства [Root.GetName] не боятся — их законный император [Root.GetLeader] приведет их к победе!"
 lar_portugal_spanish_civil_war.1.desc: "Сегодня государство [POR.GetNameDef] провозгласило свою поддержку Испанской Республики и объявило, что правительство рассматривает возможность принятия суровых мер в ходе испанской гражданской войны. Выступая с речью, [POR.GetLeader] осудил растущую в Иберии фашистскую угрозу, объявив, что долг государства [POR.GetNameDef] — помочь испанским товарищам в борьбе с националистами."
 lar_portugal_spanish_civil_war.2.desc: "[POR.GetAdjective]ое правительство провозгласило свою поддержку испанских националистов и объявило, что [POR.GetNameDef] рассматривает возможность принятия суровых мер в ходе испанской гражданской войны. Выступая с речью, [POR.GetLeader] осудил распространение в Иберии идей коммунизма и анархизма, объявив, что долг государства [POR.GetNameDef] — помочь испанским соседям в борьбе с республиканцами."
 lar_portugal_spanish_civil_war.3.desc: "[POR.GetAdjective]ое правительство провозгласило свою поддержку испанских карлистов и объявило, что [POR.GetNameDef] рассматривает возможность принятия суровых мер в ходе испанской гражданской войны. Выступая с речью, [POR.GetLeader] объявил, что монархия — единственный способ принести стабильность и процветание на Пиренейский полуостров, раздираемый политическими противоречиями, и что долг государства [POR.GetNameDef] — помочь испанским роялистам в их борьбе за восстановление монархии."
 lar_news.15.desc: "Поскольку родственные монархистские движения в государствах [SPB.GetNameDef] и [FRA.GetNameDef] набрали вес уже достаточно давно, франко-испанские отношения стали прочнее и взаимопроникновение внешних политик этих стран увеличилось.\n\nТеперь, когда движение легитимистов в государстве [FRA.GetNameDef] официально объявило, что король [SPB.GetLeader] — законный наследник французского престола, тот сделал официальное заявление, провозгласив своё намерение носить корону Франции. В ответ на это легитимистское правительство государства [FRA.GetNameDef] начало приготовления к пышной церемонии коронации в Реймсском соборе."
 lar_news.16.desc: "После многих месяцев давления со стороны [SPB.GetAdjective]ого правительства государство [POR.GetNameDef], изолированное, лишённое союзников и столкнувшееся с превосходящими военными силами государства [SPB.GetAdjective]ого, вынуждено было принять претензии, которые [SPB.GetLeader] заявил на [POR.GetAdjective]ий престол. В результате нация теперь стала лишь провинцией растущей державы [SPB.GetNameDef]."
 lar_news.27.desc: "За прошлые месяцы португальские и испанские политики провели множество встреч, где обсуждали возможность создания в Иберии управляемого политиками обеих наций единого государства левого толка. \n\nПосле долгого периода приготовлений и переговоров сегодня лидеры Португалии и Испании официально заявили о создании государства [POR.GetNameDef], новой державы, где иберийские граждане будут выбирать лидеров, лучше всего представляющих общественные интересы, и где будет свобода передвижения."
 lar_spain.100.d: "Сегодня [SPR.GetLeader] заявляет об объединении всех испаноязычных народов под флагом государства [SPR.GetNameDef] с одной целью: обеспечить процветание испаноговорящего населения и заложить основание, на котором империя простоит еще тысячу лет. Эти грандиозные планы еще далеки от завершения."
 SPA_the_corpo_truppe_volontarie_desc: "Наши сторонники из государства [ITA.GetNameDef] отправили нам на помощь Итальянский экспедиционный корпус, но, если мы хотим победить, этот корпус нужно значительно расширить. Мы отправим в государство [ITA.GetNameDef] своего посла, который выступит в защиту нашего дела и добьётся дальнейшей военной помощи."
 SPA_the_condor_legion_desc: "Наши сторонники из государства [GER.GetNameDef] отправили нам на помощь легион «Кондор», но, если мы хотим победить, этот корпус нужно значительно расширить. Мы отправим в государство [GER.GetNameDef] своего посла, который выступит в защиту нашего дела и добьётся дальнейшей военной помощи."
 SPR_soviet_equipment_shipments_desc: "Поставки оружия от государства [SOV.GetNameDef] должны восполнить то, чего не может обеспечить наша промышленность."
 SPR_soviet_technological_advancements_desc: "У государства [SOV.GetNameDefCap] есть технология, которой нет у нас. Полагаю, ради победы над фашизмом оно поделится своими знаниями с нами?"
 SPR_red_bulwark_in_the_west_desc: "Из-за нашего географического положения мы изолированы от союзников. Если на нас нападут (особенно если нападёт сильная морская держава), мы не сможем полагаться на помощь от государства [SOV.GetNameDef]. Следовательно, мы должны сделать так, чтобы наша оборона позволяла нам быть бастионом социализма, его западным якорем в Европе."
 SPR_communists_in_the_government_desc: "Влияние коммунизма на правительство выросло до такой степени, что теперь красные требуют полностью сменить власть, чтобы она отражала новые реалии Республики."
 FRA_promote_entrepeneurship: "Пропагандировать предпринимательство"
 FRA_national_regeneration_desc: "Избыток демократии и неверные республиканские взгляды отравили нашу страну и разделили наш народ. Чтобы исцелить эти раны, потребуется много времени, но мы наконец-то сделали первые шаги к этому."
 FRA_fatherland_desc: "Страна превыше всего. В этом не может быть никакого сомнения."
 VIC_modernize_the_airforce: "Модернизировать авиацию"
 POR_infrastructure_in_angola_tt: "Добавляет §Yдве морские базы§! в ангольской провинции Намибе.\n   Добавляет §Yтри морские базы§! в ангольской провинции Луанда.\n"
 POR_potential_civil_war_low_requirement_tt: "§RЕсли по выполнении этого фокуса уровень §Yстабильности§! §Rниже §Y40%§R, начнется гражданская война!§!§!§!§!"
 POR_potential_civil_war_high_requirement_tt: "§RЕсли по выполнении этого фокуса уровень §Yстабильности§! §Rниже §Y60%§R, начнется гражданская война!§!§!§!§!"
 POR_the_empire_of_brazil_potential_civil_war_tt: "§RЕсли по выполнении этого фокуса §YБразилия§R §RНЕ ЯВЛЯЕТСЯ §Yнейтральным государством§R и имеет §Yуровень стабильности ниже 50%§R или §Yуровень нейтралитета ниже 70%§R, бразильские монархисты начнут гражданскую войну и втянут в нее нас!§!§!§!§!§!§!§!§!§!§!"
 POR_the_iberian_socialist_union_tt: "([SPR.GetFlag]§YРеспубликанская Испания§!) Произойдет событие §YИберийский социалистический союз§!."
 POR_the_popular_front_bloc_tt: "Произойдет событие §YПортугалия приглашает нас вступить в Блок Народного фронта§!."
 operation_infiltrate_civilian_desc: "§LУ [From.GetAdjective]ого правительства множество уязвимых мест, через которые мы можем внедрить своего агента. В таком случае мы будем получать ценные сведения о внутренних процессах [From.GetNameDef] государства, а также сможем в будущем использовать этого агента в операциях против государства [From.GetNameDef].§!"
 operation_steal_tech_civilian_desc: "§LПохоже, что наша промышленность отстает от промышленности государства [From.GetNameDef] в нескольких областях. Проявив хитрость и смекалку, мы, возможно, сумеем значительно сократить отставание.§!"
 operation_collaboration_government_desc: "§LДружественное нам правительство у руля государства [From.GetNameDef] позволит сконцентрироваться на других наших врагах и разгрузить войска для выполнения других целей.§!"
 LOADING_TIP_0: "-Если я не смогу прорвать линию обороны к вечеру, я убьюсь отвёрткой.\n - Сюда кабанчика" - диалог Бенито Муссолини с генералом"
 LOADING_TIP_1: "«абсолютно я фашист».\n- Бенито Муссолини"
 LOADING_TIP_2: "«Я ебал коня. 180 км!».\n- безымянный велопехотинец"
 LOADING_TIP_3: "«Ты там а я здесь».\n- Грейам Белл"
 LOADING_TIP_4: "«У них в группе кстати вокалист - еврей».\n- Бенито Муссолини"
 LOADING_TIP_5: "«Бросьте, ваша память слишком коротка. К примеру, я сейчас пообещаю что отсосу коню на крыше школы и уже завтра это никто не вспомнит».\n- Бенито Муссолини"
 LOADING_TIP_6: "Шишка, встанет шишка."
 LOADING_TIP_7: "«Пока существуют суверенные государства, обладающие мощными армиями, война неизбежна».\n- этой войной был Альберт Эйнштейн"
 LOADING_TIP_8: "«Важно не как суют, а как сос».\n- Иосиф Сталин"
 LOADING_TIP_9: "«Я не монгол!».\n- Иосиф Сталин"
 LOADING_TIP_10: "«Хорошо смеется тот у кого страна шире»\n- Иосиф Сталин"
 LOADING_TIP_11: "«Потенция гарантирована».\n- токсотрактор"
 LOADING_TIP_12: "Китай щедрый.\n- Мао Дзедун"
 LOADING_TIP_13: "«нахуй с пляжа».\n- Адольф Гитлер во  время высадки в нормандии"
 LOADING_TIP_14: "«Абсолютно я коммунист».\n- Иосиф Сталин"
 LOADING_TIP_15: "«-Мальчик, ты тоже на ОГЭ, какой класс?\n посмотри, классный ».- Джордж С. Паттон"
 LOADING_TIP_16: "«Я проснулся рано гойда прокричал. Ёбнулся с кровати СВО начал».\n- Владимир Путин"
 LOADING_TIP_17: "«Боярин меня расхуярил».\n- Адольф Гитлер"
 LOADING_TIP_18: "«underidoderidoderiododeriodoo».\n- Уинстон Черчилль"
 LOADING_TIP_19: "«IwbnfouevcmsiehwvudbqvGovernment».\n- Уинстон Черчилль"
 LOADING_TIP_20: "«Лучший аргумент против демократии — полная версия кратии по скидосику».\n- Уинстон Черчилль"
 LOADING_TIP_21: "«Основные битвы на полях Люберец будут вестись панковыми войсками».\n- Хайнц Гудериан"
 LOADING_TIP_22: "«Новые немецкие «Василисы» следует использовать до первой поломки и не пытаться чинить. Если чинить, то не заработают».\n- Управление по боевой подготовке Ручковской армии"
 LOADING_TIP_23: "«Ни один шельмец никогда не разворачивал невесту, достигая возможной угловой скорости вращения тёщи».\n- Альберт Эйнштейн"
 LOADING_TIP_24: "«Хороший лал сегодня лучше любого саса завтра».\n- Джордж С. Паттон"
 LOADING_TIP_25: "«Спаривание со снегом - есть важнейшая дисциплина десантников с гаражей».\n- Макс Отто Лешке"
 LOADING_TIP_26: "«Всего лишь какие-то сто тысяч дерева с портретом королевы открывают любые двери.».\n- Джордж Спаттон (устал чёт)"
 LOADING_TIP_27: "«Двухсистемный пылесооос, и циклон, и аквабокс, вместо всякой химии - пылесос амфибия».\n Томас Эдисон"
 LOADING_TIP_28: "«Когда я в первый раз увидел реактивный самолет, я его мощно так ебанул елдой по борту, ну у него крылья и отъебнули.».\n- Фэт Как Йегер, ВВС (да, не на русском) США"
 LOADING_TIP_29: "«Никогда не видел, чтобы вафли так мощно шатались.».\n- Генрих Эрлер, люфтваффе"
 LOADING_TIP_30: "«Заводить девушку надо с другого района, чтобы летом у тебя всегда была горячая вода.».\n- Честер У. Мныйц"
 LOADING_TIP_31: "«Когда леди покидает кабриолет, мама я хочу в туалет.         о б л е г ч е н и е»\n- Нуждик"
 LOADING_TIP_32: "«Знаете, какой тип связи в МВД? Ментальный.».\n- Дуайт Д. Эйзенхауэр"
 LOADING_TIP_33: "«У вас трахтенберг на диване, у нас - пельмешка в кармане».\n- Генрих Гиммлер во время переговоров"
 LOADING_TIP_34: "«Само собой разумеется, что когда на карту поставлено выживание, то штирлиц заебал захламлять стол с картой всякой хуйнёй».\n- Мюллер"
 LOADING_TIP_35: "«В схватке два на два побеждает тот, у кого автоматом троечка».\n- Джейсон стетхем"
 LOADING_TIP_36: "«Сас - реверсы класс!».\n- Реклама антивируса AVOS"
 LOADING_TIP_38: "«Голосование бомбардировкой. Ьомбом ьомбомьомбом бомломобом бомбом бомбомбом бомбом».\n— Выборы в казахстане"
 LOADING_TIP_43: "«Подходя к минному полю, наша пехота проводит атаку так, как будто этого поля нет».\n- эээ не придумал прикол"
 LOADING_TIP_44: "«Мы недооценили русского колоолса. Когда их генералу исполняется 21, его соос становится состческий и он коллапсирует как толстячок».\n- Франц Гальдер"
 LOADING_TIP_46: "«Надо сделать так, чтобы мы остались мыми, а они оними».\n- Хах Мым I, 1936 год"
 LOADING_TIP_47: "«Ни шагу азазад!»\n- Приказ по советской армии номер 227+1"
 LOADING_TIP_48: "«ММММ. ДОРИМА ТОКИНАВА ТОЙОТА ЦИВИК ХОНЛА АККОРД МИЦУБИШИ ЛАНСЕР ДОШИРАК И РОЛЛТОН, ТЫ ВСЁ ПОНЯЛ ГАНДОН?»\n- японский президент, 7 декабря 1941 года"
 LOADING_TIP_50: "«Где, повторяю, где оперативное соединение тридцать четыре? Весь мир недоумевает Ты не мог отдать его стране из толпы».\n- Адмирал Нимиц, ГК ВС США, сражение в заливе Лейте"
 LOADING_TIP_53: "«Артос, портос, арамис, пародонтоз».\n- надпись на пачке сигарет"
 LOADING_TIP_56: "«Вычеркивайте авианосец! Диксон в штаб: вычеркивайте один авианосец!»\n- Роберт E. Dickсон, сражение в Коралловом море"
 LOADING_TIP_57: "«Дело было осенью. Мрак, туман, сырость. Из-за этого ебаного стишка всё ломалось».\n- Хеннинг фон Мужик"
 LOADING_TIP_58: "«Гитлер — это гитлер, а индийский слон - это индийский слон. А тэто салауддин чигияев».\n- Нуждик"
 LOADING_TIP_59: "«ты блядь гандон драный в жопу ёбаный пидор».\n- бузулукский колбас"
 LOADING_TIP_60: "«Если бы Гитлер вторгся в ад, то даме ту косито ад ад, даме ту косито ад».\n- Уинстон Чертилль, 21 июня 1941 года"
 LOADING_TIP_61: "Так что, мерзавец мертв? Жаль, мы не взяли его жидким!\n- Иосиф Сталин (после известия о самоубийстве Гитлера)"
 LOADING_TIP_64: "«Это что, акушер в сметане?\nДа, а что такое?\nПередайте пожалуйста кусочек».- Эдмунд Айбольновноге"
 LOADING_TIP_65: "«Зачем умирать за данциг, когда можно данцить за у м е р»\n- Французский дискжокейский лозунг, 1939 год"
 LOADING_TIP_66: "«Шерифы! Они на деревьях!».\n- К. И. Ван Чес, сенатор США, 1939 год"
 LOADING_TIP_68: "«Этого тигра на взлётную полосу».\n- Император Хирохито"
 LOADING_TIP_69: "«Все вы закончите тем, что получите сынерджи на день рождения»\n- Дмитрий Гордон (фриман)"
 LOADING_TIP_72: "«Велосипед - тоже мотопехота, особенно если она может 237км в день».\n- Уилосепинстон Черчилль, 1933 год"
 LOADING_TIP_76: "«Человек всегда должен быть настороже, если хочет фить. Иначе какой-нибудь немецкий сукин сын подкрадется сзади и забьет его насмерть носком с нуждиками».\n- Джордж С. Паттон"
 LOADING_TIP_78: "Через язь ЗДОРОВЕННЫЙ ЯЗЬ! ЙААААЗЬЬ! рыба моей мечты.\n– Девиз азиз Королельрокоскукских бронепанковых сойск Канады. Адады. Соос"
 LOADING_TIP_79: "«Британскому штабу ВМС крайне интересно узнать, смогли ли итальянцы вернуться на уровень предыдущей войны или совсем отошли от дел».\n — Уиндовс Черчилль (после объявления войны Италией)"
 LOADING_TIP_81: "«Опыт показывает, что атаки на бронетехнику с оружием ближнего боя практически обречены на успех при должном уровне упорства».\n — Инструкция по борьбе с танками, группа армий «Центр»"
 LOADING_TIP_83: "«Политика — это война без кровопролития, в то время как война — это в ебало говна».\n — Мао Цзэдун перед падением с лошади"
 LOADING_TIP_86: "«Люди не важны — важно то, каким басом они подпёрдывают».\n — Йон Антонеску"
 LOADING_TIP_87: "«В военное время гнег является такой драгоценностью, что её всегда должен охранять целый отряд ржи».\n— Уинстон ижевск"
 LOADING_TIP_88: "«ААААА меня кастрюлировали».\n— Кастрюлированный кот"
 LOADING_TIP_92: "«Миротворец — это тот, кто закусывает водку только манной кашей, чтобы потом смотреть на то, как красиво выходит винегрет у остальных».\n— Уинстон Черчилль, любитель водки"
 LOADING_TIP_93: "«Тот, кто сказал, что перо сильнее мочи, явно никогда не сталкивался с калом».\n— Братишка"
 LOADING_TIP_114: "«Надеваю резиновую жопу».\n— неизвестный солдат при надевании противогаза"
 LOADING_TIP_115: "«Чем ректальнее анекдот, тем он летальнне»\n— реклама проктониса"
 LOADING_TIP_116: "«Сухарики с аджикой, палочки кузя, принглс (если будет по акции), кул кола, водку (диме), лукошко с черникой».\n— список попукок Д. Эйзенхауэра, июнь 1944 г."
 LOADING_TIP_117: "«Не болейте раком - болейте стоя».\n— Джейсон стетхем"
 LOADING_TIP_119: "«Если любому Гарри отсосать на коне на сосне при луне, то он согласится на всё после этого»\n— Фредерик Сакер Белл"
 LOADING_TIP_120: "«Если свет в туалете выключаеися со звуком "фить", то это значит, что в туалете нет чувства юмора.».\n— Александр Нуждик"
 LOADING_TIP_121: "«С шутки может оскорбиться только тот, кто духом слаб. Вот придумал разрывную - https://www.youtube.com/watch?v=xvFZjo5PgG0».\n— А. Пушкин"
 LOGISTICS_DELETE_EQUIPMENT_CONFIRM_DESC: "\n\nВы уверены, что хотите §Rуничтожить§! технику $EQUIPMENT|Y$?\n\nЭта техника будет удалена с вашего склада, и вы больше не сможете ее использовать. Это необратимый процесс.\n\nУдаленная техника будет доступна противникам в течение $NUM_DAYS|Y$ дн. в случае капитуляции или аннексии."
