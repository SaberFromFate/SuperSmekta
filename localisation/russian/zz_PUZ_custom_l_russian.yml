 SOV_fourth_five_year_plan_ns_tt: "$SOV_modify_fyp_ns_intro$ \nФабрики, производящие товары народного потребления: §Y−2,0%§! \nСкорость восстановления фабрик: §G+5,00%§! \n£prod_eff_cap Макс. эффективность производства: §G+2,00%§! \n\n"
 SOV_upgrade_industrial_designer_tt: "Модифицировать следующих конструкторов: \n\n§Y$stalingrad_tractor_factory$§!: темпы исследований в промышленности: §G+10%§!, фабрики, производящие товары народного потребления: §Y-2,0%§! \n\n§Y$leningrad_polytechnical_institute$§!: темпы исследований в электронике: §G+10%§!, расход припасов: §G-2,0%§! \n\n§Y$SOV_soviet_railways$§!: темпы исследований поездов и железных дорог: §G+10%§!, скорость мобилизации: §G+2,0%§!"
 SOV_military_engineering_university_ns_tt: "$SOV_modify_defense_industry_ns_intro$ \nМаксимальная укрепленность: §G+5,00%§! \nСкорость строительства §Yбункеров§!: §G+5,00%§! \nСкорость строительства §Yбереговых бункеров§!: §G+5,00%§! \n\n"
