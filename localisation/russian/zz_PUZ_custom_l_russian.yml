 FIN_personal_agenda_kallio_tt: "§GИскоренить экстремистов§!: уровень поддержки идеологий «$fascism$» и «$communism$» ниже §Y1%§! увеличит £GFX_power_balance_texticon §Yпубличное доверие§!. \n  — §RОпасно высокая поддержка экстремистов§!: уровень поддержки идеологий «$fascism$» и «$communism$» выше §Y9%§! снизит £GFX_power_balance_texticon §Yпубличное доверие§!. \n  — $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_ryti_tt: "§GМечта о Великой Финляндии§!: оккупация финских национальных территорий, занятых врагом, увеличит £GFX_power_balance_texticon §Yпубличное доверие§!. \n  — §RОпасно высокая поддержка социалистов§!: уровень поддержки идеологий «$democratic$» и «$communism$» выше §Y9%§! снизит £GFX_power_balance_texticon §Yпубличное доверие§!. \n  — $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_mannerheim_tt: "§GНадежный лидер§!: нахождение в состоянии войны увеличит £GFX_power_balance_texticon §Yпубличное доверие§!. \n  — §RНазначенный регент§!: нахождение в состоянии мира снизит £GFX_power_balance_texticon §Yпубличное доверие§!."
 FIN_personal_agenda_paasikivi_tt: "§GКонсерватор-реалист§!: £GFX_stability_texticon $stability$ выше §Y95%§! увеличит £GFX_power_balance_texticon §Yпубличное доверие§!. \n  — §RОпекун§!: £GFX_stability_texticon $stability$ ниже §Y60%§! снизит £GFX_power_balance_texticon §Yпубличное доверие§!. \n  — $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_tanner_tt: "§GОбъединенная нация§!: контроль над §YКарелией§! и каждым входящим в нее регионом при уровне поддержки идеологи «$democratic$» выше §Y95%§! повышает £GFX_power_balance_texticon §Yпубличное доверие§!. \n — §RОпасно высокая поддержка экстремистов§!: уровень поддержки идеологий «$fascism$» и «$communism$» выше §Y9%§! снизит £GFX_power_balance_texticon §Yпубличное доверие§!. \n — $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_aaltonen_tt: "§GКрестовый поход против фашизма§!: участие более §Y10%§! во всех активных войнах и процесс капитуляции ниже §Y5%§! во время войны против фашистской страны повышают £GFX_power_balance_texticon §Yпубличное доверие§!. \n — §RРасколотый пролетариат§!: уровень поддержки идеологии «$communism$» ниже §Y80%§! снижает £GFX_power_balance_texticon §Yпубличное доверие§!. \n — $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_kuusinen_tt: "§GСолнечная система Солнечная система организаций§!: все §Yскандинавские§! и §Yбалтийские национальные территории§! под контролем Финляндии или ее союзника повышают £GFX_power_balance_texticon §Yпубличное доверие§!. \n — §RЗабытые карело-финны§!: регионы §YКарелия§!, §YКола§!, §YОнега§! и §YОлонец§! под чужим контролем снижают £GFX_power_balance_texticon §Yпубличное доверие§!. \n — $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_von_hesse_tt: "§GМечта о Великой Финляндии§!: оккупация финских национальных территорий, занятых врагом, увеличит £GFX_power_balance_texticon §Yпубличное доверие§!. \n — §RОпасно высокая поддержка социалистов§!: уровень поддержки идеологий «$democratic$» и «$communism$» выше §Y9%§! снизит £GFX_power_balance_texticon §Yпубличное доверие§!. \n — $losing_soverignty_threatened_tt$"
