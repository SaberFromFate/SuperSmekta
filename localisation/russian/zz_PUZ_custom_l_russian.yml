 MEX_category_territorial_integration_desc: "Наша революционная борьба за свержение коррумпированных правительств принесла нам контроль над целыми странами. Ранее жители этих стран знали лишь угнетение, и чтобы они могли насладиться истинной свободой, их необходимо включить в состав государства [MEX.GetNameDef]."
 USA_request_monroe_mandate_against_FROM: "Использовать «доктрину Монро» против государства [From.GetNameDef]"
 ENG_trade_unions_demand_minister_appointment_1: "Профсоюзы требуют назначить министра"
 request_faction_member_support_of_from: "Обратиться к альянсу за поддержкой государства [From.GetNameDef]"
 exile_recruitment_campaign_desc: "Благодаря нашим друзьям из государства [From.GetNameDef] у нас теперь есть база для проведения операций. Там мы можем собираться с силами, чтобы затем с триумфом вернуться в государство [Root.GetNameDef]. А пока нужно набрать людей, которые помогут нам готовиться к войне."
 expatriate_donations: "Пожертвования от переселенцев из государства [From.GetNameDef]"
 expatriate_donations_desc: "У страдающего населения государства [From.GetNameDef] есть родственники за рубежом. Обратившись за помощью к [From.GetAdjective]им диаспорам, мы можем собрать средства для освобождения их родины."
 military_parade: "Военный парад в государстве [From.GetNameDef]"
 military_parade_desc: "Демократы, социалисты, националисты и прочие пагубные плоды просвещения досаждают [From.GetAdjective]ому правительству. Мы проведем свои непобедимые войска маршем по столице государства [From.GetNameDef] и покажем всем [Root.GetAdjective]им завистникам военную мощь."
 military_dictatorship: "Военная диктатура в государстве [From.GetNameDef]"
 military_dictatorship_desc: "В [From.GetAdjective]ом правительстве много слабых звеньев, которые нужно устранить. Говорят, что в кабинете министров лидера [From.GetLeader] замечены атеисты, профсоюзные деятели и даже либералы."
 mexico.44.desc2: "[From.GetLeader] подтвердил сообщения о том, что [From.GetAdjective]ие войска вторглись на американскую военную базу у Панамского канала, и заявил, что пошел на это, дабы сохранить [From.GetAdjective]ие интересы в Центральной Америке в условиях внутренней неспокойной ситуации в Соединенных Штатах. Органы пропаганды партии [From.GetRulingPartyLong] потребовали, чтобы все остающиеся в этом районе американские солдаты сложили оружие и обеспечили «мирную передачу власти» в Зоне канала. Желтая пресса активно критикует американского президента за то, что он не проявил упорство, не защитил национальные интересы и не ответил на [From.GetAdjective]ое нападение общей мобилизацией против государства [From.GetNameDef]."
 mtg_usa_civil_war_fascists.20.desc: "Сегодня в 8:00 в Белый дом прибыл особый посланник, доставивший президенту [USA.GetLeader] официальное сообщение от Законодательного собрания штата [CSAcapital.GetName] о том, что этот регион больше не желает считать себя частью республики. Политики заявили, что это фундаментальное право любого цивилизованного народа (с многочисленными цитатами из Декларации независимости), а также отметили, что это мирное решение, отвечающее интересам всех, и что новое государство намерено вести самостоятельную политику в качестве хорошего соседа государства [USA.GetNameDef]."
 mtg_usa_civil_war_fascists.22.desc: "После вооруженных столкновений между государствами [USA.GetNameDef] и [CSA.GetNameDef] ряд законодательных собраний штатов приняли декларации о невмешательстве. Они предписывают губернаторам поддерживать территориальное единство штата и предотвращать переход войск на чью-либо сторону. Они также запрещают проводить призыв в пользу одной из сторон, но, что важно, не ограничивают продажу оружия и боеприпасов при условии оплаты авансом. \n\nЭти заявления особенно подчеркивают, что данные штаты остаются частью государства [USA.GetNameDef] и не желают формировать свое собственное постоянное правительство."
 mtg_usa_civil_war_fascists.201.t: "Добровольцы из государства [CSA_liberated_state.GetName]"
 mtg_usa_civil_war_fascists.201.desc: "Заняв территории так называемого государства [CSA_liberated_state.GetName], наши войска встретили большое количество граждан, настроенных благожелательно и жаждущих помогать нам. В патриотическом порыве они заявили о том, что готовы вступить в нашу армию."
 mtg_usa_civil_war_fascists.202.t: "Добровольцы из государства [USA_liberated_state.GetName]"
 mtg_usa_civil_war_fascists.202.desc: "Заняв территории так называемого государства [USA_liberated_state.GetName], наши войска встретили большое количество граждан, настроенных благожелательно и жаждущих помогать нам. В патриотическом порыве они заявили о том, что готовы вступить в нашу армию."
 mtg_usa_civil_war_fascists.203.desc: "Группа, называющая себя Гражданским советом государства [USA_state_government_created.GetName], заявила о том, что она принимает контроль над государством [USA_state_government_created.GetName] у [CSA.GetAdjective]ого военного руководства. Эти лица не уточнили, поддерживают ли они какую-то сторону в текущем конфликте, а просто заявили, что хотят принять ряд новых законов относительно призыва в [CSA.GetAdjective]ие военные силы.\n\nВ их декларации также было сказано, что любые остающиеся в столице делегаты Конгресса больше не являются представителями правительства [USA_state_government_created.GetName]."
 mtg_usa_canadian_corridor.1.desc: "Нашего посла в государстве [USA.GetNameDef] сегодня вызвали в Госдепартамент и предъявили ему ультиматум. Согласно врученной ему ноте, правительство государства [USA.GetNameDef] отныне не соглашается с суверенитетом Канады на территории между Вашингтоном и Аляской. \n\nПредложение предоставить право на проход войск (и освободить их от пограничного контроля) было отвергнуто. [USA.GetAdjective]ое правительство ожидает ответа до полуночи."
 mtg_usa_pacific_pacification.1.desc_b: "Делегация [USA.GetAdjective]ого правительства прибыла для обсуждения планов нашей общей защиты. Похоже, [USA.GetLeader] считает, что наша небольшая часть света представляет жизненный интерес для безопасности государства [USA.GetNameDef]. Но помимо предоставления нам простых гарантий, [USA.GetAdjective]ое правительство хочет, чтобы мы сами не стали угрозой. По этой причине соглашение предусматривает ряд положений, позволяющих государству [USA.GetNameDef] оказывать значительное влияние на наши внутренние дела.\n\nПока в переговорах дело не дошло до угроз, но ясно, что президент [USA.GetLeader] сочтет наш отказ актом враждебности."
 mtg_usa_pacific_pacification.3.desc: "Правительство государства [From.GetNameDef] отказалось даже встречаться с нашей делегацией, утверждая, что между нашими странами нет никаких нерешенных вопросов. Тем не менее, военный атташе в регионе [GET_AUSTRALIA_NEW_ZEALAND_STATUS] доложил об участившихся в последнее время военных маневрах."
 mtg_usa_secure_asia.1.desc: "Президент [USA.GetLeader] направил особого представителя в столицу на встречу, где будет присутствовать лидер [This.GetLeader], для обсуждения вновь проявившихся интересов государства [USA.GetNameDef] в этом регионе. [This.GetNameDefCap], по всей видимости, занимает ключевое место в [USA.GetAdjective]ой стратегии. Государство [USA.GetNameDef] больше не потерпит недружественного или явно враждебного правительства в регионе [This.GetNameDef]."
 mtg_usa_secure_asia.6.desc: "Переговоры с представителями государства [From.GetNameDef] прервались, едва успев начаться. [From.GetAdjective]ий кабинет обсуждал наше предложение менее часа, после чего без промедления отверг его. [From.GetAdjective]ий министр иностранных дел сообщил нашему послу, что если предложение не будет существенным образом переработано, им нечего обсуждать."
 mtg_usa_secure_asia.7.desc: "В ходе крупного дипломатического наступления президент [USA.GetLeader] публично объявил Вьетнам и Индокитай регионом жизненных интересов государства [USA.GetNameDef]. Как следствие, оно стремится усилить свое присутствие в этой зоне.\n\nВ частной беседе представитель государства [USA.GetNameDef] позволил себе ряд агрессивных высказываний по поводу Индокитая. Они не только оказывают давление на государство [SIA.GetNameDef], но и потребовали право размещать войска в наших колониях и «консультировать» колониальную администрацию. \n\nПо сути это означает передачу территорий под их контроль."
 mtg_usa_protect_south_america.3.desc: "Делегация государства [From.GetNameDef] поспешно оставила саммит и направилась домой. [From.GetAdjective]ий посол до сих пор отказывается прокомментировать этот шаг, утверждая, что пока ожидает распоряжений."
 mtg_usa_foreign_support.1.t: "Пожертвования для государства [USA.GetNameDef]"
 mtg_usa_foreign_support.4.t: "Оружие для государства [USA.GetNameDef]"
 mtg_usa_diplomatic_protest.2.desc: "Выступая с речью перед обеими палатами Конгресса, президент [USA.GetLeader] заявил о том, что его правительство сохраняет верность доктрине Монро, согласно которой никаким внешним государствам не дозволяется иметь территории на американских континентах. На практике [USA.GetAdjective]ое правительство мирилось с тем, что другие [USA.GetRulingIdeology] страны имеют небольшие владения, но не может принять того, что называет «незаконной оккупацией и прямой угрозой их безопасности». \n\nВскоре после этого [USA.GetAdjective]ий посол передал ноту с ультиматумом от президента — передать контроль над нашими американскими владениями государству [USA.GetNameDef]."
 mtg_usa_diplomatic_protest.4.desc: "Назвав нашу ноту «неприемлемым вмешательством в международные дела государства [From.GetNameDef]», [From.GetAdjective]ое правительство прямо отказалось обсуждать вопрос суверенитета своих американских владений."
 mtg_news.8.t: "Подъем государства [Root.GetNameDef]"
 mtg_britain.23.d: "Представители государства [From.GetNameDefCap] связались с нами и попросили, чтобы мы подвергли итальянцев дипломатической изоляции. Если мы прислушаемся к их советам, то они готовы рассмотреть вариант заключения с нами союза в будущем."
 mtg_britain.27.d: "Как упоминалось ранее, представители государства [From.GetNameDef] предложили заключить союз в целях продолжения сотрудничества и дальнейшей изоляции итальянцев."
 mtg_britain.66.d: "[From.GetAdjective]ое правительство претерпело серьезные политические изменения. Мы должны решить, оставаться ли лояльными к нему теперь, когда его идеологические взгляды настолько различаются."
 mtg_britain.76.d: "Культурные различия между восточной и западной частями государства [PAK.GetName] обострили обстановку, и теперь Бангладеш открыто восстал против того, что его представители называют «притеснением». Непохоже, чтобы мы могли вернуть себе контроль над этим регионом, не проливая крови..."
 mtg_britain.81.d: "Представители государства [From.GetNameDefCap] отвергли наши требования. «Если они хотят от нас послушания, пусть попробуют вырвать его из наших сердец силой!» – таков был их ответ."
 mtg_britain.100_tt: "Если резолюция будет принята, вы получите следующее:\n"
 panay_incident.2.e.tt: "Поскольку военные настроения становятся все более сильными, вывод войск из государства [CHI.GetName] помешает нам оправдывать боевые действия в будущем; хотя, если мы уверим общественность в наших мирных намерениях, то укрепим стабильность внутри страны.\n\n"
 panay_incident.3.d: "В ответ на потопление канонерской лодки США «Панай» в результате бомбардировки ранее на этой неделе государство [USA.GetNameDef] требует извинений, наказаний причастных к инциденту офицеров и компенсации. Наше правительство не отдавало приказа об атаке, и не вполне ясно, была ли она проведена по ошибке нашими не в меру усердными пилотами, или это вообще попытка некоторых жёстко настроенных военных вынудить государства [USA.GetNameDef] и [ENG.GetName] вывести свои отряды с территории государства [CHI.GetName]. Некоторые представители правительства не желают, чтобы мы уступали [USA.GetAdjective]им требованиям, но отказ может означать войну."
 mtg_netherlands.15.d: "Представители государства [From.GetNameDefCap] предложили воссоздать буферное государство Объединенные Нидерланды, существовавшее после наполеоновских войн. Они ссылаются на свой вклад в военные кампании по сравнению с почти полной бесполезностью бельгийцев и люксембуржцев, и на основании этого утверждают, что их план поможет сохранить мир в континентальной Европе."
 mtg_netherlands.21.d: "В процессе общения с представителями государства [From.GetNameDefCap] выяснилось, что они стремятся установить контроль над нашими делами... Некоторые второстепенные комитеты правительства уже сочтены «необязательными», и потому этими вопросами заведует непосредственно Амстердам."
 mtg_netherlands.25.d: "Представители государства [From.GetNameDefCap] сообщили, что наше предложение их не интересует."
 mtg_netherlands.28.d: "Представители государства [From.GetNameDefCap] сообщили, что Вест-Индия их не интересует и что они не желают давать никаких обещаний насчет защиты наших колоний."
 mtg_netherlands.31.d: "Представители государства [From.GetNameDefCap] отказались предоставлять нам снаряжение. Они утверждают, что если оно нам так необходимо, то наша промышленность сможет произвести больше."
 mtg_netherlands.61.d: "Представители государства [From.GetNameDef] не пошли на попятную и отказались извиниться за оскорбления и клевету в отношении принца Бернарда. Правы ли они и действительно ли принц Бернард вмешивался в их внутренние дела — сейчас неважно; мы достигли переломного момента в международных отношениях."
 mtg_news.14.desc: "В своей сегодняшней речи [From.GetLeader] провозгласил изменения в колониальной политике государства. «[From.GetAdjective]ое правительство признает право всех народов на самоопределение и решает направить всех подданных империи на путь независимости, которая должна настать в обозримом будущем».\n\nВ ответ на обеспокоенность сильным ослаблением мировых позиций государства [From.GetNameDef], к которым может привести такая мера, [From.GetLeader] заметил, что «все народы, выразившие такое пожелание, могут остаться в составе новообразованного содружества наций, причем в качестве полностью равноправных и независимых его участников». Пока неизвестно, воспользуется ли какая-нибудь нация такой возможностью."
 mtg_news.15.desc: "Сегодня в полночь состоялась давно ожидаемая передача полного суверенитета различным колониальным народностям Британской империи. Несмотря на предложение [From.GetAdjective]ого правительства бывшим подданным присоединиться к альянсу [From.GetFactionName], многие страны решили пойти своим путем.\n\nЭтот поступок вызывает смешанные чувства в родном государстве, но всячески приветствуется социалистами всего мира. Пока неясно, насколько данная мера ослабит позицию государства [From.GetNameDef] в мире и что ждет страны, избравшие путь самостоятельного развития."
 mtg_news.16.desc: "В своем сегодняшнем публичном заявлении новый [From.GetAdjective]ий премьер-министр [From.GetLeader] объявляет о намерении нового правительства уйти от курса умиротворения, старательно поддерживаемого предшественниками. [From.GetLeader] ясно дает понять, что цель государства [From.GetNameDef] — «остановить марш тирании везде, где только она поднимет свою уродливую голову».\n\nПока неясно, остановит ли угроза войны стремление определенных наций к экспансии, но в государстве [From.GetNameDef] уже вовсю развернуты программы по вербовке, что придает силы этому выступлению."
 mtg_news.33.desc: "Якобы пытаясь получить поддержку своей программы перевооружения, [From.GetAdjective]ое правительство начало переговоры с профсоюзами и предлагает пойти на уступки в обмен на их лояльность. Ожидается, что это заметно повысит влияние социалистов на правительство."
 mtg_news.45.desc: "Насильственное рождение государства [From.GetNameDefCap] и по сей день вызывает нестабильность в новообразованной нации, где сильна власть вооруженного ополчения, особенно на окраинах страны. Становятся все более очевидны культурные различия между мусульманским населением северо-запада и северо-востока Индии; пренебрежительное отношение западных пакистанцев к своим восточным землякам раздувает пожар, который еще не полностью погас со времен гражданской войны.\n\nТеперь восток, объявив, что с него довольно и что он тоже хочет полной независимости, взялся за оружие."
 mtg_news.49.desc: "[From.GetAdjective]ое и [JAP.GetAdjective]ое правительства выступили с совместным заявлением о торговой сделке между двумя государствами. С этого времени Япония получает эксклюзивные права на все ресурсы, эксплуатируемые в Индонезийском архипелаге.\n\nЭто беспрецедентное соглашение — без сомнения, попытка [From.GetAdjective]ого правительства предотвратить все будущие угрозы со стороны Японии, хоть она и обеспокоила до крайности другие заинтересованные стороны, в частности, государства [USA.GetNameDef] и [ENG.GetNameDef]."
 MTG_naval_treaty.1.desc: "Наши недавние усилия по увеличению флота открыли нам путь в ряды крупных морских держав. Государство [From.GetNameDefCap] явно обеспокоено этим и отправило в нашу столицу делегацию для переговоров по взаимному ограничению вооружений. \n\nДоговор будет составлен по образцу второго Лондонского морского соглашения и ограничит размер наших крупных кораблей, а также общий размер флота крупных кораблей так, чтобы тот не превышал размер флота государства [ENG.GetNameDef]."
 MTG_naval_treaty.3.desc: "Делегация из государства [From.GetNameDef] вышла из переговоров из-за, цитируем, «полного отказа другой стороны признавать политические и стратегические реалии, которые стоят перед государством [From.GetNameDef]».\n\n Цель внешней политики, состоящая в контроле вооружения, очевидно, не была достигнута, и многие наблюдатели задаются вопросом — как долго еще другие стороны соглашения будут готовы соблюдать ограничения."
 MTG_naval_treaty.6.desc: "Встреча с министром иностранных дел государства [From.GetNameDef] прошла не так хорошо, как мы надеялись. По словам нашего посла, [From.GetAdjective]ое правительство заранее решило отклонять все наши предложения. Ему вручили простую ноту, где было написано, что правительство лидера [From.GetLeader] не видит предмета для диалога с нами."
 MTG_naval_treaty.7.desc: "[From.GetLeader] объявил сегодня, что [From.GetNameDef] отказывается соблюдать условия подписанного ранее морского соглашения. По его словам, сложившаяся в мире ситуация не оставляет иного выбора. [From.GetNameDefCap] правительство, очевидно, получило из надежных источников сообщения о том, что несколько соседних стран начали программу агрессивного расширения флота, угрожающую [From.GetAdjective]им интересам в этом регионе.\n\n.[From.GetAdjective]ое адмиралтейство отказалось комментировать слухи о том, что несколько строящихся кораблей были запланированы уже без учета ограничений соглашения."
 MTG_naval_treaty.8.desc: "Сейчас, когда условия Лондонского морского соглашения соблюдают лишь две страны, ясно, что рано или поздно кто-то из них выйдет из договора, окончательно сделав его бессмысленным. Правительство государства [From.GetNameDef], очевидно, решило, что договор уже не соответствует заявленным целям и что ограничение собственного флота ܻ — угроза национальной безопасности.\n\nЭксперты по всему миру сейчас предсказывают резкое увеличение финансирования флотов — многие страны захотят компенсировать несколько десятилетий ограничений."
 mtg_netherlands.71.d: "Королева государства [HOL.GetNameDef] Вильгельмина объявила о готовности к восстановлению на троне Германии кайзера Вильгельма II по окончании войны. Это заявление вызвало у наших солдат неоправданный оптимизм и необоснованное чувство лояльности, часть бойцов пытается попасть в государство [HOL.GetNameDef], чтобы сражаться за королеву.\n\nЕсли мы не доведем войну до решительного конца, искоренить это движение будет сложно."
 MEX_focus_blue_water_navy: "Океанский флот"
 MEX_focus_international_proletarianism: "Международный пролетариат"
 HOL_cave_to_the_germans_tt: "@ГЕР§Y[GER.GetName]§! имеет по меньшей мере на §Y15§! очков торгового влияния больше, чем @АНГ§Y[ENG.GetName]§!."
 HOL_cave_to_the_germans2_tt: "@ГЕР§Y[GER.GetName]§! имеет не менее §Y25§! очков торгового влияния."
 HOL_maintain_trade_neutrality_tt: "Разница в количестве очков торгового влияния между @ГЕР§Y[GER.GetName]§! и @АНГ§Y[ENG.GetName]§! не превышает §Y5§! очков.\n"
