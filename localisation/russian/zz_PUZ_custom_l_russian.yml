 BUL_refuse_army_restrictions_desc: "Теперь, когда нас поддерживает организация [GetBulgarianFactionName], нам не нужно согласие государства [ENG.GetNameDef], чтобы начать перевооружение армии."
 BUL_rearmament_main_factors_tt: "\nОсновные факторы, влияющие на [ENG.GetAdjective]ое решение: \n§G- Публичное осуждение ВМРО\n- Хорошие отношения с государством §Y[ENG.GetNameWithFlag]§! \n- Завершение фокуса §YДоговор о вечной дружбе§! или §YСалоникское соглашение§! \n- Склонность к демократии\n- Тот же тип правительства, что и у государства §Y[ENG.GetNameWithFlag]§!§! \n§R- Плохие отношения с государством §Y[ENG.GetNameWithFlag]§! \n- Поддержка ВМРО\n- Назначение Богдана Филова на пост советника или главы государства§!"
 BUL_align_bulgaria_desc: "Десятилетиями наши дипломатические отношения с Болгарией были дружественными, и благодаря нашей финансовой помощи болгарское правительство смогло выплатить свой огромный долг. Пора призвать Болгарию официально стать союзником государства [GER.GetNameDef]."
 BUL_execute_plan_desc: "Появилась прекрасная возможность для претворения плана в жизнь! \nЗемля пухом, Борис…"
 BUL_the_fate_of_the_balkans_dec_cat_desc: "Иностранные державы уже очень давно не могут отвести взгляд от Балкан… \nНо времена изменились: мы стали сильнее, и теперь [ROOT.GetNameDef] вполне может претендовать на превосходство на Балканах."
 BUL_ultimatum_opinion_high: "\n— §GВысокое мнение о государстве§! [ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!"
 BUL_ultimatum_opinion_medium: "\n- §YМнение о государстве§! [ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!:"
 BUL_ultimatum_opinion_low: "\n— §RНизкое мнение о государстве§! [ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!"
 BUL_ultimatum_strength_high: "\n— §GВысокая боеспособность §! [ROOT.GetFlag]§Y[ROOT.GetAdjective]ой§! §Gармии§!"
 BUL_ultimatum_strength_medium: "\n— Боеспособность [ROOT.GetFlag]§Y[ROOT.GetAdjective]ой армии§!"
 BUL_ultimatum_strength_low: "\n— §RНизкая боеспособность §! [ROOT.GetFlag]§Y[ROOT.GetAdjective]ой§! §Rармии§!"
