 SOV_expand_the_red_fleet: "Расширить [GetSovietArmyAdjectiveBasedOnIdeology] флот"
 SOV_expand_the_red_fleet_desc_alt: "[GetSovietArmyAdjectiveBasedOnIdeology] флот выглядит до смешного жалким в сравнении с флотами других ведущих держав. Нашей главной задачей должно стать его развитие!"
