 UNITS_VIEW_BTN_DRAW_BLITZ: "§HПрорыв§!\n§GНажмите и удерживайте правую кнопку мыши§! на карте, чтобы нарисовать §Yлинию прорыва§!.\nЛинии можно рисовать только на территории, которую вы прикрепили к §Hлинии фронта§! или §Hморскому вторжению§!.\n\nВ отличие от §Yлинии наступления§!, в ходе §Yпрорыва§! войска будут активно пытаться захватить все провинции, существовавшие в тот момент, когда вы нарисовали линию, без учета последующих изменений. §YПрорыв§! полезен, если вы хотите создать несколько пересекающихся блокадных колец, чтобы отрезать противника или нанести серию быстрых ударов по вражеской территории."
