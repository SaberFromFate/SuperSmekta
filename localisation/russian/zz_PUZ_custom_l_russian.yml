 SOV_gosproyektstroy_bring_foreign_experts_desc: "Мы подпишем соглашение с главными [FROM.GetAdjective]ими индустриальными предприятиями и примем у себя опытных инженеров и архитекторов из государства [FROM.GetNameDef], чтобы те выступали консультантами в наших промышленных проектах."
 SOV_pressure_government_effects_tt: "Цель этого события — вынуждать государство §Y[FROM.GetFlag][FROM.GetNameDefCap]§! вступить в состав державы §Y[ROOT.GetFactionName]§! или заменить свое текущее правительство на то, чья идеология — §Y[ROOT.GetRulingIdeology]§! ([FROM.GetNameDefCap] может отказаться)."
 SOV_preparations_for_operation_countenance_mission_tt: "Как только задание §Y$SOV_operation_countenance$§! станет активным, у [GetOperationCountenanceTooltip] войск будет §Y[?SOV.SOV_operation_countenance_mission_days] д.§! на сдачу государства [PER.GetNameDef], по истечении которых они попытаются примкнуть к другому альянсу, а наше население начнет беспокоиться о нашей военной мощи."
 SOV_operation_countenance_successful_tt: "Эффекты при нашей сдаче государства [PER.GetNameDef]:"
 SOV_formalize_of_the_soviet_republic_of_sinkiang: "Официально закрепить Советскую республику Синьцзянь"
 SOV_formalize_of_the_soviet_republic_of_sinkiang_desc: "Пора потребовать, чтобы регион [SIK.GetNameDef] стал независимой Советской социалистической республикой, подчиненной правительству государства [FROM.GetNameDef]."
