 POL_danzig_decisions_desc: "Данциг слишком долго был занозой в заднице польской экономики! Пора нам взять контроль над городом, но этого можно достичь, лишь в определенной степени сотрудничая с местными…"
 poland.15.d: "[Root.GetLeader] получает сегодня весьма тревожную телеграмму от [From.GetAdjective]ого президента. Тот требует, чтобы государство [LIT.GetNameDef] не только отказалось от своих претензий на бывшую столицу, Вильнюс, но также сложило оружие и уступило все территории [From.GetAdjective]ой державе. [From.GetNameDefCap] пытается восстановить давно почившую унию еще со времен образования государства [Root.GetNameDef] и, похоже, считает угрозу очередной войны достаточной, чтобы [Root.GetLeader] запросил пощады."
 poland.15.d.notlit: "[Root.GetLeader] получает сегодня весьма тревожную телеграмму от [From.GetAdjective]ого президента. Тот требует, чтобы государство [Root.GetNameDef] сложило оружие и уступило все территории [From.GetAdjective]ой державе. [From.GetNameDefCap] пытается восстановить давно почившую Унию еще со времен образования государства [Root.GetNameDef] и, похоже, считает угрозу очередной войны между нашими народами достаточной, чтобы [Root.GetLeader] запросил пощады."
 poland.1501.d: "Сегодня для государства [Root.GetNameDef] настал великий день — [From.GetAdjective]ая армия сложила оружие и дала [Root.GetAdjective]им солдатам пройти прямо в столицу и объявить воссоединение государств [Root.GetNameDef] и [From.GetNameDef]! Уния возродилась, улицы города [Root.Capital.GetName] полны людьми, машущими [Root.GetAdjective]ми и [From.GetAdjective]ми флагами, — правда, в [From.GetAdjective]ой столице таких торжеств не видно, и народ там на удивление мрачен."
 poland.17.d: "Валерий Славек наконец-то вернул себе место главы правительства государства [Root.GetNameDef]. [Root.GetLeader] теперь занимает скорее роль советника, но многие зачастую сомневаются в политической ориентации Славека. Кто-то считает его социалистом, желающим реформ, но многие из его критиков полагают его очередным авторитарным политиком, таким же, как [Root.GetLeader] или Рыдз-Смиглы. Теперь, наконец-то став главой правительства, Славек, вероятно, положит конец таким вопросам, ведь он опять вносит поправки в конституцию Польши."
 poland.18.d: "Довольно долго главной поддерживающей силой государства [Root.GetNameDef] был Эдвард Рыдз-Смиглы и его последователи, правые санационисты, но теперь, когда [Root.GetLeader] соглашается с Лагерем национального объединения, власть Рыдз-Смиглы фактически становится легитимной. Из-за его близких связей с фалангистами слышатся опасения, что [Root.GetNameDef] слишком заигрывает с крайне правыми силами с политических окраин и что симпатии Рыдз-Смиглы к фашистам могут привести к дипломатической изоляции государства [Root.GetNameDef] от бывших союзников."
 poland.21.t: "[DNZ.GetNameDef] ищет примирения с государством [Ger.GetNameDefCap]"
 poland.21.d: "Пока на улицах города [DNZ.GetNameDef] бушует война, [DNZ.GetLeader] упорно противостоит войскам, которыми командует [POL.GetLeader]. Но одного города, очевидно, недостаточно, чтобы выстоять против армии государства [POL.GetNameDef]. Как член партии [Root.GetRulingParty], [DNZ.GetLeader] признает, что [Root.GetLeader] выше по иерархии и [DNZ.GetAdjective]ое поражение здесь неприемлемо. [GER.GetNameDefCap] может вступить в войну, защищая город [DNZ.GetNameDef], — это даст уникальную возможность захватить его, играя роль защитника."
 poland.25.d: "Несмотря на обещания государства [hosting_country_target.GetNameDef] приютить [Root.GetAdjective]ое правительство в изгнании, [hosting_country_target.GetLeader] требует: пусть [Root.GetLeader] немедленно оставит пост президента державы [Root.GetNameDef]. В хаосе, последовавшем за капитуляцией и ссылкой, [Root.GetLeader] уже бежит в нейтральную европейскую страну, и те немногие, кто остался от [Root.GetAdjective]ого правительства, должны решить, кто возглавит борьбу за родное государство."
 POL_invite_to_faction_tooltip: "получит приглашение в альянс государства [Root.GetFlag]§Y[Root.GetName]§!.\n"
 POL_the_left_chairman_desc: "Левые и правые санационисты несовместимы идеологически. Пусть реформы, предложенные правыми, и выгодны для нас, но именно левые радеют прежде всего об интересах Польши. Возможно, дав им больше власти, мы сможем вытеснить правых полностью…"
 POL_join_allies_desc: "Будущее государства [Root.GetNameDef] находится в руках наших старых друзей с Запада. Хотя мы уже идем вслед за Союзниками, официально присоединившись к ним, мы утвердим свою преданность Западу, и, в идеале, Запад тоже засвидетельствует свою преданность нам."
 POL_eastern_conscription_idea_desc: "Жители Восточной Польши быстро проходят боевую подготовку на случай войны с войсками государства [RUS.GetNameDef]."
