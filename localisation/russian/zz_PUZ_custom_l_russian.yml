 SOV_an_adaptable_army_ns_tt: "$SOV_modify_the_red_army_ns_intro$ \nЗимние потери от истощения: §G-10,0%§! \nПотери от жары: §G-10,0%§! \nФактор прироста акклиматизации к холоду: §G+15,0%§! \nФактор прироста акклиматизации к жаре: §G+15,0%§! \nУменьшение штрафа за местность: §G+5,0%§! \n\n"
 SOV_reinforce_western_naval_bases_other_states_tt: "Также добавит §Y2 зенитных§! и §Y2 береговых укрепления§! в регионы §Y[111.GetName]§!, §Y[812.GetName]§!, §Y[808.GetName]§! или §Y[189.GetName]§!, если у государства [SOV.GetNameDef] есть полный контроль над любым из них."
 SOV_trigger_first_moscow_trial_tt: "Произойдет событие «§YПервый московский процесс§!»."
